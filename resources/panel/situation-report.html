<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Shoppers — Company Situation</title>
<style>
  :root{ --surface:#fcfcfb;--plane:#f9f9f7;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--baseline:#c3c2b7;
    --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--good:#0ca30c;--crit:#d03b3b;--warn:#b45309}
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .rep{max-width:980px;margin:0 auto;padding:20px 20px 40px}
  .rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  h1{font-size:22px;margin:0;color:#15803d}
  .sub{color:var(--ink2);font-size:13px;margin-top:2px}
  .rep-btns button{font:inherit;font-size:13px;border:1px solid var(--grid);background:#fff;color:var(--ink2);border-radius:8px;padding:7px 12px;cursor:pointer;margin-left:6px}
  .rep-btns button:hover{background:#f0f4f1}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
  .kpi{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:12px}
  .kpi .kv{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .kpi .kl{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.03em}
  .kpi.ok .kv{color:#15803d}.kpi.bad .kv{color:var(--crit)}.kpi.warn .kv{color:#b45309}
  .card{background:var(--surface);border:1px solid var(--grid);border-radius:14px;padding:16px 18px;margin-top:12px}
  .card h2{font-size:14px;margin:0 0 2px}
  .cap{font-size:12px;color:var(--muted);margin:0 0 10px}
  /* v4.36 — period selector and the tie-out warning */
  .per{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
  .per button{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--grid);background:#fff;color:var(--ink2);border-radius:999px;padding:6px 14px;cursor:pointer}
  .per button:hover{background:#f0f4f1}
  .per button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .warn-b{border:1px solid #fecaca;background:#fef2f2;color:#7f1d1d;border-radius:10px;padding:12px 14px;margin:0 0 16px;font-size:13px;line-height:1.5}
  @media print{.per{display:none}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .bar-lab{width:44px;font-size:12px;color:var(--ink2);font-weight:600}
  .bar-track{flex:1;height:16px;background:#eef1ee;border-radius:6px;overflow:hidden}
  .bar-fill{display:block;height:100%;background:var(--s1);border-radius:6px}
  .bar-val{width:96px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  table.mini td{padding:5px 2px;border-bottom:1px solid var(--grid)}
  table.mini td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  table.mini tr.tot td{font-weight:700;border-top:1.5px solid var(--baseline)}
  .foot{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
  .state{max-width:520px;margin:60px auto;text-align:center;color:var(--ink2);font-size:15px}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
  @media print{.rep-btns{display:none}body{background:#fff}}
</style>
</head>
<body>
<div id="app"><div class="state">Loading your books…</div></div>
<script>
(async () => {
  const app = document.getElementById('app');
  const get = (u) => fetch(u, { credentials: 'same-origin', headers: { Accept: 'application/json' } }).then(r => r.json()).catch(() => null);
  /* v4.26 — these three were hardcoded here, so no owner could change their own loan terms.
     They now arrive from Settings → Finance → Director loan (window.BOOKS_CFG, injected by
     the controller). The old literals stay as fallbacks so a cached copy still renders. */
  const CFG = window.BOOKS_CFG || {};
  const STOCK_USD = Number(CFG.stock_usd) || 0;
  const RATE = (Number(CFG.rate) > 0 && Number(CFG.rate) <= 1) ? Number(CFG.rate) : 0.03;
  const LENDER = (() => {
    const names = String(CFG.lenders || 'Bhavin').split(',').map(s => s.trim()).filter(Boolean)
      .map(s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    return new RegExp(names.length ? names.join('|') : 'bhavin', 'i');
  })();

  /* v4.36 — the profit figures now cover a period. The balance sheet does not: it is a
     point-in-time statement and stays "as at now", which the caption says out loud. */
  const PERIODS = [['month','This month'],['last_month','Last month'],['quarter','This quarter'],['year','This year'],['all','Since inception']];
  const savedPeriod = (() => { try { return sessionStorage.getItem('books.period'); } catch (e) { return null; } })();
  let PERIOD = PERIODS.some(p => p[0] === savedPeriod) ? savedPeriod : 'month';

  const [pnl, fin, ct, cb] = await Promise.all([
    get('/papi/cash-pnl?period=' + encodeURIComponent(PERIOD)), get('/papi/finance-overview'),
    get('/papi/capital-trace'), get('/papi/trade-cashbook/all'),
  ]);
  if (!pnl || !pnl.ok) { app.innerHTML = '<div class="state">Please open this while signed in as the owner.</div>'; return; }
  const is = pnl.income_statement || {}, kpi = (fin && fin.kpis) || {};

  const today = new Date();
  const days = (d) => Math.max(0, Math.floor((today - new Date(d)) / 86400000));

  /* ── v4.26 director loan — real amortisation ───────────────────────────────────────────
     Before: interest was recomputed from each ORIGINAL advance forever, and repayments were
     only subtracted from the total. Paying money back therefore never reduced what the loan
     cost you — the clock kept running on the full principal.

     Now: advances and repayments go onto ONE timeline in date order and the outstanding
     balance compounds between events, so a repayment stops interest on the money returned —
     which is the whole point of repaying. Each repayment clears accrued interest first, then
     principal (normal practice), so the note no longer has to say "interest" or "principal";
     it only has to identify the payment as a loan repayment to the lender.

     With no repayments recorded the two models agree to the cent — every dollar still
     compounds from its own advance date — so switching over changes nobody's balance today. */
  const advRows = ((ct && ct.entries) || []).filter(e => LENDER.test((e.holder || '') + ' ' + (e.note || '')));
  const repayRows = ((cb && cb.entries) || []).filter(e => {
    /* `person` is what /papi/trade-cashbook/all returns; `holder` was read before and is never
       present there, so a repayment only counted if the NOTE happened to name the lender. */
    const txt = (e.person || e.holder || '') + ' ' + (e.note || '') + ' ' + (e.category || '');
    /* v4.36 — this endpoint filters no status at all, so the exclusions every server-side total
       applies have to be applied here: REJECTED entries were being counted as real repayments,
       which understated the loan and overstated profit. Conversion/Transfer legs are excluded
       for the same reason they are everywhere else — they are one pot of money moving, not a
       payment. And \b around the keywords stops "return" matching inside an unrelated word. */
    const st = String(e.status || '').toLowerCase();
    const cat = String(e.category || '');
    if (st === 'void' || st === 'rejected') return false;
    if (cat === 'Conversion' || cat === 'Transfer') return false;
    return +e.out > 0 && LENDER.test(txt) && /\b(loan|interest|repay|repaid|return)\w*\b/i.test(txt);
  });

  const timeline = [
    ...advRows.map(e => ({ t: new Date(e.date).getTime(), kind: 'advance', usd: +e.usd || 0, note: e.note || '' })),
    ...repayRows.map(e => ({ t: new Date(e.date).getTime(), kind: 'repay', usd: +e.usd || 0, note: e.note || '' })),
  ].filter(x => isFinite(x.t) && x.usd > 0).sort((a, b) => a.t - b.t);

  /* v4.36 — the reporting window, in whole days, so interest can be attributed to the period
     it was actually incurred in. 'Since inception' has no bounds. */
  const dayOf = (iso) => Math.floor(Date.parse(iso + 'T00:00:00Z') / 86400000);
  const PER = (pnl && pnl.period) || {};
  const P_FROM = (PER.key === 'all' || !PER.from) ? -Infinity : dayOf(PER.from);
  const P_TO   = (PER.key === 'all' || !PER.to)   ?  Infinity : dayOf(PER.to);

  let loanP = 0, loanI = 0, loanIPeriod = 0, intPaid = 0, prinPaid = 0, owedRun = 0, unpaidInt = 0, cursor = null;
  const accrue = (toMs) => {
    if (cursor === null || owedRun <= 0) { cursor = toMs; return; }
    /* whole calendar days, the same convention the old per-advance figure used, so switching
       to amortisation does not nudge anybody's balance on the day it deploys */
    const c0 = Math.floor(cursor / 86400000);
    const d = Math.max(0, Math.floor(toMs / 86400000) - c0);
    if (d > 0) {
      const grow = owedRun * (Math.pow(1 + RATE, d / 30) - 1);
      /* The slice of this gap lying inside the reporting window, priced by the SAME curve —
         growth from day a to day b is owed × ((1+r)^(b/30) − (1+r)^(a/30)). Exact, so the
         period figures sum to the all-time figure and no balance moves by a cent. */
      const a = Math.min(Math.max(P_FROM - c0, 0), d);
      const b = Math.min(Math.max(P_TO + 1 - c0, 0), d);
      if (b > a) loanIPeriod += owedRun * (Math.pow(1 + RATE, b / 30) - Math.pow(1 + RATE, a / 30));
      owedRun += grow; unpaidInt += grow; loanI += grow;
    }
    cursor = toMs;
  };
  timeline.forEach(ev => {
    if (cursor === null) cursor = ev.t; else accrue(ev.t);
    if (ev.kind === 'advance') { owedRun += ev.usd; loanP += ev.usd; return; }
    let left = ev.usd;
    /* interest first, then principal — and the interest must come OFF the balance before the
       principal share is sized, or an overpayment books more principal than was ever borrowed */
    const toInt = Math.min(left, unpaidInt);
    unpaidInt -= toInt; intPaid += toInt; left -= toInt; owedRun -= toInt;
    const toPrin = Math.min(left, Math.max(0, owedRun));
    prinPaid += toPrin; left -= toPrin;
    owedRun = Math.max(0, owedRun - toPrin);
  });
  accrue(today.getTime());                            // interest up to today

  const loanOwed = Math.max(0, owedRun);
  /* v4.36 — this was `unpaidInt`, the unpaid interest BALANCE, which is not an expense: it
     charged $2 against profit while the loan panel beside it reported $47 of interest to date.
     An interest expense is interest INCURRED in the period. (Identity: loanI = unpaidInt + intPaid.) */
  const financeCost = loanIPeriod;

  const eq = {};
  ((ct && ct.by_partner) ? Object.entries(ct.by_partner) : []).forEach(([n, v]) => { if (!LENDER.test(n)) eq[n] = (eq[n] || 0) + (+v || 0); });
  const equityContributed = Object.values(eq).reduce((a, b) => a + b, 0);
  const eqSrv = (pnl && pnl.equity) || {};
  /* v5.16 — CAPITAL PUT IN, with the lender taken out.
     `equityContributed` above is built from by_partner with the lender excluded, which is the whole
     guard that stops the director's money counting as equity AND as a loan. It was computed and then
     never read: this row took `eqSrv.capital_introduced`, the raw server figure, lender included.
     Same class of defect v4.36 fixed for equity itself — an independently-computed figure sitting in
     a variable nobody used.
     The arithmetic settles which is right. Cash on hand is $1,986.00.
       capital_introduced $2,591  ->  cash books say equity $4,423.92   $2,437.92 MORE than the cash
       lender excluded      $153  ->  cash books say equity $1,985.92   8 cents, i.e. rounding
     $2,437.92 is the director's repaid loan to the dollar. With it removed the cash books tie to the
     cash, and the last line of the reconciliation stops being a plug and becomes exactly
     stock + owed to us − bills not yet paid.
     Falls back to the server figure only if capital-trace did not load, and says so rather than
     silently reporting $0 of capital. */
  const capTraceOk = !!(ct && ct.by_partner && Object.keys(ct.by_partner).length);
  const capIn = capTraceOk ? equityContributed : (+eqSrv.capital_introduced || 0);
  const draws = +eqSrv.drawings || 0;
  const opAllTime = +eqSrv.operating_profit_all_time || 0;
  const retained = opAllTime - loanI;                  // every dollar of profit ever kept in the business

  const rev = +is.sales_revenue || 0, cogs = +is.cost_of_goods || 0, gross = +is.gross_profit || 0;
  const opex = +is.operating_expenses || 0, oOut = +is.other_cash_out_review || 0, oIn = +is.other_cash_in_review || 0;
  const op = +is.operating_profit || (gross - opex - oOut + oIn);
  const net = op - financeCost;
  const margin = rev > 0 ? (gross / rev * 100) : 0;
  const cash = +kpi.cash_on_hand || 0, recv = +kpi.receivable || 0, pay = +kpi.payable || 0;
  const assets = cash + STOCK_USD + recv, liab = pay + loanOwed;
  /* v4.36 — equity used to be `assets - liab` and nothing else, which made the balance check
     `0 < 0.5` — true always, for any inputs, however wrong. Both figures are now computed
     independently and the gap between them is shown rather than absorbed.
       earned  = what the cash books say equity is
       equity  = what the balance sheet needs it to be
       unrecog = the difference, and it is not an error: stock on the shelf and money customers
                 owe you are assets a CASH-basis P&L has never seen, and unpaid supplier bills
                 are costs it has not seen either. Naming it is the honest move. */
  const equityEarned = capIn - draws + retained;
  const equity = assets - liab;
  const unrecognised = equity - equityEarned;
  const byCur = (fin && fin.cash_by_currency) || [];

  const money = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const k = (n) => '$' + Math.round(Number(n || 0)).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  const waterfall = () => {
    const steps = [
      { l: 'Revenue', v: rev, t: 'start' }, { l: 'Cost of goods', v: -cogs, t: 'sub' }, { l: 'Gross profit', v: gross, t: 'total' },
      { l: 'Expenses', v: -opex, t: 'sub' }, { l: 'Other cash out', v: -oOut, t: 'sub' },
      ...(oIn ? [{ l: 'Other in', v: oIn, t: 'add' }] : []),
      { l: 'Operating profit', v: op, t: 'total' }, { l: 'Loan interest', v: -financeCost, t: 'sub' }, { l: 'NET PROFIT', v: net, t: 'net' },
    ];
    const W = 860, H = 300, padT = 24, padB = 64, padL = 8, padR = 8;
    const max = Math.max(rev, op, gross) * 1.08, plotH = H - padT - padB, bw = (W - padL - padR) / steps.length - 14;
    const y = (val) => padT + plotH * (1 - val / max);
    let run = 0, bars = '', prevY = y(0);
    steps.forEach((s, i) => {
      const x = padL + i * ((W - padL - padR) / steps.length) + 7;
      let top, bot, col;
      if (s.t === 'total' || s.t === 'net' || s.t === 'start') { top = y(Math.max(0, s.v)); bot = y(0); run = s.v; col = s.t === 'net' ? 'var(--good)' : 'var(--s1)'; }
      else { const from = run; run += s.v; top = y(Math.max(from, run)); bot = y(Math.min(from, run)); col = s.v < 0 ? 'var(--crit)' : 'var(--s6)'; }
      const h = Math.max(2, bot - top);
      bars += `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="4" fill="${col}"/>`;
      if (i > 0) bars += `<line x1="${x - 7}" y1="${prevY}" x2="${x}" y2="${prevY}" stroke="var(--grid)" stroke-width="1.5"/>`;
      prevY = (s.t === 'total' || s.t === 'net' || s.t === 'start') ? y(s.v) : y(run);
      bars += `<text x="${x + bw / 2}" y="${top - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${s.v < 0 ? '−' : ''}${k(Math.abs(s.v))}</text>`;
      bars += `<text x="${x + bw / 2}" y="${H - padB + 18}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(s.l.split(' ')[0])}</text>`;
      bars += `<text x="${x + bw / 2}" y="${H - padB + 32}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(s.l.split(' ').slice(1).join(' '))}</text>`;
    });
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Profit and loss waterfall">${bars}</svg>`;
  };

  const balanceChart = () => {
    const W = 520, H = 300, padT = 20, padB = 70, colW = 120, gap = 150, plotH = H - padT - padB;
    const x1 = 70, x2 = x1 + gap + colW;

    /* v5.16 — DRAW THE NEGATIVE EQUITY. The old seg() opened with `if (s.v <= 0) return`, and equity
       is the one segment that can go negative. On a shop financed by supplier credit it IS negative,
       so the liabilities column drew Payables alone, scaled against assets: a $7,327 block on a
       $5,940 axis — standing TALLER than the assets beside it and captioned with a total it did not
       equal. The single most important fact on the page was the one thing the picture refused to
       show, and what it drew instead was arithmetically impossible.
       A deficit now hangs BELOW the zero line, which is what it is: the part of the assets that the
       owners do not own. The scale accounts for both directions so nothing overflows. */
    const posA = Math.max(0, cash) + Math.max(0, STOCK_USD) + Math.max(0, recv);
    const posL = Math.max(0, pay) + Math.max(0, loanOwed) + Math.max(0, equity);
    const negL = Math.max(0, -equity);
    const span = (Math.max(posA, posL) + negL) || 1;
    const scale = plotH / span;
    const foot = padT + plotH;                 // bottom of the plot area — captions sit here
    const base = foot - negL * scale;          // the zero line lifts to leave room for the deficit

    const seg = (segs, x) => {
      let up = base, down = base, out = '';
      segs.forEach(s => {
        const v = +s.v || 0;
        if (!v) return;
        const h = Math.abs(v) * scale;
        let y0;
        if (v > 0) { up -= h; y0 = up; } else { y0 = down; down += h; }
        out += `<rect x="${x}" y="${y0 + 1}" width="${colW}" height="${Math.max(1, h - 2)}" fill="${s.c}"/>`;
        const lab = `${esc(s.l)} ${v < 0 ? '−' : ''}${k(Math.abs(v))}`;
        /* v4.36 — a segment too thin for a label inside it gets one OUTSIDE it instead. Receivables
           drew as an unnamed sliver of colour: a real asset on the balance sheet with no name on it. */
        if (h > 18) out += `<text x="${x + colW / 2}" y="${y0 + h / 2 + 4}" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">${lab}</text>`;
        else out += `<text x="${x + colW + 6}" y="${y0 + h / 2 + 4}" font-size="10" font-weight="600" fill="${s.c}">${lab}</text>`;
      });
      return out;
    };
    const A = seg([{ l: 'Cash', v: cash, c: 'var(--s1)' }, { l: 'Stock', v: STOCK_USD, c: 'var(--s2)' }, ...(recv > 0.005 ? [{ l: 'Owed to us', v: recv, c: 'var(--s3)' }] : [])], x1);
    const L = seg([{ l: 'Payables', v: pay, c: 'var(--s4)' }, { l: 'Loan', v: loanOwed, c: 'var(--s5)' },
                   { l: 'Equity', v: equity, c: equity < 0 ? 'var(--crit)' : 'var(--s6)' }], x2);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Balance sheet">${A}${L}
      <line x1="40" y1="${base}" x2="${W - 20}" y2="${base}" stroke="var(--baseline)" stroke-width="1.5"/>
      <text x="${x1 + colW / 2}" y="${foot + 20}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">ASSETS</text>
      <text x="${x1 + colW / 2}" y="${foot + 36}" text-anchor="middle" font-size="12" fill="var(--ink2)">${k(assets)}</text>
      <text x="${x2 + colW / 2}" y="${foot + 20}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">LIABILITIES + EQUITY</text>
      <text x="${x2 + colW / 2}" y="${foot + 36}" text-anchor="middle" font-size="12" fill="var(--ink2)">${k(liab + equity)}</text></svg>`;
  };

  const cashChart = () => {
    if (!byCur.length) return '<p class="cap">No currency split available.</p>';
    const rows = byCur.map(c => ({ cur: c.currency, usd: +c.usd || 0 })).filter(r => Math.abs(r.usd) > 0.5).sort((a, b) => b.usd - a.usd);
    const max = Math.max(...rows.map(r => Math.abs(r.usd)), 1);
    return rows.map(r => `<div class="bar-row"><span class="bar-lab">${esc(r.cur)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.max(2, Math.abs(r.usd) / max * 100)}%"></span></span>
      <span class="bar-val">${money(r.usd)}</span></div>`).join('');
  };

  const tone = (v) => v >= 0 ? 'ok' : 'bad';
  const kpi_ = (label, val, t) => `<div class="kpi ${t || ''}"><div class="kv">${money(val)}</div><div class="kl">${label}</div></div>`;
  const stamp = today.toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const perLabel = PER.label || 'This month';

  /* v4.36 — the check that can actually fail.
     The old one compared the assets column against (liabilities + equity) while equity was DEFINED
     as assets − liabilities: it reduced to 0 < 0.5 and printed ✓ for any inputs at all. This
     compares two figures produced by two different endpoints from two different code paths —
     the cash KPI from finance-overview, and the cashbook closing from cash-pnl. If a row is
     unclassified, or an FX conversion is lop-sided, they disagree and it says so. */
  const rec = (pnl && pnl.reconciliation) || {};
  /* implied_ending_cash is built from the classified buckets; the cash KPI is a raw signed sum
     over the same rows in a different controller. They agree unless a row landed in no bucket. */
  const closing = +rec.implied_ending_cash || 0;
  const cashGap = cash - closing;
  const cashOk = Math.abs(cashGap) < 0.05;
  const classifiedOk = rec.reconciles !== false;
  const gapNote = +rec.difference || 0;

  app.addEventListener('click', (ev) => {
    const b = ev.target && ev.target.closest ? ev.target.closest('.per button') : null;
    if (!b) return;
    try { sessionStorage.setItem('books.period', b.getAttribute('data-per')); } catch (e) {}
    location.reload();
  });

  app.innerHTML = `<div class="rep">
    <div class="rep-head"><div><h1>Family Shoppers</h1>
        <div class="sub">Profit for <b>${esc(perLabel)}</b> · what we own and owe as at ${stamp}</div></div>
      <div class="rep-btns"><button onclick="window.print()">⭳ Save PDF</button><button onclick="location.reload()">↻ Refresh</button></div></div>
    <div class="per">${PERIODS.map(([k2, l]) => `<button class="${k2 === PERIOD ? 'on' : ''}" data-per="${k2}">${esc(l)}</button>`).join('')}</div>
    ${(!cashOk || !classifiedOk) ? `<div class="warn-b"><b>These figures do not tie out.</b>
      ${!cashOk ? `The cash on hand (${money(cash)}) and the cash the profit statement accounts for (${money(closing)}) differ by <b>${money(Math.abs(cashGap))}</b>. ` : ''}
      ${!classifiedOk ? `${money(Math.abs(gapNote))} of cash movement did not fall into any category on the profit statement. ` : ''}
      Treat the profit figure as provisional until this is resolved — it usually means an entry type nobody has classified, or one leg of a currency conversion recorded without its pair.</div>` : ''}
    <div class="kpis">
      ${kpi_('Net profit · ' + perLabel, net, tone(net))}${kpi_('Cash (all currencies)', cash, 'ok')}${kpi_('Owed to suppliers', pay, 'warn')}
      ${kpi_('Loan owed (' + String(CFG.lenders || 'Bhavin') + ')', loanOwed, 'warn')}${kpi_('Owners’ equity', equity, '')}
      <div class="kpi"><div class="kv">${margin.toFixed(1)}%</div><div class="kl">Gross margin · ${esc(perLabel)}</div></div></div>
    <div class="card"><h2>How the profit is made</h2>
      <p class="cap">${esc(perLabel)} · from cash received to net profit — blue = totals, red = money out, green = what's left.
        Cash basis: a sale counts when the money arrives, a cost when it is paid.</p>${waterfall()}</div>
    <div class="grid2">
      <div class="card"><h2>What we own vs what we owe</h2>
        <p class="cap">As at ${stamp}. Owners' equity is what would be left if everything owed were settled.</p>${balanceChart()}
        <table class="mini" style="margin-top:14px">
          <tr><td>Capital put in</td><td>${money(capIn)}</td></tr>
          ${draws ? `<tr><td>Less drawings</td><td>−${money(draws)}</td></tr>` : ''}
          <tr><td>Profit kept in the business (all time)</td><td>${money(retained)}</td></tr>
          <tr><td>Stock, money owed to us, bills not yet paid</td><td>${money(unrecognised)}</td></tr>
          <tr class="tot"><td>Owners' equity</td><td>${money(equity)}</td></tr></table>
        <p class="cap" style="margin-top:8px">The last line before the total is the part the cash books have not
          recognised yet — goods on the shelf and money customers owe you are not cash, and unpaid supplier bills
          are not yet a cost. ${Math.abs(unrecognised) > Math.abs(net) ? '<b>It is currently larger than the profit figure</b>, so read that figure with care.' : ''}</p>
        ${!capTraceOk ? `<p class="cap"><b>Capital could not be read per partner</b>, so the figure above still includes any director loan. Refresh, and if it persists the capital-trace endpoint is failing.</p>` : ''}
        ${/* v5.16 — say plainly who is funding the business. A shop run on trade credit has negative
              equity by construction, and that is a fact to manage rather than a fault to hide. The
              numbers here are the same ones in the chart above, restated as the sentence an owner
              would say out loud. */ equity < 0 ? `<p class="cap" style="margin-top:8px"><b>This business is funded by its suppliers.</b>
          Suppliers are owed ${money(liab)}. Everything the business holds — cash, stock and money customers owe —
          comes to ${money(assets)}. The ${money(Math.abs(equity))} difference is the negative equity: supplier credit is
          not only financing the stock, ${money(Math.abs(equity))} of it has already been spent on something that is no
          longer on the shelf. That is workable while suppliers keep extending terms and dangerous the week they stop.
          ${STOCK_USD > 0 ? `Note this rests on a stock figure of ${money(STOCK_USD)} that is typed in by hand, not counted.` : ''}</p>` : ''}</div>
      <div class="card"><h2>Where the cash sits</h2>
        <p class="cap">Cash on hand by currency, valued in USD.</p><div>${cashChart()}</div>
        <h2 style="margin-top:18px">Loan — ${esc(String(CFG.lenders || 'Bhavin'))}</h2>
        <table class="mini">
          <tr><td>Principal</td><td>${money(loanP)}</td></tr>
          <tr><td>Interest to date</td><td>${money(loanI)}</td></tr>
          <tr><td>…of which ${esc(perLabel)}</td><td>${money(loanIPeriod)}</td></tr>
          ${intPaid ? `<tr><td>Interest paid</td><td>−${money(intPaid)}</td></tr>` : ''}
          ${prinPaid ? `<tr><td>Principal repaid</td><td>−${money(prinPaid)}</td></tr>` : ''}
          <tr class="tot"><td>Balance owed</td><td>${money(loanOwed)}</td></tr>
          <tr><td>Interest next month ≈</td><td>${money(loanOwed * RATE)}</td></tr>
          <tr><td>Rate</td><td>${(RATE * 100).toFixed(2)}% / month</td></tr></table></div></div>
    <div class="foot">Live from your cashbook · stock is the manual value (${money(STOCK_USD)}) until it tracks from purchases · read-only</div>
  </div>`;
})();
</script>
</body>
</html>
