<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
  :root{--brand:#16a34a;--brand-ink:#15803d;--brand-wash:#eafaf0;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--wash:#f9fafb;--danger:#b91c1c;}
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  html,body{margin:0;height:100%;background:var(--wash);color:var(--ink);}
  .shell{display:flex;min-height:100%;}
  /* left sub-nav */
  .side{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);padding:16px 10px;}
  .side h1{font-size:16px;margin:6px 10px 14px;}
  .snav{display:flex;flex-direction:column;gap:2px;}
  .snav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:14px;color:#374151;text-decoration:none;cursor:pointer;}
  .snav a:hover{background:var(--wash);}
  .snav a.on{background:var(--brand-wash);color:var(--brand-ink);font-weight:600;}
  .snav a .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:0;flex:none;}
  .snav a.on .dot{opacity:1;}
  /* main */
  .main{flex:1;min-width:0;padding:22px 26px 70px;overflow:auto;}
  .main h2{font-size:20px;margin:0 0 2px;}
  .main .lead{color:var(--mut);font-size:13px;margin:0 0 18px;}
  .group{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 18px 8px;margin-bottom:16px;}
  .group h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 2px;}
  .group .ghelp{font-size:12.5px;color:var(--mut);margin:0 0 6px;}
  .fld{display:flex;align-items:flex-start;gap:16px;padding:12px 0;border-top:1px solid #f1f2f4;}
  .fld:first-of-type{border-top:0;}
  .fld label{flex:1;font-size:14px;padding-top:8px;}
  .fld label .fhelp{display:block;color:var(--mut);font-size:12px;margin-top:2px;font-weight:400;}
  .fld .ctl{flex:none;width:280px;display:flex;align-items:center;gap:8px;}
  input[type=text],input[type=number],select,textarea{width:100%;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  textarea{min-height:64px;resize:vertical;}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-wash);}
  .unit{color:var(--mut);font-size:13px;white-space:nowrap;}
  .bar{position:sticky;bottom:0;background:linear-gradient(#fff9,#fff);border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:12px;margin-top:6px;}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn.sec{background:#fff;color:#374151;border:1px solid var(--line);}
  .btn.dgr{background:#fff;color:var(--danger);border:1px solid #f1c9c9;padding:6px 12px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:default;}
  .msg{font-size:13.5px;} .msg.ok{color:var(--brand-ink);} .msg.err{color:var(--danger);}
  .banner{display:flex;align-items:center;gap:12px;background:var(--brand-wash);border:1px solid #bfe6cd;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;}
  .banner.warn{background:#fff7ed;border-color:#fed7aa;}
  .banner .grow{flex:1;}
  table.tm{width:100%;border-collapse:collapse;}
  table.tm th,table.tm td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px;}
  table.tm th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--wash);font-size:12px;color:#374151;}
  .addgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .addgrid .full{grid-column:1/3;}
  .empty{color:var(--mut);padding:26px 0;text-align:center;}
  @media(max-width:720px){.side{width:170px;} .fld{flex-direction:column;gap:6px;} .fld .ctl{width:100%;} .addgrid{grid-template-columns:1fr;} .addgrid .full{grid-column:1;}}
</style>
</head>
<body>
<div class="shell">
  <nav class="side"><h1>Settings</h1><div class="snav" id="snav"></div></nav>
  <main class="main" id="main"><div class="empty">Loading…</div></main>
</div>
<script>
  var HUB=null, ACTIVE=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function get(u){return fetch(u,{credentials:'include',headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}}).then(function(r){return r.json();});}
  function post(u,b){return fetch(u,{method:'POST',credentials:'include',headers:{'Accept':'application/json','Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(b||{})}).then(function(r){return r.json();});}
  function sec(k){return (HUB.sections||[]).filter(function(s){return s.key===k;})[0];}

  function renderNav(){
    document.getElementById('snav').innerHTML=(HUB.sections||[]).map(function(s){
      return '<a class="'+(s.key===ACTIVE?'on':'')+'" onclick="go(\''+esc(s.key)+'\')"><span class="dot"></span>'+esc(s.label)+'</a>';
    }).join('');
  }
  function go(k){ ACTIVE=k; renderNav(); renderSection(); }

  function fieldCtl(f){
    var v=f.value, k=esc(f.key);
    if(f.type==='enum'){
      var ol=f.optionLabels||{};
      return '<select data-key="'+k+'">'+(f.options||[]).map(function(o){return '<option value="'+esc(o)+'"'+(String(v)===String(o)?' selected':'')+'>'+esc(ol[o]||o)+'</option>';}).join('')+'</select>';
    }
    if(f.type==='image'){
      return '<div style="width:100%">'
        +'<input type="text" data-key="'+k+'" value="'+esc(v)+'" placeholder="Upload below, or paste an image link" style="margin-bottom:6px">'
        +'<div style="display:flex;gap:8px;align-items:center">'
        +'<button class="btn sec" type="button" onclick="pickImg(\''+k+'\')">Upload image…</button>'
        +(v?'<img src="'+esc(v)+'" alt="" style="height:34px;max-width:96px;border:1px solid var(--line);border-radius:6px;background:#fff;object-fit:contain">':'')
        +'</div></div>';
    }
    if(f.type==='textarea') return '<textarea data-key="'+k+'">'+esc(v)+'</textarea>';
    if(f.type==='number') return '<input type="number" data-key="'+k+'" value="'+esc(v)+'">'+(f.unit?'<span class="unit">'+esc(f.unit)+'</span>':'');
    if(f.type==='bool') return '<select data-key="'+k+'"><option value="1"'+(v?' selected':'')+'>On</option><option value="0"'+(!v?' selected':'')+'>Off</option></select>';
    return '<input type="text" data-key="'+k+'" value="'+esc(v)+'">';
  }

  function renderSection(){
    var s=sec(ACTIVE); var main=document.getElementById('main');
    if(!s){ main.innerHTML='<div class="empty">Pick a section.</div>'; return; }
    if(s.special==='team'){ return renderTeam(); }
    var html='<h2>'+esc(s.label)+'</h2><div class="lead">Changes apply only to your business.</div>';
    (s.groups||[]).forEach(function(g){
      html+='<div class="group"><h3>'+esc(g.label)+'</h3>'+(g.help?'<div class="ghelp">'+esc(g.help)+'</div>':'');
      (g.fields||[]).forEach(function(f){
        html+='<div class="fld"><label>'+esc(f.label)+(f.help?'<span class="fhelp">'+esc(f.help)+'</span>':'')+'</label><div class="ctl">'+fieldCtl(f)+'</div></div>';
      });
      html+='</div>';
    });
    // WhatsApp connection banner on the whatsapp section
    if(s.key==='whatsapp'){
      var wa=HUB.whatsapp||{};
      html = '<h2>'+esc(s.label)+'</h2><div class="lead">Connect your number and set what the bot says.</div>'
        + '<div class="banner'+(wa.linked?'':' warn')+'"><div class="grow"><b>WhatsApp:</b> '+(wa.linked?'Connected':'Not connected')+(wa.number?(' · '+esc(wa.number)):'')+'</div>'
        + '<button class="btn'+(wa.linked?' sec':'')+'" onclick="window.open(\'/panel/setup\',\'_blank\')">'+(wa.linked?'Manage connection':'Connect WhatsApp')+'</button></div>'
        + html.substring(html.indexOf('<div class="group"'));
    }
    html+='<div class="bar"><button class="btn" id="save" onclick="save()">Save changes</button><span class="msg" id="msg"></span></div>';
    main.innerHTML=html;
  }

  function pickImg(key){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='image/png,image/jpeg,image/webp,image/gif';
    inp.onchange=function(){
      if(!inp.files||!inp.files[0]) return;
      if(inp.files[0].size>6*1024*1024){ alert('Image is too big — keep it under 6 MB.'); return; }
      var fd=new FormData(); fd.append('key',key); fd.append('file',inp.files[0]);
      var msg=document.getElementById('msg'); if(msg){ msg.className='msg'; msg.textContent='Uploading…'; }
      fetch('/papi/branding-upload',{method:'POST',credentials:'include',headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'},body:fd})
        .then(function(r){ return r.json(); })
        .then(function(r){
          if(r&&r.ok){
            var el=document.querySelector('#main [data-key="'+key+'"]'); if(el) el.value=r.url;
            if(msg){ msg.className='msg ok'; msg.textContent='Uploaded ✓ — now click Save changes.'; }
          } else if(msg){ msg.className='msg err'; msg.textContent=(r&&(r.message||r.error))||'Upload failed.'; }
        })
        .catch(function(){ if(msg){ msg.className='msg err'; msg.textContent='Upload failed.'; } });
    };
    inp.click();
  }

  function save(){
    var vals={};
    document.querySelectorAll('#main [data-key]').forEach(function(el){ vals[el.getAttribute('data-key')]=el.value; });
    var btn=document.getElementById('save'), msg=document.getElementById('msg');
    btn.disabled=true; msg.className='msg'; msg.textContent='Saving…';
    post('/papi/settings-hub-save',{values:vals}).then(function(r){
      if(r&&r.ok){
        // Re-read from the server so the form always reflects what's actually stored (confirms the save).
        return get('/papi/settings-hub').then(function(h){
          if(h&&h.ok){ HUB=h; renderNav(); renderSection(); }
          var m=document.getElementById('msg'); if(m){ m.className='msg ok'; m.textContent=(r.message||'Saved.'); }
        });
      }
      btn.disabled=false; msg.className='msg err'; msg.textContent=(r&&r.message)||'Could not save.';
    }).catch(function(){ var b=document.getElementById('save'); if(b) b.disabled=false; var m=document.getElementById('msg'); if(m){ m.className='msg err'; m.textContent='Could not save — are you still logged in?'; } });
  }

  /* ---- Team ---- */
  function renderTeam(){
    var team=HUB.team||[], roles=HUB.roles||[];
    var rows=team.length? team.map(function(m){
      return '<tr><td>'+esc(m.name)+(m.is_me?' <span class="tag">you</span>':'')+'</td><td>'+esc(m.email||'—')+'</td><td><span class="tag">'+esc(m.role)+'</span></td>'
        +'<td style="text-align:right">'+(m.is_me?'':'<button class="btn dgr" onclick="delMember('+m.id+',\''+esc(m.name)+'\')">Remove</button>')+'</td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty">No team members yet.</td></tr>';
    document.getElementById('main').innerHTML=
      '<h2>Team</h2><div class="lead">People who can sign in to your CloudBSS. Only owners can add or remove members.</div>'
      +'<div class="group"><h3>Members</h3><table class="tm"><thead><tr><th>Member</th><th>Email</th><th>Role</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<div class="group"><h3>Add member</h3><div class="ghelp">They sign in by email + password, or WhatsApp number (OTP).</div>'
      +'<div class="addgrid" style="padding:10px 0">'
      +'<input type="text" id="m_name" placeholder="Full name">'
      +'<select id="m_role">'+roles.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>';}).join('')+'</select>'
      +'<input type="text" id="m_email" placeholder="Email">'
      +'<input type="text" id="m_phone" placeholder="WhatsApp number">'
      +'<input type="text" id="m_pass" class="full" placeholder="Password (6+ chars) — optional if phone given">'
      +'</div><div class="bar"><button class="btn" id="addbtn" onclick="addMember()">Add member</button><span class="msg" id="tmsg"></span></div></div>';
  }
  function addMember(){
    var b={name:val('m_name'),email:val('m_email'),phone:val('m_phone'),role:val('m_role'),password:val('m_pass')};
    var btn=document.getElementById('addbtn'), msg=document.getElementById('tmsg');
    if(!b.name){ msg.className='msg err'; msg.textContent='Name is required.'; return; }
    btn.disabled=true; msg.className='msg'; msg.textContent='Adding…';
    post('/papi/staff/add',b).then(function(r){
      btn.disabled=false;
      if(r&&(r.ok!==false)){ reload(); } else { msg.className='msg err'; msg.textContent=(r&&(r.message||r.error))||'Could not add.'; }
    }).catch(function(){ btn.disabled=false; msg.className='msg err'; msg.textContent='Could not add.'; });
  }
  function delMember(id,name){
    if(!window.confirm('Remove '+name+' from the team? Their login is deleted.')) return;
    post('/papi/staff/delete',{id:id}).then(function(){ reload(); });
  }
  function val(id){ var e=document.getElementById(id); return e?e.value:''; }

  function reload(){ return get('/papi/settings-hub').then(function(r){ if(r&&r.ok){ HUB=r; renderNav(); renderSection(); } }); }

  get('/papi/settings-hub').then(function(r){
    if(!r||!r.ok){ document.getElementById('main').innerHTML='<div class="empty">Could not load settings ('+esc(r&&r.error||'')+').</div>'; return; }
    HUB=r; ACTIVE=(r.sections&&r.sections[0]&&r.sections[0].key)||null; renderNav(); renderSection();
  });
</script>
</body>
</html>
