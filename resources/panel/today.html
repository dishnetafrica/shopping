<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today — CloudBSS</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--muted:#6b7280;--line:#e6e8ec}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b20;--ink:#eef0f3;--muted:#98a0ab;--line:#262a31}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  header h1{font-size:24px;margin:0}
  header .date{color:var(--muted);font-size:13px}
  header .refresh{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;font-size:13px;cursor:pointer}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:13px;padding:14px 15px;transition:transform .08s,box-shadow .12s}
  .card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .card.quiet{opacity:.62}
  .card .top{display:flex;align-items:center;gap:8px}
  .card .icon{font-size:18px}
  .card .count{margin-left:auto;font-size:30px;font-weight:800;line-height:1}
  .card .label{font-weight:650;margin-top:8px}
  .card .reason{color:var(--muted);font-size:12.5px;margin-top:3px}
  .pos{margin:18px 2px 0;color:#16a34a;font-weight:600;font-size:14px}
  .foot{margin-top:22px;font-size:13px}
  .foot a{color:var(--muted)}
  .muted{color:var(--muted);padding:20px 2px}
  .err{padding:18px 2px;color:#dc2626}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Today</h1>
      <span class="date" id="date"></span>
      <button class="refresh" onclick="load()">↻ Refresh</button>
    </header>
    <p class="sub">What needs you right now — each card tells you why.</p>
    <div class="grid" id="cards"><div class="muted">Loading…</div></div>
    <p class="pos" id="positive"></p>
    <p class="foot"><a id="full" href="/panel">← Open full panel</a></p>
  </div>

  <script src="/panel/shared/api.js"></script>
  <script src="/panel/shared/utils.js"></script>
  <script>
    var token = (function(){ try { return (new URLSearchParams(location.search)).get('token') || ''; } catch(e){ return ''; } })();
    CB.setToken(token);
    if (token) { var fl = document.getElementById('full'); if (fl) fl.href = '/panel?token=' + encodeURIComponent(token); }
    document.getElementById('date').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' });

    var TONE = { red:'#dc2626', amber:'#d97706', blue:'#2563eb', green:'#16a34a' };

    function href(c){
      var h = c.href || '#';
      if (token && h.indexOf('/panel') === 0 && h.indexOf('?') < 0) {
        var hash = ''; var i = h.indexOf('#');
        if (i >= 0) { hash = h.slice(i); h = h.slice(0, i); }
        h = h + '?token=' + encodeURIComponent(token) + hash;
      }
      return h;
    }

    function render(d){
      var box = document.getElementById('cards');
      if (!d || !d.ok) { box.innerHTML = '<div class="err">Could not load. <a href="/panel">Open the panel</a> instead.</div>'; return; }
      var cards = d.cards || [];
      box.innerHTML = cards.map(function(c){
        var col = TONE[c.tone] || '#6b7280';
        var quiet = (Number(c.count) || 0) === 0 ? ' quiet' : '';
        return '<a class="card'+quiet+'" href="'+CB.esc(href(c))+'" style="border-left-color:'+col+'">'
          + '<div class="top"><span class="icon">'+CB.esc(c.icon||'')+'</span>'
          + '<span class="count" style="color:'+col+'">'+(Number(c.count)||0)+'</span></div>'
          + '<div class="label">'+CB.esc(c.label||'')+'</div>'
          + '<div class="reason">'+CB.esc(c.reason||'')+'</div></a>';
      }).join('');
      var pos = (d.positive && d.positive.confirmed_today) || 0;
      document.getElementById('positive').textContent = pos ? ('🟢 '+pos+' '+(pos===1?'delivery':'deliveries')+' confirmed today') : '';
    }

    function load(){
      document.getElementById('cards').innerHTML = '<div class="muted">Loading…</div>';
      CB.api('/papi/today').then(render);
    }
    load();
  </script>
</body>
</html>
