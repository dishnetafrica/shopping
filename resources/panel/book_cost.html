<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Purchase</title>
<style>
  :root{--red:#D41C1C;--green:#059669;--amber:#d97706;--blue:#1e40af;--dark:#0f0f0f;
        --mute:#94a3b8;--bg:#f5f5f2;--card:#fff;--border:#e8e8e3;
        --font:'Inter',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:var(--font);color:#0f0f0f;}
  .wrap{max-width:640px;margin:0 auto;padding:14px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .top h1{font-size:20px;margin:0;font-weight:900;} .top a{color:var(--green);text-decoration:none;font-weight:700;font-size:13px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;}
  label{font-size:12px;font-weight:700;color:#374151;display:block;margin:12px 0 5px;}
  select,input,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);background:#fff;outline:none;}
  select:focus,input:focus{border-color:var(--green);}
  .row{display:flex;gap:10px;} .row>div{flex:1;}
  .conv{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;color:#065f46;margin-top:10px;}
  .receipt{display:flex;align-items:center;gap:8px;background:#eff6ff;border:1px dashed #93c5fd;border-radius:10px;padding:12px;margin-top:12px;font-size:13px;font-weight:700;color:#1e40af;cursor:pointer;}
  .btn{width:100%;margin-top:16px;background:var(--dark);color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .hint{font-size:11px;color:var(--mute);text-align:center;margin-top:8px;}
  .stagebtns{display:flex;gap:6px;flex-wrap:wrap;}
  .stagebtn{flex:1;min-width:90px;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:12px;font-weight:700;color:#374151;cursor:pointer;text-align:center;}
  .stagebtn.on{border-color:var(--green);background:#ecfdf5;color:#065f46;}
</style></head>
<body><div class="wrap">
  <div class="top"><h1>🛒 Book Purchase</h1><a href="/panel">← Panel</a></div>
  <div class="card">
    <label>For order</label>
    <select id="order"><option value="">— loading orders —</option></select>

    <label>What is this cost for?</label>
    <div class="stagebtns" id="stages">
      <div class="stagebtn on" data-s="purchase">📦 Goods</div>
      <div class="stagebtn" data-s="freight_bus">🚌 Bus freight</div>
      <div class="stagebtn" data-s="delivery_boda">🛵 Boda delivery</div>
      <div class="stagebtn" data-s="funding">💵 Cash in</div>
    </div>

    <div class="row">
      <div><label>Currency</label>
        <select id="cur"><option>UGX</option><option>SSP</option><option>USD</option></select></div>
      <div style="flex:1.5"><label>Amount</label>
        <input id="amt" type="text" inputmode="decimal" placeholder="400000" oninput="calc()"></div>
    </div>

    <label>Rate (native per 1 USD)</label>
    <input id="rate" type="text" inputmode="decimal" oninput="calc()">
    <div class="conv" id="conv">≈ $0.00 USD</div>

    <label id="holderLbl">Who paid / holds it</label>
    <input id="holder" type="text" placeholder="Jaeysh bhai">
    <select id="holderSel" style="display:none"></select>
    <div id="holderMe" style="display:none;font-size:12px;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;padding:9px 11px;font-weight:700;">Booking to your cash</div>

    <label>Receipt (optional)</label>
    <label class="receipt" for="receipt">📷 Attach receipt photo <span id="rname" style="font-weight:500;color:#64748b"></span></label>
    <input id="receipt" type="file" accept="image/*" style="display:none" onchange="document.getElementById('rname').textContent=this.files[0]?('· '+this.files[0].name):''">

    <label>Note (optional)</label>
    <input id="note" type="text" placeholder="e.g. sugar 50 bags">

    <button class="btn" onclick="save()">Book purchase</button>
    <div class="hint" id="hint">reduces cash · adds cost to the order</div>
  </div>
</div>
<script>
const $=s=>document.getElementById(s); let stage='purchase', rates={UGX:3700,SSP:5180,USD:1};
document.querySelectorAll('.stagebtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.stagebtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); stage=b.dataset.s;
  $('hint').textContent = stage==='funding' ? 'adds cash to this holder' : 'reduces cash · adds cost to the order';
});
function setRate(){ $('rate').value = rates[$('cur').value]||''; calc(); }
$('cur').onchange=setRate;
function calc(){ const a=parseFloat(($('amt').value||'').replace(/,/g,''))||0, r=parseFloat(($('rate').value||'').replace(/,/g,''))||0;
  $('conv').textContent = r>0 ? '≈ $'+(a/r).toLocaleString(undefined,{maximumFractionDigits:2})+' USD' : '≈ $0.00 USD'; }
let ME=null, IS_OWNER=false;
fetch('/papi/order-costs/orders',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{
  if(d.default_rates) rates=d.default_rates;
  ME=d.me; IS_OWNER=d.me&&d.me.is_owner;
  const sel=$('order'); sel.innerHTML='<option value="">— no order (general) —</option>';
  (d.orders||[]).forEach(o=>{ const opt=document.createElement('option'); opt.value=o.id;
    opt.textContent=`${o.order_no} · ${o.customer_name||'—'} · $${o.total}`; sel.appendChild(opt); });
  // Holder UI: owner picks staff from dropdown; staff auto-book to self
  if(IS_OWNER && d.staff && d.staff.length){
    $('holder').style.display='none';
    const hs=$('holderSel'); hs.style.display='block';
    hs.innerHTML='<option value="">— my own cash —</option>'+d.staff.map(u=>`<option value="${u.id}">${u.name} (${u.role})</option>`).join('')+'<option value="__other">Other (type name)…</option>';
    hs.onchange=function(){ if(hs.value==='__other'){$('holder').style.display='block';$('holder').value='';} else {$('holder').style.display='none';} };
  } else {
    // staff: hide holder input, show "booking to your cash"
    $('holderLbl').style.display='none'; $('holder').style.display='none'; $('holderMe').style.display='block';
  }
  setRate();
});
function save(){
  const fd=new FormData();
  fd.append('order_id',$('order').value); fd.append('stage',stage);
  fd.append('currency',$('cur').value);
  fd.append('native_amount',($('amt').value||'').replace(/,/g,''));
  fd.append('rate_to_usd',($('rate').value||'').replace(/,/g,''));
  const hs=$('holderSel');
  if(IS_OWNER && hs && hs.style.display!=='none' && hs.value && hs.value!=='__other'){
    fd.append('holder_user_id',hs.value);
  } else if($('holder').style.display!=='none' && $('holder').value){
    fd.append('holder',$('holder').value);
  }
  fd.append('note',$('note').value);
  if($('receipt').files[0]) fd.append('receipt',$('receipt').files[0]);
  const b=document.querySelector('.btn'); b.disabled=true; b.textContent='Saving…';
  fetch('/papi/order-costs',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'},body:fd})
    .then(r=>r.json()).then(r=>{ b.disabled=false; b.textContent='Book purchase';
      if(r.ok){ alert('Booked ✅  ($'+r.usd+' USD)'); $('amt').value='';$('note').value='';$('receipt').value='';$('rname').textContent='';calc(); }
      else alert('Could not save: '+(r.error||'error')); })
    .catch(()=>{ b.disabled=false; b.textContent='Book purchase'; alert('Failed.'); });
}
</script></body></html>
