<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Shopper">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>Cashbook</title>
<style>
  :root{--red:#D41C1C;--green:#059669;--amber:#d97706;--blue:#1e40af;--dark:#0f0f0f;--mute:#94a3b8;--bg:#f5f5f2;--border:#e8e8e3;--font:'Inter',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--font);color:#0f0f0f;}
  .wrap{max-width:680px;margin:0 auto;padding:14px;}
  @media(min-width:721px){ .wrap{max-width:1060px;} table.ledger{min-width:0;} }
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .top h1{font-size:20px;margin:0;font-weight:900;}.top a{color:var(--green);text-decoration:none;font-weight:700;font-size:13px;}
  .sub{font-size:12px;color:var(--mute);margin-bottom:12px;font-weight:600;}
  .filters{display:flex;gap:6px;margin-bottom:12px;}
  .filt{flex:1;padding:9px;border:1.5px solid var(--border);border-radius:10px;background:#fff;text-align:center;font-size:12px;font-weight:800;color:#374151;cursor:pointer;}
  .filt.on{border-color:var(--green);background:#ecfdf5;color:#065f46;}
  .balcard{border-radius:14px;padding:16px 18px;margin-bottom:11px;position:relative;overflow:hidden;color:#fff;}
  .balcard .circ{position:absolute;top:-20px;right:-20px;width:110px;height:110px;background:rgba(255,255,255,.06);border-radius:50%;}
  .balcard .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.3px;color:rgba(255,255,255,.6);margin-bottom:5px;}
  .balcard .val{font-size:30px;font-weight:900;letter-spacing:-1.5px;line-height:1;}
  .balcard .val .u{font-size:13px;font-weight:700;color:rgba(255,255,255,.45);}
  .usd{background:#1a6b3a;}.ugx{background:#8a5a10;}.ssp{background:#1a3a7a;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .sectlbl{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mute);margin-bottom:10px;}
  .dirbtns{display:flex;gap:8px;margin-bottom:4px;}
  .dirbtn{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:13px;font-weight:800;cursor:pointer;text-align:center;color:#374151;}
  .dirbtn.in.on{border-color:var(--green);background:#ecfdf5;color:#065f46;}
  .dirbtn.out.on{border-color:var(--red);background:#fef2f2;color:#991b1b;}
  label{font-size:12px;font-weight:700;color:#374151;display:block;margin:11px 0 5px;}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);background:#fff;outline:none;}
  input:focus,select:focus{border-color:var(--green);}
  .row{display:flex;gap:10px;}.row>div{flex:1;}
  .conv{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:800;color:#475569;margin-top:10px;}
  .btn{width:100%;margin-top:14px;color:#fff;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;background:var(--dark);}
  .ledwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:12px;background:#fff;}
  table.ledger{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
  table.ledger th{text-align:left;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:#94a3b8;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--border);background:#fafbfa;white-space:nowrap;position:sticky;top:0;}
  table.ledger th.num{text-align:right;}
  table.ledger th.in{color:#15803d;}table.ledger th.out{color:#dc2626;}
  table.ledger td{padding:9px 10px;border-bottom:1px solid #f1f4f1;vertical-align:top;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger tr.in{border-left:3px solid #15803d;}table.ledger tr.out{border-left:3px solid #dc2626;}
  table.ledger .ref{font-weight:800;color:#334155;white-space:nowrap;font-size:11px;}
  table.ledger .dt{color:#64748b;white-space:nowrap;font-size:11px;}
  table.ledger .part .cat{font-weight:800;color:#0f172a;}
  table.ledger .part .nt{color:#64748b;font-size:11px;margin-top:1px;}
  table.ledger .pers{color:#475569;white-space:nowrap;}
  table.ledger .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.ledger td.in{color:#15803d;font-weight:800;}
  table.ledger td.out{color:#dc2626;font-weight:800;}
  table.ledger .bal{font-weight:800;color:#0B3D22;}
  table.ledger .st{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  table.ledger .st.ok{background:#E6F4EA;color:#0B3D22;}table.ledger .st.pend{background:#FFF7E6;color:#d97706;}
  table.ledger .del{background:#fff;border:1.5px solid #fecaca;color:#dc2626;border-radius:7px;width:24px;height:24px;font-size:12px;font-weight:800;cursor:pointer;}
  .pager{display:flex;justify-content:center;gap:8px;margin-top:12px;}
  .pager button{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer;}
  .loading{text-align:center;color:var(--mute);padding:20px;}
  .pill{font-size:9px;background:#f1f5f9;color:#475569;padding:2px 7px;border-radius:8px;font-weight:800;}

  table.ledger .edt{background:#fff;border:1.5px solid #cfe0d4;color:#0B3D22;border-radius:7px;padding:4px 9px;font-size:11px;font-weight:800;cursor:pointer;margin-right:5px;}
  .ebackdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:79;display:none;}.ebackdrop.on{display:block;}
  .esheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -8px 30px -10px rgba(0,0,0,.25);transform:translateY(110%);transition:.22s;max-height:92vh;overflow:auto;max-width:520px;margin:0 auto;}
  .esheet.on{transform:translateY(0);}
  .esheet h3{margin:0 0 4px;font-size:16px;font-weight:900;}
  .esheet .rf{font-size:12px;color:#6E7D72;margin:0 0 10px;font-weight:700;}
  .esheet label{display:block;font-size:12px;font-weight:800;color:#374151;margin:10px 0 5px;}
  .esheet input,.esheet select{width:100%;padding:11px;border:1.5px solid #E1E8E2;border-radius:11px;font-size:16px;font-family:inherit;}
  .esheet .e2{display:flex;gap:10px;}.esheet .e2>*{flex:1;}
  .esave{width:100%;margin-top:14px;background:#0B3D22;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .ex{position:absolute;right:14px;top:14px;background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;}
</style>
<!-- ===== DishNet mobile app shell (injected v2) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dn-shell">
  :root{--dn-g:#15803D;--dn-gd:#0B3D22;--dn-gl:#E6F4EA;--dn-line:#E2E8E2;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px)!important;}

  /* sticky app bar (reuse existing .top) */
  .top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
       justify-content:flex-start;margin:-14px -14px 14px -14px!important;
       padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px!important;
       background:var(--dn-gd);box-shadow:0 2px 10px -4px rgba(11,61,34,.5);}
  .top h1{color:#fff!important;font-size:17px!important;font-weight:800!important;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top a{order:-1;flex-shrink:0;width:34px;height:34px;border-radius:50%;
         background:rgba(255,255,255,.16)!important;color:#fff!important;
         display:grid;place-items:center;font-size:0!important;text-decoration:none;}
  .top a::before{content:"\2039";font-size:24px;font-weight:700;line-height:1;margin-top:-2px;}
  .dn-appbtn{margin-left:auto;flex-shrink:0;height:34px;padding:0 13px;border-radius:99px;
             background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:700;
             display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .dn-appbtn:active{background:rgba(255,255,255,.28);}

  /* theme accents */
  .btn{background:var(--dn-gd)!important;border-radius:12px!important;padding:14px!important;font-weight:800!important;}
  .btn:active{background:#082a18!important;}
  input,select,textarea{font-size:16px!important;border-radius:11px!important;}
  input:focus,select:focus,textarea:focus{border-color:var(--dn-g)!important;}
  .card,.oitem,.item,.balcard,.hero{box-shadow:0 1px 2px rgba(16,35,28,.05),0 3px 12px -4px rgba(16,35,28,.06);}

  /* #2 amount echo (anti-typo) */
  .dn-amt-echo{display:none;margin:9px 0 2px;padding:8px 12px;border-radius:10px;
               background:var(--dn-gl);border:1px solid #BFE3CB;color:var(--dn-gd);
               font-size:16px;font-weight:800;letter-spacing:.2px;}

  /* fixed bottom tab bar */
  .dn-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;min-height:58px;
             background:#fff;border-top:1px solid var(--dn-line);
             padding-bottom:env(safe-area-inset-bottom,0px);
             box-shadow:0 -2px 14px -6px rgba(16,35,28,.18);}
  .dn-tabbar a{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;
               gap:3px;padding:9px 2px 8px;text-decoration:none;color:#7C8A80;font-size:10.5px;font-weight:700;}
  .dn-tabbar a .di{font-size:20px;line-height:1;filter:grayscale(35%);opacity:.85;}
  .dn-tabbar a .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .dn-tabbar a.on{color:var(--dn-gd);}
  .dn-tabbar a.on .di{filter:none;opacity:1;transform:translateY(-1px);}
  .dn-tabbar a.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--dn-g);}
  @media(min-width:721px){.dn-tabbar{max-width:720px;margin:0 auto;border-left:1px solid var(--dn-line);border-right:1px solid var(--dn-line);}}
</style>
</head>
<body><div class="wrap">
  <div class="top"><h1 id="title">💵 Cashbook</h1><a href="/panel">← Panel</a></div>
  <div class="sub" id="sub">Currency-aware cash ledger</div>

  <div class="filters">
    <div class="filt on" data-c="ALL" onclick="setFilt(this)">All</div>
    <div class="filt" data-c="USD" onclick="setFilt(this)">💵 USD</div>
    <div class="filt" data-c="UGX" onclick="setFilt(this)">🇺🇬 UGX</div>
    <div class="filt" data-c="SSP" onclick="setFilt(this)">🇸🇸 SSP</div>
  </div>

  <div id="balances"></div>

  <div class="card">
    <div class="sectlbl">➕ RECORD CASH MOVEMENT</div>
    <div class="dirbtns">
      <div class="dirbtn in on" data-d="in" onclick="setDir('in')">↓ Money in</div>
      <div class="dirbtn out" data-d="out" onclick="setDir('out')">↑ Money out</div>
    </div>
    <div class="row">
      <div><label>Currency</label><select id="cur" onchange="setRate()"><option>UGX</option><option>SSP</option><option>USD</option></select></div>
      <div style="flex:1.5"><label>Amount</label><input id="amt" inputmode="decimal" placeholder="100000" oninput="calc()"></div>
    </div>
    <label>Rate (native per 1 USD)</label>
    <input id="rate" inputmode="decimal" oninput="calc()">
    <div class="conv" id="conv">≈ $0.00 USD</div>
    <label>Category</label>
    <select id="cat"><option value="">— choose —</option><option>Receipt</option><option>Sale</option><option>Funding / Float</option><option>Local Purchase</option><option>Travel &amp; Field</option><option>Food Allowance</option><option>Transport</option><option>Salary / Wages</option><option>Misc Expense</option><option>Other</option></select>
    <label>Note (optional)</label>
    <input id="note" placeholder="e.g. float to Jayesh, sold goods">
    <button class="btn" id="saveBtn" onclick="save()">Record entry</button>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
    <div class="sectlbl" style="margin:0">📒 ENTRIES</div>
    <div style="display:flex;gap:6px">
      <button onclick="exportCsv()" style="background:#0B3D22;color:#fff;border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer">⬇ CSV</button>
      <button onclick="exportPdf()" style="background:#eef2f7;color:#334155;border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer">🖨 PDF</button>
    </div>
  </div>
  <div id="list"><div class="loading">Loading…</div></div>
  <div class="pager" id="pager"></div>
</div>
<script>
const $=s=>document.getElementById(s);
let FILT='ALL', DIR='in', PAGE=1, PAGES=1, rates={UGX:3700,SSP:5180,USD:1};
function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function setFilt(el){document.querySelectorAll('.filt').forEach(f=>f.classList.remove('on'));el.classList.add('on');FILT=el.dataset.c;PAGE=1;load();}
function setDir(d){DIR=d;document.querySelectorAll('.dirbtn').forEach(b=>b.classList.remove('on'));document.querySelector('.dirbtn.'+d).classList.add('on');$('saveBtn').style.background=d==='out'?'var(--red)':'var(--dark)';$('saveBtn').textContent=d==='out'?'Record money out':'Record money in';}
function setRate(){$('rate').value=rates[$('cur').value]||'';calc();}
function calc(){const a=parseFloat(($('amt').value||'').replace(/,/g,''))||0,r=parseFloat(($('rate').value||'').replace(/,/g,''))||0;$('conv').textContent='≈ $'+(r>0?fmt(a/r):'0.00')+' USD';}
function balCard(cur,v){const cls={USD:'usd',UGX:'ugx',SSP:'ssp'}[cur];const sym=cur==='USD'?'$':'';const unit=cur==='USD'?'':cur;
  return `<div class="balcard ${cls}"><div class="circ"></div><div class="lbl">${cur} balance</div><div class="val">${sym}${fmt(v)} <span class="u">${unit}</span></div></div>`;}

var ERATES={UGX:3655,SSP:5180,USD:1};
function editRow(id){
  var e=(window.__ENTRIES||[]).find(function(x){return x.id===id;}); if(!e){return;}
  window.__EID=id;
  $('eRef').textContent=(e.ref||'')+' · '+(e.category||'')+' · '+(e.when||'');
  $('eAmt').value=e.native||''; $('eCur').value=e.currency||'UGX';
  $('eRate').value=e.rate||ERATES[e.currency]||''; $('eHolder').value=e.holder||'';
  $('eOrder').value=e.order_no||''; $('eCat').value=e.category||''; $('eNote').value=(e.note||'');
  $('eDate').value=e.created_date||'';
  $('eOrderWrap').style.display=(e.stage==='purchase'||e.stage==='customer_payment')?'block':'none';
  // fill people datalist from current holders
  var names={}; (window.__ENTRIES||[]).forEach(function(x){if(x.holder)names[x.holder]=1;});
  $('ePeople').innerHTML=Object.keys(names).map(function(n){return '<option value="'+n.replace(/"/g,'&quot;')+'">';}).join('');
  eRate();
  $('eback').classList.add('on'); $('esheet').classList.add('on');
}
function closeEdit(){ $('eback').classList.remove('on'); $('esheet').classList.remove('on'); }
function eRate(){ var c=$('eCur').value; $('eRateWrap').style.display=c==='USD'?'none':'flex'; }
function saveEdit(){
  var id=window.__EID; if(!id) return;
  var amt=parseFloat(($('eAmt').value||'').replace(/,/g,''))||0; if(amt<=0){alert('Amount?');return;}
  var body=new URLSearchParams({amount:amt,currency:$('eCur').value,rate_to_usd:($('eCur').value==='USD'?1:($('eRate').value||'')),holder:$('eHolder').value.trim(),order_no:$('eOrder').value.trim(),category:$('eCat').value.trim(),note:$('eNote').value.trim(),created_date:$('eDate').value});
  var b=$('eSave'); b.disabled=true; b.textContent='Saving…';
  fetch('/papi/trade-cashbook/'+id+'/update',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:body})
   .then(r=>r.json()).then(function(r){ b.disabled=false; b.textContent='Save changes';
     if(r&&r.ok){ closeEdit(); load(); } else alert('Could not save: '+((r&&r.error)||'error')); })
   .catch(function(){ b.disabled=false; b.textContent='Save changes'; alert('Failed'); });
}
function load(){
  fetch('/papi/trade-cashbook?currency='+FILT+'&page='+PAGE+'&per=20',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{
    if(!d.ok){$('list').innerHTML='<div class="loading">Could not load.</div>';return;}
    if(d.default_rates)rates=d.default_rates;
    $('title').textContent=d.view==='mine'?'💵 My Cashbook':'💵 Cashbook';
    $('sub').textContent=(d.view==='mine'?('My cash · '+d.whoami):'All staff')+' · currency-aware ledger';
    // balances
    const b=d.balances;
    $('balances').innerHTML = FILT==='ALL'
      ? balCard('USD',b.USD)+balCard('UGX',b.UGX)+balCard('SSP',b.SSP)
      : balCard(FILT,b[FILT]);
    // entries
    PAGES=d.pages||1;
    if(!d.entries||!d.entries.length){$('list').innerHTML='<div class="loading">No entries.</div>';$('pager').innerHTML='';return;}
    $('list').innerHTML = `
      <div class="ledwrap"><table class="ledger">
        <thead><tr><th>Ref</th><th>Date</th><th>Particulars</th><th>Person</th><th class="num in">IN</th><th class="num out">OUT</th><th class="num">Balance</th><th>Status</th><th></th></tr></thead>
        <tbody>${(window.__ENTRIES=d.entries, window.__OWNER=!!d.is_owner, d.entries).map(e=>`
          <tr class="${e.dir}">
            <td class="ref">${e.ref||''}</td>
            <td class="dt">${e.when||''}</td>
            <td class="part"><div class="cat">${e.category||''}</div>${e.note?`<div class="nt">${e.note}</div>`:''}</td>
            <td class="pers">${e.holder||''}</td>
            <td class="num in">${e.dir==='in'?e.currency+' '+fmt(e.native):''}</td>
            <td class="num out">${e.dir==='out'?e.currency+' '+fmt(e.native):''}</td>
            <td class="num bal">${e.currency} ${fmt(e.run)}</td>
            <td>${e.status==='approved'?'<span class="st ok">Done</span>':'<span class="st pend">'+e.status+'</span>'}</td>
            <td style="white-space:nowrap">${window.__OWNER&&e.editable?`<button class="edt" onclick="editRow(${e.id})">Edit</button>`:''}${window.__OWNER&&e.editable?`<button class="del" onclick="del(${e.id})">✕</button>`:''}</td>
          </tr>`).join('')}</tbody>
      </table></div>`;
    // pager
    $('pager').innerHTML = PAGES>1 ? `<button ${PAGE<=1?'disabled':''} onclick="PAGE--;load()">‹ Prev</button><span style="padding:7px 4px;font-size:13px;color:#64748b">Page ${PAGE}/${PAGES}</span><button ${PAGE>=PAGES?'disabled':''} onclick="PAGE++;load()">Next ›</button>` : '';
  });
}
function fetchAll(){
  return fetch('/papi/trade-cashbook/all?currency='+FILT,{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'}).then(r=>r.json());
}
function csvCell(v){ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCsv(){
  fetchAll().then(function(d){
    if(!d.ok||!d.entries||!d.entries.length){ alert('Nothing to export'); return; }
    var head=['Ref','Date','Category','Particulars','Person','Currency','In','Out','Balance','USD','Status'];
    var lines=[head.map(csvCell).join(',')];
    d.entries.forEach(function(e){
      lines.push([e.ref,e.date,e.category,e.note,e.person,e.currency,e.in||'',e.out||'',e.balance,e.usd,e.status].map(csvCell).join(','));
    });
    var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='cashbook-'+(FILT==='ALL'?'all':FILT)+'-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }).catch(function(){ alert('Export failed'); });
}
function exportPdf(){
  fetchAll().then(function(d){
    if(!d.ok||!d.entries||!d.entries.length){ alert('Nothing to export'); return; }
    var w=window.open('','_blank'); if(!w){ alert('Allow pop-ups to print'); return; }
    var rows=d.entries.map(function(e){
      return '<tr class="'+(e.in?'in':'out')+'"><td>'+esc(e.ref)+'</td><td>'+esc(e.date)+'</td>'+
        '<td><b>'+esc(e.category)+'</b>'+(e.note?'<br><span class=n>'+esc(e.note)+'</span>':'')+'</td>'+
        '<td>'+esc(e.person||'')+'</td>'+
        '<td class="num in">'+(e.in?esc(e.currency)+' '+fmt(e.in):'')+'</td>'+
        '<td class="num out">'+(e.out?esc(e.currency)+' '+fmt(e.out):'')+'</td>'+
        '<td class="num b">'+esc(e.currency)+' '+fmt(e.balance)+'</td>'+
        '<td>'+esc(e.status)+'</td></tr>';
    }).join('');
    w.document.write('<html><head><title>Cashbook '+(FILT==='ALL'?'':FILT)+'</title>'+
      '<style>body{font-family:Arial,sans-serif;color:#111;padding:16px}h2{margin:0 0 2px}.sub{color:#666;font-size:12px;margin-bottom:12px}'+
      'table{width:100%;border-collapse:collapse;font-size:11px}th,td{border-bottom:1px solid #ddd;padding:6px 7px;text-align:left;vertical-align:top}'+
      'th{background:#f3f5f3;text-transform:uppercase;font-size:9px;letter-spacing:.4px;color:#555}.num{text-align:right;white-space:nowrap}'+
      'tr.in td.in{color:#15803d;font-weight:700}tr.out td.out{color:#dc2626;font-weight:700}td.b{font-weight:700;color:#0B3D22}.n{color:#666}'+
      '@media print{button{display:none}}</style></head><body>'+
      '<h2>Cashbook — '+(FILT==='ALL'?'All currencies':FILT)+'</h2>'+
      '<div class="sub">Family Shoppers · '+d.count+' entries · '+new Date().toLocaleString()+'</div>'+
      '<table><thead><tr><th>Ref</th><th>Date</th><th>Particulars</th><th>Person</th><th class=num>In</th><th class=num>Out</th><th class=num>Balance</th><th>Status</th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></body></html>');
    w.document.close(); setTimeout(function(){ w.focus(); w.print(); },400);
  }).catch(function(){ alert('Export failed'); });
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function save(){
  const native=($('amt').value||'').replace(/,/g,''),rate=($('rate').value||'').replace(/,/g,'');
  if(!(parseFloat(native)>0)){alert('Enter an amount');return;}
  const p=new URLSearchParams({dir:DIR,currency:$('cur').value,native_amount:native,rate_to_usd:rate,category:$('cat').value,note:$('note').value});
  const b=$('saveBtn');b.disabled=true;
  fetch('/papi/trade-cashbook?'+p,{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(r=>{
    b.disabled=false;setDir(DIR);
    if(r.ok){$('amt').value='';$('note').value='';$('cat').value='';calc();PAGE=1;load();}else alert('Failed: '+(r.error||'error'));
  }).catch(()=>{b.disabled=false;alert('Failed.');});
}
function del(id){var e=(window.__ENTRIES||[]).find(function(x){return x.id===id;});var msg=(e&&e.stage==='customer_payment')?'Delete this receipt? It will be removed from the customer account too. Cannot be undone.':'Delete this entry? Cannot be undone.';if(!confirm(msg))return;
  fetch('/papi/trade-cashbook/'+id+'/delete',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(r=>{if(r.ok)load();else alert(r.error==='not_allowed'?'Only owner/manager can delete':'Failed');});}
setRate();load();
</script>
<!-- ===== DishNet role-aware tab bar + amount format (injected v2) ===== -->
<nav class="dn-tabbar" id="dnTabbar"></nav>
<script>
(function(){
  var here=location.pathname.replace(/\/+$/,'')||'/panel';
  // tab -> access rule. menu:X requires effectiveMenus contains X; owner requires is_owner.
  var TABS=[
    {t:'Orders',i:'\uD83D\uDED2',u:'/panel/orders-costs', need:'menu:ordercosts'},
    {t:'Buy',   i:'\uD83D\uDECD\uFE0F',u:'/panel/book-cost',    need:'menu:purchases'},
    {t:'List',  i:'\uD83D\uDCCB',u:'/panel/buy-list',     need:'buylist'},
    {t:'Cash',  i:'\uD83D\uDCB0',u:'/panel/cash-position', need:'menu:cash'},
    {t:'Book',  i:'\uD83D\uDCD2',u:'/panel/trade-cashbook',need:'owner'},
    {t:'Spend', i:'\uD83D\uDCB8',u:'/panel/expenses',      need:'owner'},
    {t:'P&L',   i:'\uD83D\uDCC8',u:'/panel/pnl',           need:'owner'}
  ];
  function allowed(rule, nav){
    if(rule==='owner') return !!nav.is_owner;
    if(rule==='buylist') return (nav.menus||[]).indexOf('purchases')>=0 && !nav.is_owner;
    if(rule.indexOf('menu:')===0){ var k=rule.slice(5); return (nav.menus||[]).indexOf(k)>=0; }
    return false;
  }
  function render(nav){
    var bar=document.getElementById('dnTabbar'); if(!bar) return;
    var vis=TABS.filter(function(x){ return allowed(x.need,nav); });
    bar.innerHTML=vis.map(function(x){
      var on=(here===x.u)?'on':'';
      return '<a class="'+on+'" href="'+x.u+'"><span class="di">'+x.i+'</span><span class="dl">'+x.t+'</span></a>';
    }).join('');
    // Approvals pill: only if user actually has the approvals menu, and not already on it
    var top=document.querySelector('.top');
    if(top && here!=='/panel/approvals' && (nav.menus||[]).indexOf('approvals')>=0){
      var a=document.createElement('a'); a.className='dn-appbtn'; a.href='/panel/approvals';
      a.innerHTML='\u2713 Approvals'; top.appendChild(a);
    }
  }
  // Safe fallback if the nav call fails: core three only, no owner tabs, no approvals.
  var FALLBACK={is_owner:false, menus:['ordercosts','purchases','cash']};
  fetch('/papi/me/nav',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(function(d){ render(d && d.ok ? d : FALLBACK); })
    .catch(function(){ render(FALLBACK); });

  // ---- #2 live thousands-grouping + currency echo (anti big-number typo) ----
  function group(v){
    v=(v==null?'':String(v)).replace(/[^\d.]/g,'');
    var p=v.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return p.length>1 ? p[0]+'.'+p.slice(1).join('') : p[0];
  }
  function wire(id, curId){
    var el=document.getElementById(id); if(!el) return;
    var cur=curId?document.getElementById(curId):null;
    var echo=document.createElement('div'); echo.className='dn-amt-echo';
    var anchor=(el.closest && el.closest('.row'))||el;
    if(anchor.parentNode) anchor.parentNode.insertBefore(echo, anchor.nextSibling);
    function upd(){
      var g=group(el.value); if(el.value!==g) el.value=g;
      var n=parseFloat(g.replace(/,/g,''))||0;
      if(n>0){ echo.textContent=(cur&&cur.value?cur.value+' ':'')+group(String(n)); echo.style.display='block'; }
      else { echo.textContent=''; echo.style.display='none'; }
    }
    el.addEventListener('input',upd);
    if(cur) cur.addEventListener('change',upd);
    // pages clear the field on successful save (value set directly) -> re-sync after any button tap
    document.querySelectorAll('.btn,button').forEach(function(b){ b.addEventListener('click',function(){ setTimeout(upd,1500); }); });
    upd();
  }
  wire('amt','cur');       // book_cost, expenses, trade_cashbook
  wire('total','sellcur'); // orders_costs
})();
</script>
