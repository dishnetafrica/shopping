name: tests
on:
  push:
  pull_request:
jobs:
  money-kernel:
    name: Money kernel (must pass)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopbot_test
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopbot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      APP_KEY: base64:N2AKuDAQKomuTgjhawBbQFh06whgXLxdYxVRxwL55/s=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shopbot_test
      DB_USERNAME: shopbot
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, intl, zip, gd
          coverage: none
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing
          mkdir -p storage/logs storage/app/public
          chmod -R 777 bootstrap/cache storage
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Migrate the test database
        run: php artisan migrate --force
      - name: Money kernel tests (the important ones)
        run: php artisan test tests/Unit/Kernel tests/Feature/Kernel
      # Travel Vertical (M1). A required check, like the money kernel above: this step has no
      # continue-on-error, so a failing travel test fails the job. It covers the trip record, the
      # pipeline, the conversation guards (no invented fare, no passport request), tenant isolation
      # of the travel tables, and that a business which is not a travel agency is untouched.
      - name: Travel vertical tests (must pass)
        run: php artisan test tests/Unit/Travel tests/Feature/Travel
      - name: Full suite (informational only — shows what still needs work)
        continue-on-error: true
        run: |
          set +e
          php artisan test 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/fullsuite.txt
          echo ""
          echo "======================================================================"
          echo "   FULL-SUITE RESULT  —  screenshot from this line down and send to me"
          echo "======================================================================"
          grep -E "Tests:|Duration:" /tmp/fullsuite.txt | tail -3
          echo "----------------------------- FAILING --------------------------------"
          grep -E "(^| )FAIL |^[[:space:]]*⨯" /tmp/fullsuite.txt | head -120
          echo "======================================================================"
      - name: Save full-suite log (optional download)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-log
          path: /tmp/fullsuite.txt
          if-no-files-found: ignore

  v3-assets:
    name: V3 assets in sync
    runs-on: ubuntu-latest
    # No PHP/DB — a pure byte-comparison of the V3 source of truth (resources/v3) against its
    # served copy (public/assets/v3). Fails the PR if someone edited resources/v3 without running
    # scripts/v3-assets-sync.sh. See docs/v3-migration/V3-MAINTAINABILITY-STANDARD.md.
    steps:
      - uses: actions/checkout@v4
      - name: resources/v3 == public/assets/v3
        run: bash scripts/v3-assets-sync-check.sh
      # Travel Vertical (M1): runs the real navigation code from shell.js and fails if the Trips
      # menu entry would show for any business type other than a travel agency.
      - name: Trips menu shows only for travel agencies
        run: node tests/render-sim/trips_nav_gate.js
