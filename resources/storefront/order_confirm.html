<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Check your order</title>
<style>
  :root{ --g:#0B3D22; --g2:#16a34a; --line:#e4eae6; --ink:#12241a; --mut:#65786d; --warn:#b45309; --bg:#f4f7f5; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .biz{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g2);margin-bottom:6px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:14px;margin-bottom:0}
  .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  .nm{font-weight:650}
  .qt{color:var(--mut);font-size:13px;margin-top:2px}
  .amt{text-align:right;white-space:nowrap;font-weight:700}
  .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:2px solid var(--ink)}
  .tot b{font-size:22px}
  .dl{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .dl:last-child{border-bottom:0}
  .dl .k{color:var(--mut);min-width:96px}
  .dl .v{font-weight:650}
  .go{display:block;width:100%;border:0;border-radius:14px;background:var(--g);color:#fff;font-size:17px;font-weight:800;padding:16px;cursor:pointer}
  .go:disabled{opacity:.55}
  .wrongbox{margin-top:12px;font-size:14px;color:var(--mut);text-align:center}
  .ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:14px;padding:16px;text-align:center;font-weight:700}
  .stale{background:#fff7ed;border:1px solid #fed7aa;color:var(--warn);border-radius:14px;padding:14px;font-size:14px;margin-bottom:14px}
  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px;line-height:1.7}
  a{color:var(--g2)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>/*__CONFIRM_CFG__*/</script>
<script>
(function(){
  var C = window.CONFIRM_CFG || {};
  var S = C.snapshot || {};
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var money = function(n, cur){
    cur = String(cur||'UGX').toUpperCase();
    var dec = cur === 'USD' ? 2 : 0;
    return cur + ' ' + Number(n||0).toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});
  };
  var qty = function(q, unit){
    var s = String(Math.round(Number(q||0)*1000)/1000);
    return unit ? (s + ' ' + unit) : s;
  };

  var lines = S.lines || [];
  var rows = lines.map(function(l){
    var amount = Number(l.price||0) * Number(l.qty||0);
    return '<tr><td><div class="nm">' + esc(l.name) + '</div>'
      + '<div class="qt">' + esc(qty(l.qty, l.unit)) + (Number(l.price||0) > 0 ? ' × ' + esc(money(l.price, S.currency)) : '') + '</div></td>'
      + '<td class="amt">' + (Number(l.price||0) > 0 ? esc(money(amount, S.currency)) : '—') + '</td></tr>';
  }).join('');

  var details = '';
  if (S.address)  details += '<div class="dl"><span class="k">Deliver to</span><span class="v">' + esc(S.address) + '</span></div>';
  if (S.terms)    details += '<div class="dl"><span class="k">Payment</span><span class="v">' + esc(S.terms) + '</span></div>';
  if (S.order_date) details += '<div class="dl"><span class="k">Ordered</span><span class="v">' + esc(S.order_date) + '</span></div>';

  var head = '<div class="card">'
    + (C.business ? '<div class="biz">' + esc(C.business) + '</div>' : '')
    + '<h1>Order ' + esc(S.order_no || '') + '</h1>'
    + '<p class="sub">Please check this is right before we deliver.</p></div>';

  var body = '<div class="card"><p class="lbl">What you ordered</p><table>' + rows + '</table>'
    + (Number(S.total||0) > 0 ? '<div class="tot"><span>Total</span><b>' + esc(money(S.total, S.currency)) + '</b></div>' : '')
    + '</div>'
    + (details ? '<div class="card"><p class="lbl">Delivery &amp; payment</p>' + details + '</div>' : '');

  var action;
  if (C.superseded) {
    action = '<div class="stale">This order has been updated since this message was sent. '
           + 'Please open the newest message we sent you on WhatsApp, or contact us.</div>';
  } else if (C.confirmed) {
    action = '<div class="ok">✅ Confirmed' + (C.confirmedAt ? ' on ' + esc(C.confirmedAt) : '') + '<br>'
           + '<span style="font-weight:500;font-size:14px">Thank you — we are getting it ready.</span></div>';
  } else {
    action = '<div class="card"><button class="go" id="go">✅ Yes, this is correct</button>'
           + '<div class="wrongbox">Something wrong? Do not tap — reply on WhatsApp'
           + (C.contact ? ' or call <a href="tel:' + esc(C.contact) + '">' + esc(C.contact) + '</a>' : '')
           + ' and we will fix it before delivery.</div></div>';
  }

  document.getElementById('app').innerHTML = head + body + action
    + '<div class="foot">Confirming records the date and time against this order.<br>'
    + 'It does not take any payment.</div>';

  var btn = document.getElementById('go');
  if (btn) {
    btn.addEventListener('click', function(){
      btn.disabled = true; btn.textContent = 'Saving…';
      fetch('/o/' + encodeURIComponent(C.token) + '/accept', {
        method: 'POST', headers: {'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}
      }).then(function(r){ return r.json(); }).then(function(d){
        if (d && d.ok) {
          document.getElementById('app').innerHTML = head + body
            + '<div class="ok">✅ Confirmed' + (d.at ? ' on ' + esc(d.at) : '') + '<br>'
            + '<span style="font-weight:500;font-size:14px">Thank you — we are getting it ready.</span></div>';
        } else {
          btn.disabled = false; btn.textContent = '✅ Yes, this is correct';
          alert((d && d.message) || 'Could not save that. Please reply on WhatsApp instead.');
        }
      }).catch(function(){
        btn.disabled = false; btn.textContent = '✅ Yes, this is correct';
        alert('No connection. Please reply YES on WhatsApp instead.');
      });
    });
  }
})();
</script>
</body>
</html>
