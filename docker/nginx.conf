server {
    listen 80 default_server;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 25m;

    # E9 shared design assets (tokens.css / ui.js). Served straight from resources/ via alias, so we
    # never create a public/panel/ directory (which would shadow the /panel route and 403 the panel).
    # ^~ makes this prefix win without any regex-location interference.
    location ^~ /panel/shared/ {
        alias /var/www/html/resources/panel/shared/;
        access_log off;
        types { text/css css; application/javascript js; }
        default_type application/octet-stream;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
