# Build + push the multi-arch ShopBot Vision EDGE image to GitHub Container Registry (GHCR).
#
# The box never builds — CI produces one manifest covering arm64 (RK3588 / Jetson) and amd64, so the box
# pulls the right architecture. Triggered ONLY on an edge version tag so it never runs on ordinary pushes
# and never interferes with the Laravel EasyPanel build.
#
# GHCR needs NO registry secret: the built-in GITHUB_TOKEN (with packages: write below) authenticates the
# push. The ONLY thing you must configure is the repo VARIABLE SHOPBOT_LICENSE_PUBKEY (the public
# verification key — safe to expose). The signing PRIVATE key is never referenced here.
# The published package is PRIVATE by default; a separate read-only PAT is used to pull on the box.
name: edge-image

on:
  push:
    tags:
      - 'edge-v*'          # e.g. edge-v0.1.0
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/shopbot-vision   # → ghcr.io/dishnetafrica/shopbot-vision

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if the license public key is missing
        run: |
          if [ -z "${{ vars.SHOPBOT_LICENSE_PUBKEY }}" ]; then
            echo "::error::SHOPBOT_LICENSE_PUBKEY variable is empty — the image would ship with no license"
            echo "::error::verification key and every license would be rejected on the box. Set the repo"
            echo "::error::variable SHOPBOT_LICENSE_PUBKEY to config('vision.license_public') and re-run."
            exit 1
          fi

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (built-in token — no secret to manage)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image (pinned to the tag, no :latest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edge/Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: |
            SHOPBOT_LICENSE_PUBKEY=${{ vars.SHOPBOT_LICENSE_PUBKEY }}
            SHOPBOT_VISION_VERSION=${{ github.ref_name }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Output the image reference + digest to pull
        run: |
          echo "IMAGE_REF=${{ env.IMAGE }}:${{ github.ref_name }}"
          echo "DIGEST=${{ steps.build.outputs.digest }}"
          echo "Verify on the box before install: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }}"
