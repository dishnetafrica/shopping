<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Shopper</title>
<meta name="theme-color" content="#0B3D22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Shopper">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gd:#0B3D22;--g:#15803D;--line:#E2E8E2;--ink:#16231C;--mute:#6E7D72;}
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Outfit',system-ui,-apple-system,sans-serif;background:#EEF2EE;color:var(--ink);
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
  .hero{background:linear-gradient(160deg,#15803D,#0B3D22);color:#fff;
        padding:calc(env(safe-area-inset-top,0px) + 22px) 20px 44px}
  .hbar{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:13px;background:#fff;color:var(--gd);display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto}
  .hi{flex:1;min-width:0}
  .hi .n{font-size:19px;font-weight:800;line-height:1.15}
  .hi .r{font-size:12.5px;opacity:.82;font-weight:600;margin-top:2px}
  .out{flex:0 0 auto;background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:99px;padding:9px 14px;font-size:12.5px;font-weight:700;text-decoration:none}
  .grid{padding:0 16px;margin-top:-26px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin-left:auto;margin-right:auto}
  .tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-decoration:none;color:var(--ink);
        display:flex;flex-direction:column;gap:10px;min-height:118px;box-shadow:0 2px 10px -6px rgba(16,35,28,.25)}
  .tile:active{transform:scale(.98)}
  .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px}
  .tile .t{font-size:15px;font-weight:800;line-height:1.15}
  .tile .d{font-size:11.5px;color:var(--mute);font-weight:600;line-height:1.3;margin-top:auto}
  .full{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center}
  .full .ic{flex:0 0 auto}.full .txt{flex:1}
  .foot{text-align:center;color:var(--mute);font-size:11px;font-weight:600;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
  .load{grid-column:1/-1;text-align:center;color:var(--mute);padding:26px;font-weight:600}
</style></head>
<body>
  <div class="hero">
    <div class="hbar">
      <div class="logo" id="logo">FS</div>
      <div class="hi"><div class="n" id="hi">Family Shopper</div><div class="r" id="role">Seller</div></div>
      <a class="out" href="/panel/logout" onclick="return confirm('Sign out?')">Sign out</a>
    </div>
  </div>
  <div class="grid" id="grid"><div class="load">Loading…</div></div>
  <div class="foot">Family Shopper · tap a tile to start</div>

<script>
var TILES=[
  {t:'Buy List',        d:'What to buy today',        i:'\uD83E\uDDFA', u:'/panel/buy-list',      need:'purchases', bg:'#E1F5EE', fg:'#0F6E56'},
  {t:'Payments',        d:'Advances & receipts',      i:'\uD83D\uDCB5', u:'/panel/payments',       need:'panel', bg:'#FAEEDA', fg:'#854F0B'},
  {t:'Book Purchase',   d:'Record a buy · cash/credit',i:'\uD83D\uDECD\uFE0F', u:'/panel/book-cost', need:'menu:purchases', bg:'#E6F4EA', fg:'#15803D'},
  {t:'Orders & Margin', d:'Juba orders + margin',     i:'\uD83E\uDDFE', u:'/panel/orders-costs',  need:'menu:ordercosts', bg:'#E6F1FB', fg:'#185FA5'},
  {t:'Cash',            d:'How much cash I have',     i:'\uD83D\uDCB0', u:'/panel/cash-position', need:'menu:cash', bg:'#FAEEDA', fg:'#854F0B'},
  {t:'Suppliers We Owe',d:'Credit debt · pay supplier',i:'\uD83E\uDDFE', u:'/panel/supplier-debt', need:'purchases', bg:'#FCEBEB', fg:'#A32D2D'},
  {t:'Cashbook',        d:'Money in / out',           i:'\uD83D\uDCD2', u:'/panel/trade-cashbook', need:'owner', bg:'#EEEDFE', fg:'#534AB7'},
  {t:'Expenses',        d:'Record an expense',        i:'\uD83D\uDCB8', u:'/panel/expenses',       need:'owner', bg:'#FBEAF0', fg:'#993556'},
  {t:'Profit & Loss',   d:'Live P&L',                 i:'\uD83D\uDCC8', u:'/panel/pnl',            need:'owner', bg:'#EAF3DE', fg:'#3B6D11'},
  {t:'Partners',        d:'Capital & ownership',      i:'\uD83E\uDD1D', u:'/panel/partners',       need:'owner', bg:'#E6F1FB', fg:'#185FA5'},
  {t:'Invoiced',        d:'Monthly revenue',          i:'\uD83E\uDDFE', u:'/panel/invoiced',       need:'owner', bg:'#EAF3DE', fg:'#3B6D11'},
  {t:'Approvals',       d:'Review receipts',          i:'\u2705',       u:'/panel/approvals',      need:'menu:approvals', bg:'#F1EFE8', fg:'#444441'}
];
function allowed(rule,nav){
  if(rule==='owner') return !!nav.is_owner;
  if(rule==='panel') return true;
  if(rule==='purchases') return (nav.menus||[]).indexOf('purchases')>=0;
  if(rule.indexOf('menu:')===0){ var k=rule.slice(5); return (nav.menus||[]).indexOf(k)>=0; }
  return false;
}
function initials(name){ name=(name||'').trim(); if(!name) return 'FS';
  var p=name.split(/\s+/); return ((p[0]||'')[0]||'F').toUpperCase()+((p[1]||'')[0]||(p[0]||'S')[1]||'S').toUpperCase(); }
function render(nav){
  document.getElementById('hi').textContent = nav.name ? ('Hi '+nav.name.split(/\s+/)[0]) : 'Family Shopper';
  document.getElementById('role').textContent = (nav.role||'seller').replace(/^\w/,function(c){return c.toUpperCase();})+' · Family Shopper';
  document.getElementById('logo').textContent = initials(nav.name);
  var vis=TILES.filter(function(x){return allowed(x.need,nav);});
  var g=document.getElementById('grid');
  if(!vis.length){ g.innerHTML='<div class="load">No screens for this login.</div>'; return; }
  g.innerHTML=vis.map(function(x){
    return '<a class="tile" href="'+x.u+'"><div class="ic" style="background:'+x.bg+';color:'+x.fg+'">'+x.i+'</div>'+
      '<div class="t">'+x.t+'</div><div class="d">'+x.d+'</div></a>';
  }).join('');
}
var FALLBACK={name:'',role:'seller',is_owner:false,menus:['ordercosts','purchases','cash']};
fetch('/papi/me/nav',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
  .then(function(r){return r.json();})
  .then(function(d){ render(d&&d.ok?d:FALLBACK); })
  .catch(function(){ render(FALLBACK); });
</script>
</body></html>
