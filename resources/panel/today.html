<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today — CloudBSS</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#15181d;--muted:#6b7280;--line:#e6e8ec}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b20;--ink:#eef0f3;--muted:#98a0ab;--line:#262a31}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:22px 16px 48px}
  h1{font-size:23px;margin:0 0 2px}
  .lead{color:var(--muted);font-size:14px;margin:0 0 14px}
  .lead b{color:var(--ink)}
  .recap{display:flex;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:18px;font-size:13px}
  .recap .m{color:var(--muted)} .recap .v{font-weight:700}
  .refresh{float:right;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:5px 10px;font-size:13px;cursor:pointer}
  .group{margin:0 0 18px}
  .ghead{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-weight:700}
  .ghead .gi{font-size:16px}
  .ghead .gc{margin-left:auto;color:var(--muted);font-size:12px;font-weight:600}
  .task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 13px;margin-bottom:8px}
  .task .body{min-width:0;flex:1}
  .task .lab{font-weight:650}
  .task .det{color:var(--muted);font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .rs{font-size:12px;margin-top:3px;opacity:.95}
  .task .act{flex:0 0 auto}
  .task .act button{border:0;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:650;color:#fff;cursor:pointer}
  .done{text-align:center;color:var(--muted);padding:34px 0}
  .done .big{font-size:40px}
  .more{color:var(--muted);font-size:12px;margin:2px 2px 0}
  .foot{margin-top:20px;font-size:13px}.foot a{color:var(--muted)}
  .muted{color:var(--muted);padding:22px 2px}.err{color:#dc2626;padding:18px 2px}
</style>
</head>
<body>
  <div class="wrap">
    <button class="refresh" onclick="load()">↻</button>
    <h1 id="greet">Today</h1>
    <p class="lead" id="lead"></p>
    <div class="recap" id="recap" style="display:none"></div>
    <div id="list"><div class="muted">Loading…</div></div>
    <p class="foot"><a id="full" href="/panel">← Open full panel</a> &nbsp;·&nbsp; <a href="/panel/guide" id="guideLink">📖 How it works</a></p>
  </div>

  <script src="/panel/shared/api.js"></script>
  <script src="/panel/shared/utils.js"></script>
  <script>
    var token = (function(){ try { return (new URLSearchParams(location.search)).get('token') || ''; } catch(e){ return ''; } })();
    CB.setToken(token);
    if (token) { var fl=document.getElementById('full'); if (fl) fl.href='/panel?token='+encodeURIComponent(token); }
    var TONE={red:'#dc2626',amber:'#d97706',blue:'#2563eb',green:'#16a34a'};
    window.__T=[];  // flat task store so action buttons can find their task

    function withTok(h){
      if(!token || h.indexOf('/panel')!==0 || h.indexOf('?')>=0) return h;
      var hash='',i=h.indexOf('#'); if(i>=0){hash=h.slice(i);h=h.slice(0,i);}
      return h+'?token='+encodeURIComponent(token)+hash;
    }
    function doAction(i){
      var t=window.__T[i]; if(!t||!t.action) return;
      var a=t.action;
      if(a.href){ location.href=withTok(a.href); return; }
      if(a.api==='quotation-resend'){
        CB.api('/papi/quotation-resend',{id:a.id}).then(function(d){
          if(d&&d.ok){ CB.toast(d.sent?'Reminder sent ✓':'WhatsApp not connected'); }
          else CB.toast((d&&d.message)||'Could not send');
          load();
        });
      }
    }
    function money(n,cur){ n=Number(n||0); var s=n>=1e6?(n/1e6).toFixed(1)+'M':(n>=1e3?Math.round(n/1e3)+'K':String(Math.round(n))); return (cur?cur+' ':'')+s; }

    function render(d){
      var list=document.getElementById('list');
      if(!d||!d.ok){ list.innerHTML='<div class="err">Could not load. <a href="/panel">Open the panel</a> instead.</div>'; return; }
      document.getElementById('greet').textContent=d.greeting||'Today';
      var total=d.total_tasks||0;
      document.getElementById('lead').innerHTML = total
        ? ('You have <b>'+total+'</b> '+(total===1?'thing':'things')+' that need you.')
        : 'Nothing needs you right now.';
      // yesterday recap
      var y=d.yesterday||{}, rc=document.getElementById('recap');
      if(y.orders!=null){
        rc.style.display='flex';
        rc.innerHTML='<span><span class="m">Yesterday</span></span>'
          +'<span><span class="v">'+(y.orders||0)+'</span> <span class="m">orders</span></span>'
          +'<span><span class="v">'+(y.delivered||0)+'</span> <span class="m">delivered</span></span>'
          +'<span><span class="v">'+money(y.sales,y.currency)+'</span> <span class="m">sales</span></span>';
      } else rc.style.display='none';

      window.__T=[];
      var groups=d.groups||[];
      if(!groups.length){ list.innerHTML='<div class="done"><div class="big">✅</div>All clear. Nothing needs you right now.</div>'; return; }
      var html=groups.map(function(g){
        var col=TONE[g.tone]||'#6b7280';
        var rows=(g.tasks||[]).map(function(tk){
          var idx=window.__T.push(tk)-1;
          var btn=tk.action?('<div class="act"><button style="background:'+col+'" onclick="doAction('+idx+')">'+CB.esc(tk.action.label||'Open')+'</button></div>'):'';
          return '<div class="task" style="border-left-color:'+col+'">'
            +'<div class="body"><div class="lab">'+CB.esc(tk.label||'')+'</div>'
            +'<div class="det">'+CB.esc(tk.detail||'')+'</div>'
            +'<div class="rs" style="color:'+col+'">'+CB.esc(tk.reason||'')+'</div></div>'+btn+'</div>';
        }).join('');
        var more=g.more?('<div class="more">+ '+g.more+' more</div>'):'';
        return '<div class="group"><div class="ghead"><span class="gi">'+CB.esc(g.icon||'')+'</span>'+CB.esc(g.title||'')
          +'<span class="gc">'+((g.tasks||[]).length+(g.more||0))+'</span></div>'+rows+more+'</div>';
      }).join('');
      list.innerHTML=html;
    }
    function load(){ document.getElementById('list').innerHTML='<div class="muted">Loading…</div>'; CB.api('/papi/today').then(render); }
    load();
  </script>
</body>
</html>
