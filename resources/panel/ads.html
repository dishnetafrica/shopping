<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ads</title>
<style>
:root{--dark:#1B3A2B;--green:#15803D;--red:#C0392B;--amber:#C2700A;--blue:#1877F2;--line:#e4e9e4;--muted:#6b7280;--bg:#f6f8f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1B211D;background:var(--bg)}
.top{background:var(--dark);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:800}
.back{background:#ffffff22;border:none;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0000000d}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.h{font-weight:800;font-size:15px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:6px}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cbd5cb;border-radius:30px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--green)}
.switch input:checked+.slider:before{transform:translateX(22px)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px}
.pill.on{background:#eaf6ee;color:var(--green)}.pill.off{background:#fdecea;color:var(--red)}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;font-weight:700;background:#f0f4f0;border-radius:9px;padding:6px 9px;color:#333}
.sec{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px}
.ev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.ev .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ev .ph{font-weight:700}.ev .tm{font-size:11px;color:var(--muted);white-space:nowrap}
.ev .dt{font-size:13px;color:#1B211D;margin-top:3px}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:20px}
.badge.ref{background:#e8f0fe;color:#1877F2}.badge.fol{background:#f3eefe;color:#7c3aed}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.help{background:#f0f6ff;border:1px solid #cfe0ff;border-radius:12px;padding:12px;font-size:12.5px;color:#243b53;line-height:1.55}
</style></head>
<body>
<div class="top"><h1>📣 Facebook Ads</h1><a class="back" href="/panel">Panel</a></div>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>

<script>
var $=function(id){return document.getElementById(id);};
function api(u,opt){opt=opt||{};opt.headers=Object.assign({'X-Requested-With':'XMLHttpRequest'},opt.headers||{});opt.credentials='same-origin';opt.cache='no-store';return fetch(u,opt).then(function(r){return r.json();});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ago(s){ if(!s)return''; var d=new Date(String(s).replace(' ','T')); if(isNaN(d))return esc(s); var m=Math.floor((Date.now()-d.getTime())/60000); if(m<1)return'just now'; if(m<60)return m+'m ago'; var h=Math.floor(m/60); if(h<24)return h+'h ago'; return Math.floor(h/24)+'d ago'; }

function load(){
  $('wrap').innerHTML='<div class="empty">Loading…</div>';
  api('/papi/ads').then(function(d){
    if(!d||!d.ok){$('wrap').innerHTML='<div class="empty">Could not load.</div>';return;}
    var on=!!d.enabled;
    var modeNice={ai:'AI brain',n8n:'n8n workflow',auto:'Inbuilt bot',inbuilt:'Inbuilt bot'}[d.bot_mode]||d.bot_mode;
    var h='';
    // toggle card
    h+='<div class="card"><div class="rowb"><div><div class="h">Understand ad customers</div>'+
       '<div class="note">When a customer arrives from (or forwards) a Facebook/Instagram ad, the bot reads the ad, works out which product they mean, and answers about that product — instead of a generic reply.</div></div>'+
       '<label class="switch"><input type="checkbox" id="tog" '+(on?'checked':'')+' '+(d.is_owner?'':'disabled')+' onchange="toggle(this.checked)"><span class="slider"></span></label></div>'+
       '<div class="stat"><span class="pill '+(on?'on':'off')+'">'+(on?'ON':'OFF')+'</span>'+
       '<span class="chip">Bot mode: '+esc(modeNice)+'</span>'+
       '<span class="chip">'+d.arrivals_7d+' ad arrival'+(d.arrivals_7d===1?'':'s')+' · 7 days</span></div>'+
       (d.is_owner?'':'<div class="note">Only the owner or a manager can change this.</div>')+
       '<div class="note" id="togMsg"></div></div>';
    // --- Bot behaviour controls ---
    var dis=d.is_owner?'':'disabled';
    var keepAi=!!d.keep_ai_on;
    h+='<div class="card">'+
      '<div class="h">Bot behaviour</div>'+
      '<div class="note">Small settings that fix common WhatsApp mix-ups. '+(d.is_owner?'':'Owner/manager only.')+'</div>'+

      '<div class="sec">Ad page / brand names to ignore</div>'+
      '<input id="btIgnore" '+dis+' value="'+esc(d.ad_ignore_titles||'')+'" placeholder="e.g. '+esc(d.business_name||'SkyTrips')+', SkyTrips" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:13px">'+
      '<div class="note">When someone arrives from an ad, the ad’s <b>title</b> is often your <b>page or campaign name</b> (e.g. “SkyTrips”), not a product. Without this, the bot searches for a product called “SkyTrips” and replies “I don’t have that” — ignoring the customer’s real question. List those page/campaign names here (comma-separated) and the bot will skip them and just help the customer. Your business name is always ignored automatically.</div>'+

      '<div class="sec">Keep AI replying after I message a customer</div>'+
      '<div class="rowb"><div class="note" style="margin:0;flex:1">If you (a human) send one message in a chat by mistake, don’t stop the AI. With this ON, your message is kept for context and the AI keeps answering the customer. With it OFF, a manual message pauses the bot for a while (so a person can take over).</div>'+
      '<label class="switch"><input type="checkbox" id="btKeepAi" '+(keepAi?'checked':'')+' '+dis+'><span class="slider"></span></label></div>'+

      '<div class="sec">Price basis city (USD prices are ex-…)</div>'+
      '<input id="btBasis" '+dis+' value="'+esc(d.basis_city||'')+'" placeholder="e.g. Juba" style="'+fst+'">'+
      '<div class="note">Your USD prices are quoted “ex-” this city (goods ready here; onward transport to the customer’s town is arranged after the order). Set it to <b>Juba</b>. The bot also asks out-of-town South Sudan customers how they receive goods (their transporter/route, or collect) and notes it on the order.</div>'+

      '<div class="sec">Warehouse / pickup location</div>'+
      '<input id="btWh" '+dis+' value="'+esc(d.warehouse||'')+'" placeholder="e.g. Luri, just outside Juba, South Sudan" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:13px">'+
      '<div class="note">When a customer asks where you are / can they collect, the bot will tell them the pickup point. Leave blank to skip.</div>'+

      '<div class="sec">Minimum-order note (optional)</div>'+
      '<input id="btMoq" '+dis+' value="'+esc(d.moq_note||'')+'" placeholder="Leave blank for the default carton wording" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:13px">'+
      '<div class="note">Shown when a customer asks the minimum order without naming an item. Blank = “We sell wholesale by the carton — minimum 1 carton…”</div>'+

      (d.is_owner?('<div style="margin-top:14px"><button id="btSave" onclick="saveBot()" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer">Save behaviour</button> <span class="note" id="btMsg" style="margin-left:8px"></span></div>'):'')+
      '</div>';
    // --- Virtual salesperson (auto follow-up) ---
    var son=!!d.sales_on, sbuy=(d.sales_buyers!==false);
    h+='<div class="card">'+
      '<div class="rowb"><div><div class="h">🧑‍💼 Virtual salesperson (auto follow-up)</div>'+
        '<div class="note">Follows up on WhatsApp like a sales rep so your team can visit customers in person. <b>Day 1</b>: follows up on what they asked about. <b>Day 3</b>: sends the latest price list. <b>Day 7</b>: a friendly check-in. Then a price-list touch every 2 weeks. It stops the moment they reply or order, never messages mid-chat, and only runs in working hours.</div></div>'+
        '<label class="switch"><input type="checkbox" id="btSalesOn" '+(son?'checked':'')+' '+dis+'><span class="slider"></span></label></div>'+

      '<div class="sec">Also remind past buyers to re-order</div>'+
      '<div class="rowb"><div class="note" style="margin:0;flex:1">When a customer hasn’t ordered for a while, nudge them: “It’s been N days since your last order (…) — ready for a fresh supply?”</div>'+
        '<label class="switch"><input type="checkbox" id="btSalesBuyers" '+(sbuy?'checked':'')+' '+dis+'><span class="slider"></span></label></div>'+
      '<div class="sec">Re-order reminder after (days)</div>'+
      '<input id="btReorderDays" type="number" min="3" '+dis+' value="'+(d.sales_reorder_days||21)+'" style="width:120px;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:13px">'+

      '<div class="sec">Day-1 follow-up message (optional)</div>'+
      '<input id="btMsgDay1" '+dis+' value="'+esc(d.sales_msg_day1||'')+'" placeholder="Hi {name} 👋 Following up on {items} — want a quote or delivery?" style="'+ (function(){return 'width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:13px';})() +'">'+
      '<div class="note">Placeholders: <b>{name}</b> (customer), <b>{items}</b> (what they asked about). Blank = a sensible default.</div>'+

      '<div class="sec">Re-order message (optional)</div>'+
      '<input id="btMsgReorder" '+dis+' value="'+esc(d.sales_msg_reorder||'')+'" placeholder="Hi {name} 👋 It’s been {days} days since your last order{items}. Ready for more?" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:13px">'+
      '<div class="note">Placeholders: <b>{name}</b>, <b>{days}</b> (since last order), <b>{items}</b> (their last order).</div>'+

      (d.is_owner?('<div style="margin-top:14px"><button onclick="saveSales()" style="background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer">Save salesperson</button> <span class="note" id="salesMsg" style="margin-left:8px"></span></div>'):'')+
      '</div>';
    // events
    h+='<div class="sec">Recent ad arrivals</div>';
    var ev=d.events||[];
    if(!ev.length){
      h+='<div class="empty">No ad arrivals recorded yet.<br>When a customer messages from your Facebook ad, they’ll appear here with the product the bot matched.</div>';
    } else {
      h+=ev.map(function(e){
        var isRef=e.stage==='ad_referral';
        return '<div class="ev"><div class="l1"><span class="ph">'+esc(e.phone||'—')+'</span>'+
          '<span class="tm">'+ago(e.when)+'</span></div>'+
          '<div class="dt"><span class="badge '+(isRef?'ref':'fol')+'">'+(isRef?'from ad':'follow-up')+'</span> '+esc(e.detail||'')+'</div></div>';
      }).join('');
    }
    // help
    h+='<div class="sec">How to test</div>'+
       '<div class="help">1) From a test phone, tap your Facebook ad → WhatsApp opens → send “what’s the MOQ?”. The bot should name the advertised product and answer.<br>'+
       '2) Or forward the ad image and ask a question.<br>'+
       'Each time it fires you’ll see a “from ad” / “follow-up” row above. If nothing appears, make sure this switch is ON and that the bot is answering (Diagnostics shows the full message trace).</div>';
    $('wrap').innerHTML=h;
  });
}
function saveBot(){
  var m=$('btMsg'); if(m)m.textContent='Saving…';
  var body=new URLSearchParams({
    ad_ignore_titles:($('btIgnore')?$('btIgnore').value:''),
    keep_ai_on:($('btKeepAi')&&$('btKeepAi').checked)?1:0,
    warehouse:($('btWh')?$('btWh').value:''),
    moq_note:($('btMoq')?$('btMoq').value:''),
    basis_city:($('btBasis')?$('btBasis').value:'')
  });
  api('/papi/ads-settings',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){
    if(m)m.textContent=(r&&r.ok)?'Saved ✓':((r&&r.error==='not_allowed')?'Owner/manager only.':'Could not save.');
  }).catch(function(){ if(m)m.textContent='Network error.'; });
}
function saveSales(){
  var m=$('salesMsg'); if(m)m.textContent='Saving…';
  var body=new URLSearchParams({
    sales_on:($('btSalesOn')&&$('btSalesOn').checked)?1:0,
    sales_buyers:($('btSalesBuyers')&&$('btSalesBuyers').checked)?1:0,
    sales_reorder_days:($('btReorderDays')?$('btReorderDays').value:'21'),
    sales_msg_day1:($('btMsgDay1')?$('btMsgDay1').value:''),
    sales_msg_reorder:($('btMsgReorder')?$('btMsgReorder').value:'')
  });
  api('/papi/ads-settings',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body}).then(function(r){
    if(m)m.textContent=(r&&r.ok)?'Saved ✓':((r&&r.error==='not_allowed')?'Owner/manager only.':'Could not save.');
  }).catch(function(){ if(m)m.textContent='Network error.'; });
}
function toggle(on){
  var m=$('togMsg'); if(m)m.textContent='Saving…';
  api('/papi/ads-toggle',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({on:on?1:0})}).then(function(r){
    if(r&&r.ok){ if(m)m.textContent=''; load(); }
    else { if(m)m.textContent=(r&&r.error==='not_allowed')?'Owner/manager only.':'Could not save.'; if($('tog'))$('tog').checked=!on; }
  }).catch(function(){ if(m)m.textContent='Network error.'; if($('tog'))$('tog').checked=!on; });
}
load();
</script>
</body></html>
