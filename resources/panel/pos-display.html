<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TENANT}}</title>
<style>
:root{--dark:#1B3A2B;--green:#15803D;--green2:#0f6b33;--amber:#b45309;--line:#e4e9e4;--muted:#6b7280}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--dark);color:#fff;display:flex;flex-direction:column;overflow:hidden}
.top{padding:22px 34px 14px;display:flex;align-items:center;gap:16px;flex:0 0 auto}
.top img{height:52px;max-width:220px;object-fit:contain;background:#fff;border-radius:10px;padding:4px 8px}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:.5px}

.stage{flex:1 1 auto;display:flex;min-height:0;padding:0 34px 24px;gap:24px}
.items{flex:1 1 58%;background:#ffffff10;border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;min-height:0}
.items .hd{font-size:13px;font-weight:800;letter-spacing:2px;color:#ffffff88;margin-bottom:8px}
.ilist{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.irow{display:flex;justify-content:space-between;gap:14px;padding:9px 2px;border-top:1px solid #ffffff14;font-size:22px}
.irow .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .q{color:#ffffff99;flex:0 0 auto}
.irow .a{font-weight:800;flex:0 0 auto}
.irow.last{background:#ffffff14;border-radius:12px;padding:12px 12px;border-top:none;font-size:26px}
.irow.last .n{font-weight:800}

.right{flex:1 1 42%;display:flex;flex-direction:column;gap:18px;min-width:0}
.tot{background:#fff;color:#0f172a;border-radius:20px;padding:22px 26px;text-align:right}
.tot .l{font-size:14px;font-weight:800;letter-spacing:2px;color:#64748b}
.tot .v{font-size:64px;font-weight:800;line-height:1.1;white-space:nowrap}
.tot .d{font-size:16px;color:var(--amber);font-weight:700;min-height:22px}
.pay{background:#ffffff10;border-radius:20px;padding:18px 24px;text-align:right;display:none}
.pay .pl{font-size:13px;font-weight:800;letter-spacing:2px;color:#ffffff88}
.pay .pv{font-size:40px;font-weight:800}
.pay .chg{font-size:30px;font-weight:800;color:#7CFC9B;min-height:38px}

.idle{position:fixed;inset:0;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:40px;transition:opacity .3s}
.idle.hide{opacity:0;pointer-events:none}
.idle img{height:110px;max-width:70vw;object-fit:contain;background:#fff;border-radius:16px;padding:10px 16px}
.idle h1{font-size:54px;margin:0;font-weight:800}
.idle p{font-size:22px;color:#ffffffaa;margin:0;max-width:60ch}

.done{position:fixed;inset:0;background:var(--green2);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px}
.done.show{display:flex}
.done .big{font-size:56px;font-weight:800}
.done .amt{font-size:44px;font-weight:800}
.done .ch{font-size:36px;font-weight:800;color:#FFE08A;min-height:44px}
.done p{font-size:22px;color:#ffffffcc;margin:6px 0 0}
</style></head>
<body>
<div class="top" id="hdr">
  <img id="logo" src="{{LOGO}}" onerror="this.style.display='none'" alt="">
  <h1>{{TENANT}}</h1>
</div>

<div class="stage">
  <div class="items">
    <div class="hd">YOUR ITEMS</div>
    <div class="ilist" id="ilist"></div>
  </div>
  <div class="right">
    <div class="tot">
      <div class="l">TOTAL</div>
      <div class="v" id="tot">0 {{CURRENCY}}</div>
      <div class="d" id="disc"></div>
    </div>
    <div class="pay" id="payBox">
      <div class="pl" id="payLbl">CASH RECEIVED</div>
      <div class="pv" id="payTen">&nbsp;</div>
      <div class="chg" id="payChg">&nbsp;</div>
    </div>
  </div>
</div>

<div class="idle" id="idle">
  <img src="{{LOGO}}" onerror="this.style.display='none'" alt="">
  <h1>{{TENANT}}</h1>
  <p>{{TAGLINE}}</p>
</div>

<div class="done" id="done">
  <div class="big">✓ Thank you!</div>
  <div class="amt" id="doneAmt"></div>
  <div class="ch" id="doneChg"></div>
  <p>Please collect your receipt.</p>
</div>

<script>
var CUR='{{CURRENCY}}', DP=(CUR==='USD')?2:0, DONE_T=null;
function money(x){return Number(x||0).toLocaleString(undefined,{minimumFractionDigits:DP,maximumFractionDigits:DP});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $(id){return document.getElementById(id);}

function render(d){
  if(!d||!d.state||d.state==='idle'||!(d.items&&d.items.length)&&d.state==='cart'){
    $('idle').classList.remove('hide');$('done').classList.remove('show');return;
  }
  if(d.state==='done'){
    clearTimeout(DONE_T);
    $('idle').classList.add('hide');
    $('doneAmt').textContent='Paid '+money(d.total)+' '+CUR;
    $('doneChg').textContent=(d.change&&d.change>0.001)?('Your change: '+money(d.change)+' '+CUR):'';
    $('done').classList.add('show');
    DONE_T=setTimeout(function(){$('done').classList.remove('show');$('idle').classList.remove('hide');},30000);
    return;
  }
  // cart / pay
  $('idle').classList.add('hide');$('done').classList.remove('show');
  var items=d.items||[],h='';
  items.forEach(function(it,i){
    var last=(i===items.length-1);
    h+='<div class="irow'+(last?' last':'')+'"><span class="n">'+esc(it.name)+'</span>'
      +'<span class="q">'+it.qty+' × '+money(it.price)+'</span>'
      +'<span class="a">'+money(it.qty*it.price)+'</span></div>';
  });
  $('ilist').innerHTML=h;
  $('tot').textContent=money(d.total)+' '+CUR;
  $('disc').textContent=(d.disc&&d.disc>0)?('Discount −'+money(d.disc)+' '+CUR):'';
  if(d.state==='pay'){
    $('payBox').style.display='block';   // .pay is display:none in the stylesheet — must override explicitly
    if(d.tendered!=null&&d.tendered>0){
      $('payLbl').textContent='CASH RECEIVED';
      $('payTen').textContent=money(d.tendered)+' '+CUR;
      var c=d.tendered-d.total;
      $('payChg').textContent=c>=0?('Change: '+money(c)+' '+CUR):'';
    }else{
      $('payLbl').textContent='AMOUNT DUE';
      $('payTen').textContent=money(d.total)+' '+CUR;
      $('payChg').textContent='';
    }
  }else{
    $('payBox').style.display='none';
  }
}

function read(){try{return JSON.parse(localStorage.getItem('pos_disp')||'null');}catch(e){return null;}}
window.addEventListener('storage',function(e){if(e.key==='pos_disp')render(read());});
render(read());
</script>
</body></html>
