<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
  :root{--brand:#16a34a;--brand-ink:#15803d;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--wash:#f9fafb;}
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{margin:0;color:var(--ink);background:#fff;}
  .wrap{max-width:820px;margin:0 auto;padding:18px 20px 60px;}
  h1{font-size:22px;margin:0 0 2px;}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px;}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap;}
  .tab{padding:8px 14px;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab.on{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600;}
  .group{border:1px solid var(--line);border-radius:12px;padding:2px 18px 6px;margin-bottom:16px;background:#fff;}
  .group h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 2px;}
  .group .ghelp{font-size:12.5px;color:var(--mut);margin:0 0 8px;}
  .fld{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid #f1f2f4;}
  .fld:first-of-type{border-top:0;}
  .fld label{flex:1;font-size:14px;}
  .fld .fhelp{display:block;color:var(--mut);font-size:12px;margin-top:2px;}
  .fld .ctl{flex:none;display:flex;align-items:center;gap:7px;}
  select,input[type=text],input[type=number]{font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:150px;}
  select:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--wash);}
  .unit{color:var(--mut);font-size:13px;}
  .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:12px;margin-top:8px;}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:default;}
  .msg{font-size:13.5px;}
  .msg.ok{color:var(--brand-ink);} .msg.err{color:#b91c1c;}
  .empty{color:var(--mut);padding:30px 0;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Settings</h1>
  <div class="sub">Configure how your documents and account behave. Changes apply only to your business.</div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"><div class="empty">Loading…</div></div>
  <div class="bar">
    <button class="btn" id="save" onclick="save()">Save changes</button>
    <span class="msg" id="msg"></span>
  </div>
</div>
<script>
  var SCHEMA={}, ACTIVE=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function get(u){return fetch(u,{credentials:'include',headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}}).then(function(r){return r.json();});}
  function post(u,b){return fetch(u,{method:'POST',credentials:'include',headers:{'Accept':'application/json','Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify(b)}).then(function(r){return r.json();});}

  function fieldHtml(key,spec){
    var v=spec.value;
    var ctl='';
    if(spec.type==='enum'){
      ctl='<select data-key="'+esc(key)+'">'+(spec.options||[]).map(function(o){
        return '<option value="'+esc(o)+'"'+(String(v)===String(o)?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select>';
    } else if(spec.type==='int'){
      ctl='<input type="number" data-key="'+esc(key)+'" value="'+esc(v==null?'':v)+'"'+
        (spec.min!=null?' min="'+esc(spec.min)+'"':'')+(spec.max!=null?' max="'+esc(spec.max)+'"':'')+'>'+
        (spec.unit?'<span class="unit">'+esc(spec.unit)+'</span>':'');
    } else if(spec.type==='bool'){
      ctl='<select data-key="'+esc(key)+'"><option value="1"'+(v?' selected':'')+'>Yes</option><option value="0"'+(!v?' selected':'')+'>No</option></select>';
    } else {
      ctl='<input type="text" data-key="'+esc(key)+'" value="'+esc(v==null?'':v)+'"'+(spec.placeholder?' placeholder="'+esc(spec.placeholder)+'"':'')+(spec.max?' maxlength="'+esc(spec.max)+'"':'')+'>';
    }
    return '<div class="fld"><label>'+esc(spec.label||key)+(spec.help?'<span class="fhelp">'+esc(spec.help)+'</span>':'')+'</label><div class="ctl">'+ctl+'</div></div>';
  }

  function render(){
    var tabs=Object.keys(SCHEMA);
    document.getElementById('tabs').innerHTML=tabs.map(function(k){
      return '<div class="tab'+(k===ACTIVE?' on':'')+'" onclick="showTab(\''+esc(k)+'\')">'+esc(SCHEMA[k].label||k)+'</div>';}).join('');
    var tab=SCHEMA[ACTIVE]; if(!tab){document.getElementById('panels').innerHTML='<div class="empty">No settings.</div>';return;}
    var html='';
    var groups=tab.groups||{};
    Object.keys(groups).forEach(function(gk){
      var g=groups[gk];
      html+='<div class="group"><h3>'+esc(g.label||gk)+'</h3>'+(g.help?'<div class="ghelp">'+esc(g.help)+'</div>':'');
      var f=g.fields||{};
      Object.keys(f).forEach(function(fk){ html+=fieldHtml(fk,f[fk]); });
      html+='</div>';
    });
    document.getElementById('panels').innerHTML=html;
  }
  function showTab(k){ACTIVE=k;render();}

  function save(){
    var vals={};
    document.querySelectorAll('#panels [data-key]').forEach(function(el){ vals[el.getAttribute('data-key')]=el.value; });
    var btn=document.getElementById('save'), msg=document.getElementById('msg');
    btn.disabled=true; msg.className='msg'; msg.textContent='Saving…';
    post('/papi/config-save',{values:vals}).then(function(r){
      btn.disabled=false;
      if(r&&r.ok){ msg.className='msg ok'; msg.textContent='Saved '+(r.saved?r.saved.length:0)+' setting(s). New PDFs will use these.'; }
      else { msg.className='msg err'; msg.textContent='Some values were rejected: '+JSON.stringify(r&&r.errors||{}); }
    }).catch(function(){ btn.disabled=false; msg.className='msg err'; msg.textContent='Could not save — are you still logged in?'; });
  }

  get('/papi/config-schema').then(function(r){
    if(!r||!r.ok){ document.getElementById('panels').innerHTML='<div class="empty">Could not load settings ('+esc(r&&r.error||'')+').</div>'; return; }
    SCHEMA=r.schema||{}; ACTIVE=Object.keys(SCHEMA)[0]||null; render();
  });
</script>
</body>
</html>
