<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses</title>
<style>
  :root{--red:#D41C1C;--green:#059669;--amber:#d97706;--dark:#0f0f0f;--mute:#94a3b8;--bg:#f5f5f2;--border:#e8e8e3;--font:'Inter',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--font);color:#0f0f0f;}
  .wrap{max-width:640px;margin:0 auto;padding:14px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .top h1{font-size:20px;margin:0;font-weight:900;}.top a{color:var(--green);text-decoration:none;font-weight:700;font-size:13px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  .grouplbl{font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--mute);margin:14px 0 8px;text-transform:uppercase;}
  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  @media(max-width:480px){.cats{grid-template-columns:repeat(2,1fr);}}
  .cat{padding:12px 8px;border:1.5px solid var(--border);border-radius:11px;background:#fff;cursor:pointer;text-align:center;font-size:11.5px;font-weight:700;color:#374151;}
  .cat .em{font-size:20px;display:block;margin-bottom:4px;}
  .cat.on{border-color:var(--green);background:#ecfdf5;color:#065f46;}
  label{font-size:12px;font-weight:700;color:#374151;display:block;margin:11px 0 5px;}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);background:#fff;outline:none;}
  input:focus,select:focus{border-color:var(--green);}
  .row{display:flex;gap:10px;}.row>div{flex:1;}
  .conv{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:800;color:#991b1b;margin-top:10px;}
  .receipt{display:flex;align-items:center;gap:8px;background:#eff6ff;border:1.5px dashed #93c5fd;border-radius:10px;padding:12px;margin-top:12px;font-size:13px;font-weight:700;color:#1e40af;cursor:pointer;}
  .btn{width:100%;margin-top:14px;background:var(--red);color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .picked{font-size:13px;font-weight:800;color:#065f46;margin-top:6px;}
  .loading{text-align:center;color:var(--mute);padding:20px;}
</style></head>
<body><div class="wrap">
  <div class="top"><h1>💸 Expenses</h1><a href="/panel">← Panel</a></div>
  <div class="card">
    <div id="catBox"><div class="loading">Loading categories…</div></div>
    <div class="picked" id="picked" style="display:none"></div>

    <div class="row">
      <div><label>Currency</label><select id="cur" onchange="setRate()"><option>UGX</option><option>SSP</option><option>USD</option></select></div>
      <div style="flex:1.5"><label>Amount</label><input id="amt" inputmode="decimal" placeholder="50000" oninput="calc()"></div>
    </div>
    <label>Rate (native per 1 USD)</label>
    <input id="rate" inputmode="decimal" oninput="calc()">
    <div class="conv" id="conv">≈ $0.00 USD</div>

    <label>Receipt (optional)</label>
    <label class="receipt" for="receipt">📷 Attach receipt <span id="rname" style="font-weight:500;color:#64748b"></span></label>
    <input id="receipt" type="file" accept="image/*" style="display:none" onchange="document.getElementById('rname').textContent=this.files[0]?('· '+this.files[0].name):''">

    <label>Note (optional)</label>
    <input id="note" placeholder="e.g. July office rent">

    <button class="btn" onclick="save()">Record expense</button>
  </div>
  <div style="font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mute);margin:16px 0 8px">RECENT EXPENSES</div>
  <div id="expList"><div class="loading">Loading…</div></div>
  <div id="expPager" style="display:flex;justify-content:center;gap:8px;margin-top:12px"></div>
</div>
<script>
const $=s=>document.getElementById(s);let rates={UGX:3700,SSP:5180,USD:1},cat=null;
function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function setRate(){$('rate').value=rates[$('cur').value]||'';calc();}
function calc(){const a=parseFloat(($('amt').value||'').replace(/,/g,''))||0,r=parseFloat(($('rate').value||'').replace(/,/g,''))||0;$('conv').textContent='≈ $'+(r>0?fmt(a/r):'0.00')+' USD';}
fetch('/papi/expenses/categories',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{
  if(d.default_rates)rates=d.default_rates;
  const groups={};(d.categories||[]).forEach(c=>{(groups[c.group]=groups[c.group]||[]).push(c);});
  const names={operating:'Operating',staff:'Staff',logistics:'Logistics',financial:'Financial',other:'Other'};
  let html='';
  Object.keys(groups).forEach(g=>{
    html+=`<div class="grouplbl">${names[g]||g}</div><div class="cats">`;
    groups[g].forEach(c=>{html+=`<div class="cat" data-id="${c.id}" data-name="${c.name}" onclick="pick(this)"><span class="em">${c.icon||'📦'}</span>${c.name}</div>`;});
    html+='</div>';
  });
  $('catBox').innerHTML=html;setRate();
});
function pick(el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));el.classList.add('on');cat=el.dataset.name;$('picked').style.display='block';$('picked').textContent='Selected: '+cat;}
function save(){
  if(!cat){alert('Pick a category first');return;}
  const fd=new FormData();
  fd.append('expense_category',cat);fd.append('currency',$('cur').value);
  fd.append('native_amount',($('amt').value||'').replace(/,/g,''));
  fd.append('rate_to_usd',($('rate').value||'').replace(/,/g,''));
  fd.append('note',$('note').value);
  if($('receipt').files[0])fd.append('receipt',$('receipt').files[0]);
  const b=document.querySelector('.btn');b.disabled=true;b.textContent='Saving…';
  fetch('/papi/expenses',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'},body:fd}).then(r=>r.json()).then(r=>{
    b.disabled=false;b.textContent='Record expense';
    if(r.ok){alert('Expense recorded ✅ ($'+r.usd+' USD)');$('amt').value='';$('note').value='';$('receipt').value='';$('rname').textContent='';calc();}
    else alert('Failed: '+(r.error||'error'));
  }).catch(()=>{b.disabled=false;b.textContent='Record expense';alert('Failed.');});
}

let EPAGE=1, EPAGES=1;
function loadExp(){
  fetch('/papi/expenses/list?page='+EPAGE+'&per=15',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{
    const L=document.getElementById('expList');
    if(!d.ok){L.innerHTML='<div class="loading">Could not load.</div>';return;}
    EPAGES=d.pages||1;
    if(!d.expenses.length){L.innerHTML='<div class="loading">No expenses yet.</div>';renderEPager();return;}
    L.innerHTML=d.expenses.map(e=>`
      <div style="background:#fff;border:1px solid var(--border);border-radius:11px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="min-width:0">
          <div style="font-weight:800;font-size:14px">${e.category||'Misc'} <span style="font-size:12px;color:#64748b;font-weight:600">· ${e.currency} ${fmt(e.native)}</span></div>
          <div style="font-size:12px;color:#64748b">$${fmt(e.usd)} · ${e.holder||'—'} · ${e.when||''} ${e.status!=='approved'?'· <span style="color:#d97706">'+e.status+'</span>':''}</div>
        </div>
        <button onclick="delExp(${e.id})" style="background:#fff;border:1.5px solid #fca5a5;color:#dc2626;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0">Delete</button>
      </div>`).join('');
    renderEPager();
  });
}
function renderEPager(){
  const p=document.getElementById('expPager'); if(EPAGES<=1){p.innerHTML='';return;}
  p.innerHTML=`<button ${EPAGE<=1?'disabled':''} onclick="EPAGE--;loadExp()" style="padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer">‹ Prev</button>
    <span style="padding:7px 4px;font-size:13px;color:#64748b">Page ${EPAGE} / ${EPAGES}</span>
    <button ${EPAGE>=EPAGES?'disabled':''} onclick="EPAGE++;loadExp()" style="padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer">Next ›</button>`;
}
function delExp(id){
  if(!confirm('Delete this expense?'))return;
  fetch('/papi/expenses/'+id+'/delete',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'}})
    .then(r=>r.json()).then(r=>{ if(r.ok)loadExp(); else alert(r.error==='not_allowed'?'Only owner/manager can delete':'Failed'); });
}
loadExp();
// refresh list after a new expense is saved
const _origSave=save;
save=function(){ const b=document.querySelector('.btn'); _origSave(); setTimeout(loadExp,600); };
</script></body></html>
