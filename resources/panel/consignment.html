<!DOCTYPE html><html lang="en"><head>
  <link rel="stylesheet" href="/panel/shared/tokens.css">
  <script src="/panel/shared/ui.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Consignments</title>
<style>
:root{--dark:#1B3A2B;--green:#15803D;--red:#C0392B;--amber:#C2700A;--blue:#0EA5E9;--line:#e4e9e4;--muted:#6b7280;--bg:#f6f8f6}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1B211D;background:var(--bg)}
.top{background:var(--dark);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:800}
.back{background:#ffffff22;border:none;color:#fff;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.add{width:100%;background:var(--green);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0000000d;cursor:pointer}
.card .no{font-weight:800;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;background:#eef2ee;color:#444}
.mono{font-variant-numeric:tabular-nums}
.sec{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 8px}
.line{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.line .cust{font-weight:700}
.btn{border:none;border-radius:10px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer}
.btn.g{background:var(--green);color:#fff}.btn.o{background:#fff;color:var(--amber);border:1.5px solid var(--amber)}
.btn.d{background:#fff;color:var(--red);border:1.5px solid #f0b4ae}.btn.b{background:var(--dark);color:#fff}
.btn.grey{background:#eef2ee;color:#333}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;font-weight:800;color:#374151;margin-bottom:4px}
.f input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-size:14px}
.note{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.search{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:10px}
.modalwrap{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:18px;overflow:auto;z-index:40}
.modalwrap.hide{display:none}
.modal{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:18px}
.modal h3{margin:0 0 10px}
.x{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted)}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;font-weight:700;background:#f0f4f0;border-radius:9px;padding:6px 9px;color:#333}
.qgrid{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:flex-end}
.qcell{display:flex;flex-direction:column;gap:3px}
.qcell label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.qcell input{width:72px;padding:8px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;text-align:right}
.qro{font-size:13px;font-weight:800;padding:6px 0}
.short{color:var(--amber);font-weight:800}
.addbox{background:#fff;border:1px dashed var(--green);border-radius:12px;padding:12px;margin-bottom:10px}
.addbox input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;margin-bottom:8px}
.addbox .mini{display:flex;gap:8px}.addbox .mini input{margin-bottom:0}
.chkline{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0 10px;cursor:pointer}
.chkline input{width:auto;margin:0}
.hide{display:none!important}
.hintline{background:#f0f6ff;border:1px solid #cfe0ff;border-radius:10px;padding:9px 11px;font-size:12.5px;color:#243b53;margin-top:8px;line-height:1.5}
</style></head>
<body>
<div class="top">
  <button class="back" id="topBack" onclick="goList()" style="visibility:hidden">‹ Back</button>
  <h1>🚚 Consignments</h1>
  <a class="back" href="/panel" style="text-decoration:none" id="panelLink">Panel</a>
</div>
<script>/* v4.7: inside the V3 shell (embed=1) the Panel link is noise — hide it. */
if(location.search.indexOf('embed=1')>=0){document.getElementById('panelLink').style.display='none';}</script>
<div class="wrap" id="wrap"><div class="empty">Loading…</div></div>

<!-- New consignment modal -->
<div class="modalwrap hide" id="newM"><div class="modal">
  <button class="x" onclick="closeNew()">×</button>
  <h3>New consignment (Kampala → Juba)</h3>
  <div class="f"><label>Transporter / bus company</label><input id="nTransport" placeholder="e.g. Nile Coach"></div>
  <div class="f"><label>Bus number (optional)</label><input id="nBus" placeholder="e.g. UAX 123A"></div>
  <div class="f"><label>Receiver in Juba (agent)</label><input id="nAgent" placeholder="e.g. Asish"></div>
  <div class="f"><label>Agent phone (optional)</label><input id="nAgentPh" placeholder="+211…"></div>
  <label class="chkline hide" id="carryWrap"><input type="checkbox" id="nCarry"> <span id="carryLbl"></span></label>
  <button class="add" id="nSave" onclick="createConsignment()" style="margin-bottom:0">Create consignment</button>
  <div class="note" id="nMsg" style="margin-top:8px"></div>
</div></div>

<script>
var $=function(id){return document.getElementById(id);};
var VIEW='list', CID=null;
function api(u,opt){opt=opt||{};opt.headers=Object.assign({'X-Requested-With':'XMLHttpRequest'},opt.headers||{});opt.credentials='same-origin';opt.cache='no-store';return fetch(u,opt).then(function(r){return r.json();});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function nf(n){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});}

var ST={packed:['Packed','#6b7280'],sent_to_transporter:['Sent to transporter','#C2700A'],transport_confirmed:['Transport confirmed','#0EA5E9'],in_transit:['In transit','#7c5cd0'],arrived:['Arrived in Juba','#15803D'],cancelled:['Cancelled','#C0392B']};
function stBadge(s){var m=ST[s]||[s,'#6b7280'];return '<span class="badge" style="background:'+m[1]+'1a;color:'+m[1]+';border:1px solid '+m[1]+'55">'+esc(m[0])+'</span>';}
// next custody step per status
var NEXT={packed:['dispatch','📦 Dispatch (load on bus)'],sent_to_transporter:['transport_confirm','✅ Transporter received'],transport_confirmed:['depart','🚌 Bus departed'],in_transit:['arrive','📍 Mark arrived in Juba']};

function goList(){VIEW='list';CID=null;$('topBack').style.visibility='hidden';load();}
function openC(id){VIEW='detail';CID=id;$('topBack').style.visibility='visible';loadDetail();}

function load(){
  $('wrap').innerHTML='<div class="empty">Loading…</div>';
  api('/papi/consignments').then(function(d){
    if(!d||!d.ok){$('wrap').innerHTML='<div class="empty">Could not load.</div>';return;}
    var list=d.consignments||[];
    var html='';
    // v4.7 — orders selected on the Sales Orders screen, waiting to be loaded on a bus.
    var pend=pendingBus();
    if(pend){
      html+='<div class="card" style="cursor:default;border:2px solid var(--green)">'
        +'<div class="row"><b>🚌 '+pend.ids.length+' order'+(pend.ids.length===1?'':'s')+' selected for the bus</b>'
        +'<button class="btn grey" onclick="clearPending();load()">✕</button></div>'
        +'<div class="sub">Create a new consignment with them, or open an open consignment below and they will be loaded onto it.</div>'
        +'<div class="btnrow"><button class="btn g" onclick="openNew()">＋ New consignment with these '+pend.ids.length+'</button></div></div>';
    }
    html+='<button class="add" onclick="openNew()">＋ New consignment</button>';
    // Asish's one-tap request: pick from the catalogue OR paste; lands on today's open consignment.
    var fst='width:100%;padding:9px;border:1px solid var(--line,#e4e9e4);border-radius:9px;font-size:13px;font-family:inherit';
    html+='<div class="card" style="cursor:default">'+
      '<div class="row"><b>📥 Request stock from Kampala</b></div>'+
      '<div class="sub" style="margin:2px 0 6px">Pick a product and add it, or paste a list below (e.g. <i>Cling Film 10</i>). It’s added to today’s load — no need to create a consignment first.</div>'+
      // product picker row
      '<div class="mini" style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<input id="qPick" list="qProdDL" autocomplete="off" placeholder="Search product from your catalogue…" style="flex:1;min-width:150px;'+fst+'">'+
        '<datalist id="qProdDL"></datalist>'+
        '<input id="qPickQty" type="number" min="1" value="1" placeholder="Qty" style="width:74px;'+fst+'">'+
        '<button class="btn" onclick="qAddPick()">＋ Add</button>'+
      '</div>'+
      '<textarea id="qReqBulk" rows="3" placeholder="Cling Film 10&#10;Aluminium Foil 15" style="margin-top:6px;'+fst+'"></textarea>'+
      // requested-by + send-to
      '<div class="mini" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">'+
        '<div style="flex:1;min-width:150px"><div class="sub" style="margin:0 0 2px">Requested by</div>'+
          '<input id="qReqBy" list="qTeamDL" autocomplete="off" placeholder="your name" style="'+fst+'"><datalist id="qTeamDL"></datalist></div>'+
        '<div style="flex:1;min-width:150px"><div class="sub" style="margin:0 0 2px">Send to (Kampala)</div>'+
          '<select id="qSendTo" onchange="qSendToChange()" style="'+fst+'"></select>'+
          '<input id="qSendPhone" placeholder="+256…" style="display:none;margin-top:4px;'+fst+'"></div>'+
      '</div>'+
      '<label class="sub" style="display:flex;align-items:center;gap:6px;margin:8px 0 0"><input type="checkbox" id="qReqNotify" checked> Also WhatsApp the list to the person above</label>'+
      '<div class="btnrow" style="margin-top:6px"><button class="btn g" onclick="quickRequest()">📨 Send request</button></div>'+
      '<div class="sub" id="qReqMsg" style="margin-top:4px"></div></div>';
    if(!list.length){html+='<div class="empty">No consignments yet. Create one to start today’s Kampala → Juba load.</div>';}
    else{html+=list.map(function(c){
      return '<div class="card" onclick="openC('+c.id+')">'+
        '<div class="row"><span class="no">'+esc(c.number||('#'+c.id))+'</span>'+stBadge(c.status)+'</div>'+
        '<div class="sub">'+esc(c.route||'')+(c.transport?(' · '+esc(c.transport)):'')+(c.bus?(' · '+esc(c.bus)):'')+'</div>'+
        '<div class="stat"><span class="chip">'+c.orders+' order'+(c.orders===1?'':'s')+'</span>'+
          '<span class="chip">'+c.delivered+' delivered</span>'+
          (c.boxes_sent?('<span class="chip">'+c.boxes_sent+' boxes</span>'):'')+
          '<span class="chip">'+esc(c.when||'')+'</span></div>'+
      '</div>';
    }).join('');}
    $('wrap').innerHTML=html;
    fillRequestControls();
    // Deep-link from the mobile home ("Request stock") lands right on the paste box.
    if((location.hash||'').replace('#','')==='request'){
      var el=$('qPick')||$('qReqBulk');
      if(el){ try{el.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){el.scrollIntoView();} el.focus(); }
    }
  });
}
// Fill the request card's catalogue picker + requested-by/send-to selectors.
function fillRequestControls(){
  var dl=$('qProdDL');
  if(dl) dl.innerHTML=(window.PRODUCTS||[]).map(function(p){return '<option value="'+esc(p['Product Name'])+'">';}).join('');
  var c=window.__CONTACTS||{};
  var team=c.team||[];
  var tdl=$('qTeamDL'); if(tdl) tdl.innerHTML=team.map(function(m){return '<option value="'+esc(m.name)+'">';}).join('');
  var rb=$('qReqBy'); if(rb && !rb.value) rb.value=c.me||'';
  var sel=$('qSendTo');
  if(sel){
    var opts=[];
    var disp=c.dispatch||{};
    if(disp.phone) opts.push('<option value="'+esc(disp.phone)+'" data-name="'+esc(disp.name||'Kampala')+'">'+esc(disp.name||'Kampala')+'</option>');
    team.forEach(function(m){ if(m.phone && (!disp.phone||m.phone!==disp.phone)) opts.push('<option value="'+esc(m.phone)+'" data-name="'+esc(m.name)+'">'+esc(m.name)+(m.role?(' ('+esc(m.role)+')'):'')+'</option>'); });
    opts.push('<option value="__custom">Custom number…</option>');
    sel.innerHTML=opts.join('');
  }
}
function qSendToChange(){ var sel=$('qSendTo'), inp=$('qSendPhone'); if(!sel||!inp)return; if(sel.value==='__custom'){inp.style.display='';inp.focus();} else {inp.style.display='none';} }
function qAddPick(){
  var nm=($('qPick')&&$('qPick').value||'').trim(); var q=($('qPickQty')&&$('qPickQty').value)||'1';
  if(!nm){if($('qPick'))$('qPick').focus();return;}
  var ta=$('qReqBulk'); if(ta){ ta.value=(ta.value?ta.value.replace(/\s*$/,'')+'\n':'')+nm+' '+q; }
  if($('qPick'))$('qPick').value=''; if($('qPickQty'))$('qPickQty').value='1'; if($('qPick'))$('qPick').focus();
}

function loadDetail(){
  $('wrap').innerHTML='<div class="empty">Loading…</div>';
  api('/papi/consignment?id='+CID).then(function(d){
    if(!d||!d.ok){$('wrap').innerHTML='<div class="empty">Could not load.</div>';return;}
    var c=d.consignment, m=d.manifest||[];
    var next=NEXT[c.status];
    var onboard=m.filter(function(x){return x.line_status==='on_board';}).length;
    var canNotify=(['sent_to_transporter','transport_confirmed','in_transit'].indexOf(c.status)>=0 && onboard>0);
    var HINT={
      packed:'📋 Build the load — add today’s ready orders below, add any market stock, then tap Dispatch when the bus is loaded.',
      sent_to_transporter:'🚌 Handed to the transporter. Tap “Transporter received” once they confirm.',
      transport_confirmed:'✅ Transporter has it. Tap “Bus departed” when it leaves Kampala.',
      in_transit:'🛣️ On the way to Juba. Tap “Tell customers it’s on the way”, then “Mark arrived” when it reaches Juba.',
      arrived:'📍 In Juba — hand out each order and tap Delivered (or “Mark all delivered”), and sell any market stock below.',
      cancelled:'This consignment was cancelled.'
    };
    var hint=HINT[c.status]||'';
    var head='<div class="card" style="cursor:default">'+
      '<div class="row"><span class="no">'+esc(c.number||('#'+c.id))+'</span>'+stBadge(c.status)+'</div>'+
      '<div class="sub">'+esc(c.route||'')+(c.transport?(' · '+esc(c.transport)):'')+(c.bus?(' · Bus '+esc(c.bus)):'')+(c.agent?(' · Agent '+esc(c.agent)):'')+'</div>'+
      (hint?('<div class="hintline">'+hint+'</div>'):'')+
      '<div class="btnrow">'+
        (next?('<button class="btn b" onclick="advance(\''+next[0]+'\')">'+next[1]+'</button>'):'')+
        (c.status==='arrived'&&onboard>0?('<button class="btn g" onclick="deliverAll('+onboard+')">✓ Mark all delivered ('+onboard+')</button>'):'')+
        (canNotify?('<button class="btn o" onclick="notifyCustomers()">📣 Tell customers it’s on the way</button>'):'')+
        '<button class="btn grey" onclick="printSheet()">🖨 Print manifest</button>'+
        (c.status!=='cancelled'&&c.status!=='arrived'?('<button class="btn d" onclick="advance(\'cancel\')">Cancel</button>'):'')+
      '</div></div>';

    var delivered=m.filter(function(x){return x.line_status==='delivered';}).length;
    var manifest='<div class="sec">Manifest · '+m.length+' order'+(m.length===1?'':'s')+' · '+delivered+' delivered</div>';
    if(!m.length){manifest+='<div class="empty">No orders yet. Add ready orders below.</div>';}
    else{manifest+=m.map(function(l){
      var isDel=l.line_status==='delivered', isRet=l.line_status==='returned';
      var lbadge=isDel?'<span class="badge" style="background:#15803d1a;color:#15803D;border:1px solid #15803d55">Delivered'+(l.delivered_at?(' · '+esc(l.delivered_at)):'')+'</span>':(isRet?'<span class="badge" style="background:#C0392B1a;color:#C0392B;border:1px solid #C0392B55">Returned</span>':'<span class="pill">On board</span>');
      var acts='';
      if(c.status==='arrived'||c.status==='in_transit'){
        acts+= isDel? '<button class="btn grey" onclick="lineStatus('+l.line_id+',\'on_board\')">Undo</button>'
                    : '<button class="btn g" onclick="lineStatus('+l.line_id+',\'delivered\')">✓ Delivered</button>';
        if(!isDel&&!isRet) acts+='<button class="btn o" onclick="returnLine('+l.line_id+')">Short / returned</button>';
      }
      if(!isDel && (c.status==='packed'||c.status==='sent_to_transporter')) acts+='<button class="btn d" onclick="removeLine('+l.line_id+')">Remove</button>';
      return '<div class="line"><div class="row"><span class="cust">'+esc(l.order_no)+' · '+esc(l.customer||'—')+'</span>'+lbadge+'</div>'+
        (l.items?('<div class="sub">'+esc(l.items)+'</div>'):'')+
        '<div class="sub">'+(l.phone?('📞 '+esc(l.phone)+' '):'')+(l.location?('📍 '+esc(l.location)+' '):'')+(l.total?('· UGX '+nf(l.total)):'')+'</div>'+
        (l.note?('<div class="sub" style="color:#C0392B">⚠ '+esc(l.note)+'</div>'):'')+
        (acts?('<div class="btnrow">'+acts+'</div>'):'')+
      '</div>';
    }).join('');}

    // add-orders section (only before it leaves, i.e. packed / sent_to_transporter)
    var addSec='';
    if(c.status==='packed'||c.status==='sent_to_transporter'){
      addSec='<div class="sec">Add ready orders</div>'+
        '<button class="btn b" id="addAllBtn" style="width:100%;padding:12px;margin-bottom:8px;display:none" onclick="addAllOrders()"></button>'+
        '<input class="search" id="oq" placeholder="Search order no, customer, phone…" oninput="searchCand()">'+
        '<div id="cand"><div class="note">Loading ready orders…</div></div>';
    }

    // loose stock (market) section — request → sent → received → sold
    var stk=d.stock||[]; window.__STK={}; stk.forEach(function(x){window.__STK[x.id]=x;});
    var beforeSend=(c.status==='packed'||c.status==='sent_to_transporter');
    var arrived=(c.status==='arrived');
    var totShort=stk.reduce(function(a,x){return a+(Number(x.short)||0);},0);
    var stockSec='<div class="sec">Loose stock (market) · '+stk.length+' item'+(stk.length===1?'':'s')+(totShort>0?(' · <span class="short">short '+nf(totShort)+'</span>'):'')+'</div>';
    var mk=d.market||{revenue:0,cost:0,margin:0};
    if((mk.revenue||0)>0){
      stockSec+='<div class="card" style="cursor:default"><div class="row"><span>Market sales</span></div>'+
        '<div class="stat"><span class="chip">Revenue '+nf(mk.revenue)+'</span><span class="chip">Cost '+nf(mk.cost)+'</span>'+
        '<span class="chip" style="background:'+((mk.margin||0)>=0?'#eaf6ee':'#fdecea')+';color:'+((mk.margin||0)>=0?'#15803D':'#C0392B')+'">Margin '+nf(mk.margin)+'</span></div></div>';
    }
    stockSec+='<div class="addbox">'+
      '<input id="skName" list="prodDL" autocomplete="off" placeholder="Pick a product from your list (or type a loose item)" oninput="prodPick()">'+
      '<datalist id="prodDL"></datalist><input type="hidden" id="skPid">'+
      '<div class="mini"><input id="skReq" type="number" min="0" step="any" placeholder="Requested">'+
      '<input id="skSent" type="number" min="0" step="any" placeholder="Sent"'+(beforeSend?'':' style="display:none"')+'>'+
      '<input id="skCost" type="number" min="0" step="any" placeholder="Cost each">'+
      '<button class="btn g" onclick="addStock()">＋ Add</button></div>'+
      '<div class="note" id="skPickMsg" style="margin-top:2px"></div></div>';
    // Quick request list — paste what Asish asked for (e.g. "Cling Film 10"), one per line.
    stockSec+='<div class="addbox" style="margin-top:8px">'+
      '<div class="note" style="margin-bottom:4px"><b>Quick request list</b> — paste what Asish needs, one item per line (e.g. <i>Cling Film 10</i>). Each is matched to a product and added as <b>Requested</b>.</div>'+
      '<textarea id="reqBulk" rows="3" placeholder="Cling Film 10&#10;Aluminium Foil 15" style="width:100%;padding:9px;border:1px solid var(--line,#e4e9e4);border-radius:9px;font-size:13px;font-family:inherit"></textarea>'+
      '<div class="btnrow" style="margin-top:6px"><button class="btn g" onclick="addReqBulk()">＋ Add all as requested</button>'+
      '<button class="btn" onclick="notifyRequest()">📤 Send request to Kampala</button></div>'+
      '<div class="note" id="reqMsg" style="margin-top:4px"></div></div>';
    if(stk.length){
      stockSec+=stk.map(function(k){
        var short=(Number(k.short)||0)>0.0001;
        var head='<div class="row"><b>'+esc(k.name)+'</b>'+(short?('<span class="short">short '+nf(k.short)+'</span>'):(k.remaining>0?('<span class="pill">'+nf(k.remaining)+' left</span>'):''))+'</div>';
        var grid='<div class="qgrid">'+
          '<div class="qcell"><label>Requested</label><input type="number" min="0" step="any" value="'+(k.requested||0)+'" onchange="saveStock('+k.id+',\'qty_requested\',this.value)"></div>'+
          '<div class="qcell"><label>Sent</label><input type="number" min="0" step="any" value="'+(k.sent||0)+'" onchange="saveStock('+k.id+',\'qty_sent\',this.value)"></div>'+
          (arrived||k.received!=null?('<div class="qcell"><label>Received</label><input type="number" min="0" step="any" value="'+(k.received!=null?k.received:'')+'" placeholder="'+(k.sent||0)+'" onchange="saveStock('+k.id+',\'qty_received\',this.value)"></div>'):'')+
          '<div class="qcell"><label>Sold</label><div class="qro">'+nf(k.sold||0)+'</div></div>'+

          '<div class="qcell"><label>Price</label><input type="number" min="0" step="any" value="'+(k.unit_price!=null?k.unit_price:'')+'" placeholder="0" onchange="saveStock('+k.id+',\'unit_price\',this.value)"></div>'+

/* Fuzzy-match a typed name to a catalogue product: exact → starts-with → contains → all-tokens. */
function prodMatch(name){
  var v=String(name||'').trim().toLowerCase(); if(!v)return null;
  var list=window.PRODUCTS||[];
  var f=function(test){return list.find(function(p){return test(String(p['Product Name']||'').toLowerCase());});};
  return f(function(n){return n===v;}) || f(function(n){return n.indexOf(v)===0;}) || f(function(n){return n.indexOf(v)>=0;})
      || (function(){var toks=v.split(/\s+/).filter(Boolean);return f(function(n){return toks.every(function(t){return n.indexOf(t)>=0;});});})()
      || null;
}
/* Parse one request line into {name, qty}. Accepts "Cling Film 10", "Cling Film x10",
   "Cling Film - 10", "10 Cling Film"; defaults qty 1 if none given. */
function parseReqLine(line){
  var s=String(line||'').trim(); if(!s)return null;
  var m=s.match(/^(.*?)[\s:\-x×*]*(\d+(?:\.\d+)?)\s*(?:ctns?|cartons?|pcs?|boxes?|bags?)?$/i);
  if(m&&m[1].trim())return {name:m[1].trim(), qty:Number(m[2])||1};
  var m2=s.match(/^(\d+(?:\.\d+)?)\s*(?:x|×)?\s+(.*)$/i);
  if(m2&&m2[2].trim())return {name:m2[2].trim(), qty:Number(m2[1])||1};
  return {name:s, qty:1};
}
function addReqBulk(){
  var raw=($('reqBulk')&&$('reqBulk').value)||''; var msg=$('reqMsg');
  var rows=raw.split(/\n+/).map(parseReqLine).filter(Boolean);
  if(!rows.length){if(msg)msg.textContent='Type at least one line, e.g. "Cling Film 10".';return;}
  if(msg)msg.textContent='Adding '+rows.length+' item'+(rows.length===1?'':'s')+'…';
  var i=0, added=0, unmatched=[];
  (function next(){
    if(i>=rows.length){
      if(msg)msg.textContent='Added '+added+' request'+(added===1?'':'s')+(unmatched.length?(' · not found (added as loose): '+unmatched.join(', ')):'');
      if($('reqBulk'))$('reqBulk').value=''; loadDetail(); return;
    }
    var r=rows[i++]; var p=prodMatch(r.name); if(!p)unmatched.push(r.name);
    var body=new URLSearchParams({id:CID, name:(p?p['Product Name']:r.name), product_id:(p?p._row:''), qty_requested:String(r.qty), qty_sent:'0'});
    api('/papi/consignment-stock-add',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})
      .then(function(rr){ if(rr&&rr.ok)added++; next(); })
      .catch(function(){ next(); });
  })();
}
/* One-tap request from the LIST view: parse + match, then land it on today's open consignment
   (server creates one if none is open) and optionally WhatsApp Kampala. Opens the consignment. */
function quickRequest(){
  var raw=($('qReqBulk')&&$('qReqBulk').value)||''; var msg=$('qReqMsg');
  var items=raw.split(/\n+/).map(parseReqLine).filter(Boolean).map(function(r){
    var p=prodMatch(r.name);
    return {name:(p?p['Product Name']:r.name), product_id:(p?p._row:''), qty:r.qty};
  });
  if(!items.length){if(msg)msg.textContent='Type at least one line, e.g. "Cling Film 10".';return;}
  var notify=($('qReqNotify')&&$('qReqNotify').checked)?1:0;
  var reqBy=($('qReqBy')&&$('qReqBy').value||'').trim();
  var sel=$('qSendTo'), toPhone='';
  if(sel){ toPhone = (sel.value==='__custom') ? (($('qSendPhone')&&$('qSendPhone').value)||'') : sel.value; }
  if(msg)msg.textContent='Sending…';
  api('/papi/consignment-request-quick',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({items:JSON.stringify(items),notify:notify,requested_by:reqBy,send_to_phone:toPhone})}).then(function(r){
    if(r&&r.ok){ openC(r.id); }
    else if(msg){ msg.textContent = (r&&r.error==='no_items')?'Type at least one line.':'Could not send: '+((r&&r.error)||'error'); }
  }).catch(function(){ if(msg)msg.textContent='Network error.'; });
}
function notifyRequest(){
  var msg=$('reqMsg'); if(msg)msg.textContent='Sending to Kampala…';
  api('/papi/consignment-request-notify',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({id:CID})}).then(function(r){
    if(r&&r.ok){ if(msg)msg.textContent='Sent to Kampala ✓ ('+r.items+' item'+(r.items===1?'':'s')+')'; }
    else if(msg)msg.textContent = r&&r.error==='no_dispatch_phone' ? 'Set Kampala/Jayesh WhatsApp first (sourcing buyer number).'
      : (r&&r.error==='nothing_to_send' ? 'Nothing short to send — add requested items first.' : 'Could not send.');
  }).catch(function(){ if(msg)msg.textContent='Network error.'; });
}

  api('/papi/consignment-carry-source').then(function(d){
    if(d&&d.ok&&d.source){CARRY_SRC=d.source.id;$('carryLbl').textContent='Carry over '+d.source.items+' unsent request'+(d.source.items===1?'':'s')+' from '+d.source.number;$('carryWrap').classList.remove('hide');}
  });
}
function closeNew(){$('newM').classList.add('hide');}
function createConsignment(){
  var b=$('nSave');b.disabled=true;b.textContent='Creating…';
  var p={transport_company:$('nTransport').value.trim(),bus_number:$('nBus').value.trim(),destination_agent_name:$('nAgent').value.trim(),destination_agent_phone:$('nAgentPh').value.trim(),origin_city:'Kampala',destination_city:'Juba'};
  if(CARRY_SRC&&$('nCarry').checked)p.carry_from=CARRY_SRC;
  api('/papi/consignment-create',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(p)}).then(function(r){
    b.disabled=false;b.textContent='Create consignment';
    if(r&&r.ok){
      closeNew();
      // v4.7 — orders picked on the Sales Orders screen ride straight onto the new consignment.
      var pend=pendingBus();
      if(pend){ addManyTo(r.id,pend.ids,function(){ openC(r.id); }); }
      else openC(r.id);
    } else $('nMsg').textContent='Failed: '+((r&&(r.error==='not_allowed'?'owner/manager only':r.error))||'error');
  }).catch(function(){b.disabled=false;b.textContent='Create consignment';$('nMsg').textContent='Network error';});
}

load();loadProducts();loadContacts();
</script>
<script>
/* Universal business clock — East Africa Time (Kampala/Juba, UTC+3). Shown identically on every
   device regardless of the phone/computer's own timezone, so everyone reads the same clock. */
(function(){
  function eat(){var d=new Date();var e=new Date(d.getTime()+d.getTimezoneOffset()*60000+3*3600000);
    function p(n){return (n<10?'0':'')+n;} var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    return '\u{1F552} '+wd[e.getDay()]+' '+p(e.getHours())+':'+p(e.getMinutes())+' EAT';}
  function mount(){
    var host=document.querySelector('.top,.topbar,header.top'); if(!host||document.getElementById('fsClock'))return;
    var c=document.createElement('span'); c.id='fsClock';
    c.style.cssText='margin-left:auto;font-weight:800;font-size:12px;background:rgba(128,128,128,.18);color:inherit;border-radius:8px;padding:5px 9px;white-space:nowrap;align-self:center';
    c.title='Business time — East Africa Time (Kampala / Juba)';
    var back=host.querySelector('.back'); if(back&&back.parentNode===host){host.insertBefore(c,back);} else {host.appendChild(c);}
    function tick(){c.textContent=eat();} tick(); setInterval(tick,15000);
  }
  if(document.readyState!=='loading')mount(); else document.addEventListener('DOMContentLoaded',mount);
})();
</script>
