# Build + push the multi-arch ShopBot Vision EDGE image (our server side).
#
# The box never builds — CI produces one manifest covering arm64 (RK3588 / Jetson) and amd64, so
# `docker compose pull` on any box gets the right architecture. Triggered ONLY on an edge version tag so
# it never runs on ordinary pushes and never interferes with the Laravel EasyPanel build.
#
# GitHub config (see docs/SHOPBOT_EDGE_OWNER_RUNBOOK.md):
#   Variables (not secret): REGISTRY (e.g. ghcr.io/dishnetafrica), SHOPBOT_LICENSE_PUBKEY (public key)
#   Secrets:                REGISTRY_USER, REGISTRY_TOKEN
# The signing PRIVATE key is never referenced here. Registry credentials are only used by the login
# action (never echoed). The public key and registry host are variables so the image ref can be printed.
name: edge-image

on:
  push:
    tags:
      - 'edge-v*'          # e.g. edge-v0.1.0
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if the license public key is missing
        run: |
          if [ -z "${{ vars.SHOPBOT_LICENSE_PUBKEY }}" ]; then
            echo "::error::SHOPBOT_LICENSE_PUBKEY variable is empty — the image would ship with no license"
            echo "::error::verification key and every license would be rejected on the box. Set the repo"
            echo "::error::variable SHOPBOT_LICENSE_PUBKEY to config('vision.license_public') and re-run."
            exit 1
          fi
          if [ -z "${{ vars.REGISTRY }}" ]; then
            echo "::error::REGISTRY variable is empty (e.g. ghcr.io/dishnetafrica)"; exit 1
          fi

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#edge-v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edge/Dockerfile
          platforms: linux/arm64,linux/amd64
          build-args: |
            SHOPBOT_LICENSE_PUBKEY=${{ vars.SHOPBOT_LICENSE_PUBKEY }}
            SHOPBOT_VISION_VERSION=${{ github.ref_name }}
          push: true
          provenance: false
          tags: |
            ${{ vars.REGISTRY }}/shopbot-vision:${{ github.ref_name }}
            ${{ vars.REGISTRY }}/shopbot-vision:${{ github.ref_name }}-${{ github.sha }}

      - name: Output the image reference the box should pull
        run: |
          echo "IMAGE_REF=${{ vars.REGISTRY }}/shopbot-vision:${{ github.ref_name }}"
          echo "Set this as IMAGE_REF / SHOPBOT_EDGE_IMAGE in the installer."
