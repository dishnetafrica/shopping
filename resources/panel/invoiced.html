<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoiced</title>
<style>
  :root{--gd:#0B3D22;--g:#15803D;--mute:#94a3b8;--bg:#f5f5f2;--border:#e8e8e3;--font:'Inter',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--font);color:#0f0f0f;}
  .wrap{max-width:640px;margin:0 auto;padding:14px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .top h1{font-size:20px;margin:0;font-weight:900;}.top a{color:var(--g);text-decoration:none;font-weight:700;font-size:13px;}
  .mnav{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:12px;}
  .mnav button{background:#E6F4EA;color:#0B3D22;border:none;border-radius:9px;width:38px;height:38px;font-size:18px;font-weight:800;cursor:pointer;}
  .mnav .lbl{font-size:15px;font-weight:800;}
  .hero{border-radius:16px;padding:18px;color:#fff;background:linear-gradient(135deg,#15803D,#0B3D22);margin-bottom:12px;}
  .hero .t{font-size:11px;opacity:.85;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .hero .n{font-size:30px;font-weight:900;margin-top:4px;}
  .hero .c{font-size:12px;opacity:.85;margin-top:4px;font-weight:600;}
  .brek{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .brek>div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 12px;}
  .brek .t{font-size:10px;color:var(--mute);font-weight:700;text-transform:uppercase;}
  .brek .n{font-size:15px;font-weight:800;color:var(--gd);margin-top:2px;}
  .sub{font-size:12px;color:var(--mute);font-weight:600;margin:2px 0 8px;}
  .row{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .row .l .no{font-weight:800;font-size:14px;}
  .row .l .cu{font-size:12px;color:#64748b;margin-top:2px;}
  .row .amt{font-weight:900;font-size:15px;color:var(--gd);}
  .empty{text-align:center;color:var(--mute);padding:36px 20px;font-size:14px;font-weight:600;}
  .loading{text-align:center;color:var(--mute);padding:24px;}
  .note{font-size:11px;color:#94a3b8;margin-top:10px;line-height:1.5;}
</style><!-- ===== DishNet mobile app shell (injected v2) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dn-shell">
  :root{--dn-g:#15803D;--dn-gd:#0B3D22;--dn-gl:#E6F4EA;--dn-line:#E2E8E2;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px)!important;}
  .top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
       justify-content:flex-start;margin:-14px -14px 14px -14px!important;
       padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px!important;
       background:var(--dn-gd);box-shadow:0 2px 10px -4px rgba(11,61,34,.5);}
  .top h1{color:#fff!important;font-size:17px!important;font-weight:800!important;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top a{order:-1;flex-shrink:0;width:34px;height:34px;border-radius:50%;
         background:rgba(255,255,255,.16)!important;color:#fff!important;
         display:grid;place-items:center;font-size:0!important;text-decoration:none;}
  .top a::before{content:"\2039";font-size:24px;font-weight:700;line-height:1;margin-top:-2px;}
  .dn-appbtn{margin-left:auto;flex-shrink:0;height:34px;padding:0 13px;border-radius:99px;
             background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:700;
             display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .dn-appbtn:active{background:rgba(255,255,255,.28);}
  .btn{background:var(--dn-gd)!important;border-radius:12px!important;padding:14px!important;font-weight:800!important;}
  .btn:active{background:#082a18!important;}
  input,select,textarea{font-size:16px!important;border-radius:11px!important;}
  input:focus,select:focus,textarea:focus{border-color:var(--dn-g)!important;}
  .card,.oitem,.item,.balcard,.hero{box-shadow:0 1px 2px rgba(16,35,28,.05),0 3px 12px -4px rgba(16,35,28,.06);}
  .dn-amt-echo{display:none;margin:9px 0 2px;padding:8px 12px;border-radius:10px;
               background:var(--dn-gl);border:1px solid #BFE3CB;color:var(--dn-gd);
               font-size:16px;font-weight:800;letter-spacing:.2px;}
  .dn-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;min-height:58px;
             background:#fff;border-top:1px solid var(--dn-line);
             padding-bottom:env(safe-area-inset-bottom,0px);
             box-shadow:0 -2px 14px -6px rgba(16,35,28,.18);}
  .dn-tabbar a{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;
               gap:3px;padding:9px 2px 8px;text-decoration:none;color:#7C8A80;font-size:10.5px;font-weight:700;}
  .dn-tabbar a .di{font-size:20px;line-height:1;filter:grayscale(35%);opacity:.85;}
  .dn-tabbar a .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .dn-tabbar a.on{color:var(--dn-gd);}
  .dn-tabbar a.on .di{filter:none;opacity:1;transform:translateY(-1px);}
  .dn-tabbar a.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--dn-g);}
  @media(min-width:721px){.dn-tabbar{max-width:720px;margin:0 auto;border-left:1px solid var(--dn-line);border-right:1px solid var(--dn-line);}}
</style>
</head>
<body><div class="wrap">
  <div class="top"><h1>🧾 Invoiced</h1><a href="/panel">← Panel</a></div>
  <div class="mnav"><button onclick="move(-1)">‹</button><div class="lbl" id="mlabel">…</div><button onclick="move(1)">›</button></div>
  <div id="hero"></div>
  <div id="breakdown"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
    <div class="sub" id="sub" style="margin:0">Delivered orders</div>
    <div style="display:flex;gap:6px">
      <button onclick="expCsv()" style="background:#0B3D22;color:#fff;border:none;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer">⬇ CSV</button>
      <button onclick="expPdf()" style="background:#eef2f7;color:#334155;border:none;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:800;cursor:pointer">🖨 PDF</button>
    </div>
  </div>
  <div id="list"><div class="loading">Loading…</div></div>
  <div class="note">“Invoiced” = orders that reached <b>Delivered</b>, counted in the month of their <b>delivery date</b>. Orders not yet delivered are treated as quotations and excluded. UGX/SSP shown at 1 USD = 3,750 UGX = 7,000 SSP.</div>
</div>
<script>
const $=s=>document.getElementById(s);
var RATE_UGX=3750, RATE_SSP=7000;             // display equivalents (matches invoice)
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var ALL=[]; var sel=new Date();
function nf(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ymOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function orderAmt(o){
  var a = (o.total!=null?o.total:(o.total_ugx!=null?o.total_ugx:null));
  if(a==null && Array.isArray(o.items_json)) a=o.items_json.reduce(function(s,it){return s+(Number(it.qty)||0)*(Number(it.price)||0);},0);
  return Number(a)||0;
}
function orderCur(o){
  if(o.currency) return String(o.currency).toUpperCase();
  if(typeof o.payment==='string' && o.payment.indexOf('sell:')===0) return o.payment.slice(5).toUpperCase();
  return 'USD';   // Family Shoppers catalogue is USD-based
}
function orderDate(o){ return (o.delivery_date && String(o.delivery_date).trim()) ? o.delivery_date : o.created_at; }

function load(){
  fetch('/papi/orders',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(r=>r.json()).then(function(d){ ALL=(d&&d.orders)||[]; render(); })
    .catch(function(){ $('list').innerHTML='<div class="empty">Could not load orders.</div>'; });
}
function move(n){ sel.setMonth(sel.getMonth()+n); render(); }
function render(){
  $('mlabel').textContent = MONTHS[sel.getMonth()]+' '+sel.getFullYear();
  var ym=ymOf(sel);
  var rows=ALL.filter(function(o){
    if(o.status!=='Delivered') return false;
    var dt=orderDate(o); if(!dt) return false;
    return String(dt).slice(0,7)===ym;
  });
  var totUsd=0, out=[];
  rows.forEach(function(o){
    var amt=orderAmt(o);
    totUsd+=amt;                                  // USD-based catalogue
    out.push({no:o.order_no,name:o.name,amt:amt,date:String(orderDate(o)).slice(0,10)});
  });
  window.__inv={label:MONTHS[sel.getMonth()]+' '+sel.getFullYear(),totUsd:totUsd,rows:out};
  $('hero').innerHTML='<div class="hero"><div class="t">Invoiced this month (USD)</div><div class="n">$'+nf(totUsd)+'</div><div class="c">'+rows.length+' delivered order'+(rows.length!==1?'s':'')+'</div></div>';
  $('breakdown').innerHTML='<div class="brek">'+
    '<div><div class="t">USD</div><div class="n">$'+nf(totUsd)+'</div></div>'+
    '<div><div class="t">UGX equiv</div><div class="n">'+nf(totUsd*RATE_UGX)+'</div></div>'+
    '<div><div class="t">SSP equiv</div><div class="n">'+nf(totUsd*RATE_SSP)+'</div></div>'+
  '</div>';
  var L=$('list');
  if(!out.length){ $('sub').textContent='Delivered orders'; L.innerHTML='<div class="empty">No delivered orders in '+MONTHS[sel.getMonth()]+' '+sel.getFullYear()+'.</div>'; return; }
  $('sub').textContent=out.length+' delivered order'+(out.length>1?'s':'');
  out.sort(function(a,b){return (a.date<b.date)?1:-1;});
  L.innerHTML=out.map(function(o){
    return '<div class="row"><div class="l"><div class="no">'+esc(o.no||'')+'</div><div class="cu">'+esc(o.name||'')+' · '+esc(o.date)+'</div></div>'+
      '<div class="amt">$'+nf(o.amt)+'</div></div>';
  }).join('');
}

function csvCell(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function expCsv(){
  var m=window.__inv; if(!m||!m.rows.length){alert('Nothing to export');return;}
  var lines=[['Order','Customer','Delivery Date','Amount USD'].join(',')];
  m.rows.forEach(function(r){lines.push([r.no,r.name,r.date,r.amt].map(csvCell).join(','));});
  lines.push(['','','TOTAL USD',m.totUsd].map(csvCell).join(','));
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='invoiced-'+m.label.replace(' ','-')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function expPdf(){
  var m=window.__inv; if(!m||!m.rows.length){alert('Nothing to export');return;}
  var w=window.open('','_blank'); if(!w){alert('Allow pop-ups');return;}
  var rows=m.rows.map(function(r){return '<tr><td>'+esc(r.no)+'</td><td>'+esc(r.name||'')+'</td><td>'+esc(r.date)+'</td><td class=num>$'+nf(r.amt)+'</td></tr>';}).join('');
  w.document.write('<html><head><title>Invoiced '+esc(m.label)+'</title><style>body{font-family:Arial,sans-serif;padding:16px;color:#111}h2{margin:0}.sub{color:#666;font-size:12px;margin:2px 0 12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border-bottom:1px solid #ddd;padding:7px 8px;text-align:left}.num{text-align:right}tfoot td{font-weight:800;border-top:2px solid #333}</style></head><body>'+
    '<h2>Invoiced — '+esc(m.label)+'</h2><div class="sub">Family Shoppers · Delivered orders · '+m.rows.length+' orders</div>'+
    '<table><thead><tr><th>Order</th><th>Customer</th><th>Delivery Date</th><th class=num>Amount USD</th></tr></thead><tbody>'+rows+
    '</tbody><tfoot><tr><td colspan=3>TOTAL (USD)</td><td class=num>$'+nf(m.totUsd)+'</td></tr></tfoot></table></body></html>');
  w.document.close();setTimeout(function(){w.focus();w.print();},400);
}
load();
</script><!-- ===== DishNet role-aware tab bar + amount format (injected v2) ===== -->
<nav class="dn-tabbar" id="dnTabbar"></nav>
<script>
(function(){
  var here=location.pathname.replace(/\/+$/,'')||'/panel';
  var TABS=[
    {t:'Orders',i:'\uD83D\uDED2',u:'/panel/orders-costs', need:'menu:ordercosts'},
    {t:'Buy',   i:'\uD83D\uDECD\uFE0F',u:'/panel/book-cost',    need:'menu:purchases'},
    {t:'List',  i:'\uD83D\uDCCB',u:'/panel/buy-list',     need:'buylist'},
    {t:'Cash',  i:'\uD83D\uDCB0',u:'/panel/cash-position', need:'menu:cash'},
    {t:'Book',  i:'\uD83D\uDCD2',u:'/panel/trade-cashbook',need:'owner'},
    {t:'Spend', i:'\uD83D\uDCB8',u:'/panel/expenses',      need:'owner'},
    {t:'P&L',   i:'\uD83D\uDCC8',u:'/panel/pnl',           need:'owner'}
  ];
  function allowed(rule, nav){
    if(rule==='owner') return !!nav.is_owner;
    if(rule==='buylist') return (nav.menus||[]).indexOf('purchases')>=0 && !nav.is_owner;
    if(rule.indexOf('menu:')===0){ var k=rule.slice(5); return (nav.menus||[]).indexOf(k)>=0; }
    return false;
  }
  function render(nav){
    var bar=document.getElementById('dnTabbar'); if(!bar) return;
    var vis=TABS.filter(function(x){ return allowed(x.need,nav); });
    bar.innerHTML=vis.map(function(x){
      var on=(here===x.u)?'on':'';
      return '<a class="'+on+'" href="'+x.u+'"><span class="di">'+x.i+'</span><span class="dl">'+x.t+'</span></a>';
    }).join('');
    var top=document.querySelector('.top');
    if(top && here!=='/panel/approvals' && (nav.menus||[]).indexOf('approvals')>=0){
      var a=document.createElement('a'); a.className='dn-appbtn'; a.href='/panel/approvals';
      a.innerHTML='\u2713 Approvals'; top.appendChild(a);
    }
  }
  var FALLBACK={is_owner:false, menus:['ordercosts','purchases','cash']};
  fetch('/papi/me/nav',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(function(d){ render(d && d.ok ? d : FALLBACK); })
    .catch(function(){ render(FALLBACK); });

  function group(v){
    v=(v==null?'':String(v)).replace(/[^\d.]/g,'');
    var p=v.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return p.length>1 ? p[0]+'.'+p.slice(1).join('') : p[0];
  }
  function wire(id, curId){
    var el=document.getElementById(id); if(!el) return;
    var cur=curId?document.getElementById(curId):null;
    var echo=document.createElement('div'); echo.className='dn-amt-echo';
    var anchor=(el.closest && el.closest('.row'))||el;
    if(anchor.parentNode) anchor.parentNode.insertBefore(echo, anchor.nextSibling);
    function upd(){
      var g=group(el.value); if(el.value!==g) el.value=g;
      var n=parseFloat(g.replace(/,/g,''))||0;
      if(n>0){ echo.textContent=(cur&&cur.value?cur.value+' ':'')+group(String(n)); echo.style.display='block'; }
      else { echo.textContent=''; echo.style.display='none'; }
    }
    el.addEventListener('input',upd);
    if(cur) cur.addEventListener('change',upd);
    document.querySelectorAll('.btn,button').forEach(function(b){ b.addEventListener('click',function(){ setTimeout(upd,1500); }); });
    upd();
  }
  wire('amt','cur');
  wire('total','sellcur');
})();
</script>
</body></html>
