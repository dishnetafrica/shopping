name: tests

on:
  push:
  pull_request:

jobs:
  money-kernel:
    name: Money kernel (must pass)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shopbot_test
          POSTGRES_USER: shopbot
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shopbot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: testing
      APP_KEY: base64:N2AKuDAQKomuTgjhawBbQFh06whgXLxdYxVRxwL55/s=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: shopbot_test
      DB_USERNAME: shopbot
      DB_PASSWORD: secret
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, mbstring, bcmath, intl, zip, gd
          coverage: none
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing
          mkdir -p storage/logs storage/app/public
          chmod -R 777 bootstrap/cache storage
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Migrate the test database
        run: php artisan migrate --force
      - name: Money kernel tests (the important ones)
        run: php artisan test tests/Unit/Kernel tests/Feature/Kernel
      - name: Full suite (informational only)
        continue-on-error: true
        run: php artisan test
