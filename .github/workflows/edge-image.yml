# Build + push the multi-arch ShopBot Vision EDGE image (our server side).
#
# The box never builds — CI produces one manifest covering arm64 (RK3588 / Jetson) and amd64, so
# `docker compose pull` on any box gets the right architecture. Triggered ONLY on an edge version tag so
# it never runs on ordinary pushes and never interferes with the Laravel EasyPanel build.
#
# Requires repo/org secrets: REGISTRY (e.g. ghcr.io), REGISTRY_USER, REGISTRY_TOKEN. Without them the job
# does not run (it is tag-gated). This publishes the image `bootstrap.sh` pulls via IMAGE_REF.
name: edge-image

on:
  push:
    tags:
      - 'edge-v*'          # e.g. edge-v0.1.0
  workflow_dispatch: {}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#edge-v}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: edge/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ secrets.REGISTRY }}/shopbot-vision:${{ steps.ver.outputs.version }}
            ${{ secrets.REGISTRY }}/shopbot-vision:${{ steps.ver.outputs.version }}-${{ github.sha }}
          provenance: false
