<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation</title>
<style>
  :root{--green:#0C831F;--green-d:#0A6E1A;--ink:#1F2421;--muted:#6B7280;--line:#E7ECE8;--bg:#F4F6F4;--card:#fff;--amber:#B4770A;--red:#B4232A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  a{color:inherit}
  .wrap{max-width:920px;margin:0 auto;padding:16px 16px 60px}
  .top{display:flex;align-items:center;gap:13px;padding:16px 0 14px}
  .lg{width:46px;height:46px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;overflow:hidden}
  .lg img{width:100%;height:100%;object-fit:cover}
  .top .co{font-size:17px;font-weight:800;line-height:1.15}
  .top .qn{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:14px;overflow:hidden}
  .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .hd .t{font-size:15px;font-weight:800}
  .badge{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
  .badge.sent{background:#FFF6E6;color:var(--amber)} .badge.accepted,.badge.converted{background:#EAF6EC;color:var(--green-d)}
  .badge.declined,.badge.expired{background:#FDECEC;color:var(--red)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .meta .m{background:#fff;padding:13px 18px}
  .meta .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .meta .v{font-size:14px;font-weight:700;margin-top:3px}
  @media(max-width:560px){.meta{grid-template-columns:1fr 1fr}}
  .items{padding:6px 0}
  .it{display:grid;grid-template-columns:52px 1fr auto;gap:13px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
  .it:last-child{border-bottom:0}
  .it .th{width:52px;height:52px;border-radius:10px;background:#EEF2ED;display:grid;place-items:center;overflow:hidden;flex:none}
  .it .th img{width:100%;height:100%;object-fit:contain;padding:4px}
  .it .th .ph{font-size:20px;color:#9CB2A0}
  .it .nm{font-size:14px;font-weight:700;line-height:1.3}
  .it .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .it .rt{text-align:right}
  .it .lt{font-size:14.5px;font-weight:800;white-space:nowrap}
  .it .qp{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
  .tot{padding:8px 18px 16px}
  .tr{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
  .tr .l{color:var(--muted);font-weight:600}
  .tr.grand{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:19px;font-weight:900}
  .remarks{padding:14px 18px;font-size:13.5px;color:var(--ink)}
  .remarks .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .tl{padding:8px 18px 16px}
  .tlrow{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
  .tlrow .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px}
  .tlrow.done .dot{background:var(--green);border-color:var(--green)}
  .tlrow .tt{font-size:13.5px;font-weight:700}
  .tlrow.done .tt{color:var(--ink)} .tlrow .tt{color:var(--muted)}
  .tlrow .ta{font-size:11.5px;color:var(--muted)}
  .actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(244,246,244,0),var(--bg) 26%);padding:14px 0 8px}
  .btnrow{display:flex;flex-wrap:wrap;gap:10px}
  .btn{flex:1 1 auto;min-width:140px;border:0;border-radius:12px;padding:14px;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:#F2F5F2}
  .btn.wa{background:#25D366;color:#fff}
  .btn:disabled{opacity:.55;cursor:default}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
  .loading,.err{padding:60px 20px;text-align:center;color:var(--muted)}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:#1F2421;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--green-d)} .toast.err{background:var(--red)}
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:18px}
  .modal.show{display:flex}
  .msheet{background:#fff;border-radius:16px;max-width:400px;width:100%;padding:20px}
  .msheet h3{margin:0 0 4px;font-size:16px} .msheet p{margin:0 0 14px;font-size:13px;color:var(--muted)}
  .msheet input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin-bottom:12px;outline:none}
  .msheet input:focus{border-color:var(--green)}
  /* edit mode */
  .editnote{font-size:12.5px;color:var(--muted);padding:2px 18px 8px}
  .qstep{display:inline-flex;align-items:center;border:1px solid var(--green);border-radius:9px;overflow:hidden;height:34px}
  .qstep button{border:0;background:#F1F9F4;color:var(--green-d);width:30px;height:100%;font-size:17px;font-weight:800;cursor:pointer}
  .qstep input{width:44px;height:100%;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:800;font-size:14px;outline:none;-moz-appearance:textfield}
  .qstep input::-webkit-outer-spin-button,.qstep input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qrm{border:0;background:none;color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer;padding:6px 4px;margin-top:4px}
  .editbar{padding:12px 18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .editbar .add{border:1px dashed var(--green);background:#F6FBF7;color:var(--green-d);font-weight:800;border-radius:10px;padding:10px 14px;cursor:pointer}
  .addbox{padding:0 18px 14px}
  .addbox input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;outline:none}
  .addbox input:focus{border-color:var(--green)}
  .addres{max-height:230px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
  .ares{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .ares:last-child{border-bottom:0}.ares:hover{background:#F6FBF7}
  .ares .an{font-size:13.5px;font-weight:700}.ares .ap{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
  .cmtbox{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;font-family:inherit}
  .cmtbox:focus{border-color:var(--green)}
  .unav{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;color:var(--red);background:#FDECEC;border-radius:6px;padding:2px 8px}
  .altcard .hd{border-color:#CDE3F5}
  .alts{padding:4px 0}
  .altrow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
  .altrow:last-child{border-bottom:0}
  .altrow .th{width:46px;height:46px;border-radius:9px;background:#EEF2ED;display:grid;place-items:center;overflow:hidden}
  .altrow .th img{width:100%;height:100%;object-fit:contain;padding:4px}
  .altfor{font-size:11.5px;color:var(--muted)}
  .altnm{font-size:14px;font-weight:800;margin-top:1px}
  .altpr{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
  .altpr .altd{color:var(--green-d);font-weight:800}
  .altbtn{border:0;background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer}
  .altbtn:hover{background:var(--green-d)}
  .chgcard .hd{border-color:#CDE9D4}
  .chg{padding:10px 18px 16px}
  .chgrow{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px}
  .chgrow .ci{flex:none;color:var(--green-d);font-weight:900;width:16px;text-align:center}
  .chgrow b{font-weight:800}
  .revrow{display:flex;justify-content:space-between;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:13px}
  .revrow:last-child{border-bottom:0}
  .revrow .rl{font-weight:700}.revrow .rm{color:var(--muted);font-size:12px;margin-top:1px}
  .revrow .rg{font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="loading" id="load"><div class="spin"></div>Loading your quotation…</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="shareModal">
  <div class="msheet">
    <h3 id="shareTitle">Share quotation</h3>
    <p id="shareHint"></p>
    <input id="shareTo" placeholder="">
    <div class="btnrow">
      <button class="btn ghost" onclick="closeShare()">Cancel</button>
      <button class="btn primary" id="shareSend" onclick="doShare()">Send</button>
    </div>
  </div>
</div>
<script>
var CFG = __QUOTE_CONFIG__;
var Q = null;
var EDIT=false, WORK=null, CAT=null, ADDQ='';
function $(id){return document.getElementById(id);}
function money(n){ n=Number(n)||0; var cur=String((Q&&Q.currency)||CFG.currency||'UGX').toUpperCase();
  var zero=['UGX','KES','TZS','RWF','BIF','SSP','JPY','KRW','VND','XAF','XOF','GNF','MGA','CLP','PYG','ISK','KMF','XPF'];
  var d=zero.indexOf(cur)>=0?0:2;
  var s=n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  return cur==='USD'?('$'+s):(cur+' '+s); }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fdate(s){ if(!s)return '—'; try{var d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return s;} }
function ftime(s){ if(!s)return ''; try{return new Date(s).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }
function toast(m,t){var el=$('toast');el.textContent=m;el.className='toast show'+(t?(' '+t):'');clearTimeout(el._h);el._h=setTimeout(function(){el.className='toast';},2600);}

function load(){
  fetch(CFG.dataUrl,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){throw 0;} Q=d; render();
  }).catch(function(){ $('wrap').innerHTML='<div class="err">Sorry, we couldn’t load this quotation.<br>Please check the link or contact us on WhatsApp.</div>'; });
}

function chgIcon(t){return t==='add'?'＋':(t==='remove'?'✕':(t==='price'?'₵':(t==='discount'?'%':(t==='comment'||t==='request'||t==='remarks'?'✎':'✓'))));}
function chgText(c){
  if(c.type==='qty') return '<b>'+esc(c.name)+'</b> quantity: '+c.from+' → <b>'+c.to+'</b>';
  if(c.type==='add') return '<b>'+esc(c.name)+'</b> added ('+c.qty+')';
  if(c.type==='remove') return '<b>'+esc(c.name)+'</b> removed';
  if(c.type==='price') return '<b>'+esc(c.name)+'</b> price: '+money(c.from)+' → <b>'+money(c.to)+'</b>';
  if(c.type==='discount') return '<b>'+esc(c.name)+'</b> discount → <b>'+c.to+'%</b>';
  if(c.type==='freight') return 'Freight updated to <b>'+money(c.to)+'</b>';
  if(c.type==='remarks') return 'Remarks updated';
  if(c.type==='comment'||c.type==='request') return (c.by==='customer'?'You':'Sales')+': "'+esc(c.text||'')+'"';
  return esc(c.type||'Updated');
}

function render(){
  var badge='<span class="badge '+esc(Q.status)+'">'+esc(Q.status_label||Q.status)+'</span>';
  var logo=CFG.logo?('<img alt="" src="'+esc(CFG.logo)+'">'):esc((CFG.company||'FS').slice(0,2).toUpperCase());
  var cust=Q.customer||{};
  var editable=!!Q.editable;

  // --- Items (read-only, or editable when in edit mode) ---
  var itemsHtml;
  if(EDIT){
    itemsHtml=(WORK||[]).map(function(it,i){
      if(it.qty<=0 && !it._added) return ''; // removed originals hidden
      var th=it.image?('<img alt="" src="'+esc(it.image)+'">'):'<span class="ph">📦</span>';
      return '<div class="it"><div class="th">'+th+'</div>'
        +'<div><div class="nm">'+esc(it.name)+'</div><div class="sub">'+money(it.unit_price)+' each</div>'
          +'<button class="qrm" onclick="rmEdit('+i+')">Remove</button></div>'
        +'<div class="rt"><div class="qstep"><button onclick="stepEdit('+i+',-1)">−</button>'
          +'<input type="number" min="0" value="'+(it.qty||0)+'" onchange="setEditQty('+i+',this.value)"><button onclick="stepEdit('+i+',1)">+</button></div></div></div>';
    }).join('');
  } else {
    itemsHtml=(Q.items||[]).map(function(it){
      var sub=[it.brand,it.variant,it.unit].filter(Boolean).join(' · ');
      var th=it.image?('<img alt="" src="'+esc(it.image)+'">'):'<span class="ph">📦</span>';
      var un=(it.available===false)?'<div class="unav">Currently unavailable</div>':'';
      return '<div class="it"><div class="th">'+th+'</div>'
        +'<div><div class="nm">'+esc(it.name)+'</div>'+(sub?('<div class="sub">'+esc(sub)+'</div>'):'')+un+'</div>'
        +'<div class="rt"><div class="lt">'+money(it.line_total)+'</div><div class="qp">'+it.qty+' × '+money(it.unit_price)+'</div></div></div>';
    }).join('');
  }

  var t=Q.totals||{};
  var fr=Number(t.freight)||0;
  var totRows='<div class="tr"><span class="l">Subtotal</span><span>'+money(t.subtotal)+'</span></div>';
  var adj=(Number(t.grand)||0)-(Number(t.subtotal)||0)-fr;   // VAT/discount net of freight
  if(t.discount>0) totRows+='<div class="tr"><span class="l">Discount</span><span>-'+money(t.discount)+'</span></div>';
  else if(adj<0) totRows+='<div class="tr"><span class="l">Discount / adjustments</span><span>'+money(adj)+'</span></div>';
  else if(adj>0) totRows+='<div class="tr"><span class="l">Taxes</span><span>+'+money(adj)+'</span></div>';
  if(fr>0) totRows+='<div class="tr"><span class="l">Freight</span><span>'+money(fr)+'</span></div>';
  totRows+='<div class="tr grand"><span>Grand Total</span><span>'+money(t.grand)+'</span></div>';

  // --- Edit controls (add products + comment + submit) ---
  var editUI='';
  if(EDIT){
    var addUI = ADDQ===null ? '' :
      '<div class="addbox"><input id="addSearch" placeholder="Search products to add…" value="'+esc(ADDQ)+'" oninput="onAddSearch(this.value)">'
      + '<div class="addres" id="addRes">'+addResults()+'</div></div>';
    editUI='<div class="editbar"><button class="add" onclick="toggleAdd()">'+ (ADDQ===null?'+ Add products':'Close') +'</button>'
      + '<span class="rm" style="color:var(--muted);font-size:12.5px">Change quantities, remove or add lines, then send to sales.</span></div>'
      + addUI
      + '<div class="addbox"><textarea class="cmtbox" id="editComment" rows="2" placeholder="Add a note or request a price review (optional)"></textarea></div>'
      + '<div class="editbar" style="border-top:0;padding-top:0"><button class="btn ghost" style="flex:1" onclick="cancelEdit()">Cancel</button>'
      + '<button class="btn primary" style="flex:2" id="sendEditsBtn" onclick="submitEdits()">Send changes to sales</button></div>';
  }

  // --- Smart Alternatives (Q4): in-stock swaps for unavailable lines ---
  var altCard='';
  if(!EDIT && editable && (Q.alternatives||[]).length){
    altCard='<div class="card altcard"><div class="hd"><div class="t">Suggested alternatives</div><div class="qn">in stock now</div></div><div class="alts">'
      + Q.alternatives.map(function(a){
          var s=a.suggested||{}; var d=Number(s.price_diff)||0;
          var diff=d===0?'same price':(d>0?('+'+money(d)):('-'+money(-d)));
          var th=s.image?('<img alt="" src="'+esc(s.image)+'">'):'<span class="ph">📦</span>';
          return '<div class="altrow"><div class="th">'+th+'</div>'
            +'<div class="altmid"><div class="altfor">Instead of <b>'+esc(a.for)+'</b> (unavailable)</div>'
              +'<div class="altnm">'+esc(s.name)+'</div><div class="altpr">'+money(s.price)+' <span class="altd">'+diff+'</span></div></div>'
            +'<button class="altbtn" onclick="acceptAlt('+JSON.stringify(a.for).replace(/"/g,'&quot;')+','+JSON.stringify(s.name).replace(/"/g,'&quot;')+')">Accept</button></div>';
        }).join('')
      + '</div></div>';
  }

  // --- "What changed" card (visual diff of the latest revision) ---
  var changesCard='';
  if((Q.revision||1)>1 && (Q.latest_changes||[]).length){
    changesCard='<div class="card chgcard"><div class="hd"><div class="t">Revision '+Q.revision+' · what changed</div></div><div class="chg">'
      + Q.latest_changes.map(function(c){return '<div class="chgrow"><span class="ci">'+chgIcon(c.type)+'</span><span>'+chgText(c)+'</span></div>';}).join('')
      + '</div></div>';
  }

  // --- Revision history ---
  var revsCard='';
  if((Q.revisions||[]).length>1){
    revsCard='<div class="card"><div class="hd"><div class="t">Revision history</div></div>'
      + Q.revisions.map(function(r){
          var who=r.actor_type==='customer'?'You':(r.actor_type==='sales'?(r.actor_name||'Sales'):'Original');
          var n=(r.changes||[]).length;
          return '<div class="revrow"><div><div class="rl">Revision '+r.rev_no+'</div><div class="rm">'+who+' · '+ftime(r.at)+(n?(' · '+n+' change'+(n===1?'':'s')):'')+'</div></div><div class="rg">'+money(r.grand)+'</div></div>';
        }).join('')
      + '</div>';
  }

  var tl=(Q.timeline||[]).map(function(s){
    return '<div class="tlrow'+(s.done?' done':'')+'"><div class="dot"></div><div><div class="tt">'+esc(s.label)+'</div>'+(s.at?('<div class="ta">'+ftime(s.at)+'</div>'):'')+'</div></div>';
  }).join('');
  var respHint = Q.status==='converted' ? 'Approved' : ((Q.status==='sent'||Q.status==='customer_revised') ? 'Our sales team typically responds within a few hours' : '');

  var approveBtn = Q.is_converted
    ? '<button class="btn primary" disabled>✓ Approved — Order '+esc(Q.order_no||'')+'</button>'
    : '<button class="btn primary" id="approveBtn" onclick="approve()">✓ Approve Quotation</button>';

  $('wrap').innerHTML =
    '<div class="top"><div class="lg">'+logo+'</div><div><div class="co">'+esc(CFG.company||'')+'</div><div class="qn">Quotation '+esc(Q.quote_no)+'</div></div></div>'
    + changesCard
    + '<div class="card"><div class="hd"><div class="t">Quotation '+esc(Q.quote_no)+'</div>'+badge+'</div>'
      + '<div class="meta">'
        + m('Valid Until', fdate(Q.valid_until))
        + m('Sales Representative', esc(Q.sales_rep||'Our sales team'))
        + m('Revision', 'Revision '+(Q.revision||1))
        + m('Currency', esc(Q.currency))
        + m('Deliver To', esc(cust.address||'To be confirmed'))
        + m('For', esc(cust.name||''))
      + '</div></div>'
    + '<div class="card"><div class="hd"><div class="t">Items</div>'
        + (EDIT?'<div class="qn">Editing…</div>':(editable?'<button class="btn ghost" style="padding:8px 14px;min-width:0;flex:0" onclick="startEdit()">✎ Edit</button>':'<div class="qn">'+(Q.items||[]).length+' lines</div>'))
      + '</div>'
      + '<div class="items">'+itemsHtml+'</div>'
      + editUI
      + (EDIT?'':'<div class="tot">'+totRows+'</div>')+'</div>'
    + altCard
    + (Q.remarks?('<div class="card"><div class="remarks"><div class="k">Remarks</div>'+esc(Q.remarks)+'</div></div>'):'')
    + revsCard
    + '<div class="card"><div class="hd"><div class="t">Timeline</div>'+(respHint?('<div class="qn">'+esc(respHint)+'</div>'):'')+'</div><div class="tl">'+tl+'</div></div>'
    + (EDIT?'':('<div class="actions"><div class="btnrow">'
      + '<a class="btn ghost" href="'+esc(Q.pdf_url||CFG.pdfUrl)+'" target="_blank" rel="noopener">⬇ Download PDF</a>'
      + '<button class="btn ghost" onclick="window.print()">🖨 Print</button>'
      + '<button class="btn wa" onclick="openShare(\'whatsapp\')">Share on WhatsApp</button>'
      + '<button class="btn ghost" onclick="openShare(\'email\')">Share by Email</button>'
      + '</div><div class="btnrow" style="margin-top:10px">'
      + (editable?'<button class="btn ghost" onclick="startEdit()">✎ Edit Quotation</button>':'')
      + approveBtn
      + '</div>'
      + '<div class="hint"><a href="'+esc(Q.shop_url||CFG.shopUrl)+'">← Continue shopping</a></div>'
      + '</div>'));
}
function m(k,v){return '<div class="m"><div class="k">'+k+'</div><div class="v">'+(v||'—')+'</div></div>';}

/* ---- Customer editing (Q2): builds ops and sends ONE revision ---- */
function startEdit(){ EDIT=true; ADDQ=null; WORK=(Q.items||[]).map(function(it){return {name:it.name,qty:it.qty,unit_price:it.unit_price,image:it.image,unit:it.unit,_orig:it.qty};}); render(); scrollTo(0,0); }
function cancelEdit(){ EDIT=false; WORK=null; ADDQ=null; render(); }
function stepEdit(i,d){ WORK[i].qty=Math.max(0,(WORK[i].qty||0)+d); render(); }
function setEditQty(i,v){ WORK[i].qty=Math.max(0,parseInt(v,10)||0); render(); }
function rmEdit(i){ WORK[i].qty=0; if(WORK[i]._added){WORK.splice(i,1);} render(); }
function toggleAdd(){ if(ADDQ===null){ ADDQ=''; if(!CAT){fetchCat();} } else { ADDQ=null; } render(); }
function fetchCat(){ fetch(CFG.catalogueUrl,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    CAT=((d&&d.products)||[]).map(function(p){return {name:String(p['Product Name']||p.name||''),price:Number(p.Price_UGX||p.price||0),image:String(p.Image||p.image||''),unit:String(p.Unit||'')};}).filter(function(p){return p.name&&p.price>0;});
    if(EDIT&&ADDQ!==null){var el=$('addRes'); if(el)el.innerHTML=addResults();}
  }).catch(function(){CAT=[];}); }
function onAddSearch(v){ ADDQ=v; var el=$('addRes'); if(el)el.innerHTML=addResults(); }
function addResults(){
  if(CAT===null) return '<div class="ares"><span class="an" style="color:var(--muted)">Loading products…</span></div>';
  var q=(ADDQ||'').toLowerCase().trim(); if(!q) return '<div class="ares"><span class="an" style="color:var(--muted)">Type to search your catalogue</span></div>';
  var res=CAT.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0;}).slice(0,20);
  if(!res.length) return '<div class="ares"><span class="an" style="color:var(--muted)">No products match “'+esc(ADDQ)+'”</span></div>';
  return res.map(function(p){return '<div class="ares" onclick="addPick('+JSON.stringify(p.name).replace(/"/g,'&quot;')+')"><span class="an">'+esc(p.name)+'</span><span class="ap">'+money(p.price)+' · Add</span></div>';}).join('');
}
function addPick(name){
  var p=(CAT||[]).filter(function(x){return x.name===name;})[0]; if(!p)return;
  var ex=(WORK||[]).filter(function(w){return w.name===name;})[0];
  if(ex){ ex.qty=(ex.qty||0)+1; if(ex._orig!=null && ex.qty<=0) ex.qty=1; }
  else { WORK.push({name:p.name,qty:1,unit_price:p.price,image:p.image,unit:p.unit,_added:true}); }
  toast(esc(name)+' added','ok'); render();
}
function acceptAlt(forName, altName){
  var it=(Q.items||[]).filter(function(x){return x.name===forName;})[0];
  var qty=it?it.qty:1;
  fetch(CFG.reviseUrl,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({ops:[{op:'remove',name:forName},{op:'add',name:altName,qty:qty}],comment:'Accepted suggested alternative for '+forName})})
    .then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok){ toast('Swapped to '+altName,'ok'); load(); }
      else{ toast(d&&d.error?d.error:'Could not accept','err'); }
    }).catch(function(){ toast('Network error — please try again','err'); });
}
function buildOps(){
  var ops=[], orig={}; (Q.items||[]).forEach(function(it){orig[it.name]=it.qty;});
  (WORK||[]).forEach(function(w){
    if(w._added){ if(w.qty>0) ops.push({op:'add',name:w.name,qty:w.qty}); }
    else { var o=orig[w.name]; if(w.qty<=0) ops.push({op:'remove',name:w.name}); else if(w.qty!==o) ops.push({op:'qty',name:w.name,qty:w.qty}); }
  });
  return ops;
}
function submitEdits(){
  var ops=buildOps(), comment=($('editComment')&&$('editComment').value||'').trim();
  if(!ops.length && !comment){ toast('No changes to send','err'); return; }
  var b=$('sendEditsBtn'); if(b){b.disabled=true;b.textContent='Sending…';}
  fetch(CFG.reviseUrl,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({ops:ops,comment:comment})})
    .then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok){ EDIT=false;WORK=null;ADDQ=null; toast('Quotation updated — Revision '+d.revision,'ok'); load(); }
      else{ toast(d&&d.error?d.error:'Could not update the quotation','err'); if(b){b.disabled=false;b.textContent='Send changes to sales';} }
    }).catch(function(){ toast('Network error — please try again','err'); if(b){b.disabled=false;b.textContent='Send changes to sales';} });
}

function approve(){
  var b=$('approveBtn'); if(b){b.disabled=true;b.textContent='Approving…';}
  fetch(CFG.base+'/q/'+CFG.token+'/approve',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:'{}'})
    .then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok){ toast('Approved — Sales Order '+(d.order_no||'')+' created','ok'); load(); }
      else{ toast(d&&d.error?d.error:'Could not approve right now','err'); if(b){b.disabled=false;b.textContent='✓ Approve Quotation';} }
    }).catch(function(){ toast('Network error — please try again','err'); if(b){b.disabled=false;b.textContent='✓ Approve Quotation';} });
}
function requestChanges(){
  // Q1: route change requests to the sales team on WhatsApp (in-portal editing arrives in the next phase).
  var wa=CFG.waNumber?('https://wa.me/'+CFG.waNumber+'?text='+encodeURIComponent('Hello, I would like to request changes to quotation '+Q.quote_no+': ')):null;
  if(wa) window.open(wa,'_blank','noopener'); else toast('Please contact our sales team to request changes','');
}
var _shareChannel='whatsapp';
function openShare(ch){ _shareChannel=ch; var m=$('shareModal');
  $('shareTitle').textContent = ch==='email'?'Share by Email':'Share on WhatsApp';
  $('shareHint').textContent = ch==='email'?'We’ll email the quotation PDF to this address.':'We’ll send the quotation to this WhatsApp number.';
  var inp=$('shareTo'); inp.type = ch==='email'?'email':'tel';
  inp.placeholder = ch==='email'?'name@company.com':'WhatsApp number (or leave blank for yours)';
  inp.value=''; m.classList.add('show'); setTimeout(function(){inp.focus();},50);
}
function closeShare(){ $('shareModal').classList.remove('show'); }
function doShare(){
  var to=$('shareTo').value.trim(); var b=$('shareSend'); b.disabled=true;b.textContent='Sending…';
  fetch(CFG.base+'/q/'+CFG.token+'/share',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({channel:_shareChannel,to:to})})
    .then(function(r){return r.json();}).then(function(d){
      b.disabled=false;b.textContent='Send';
      if(d&&d.ok){ closeShare(); toast('Quotation sent','ok'); }
      else{ toast(d&&d.error?d.error:'Could not send','err'); }
    }).catch(function(){ b.disabled=false;b.textContent='Send'; toast('Network error','err'); });
}
load();
</script>
</body>
</html>
