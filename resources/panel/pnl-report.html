<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Finance · CloudBSS</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e7eaee;
    --green:#16a34a; --green-soft:#ecfdf3; --red:#dc2626; --amber:#b45309;
    --brand:#0e7c4a; --brand-soft:#e7f5ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:28px;margin:0 0 3px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  .head-r{display:flex;align-items:center;gap:10px}
  .seg{display:inline-flex;background:#eef1f4;border-radius:10px;padding:3px}
  .seg button{border:0;background:transparent;padding:6px 13px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-weight:600;font-size:12.5px}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.warn{background:#fffbeb;color:var(--amber)}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .tile .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:12px}
  .tile .lbl{color:var(--muted);font-size:13px;font-weight:600}
  .tile .val{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
  .tile .foot{color:var(--muted);font-size:12.5px;margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .card h2{font-size:15px;margin:0 0 3px;letter-spacing:-.01em}
  .card .h2sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .chart{height:230px;display:flex;align-items:flex-end;gap:6px;padding-top:10px;position:relative}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
  .barwrap{width:100%;height:190px;display:flex;align-items:flex-end;justify-content:center}
  .bar{width:64%;max-width:34px;background:var(--green);border-radius:5px 5px 2px 2px;transition:opacity .12s;cursor:pointer}
  .bar:hover{opacity:.8}
  .xl{font-size:11px;color:var(--muted);white-space:nowrap}
  .cur-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .cur-row:last-child{border-bottom:0}
  .cur-l{display:flex;align-items:center;gap:11px}
  .chip{font-size:11px;font-weight:800;padding:6px 9px;border-radius:9px;background:var(--brand-soft);color:var(--brand)}
  .cur-v{font-weight:700;font-variant-numeric:tabular-nums}
  .cur-usd{color:var(--muted);font-size:12px}
  .avail{font-size:11px;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:5px}
  .age{margin-bottom:13px}
  .age-top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
  .age-top b{font-weight:700}
  .track{height:9px;border-radius:6px;background:#eef1f4;overflow:hidden}
  .track > i{display:block;height:100%;background:var(--green);border-radius:6px}
  .pl td{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .pl tr:last-child td{border-bottom:0}
  .pl td.r{text-align:right;font-variant-numeric:tabular-nums}
  .pl .strong td{font-weight:700;border-top:2px solid var(--ink);padding-top:11px}
  .tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9;white-space:nowrap}
  .loading{padding:70px;text-align:center;color:var(--muted)}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Finance</h1>
      <div class="sub">Cash position, receivables and payables — from your real cashbook · <span id="today"></span></div>
    </div>
    <div class="head-r">
      <div class="seg" id="curseg"><button data-c="USD" class="on">USD</button><button data-c="UGX">UGX</button><button data-c="SSP">SSP</button></div>
      <div id="reconBadge" class="badge ok"><span class="dot"></span> Loading…</div>
    </div>
  </div>
  <div id="app"><div class="loading">Loading your finance overview…</div></div>
</div>
<div class="tip" id="tip"></div>

<script>
const H={'Accept':'application/json','X-Requested-With':'XMLHttpRequest'};
const get=u=>fetch(u,{credentials:'include',headers:H}).then(r=>r.json()).catch(()=>({ok:false}));
let DATA=null, CUR='USD';

function fmt(usd, cur, rates){
  const v = (usd||0) * (cur==='USD'?1:(rates[cur]||1));
  if(cur==='USD') return '$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  return Math.round(v).toLocaleString()+' '+cur;
}
function render(){
  const d=DATA, cur=CUR, rates=d.rates||{USD:1,UGX:3655,SSP:7000};
  const k=d.kpis, p=d.pnl;
  const tiles=[
    {ic:'💵',bg:'#ecfdf3',lbl:'Cash on hand',val:fmt(k.cash_on_hand,cur,rates),foot:'across all currencies',cls:'pos'},
    {ic:'↗',bg:'#eff6ff',lbl:'Receivable',val:fmt(k.receivable,cur,rates),foot:'owed to you'},
    {ic:'↘',bg:'#fff7ed',lbl:'Payable',val:fmt(k.payable,cur,rates),foot:'you owe',cls:'neg'},
    {ic:'📈',bg:'#f5f3ff',lbl:'Net position',val:fmt(k.net_position,cur,rates),foot:'cash + owed − you owe',cls:k.net_position>=0?'pos':'neg'},
  ];
  const flow=d.cash_flow||[];
  const maxIn=Math.max(1,...flow.map(f=>f.in));
  const bars=flow.map((f,idx)=>`<div class="col"><div class="barwrap"><div class="bar" data-i="${idx}" style="height:${Math.max(2,f.in/maxIn*100)}%"></div></div><div class="xl">${f.label}</div></div>`).join('');
  const ageRows=arr=>arr.filter(a=>a.usd>0||a.bucket==='Current').map(a=>`<div class="age"><div class="age-top"><span>${a.bucket}</span><b>${a.pct}%</b></div><div class="track"><i style="width:${a.pct}%"></i></div></div>`).join('');
  const curCards=(d.cash_by_currency||[]).map(c=>`
    <div class="cur-row"><div class="cur-l"><span class="chip">${c.currency}</span>
      <div><div class="cur-v">${c.currency==='USD'?('$'+c.usd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})):(Math.round(c.native).toLocaleString()+' '+c.currency)}</div>
      <div class="cur-usd">≈ $${c.usd.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div></div>
      <span class="avail"><span class="dot" style="background:var(--green)"></span>Available</span></div>`).join('');

  document.getElementById('app').innerHTML=`
    <div class="tiles">${tiles.map(t=>`<div class="tile"><div class="ic" style="background:${t.bg}">${t.ic}</div><div class="lbl">${t.lbl}</div><div class="val ${t.cls||''}">${t.val}</div><div class="foot">${t.foot}</div></div>`).join('')}</div>
    <div class="grid2">
      <div class="card"><h2>Cash flow</h2><div class="h2sub">Money received per day (${cur==='USD'?'USD':cur})</div><div class="chart" id="chart">${bars||'<div class="xl">No movements yet</div>'}</div></div>
      <div class="card"><h2>Cash by currency</h2><div class="h2sub">What you hold, where</div>${curCards||'<div class="xl">No cash recorded</div>'}</div>
    </div>
    <div class="grid3">
      <div class="card"><h2>Receivables ageing</h2><div class="h2sub">${fmt(k.receivable,cur,rates)} owed to you</div>${ageRows(d.receivables_ageing)}</div>
      <div class="card"><h2>Payables ageing</h2><div class="h2sub">${fmt(k.payable,cur,rates)} you owe</div>${ageRows(d.payables_ageing)}</div>
      <div class="card"><h2>P&amp;L summary</h2><div class="h2sub">Cash basis</div>
        <table class="pl">
          <tr><td>Revenue</td><td class="r">${fmt(p.revenue,cur,rates)}</td></tr>
          <tr><td>Cost of goods</td><td class="r neg">(${fmt(p.cogs,cur,rates)})</td></tr>
          <tr class="strong"><td>Gross profit</td><td class="r pos">${fmt(p.gross_profit,cur,rates)}${p.gross_margin_pct!=null?(' · '+p.gross_margin_pct+'%'):''}</td></tr>
          <tr><td>Operating expenses</td><td class="r neg">(${fmt(p.operating_expenses,cur,rates)})</td></tr>
          <tr class="strong"><td>Operating profit</td><td class="r ${p.operating_profit>=0?'pos':'neg'}">${fmt(p.operating_profit,cur,rates)}</td></tr>
        </table></div>
    </div>`;

  // hover tooltips on bars
  const tip=document.getElementById('tip');
  document.querySelectorAll('.bar').forEach(b=>{
    const f=flow[+b.dataset.i];
    b.addEventListener('mousemove',e=>{tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-10)+'px';
      tip.innerHTML=`<b>${f.label}</b><br>In: ${fmt(f.in,cur,rates)}${f.out?('<br>Out: '+fmt(f.out,cur,rates)):''}`;});
    b.addEventListener('mouseleave',()=>tip.style.opacity=0);
  });
}
(async()=>{
  document.getElementById('today').textContent=new Date().toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  const d=await get('/papi/finance-overview'); const pnl=await get('/papi/cash-pnl');
  if(!d.ok){document.getElementById('app').innerHTML='<div class="card">Could not load — sign in as the owner and try again.</div>';return;}
  DATA=d;
  const rec=(pnl.ok&&pnl.reconciliation)?pnl.reconciliation:null;
  const tie=rec?(rec.reconciles!==false):true;
  const rb=document.getElementById('reconBadge'); rb.className='badge '+(tie?'ok':'warn');
  rb.innerHTML='<span class="dot"></span> '+(tie?'Reconciled to cashbook':'Reconciliation: review');
  render();
  document.querySelectorAll('#curseg button').forEach(btn=>btn.addEventListener('click',()=>{
    CUR=btn.dataset.c; document.querySelectorAll('#curseg button').forEach(b=>b.classList.toggle('on',b===btn)); render();
  }));
})();
</script>
</body>
</html>
