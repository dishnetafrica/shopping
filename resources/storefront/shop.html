<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shop</title>
<style>
  :root{--green:#0C831F;--green-d:#0A6E1A;--ink:#1F1F1F;--muted:#7A7A7A;--line:#ECECEC;--bg:#FFFFFF;--card:#fff;--tile:#EEF2FB;--tileicon:#2E3340;--red:#B4232A;--amber:#C2700A}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:88px}
  a{color:inherit}
  .top{position:sticky;top:0;z-index:30;background:#fff;color:var(--ink);padding:11px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .top .lg{width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
  .top .hback{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:24px;line-height:1;font-weight:700;color:var(--ink);flex:none;display:grid;place-items:center;cursor:pointer;padding:0 0 3px}
  .top .hback:active{background:#f0f2f5}
  .eyebrow{display:block;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--green);margin-top:2px}
  .trust{background:var(--green);color:#fff;display:flex;flex-wrap:wrap;align-items:center;padding:7px 6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .trust span{padding:0 12px;white-space:nowrap;opacity:.96}
  .trust span+span{border-left:1px solid rgba(255,255,255,.25)}
  .top b{font-size:15px;line-height:1.1;display:block}.top .sub{font-size:11px;color:var(--muted)}
  .searchwrap{position:sticky;top:56px;z-index:25;background:var(--bg);padding:10px 12px 8px}
  .delv{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#F1F8F3;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);cursor:pointer}
  .delv .ico{font-size:15px;flex:none}
  .delv .txt{flex:1;font-weight:600;line-height:1.25}
  .delv .chg{color:var(--green-d);font-weight:700;font-size:12px;flex:none}
  .delv .pick{display:flex;gap:6px;flex:none}
  .delv .pick button{border:1px solid var(--green);background:#fff;color:var(--green-d);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .delv.out{background:#FFF4EE}
  .locbtn{width:100%;border:1px solid var(--green);background:#fff;color:var(--green-d);border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
  .locbtn:disabled{opacity:.6}
  .locmsg{font-size:12.5px;margin-top:6px;color:var(--muted)}
  .locmsg.ok{color:var(--green-d);font-weight:600}
  .locmsg a{color:var(--green-d);font-weight:700}
  .search{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;background:#F4F4F6;color:var(--ink);outline:none}
  .search:focus{border-color:var(--green)}
  .section-title{font-size:15px;font-weight:800;padding:6px 14px 8px;color:var(--ink)}
  .menutabs{display:flex;gap:8px;padding:10px 12px 4px;position:sticky;top:0;background:var(--bg,#fff);z-index:3;overflow-x:auto}
  .menutab{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;cursor:pointer}
  .menutab.on{background:var(--green);color:#fff;border-color:var(--green)}
  .subchips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 8px;-webkit-overflow-scrolling:touch}
  .subchips::-webkit-scrollbar{display:none}
  .subchip{flex:none;border:1.5px solid #e6ece8;background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:#56655c;cursor:pointer;white-space:nowrap}
  .subchip.on{border-color:#15803D;background:#f1f9f4;color:#15803D}
  .meta{padding:0 14px 8px;font-size:12px;color:var(--muted)}
  .backbar{display:flex;align-items:center;gap:10px;padding:8px 14px 4px}
  .backbar button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px}
  .backbar b{font-size:15px}
  /* category tiles */
  .catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:0 12px}
  @media(min-width:520px){.catgrid{grid-template-columns:repeat(4,1fr)}}
  .cat{border:0;background:transparent;padding:0;cursor:pointer;text-align:center}
  .cat .ci{background:var(--tile);border-radius:16px;overflow:hidden;border:0;aspect-ratio:1/1;display:grid;place-items:center}
  .cat .ci img{width:100%;height:100%;object-fit:cover}
  .cat .ci .ph{font-size:30px}
  .cat .nm{font-size:11.5px;font-weight:600;margin-top:6px;line-height:1.2}
  /* product cards */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .pc{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;display:flex;flex-direction:column}
  .pc .img{aspect-ratio:1/1;background:#fff;border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden;cursor:pointer}
  .pc .img img{width:100%;height:100%;object-fit:contain;padding:9px}.pc .img .ph{font-size:28px;color:#B9CDBE}
  .pc .bd{padding:8px 9px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
  .pc .nm{font-size:12.5px;font-weight:600;line-height:1.25;min-height:31px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc .pr{font-size:14px;font-weight:800;color:var(--ink)}
  .pc .dsc{font-size:11.5px;line-height:1.35;color:var(--muted);margin:2px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc .add{margin-top:auto;border:1px solid var(--green);background:#fff;color:var(--green);border-radius:9px;padding:8px;font-size:13px;font-weight:800}
  .pc .stp{margin-top:auto;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--green);border-radius:9px;overflow:hidden}
  .pc .stp button{border:0;background:var(--green);color:#fff;width:34px;height:34px;font-size:18px;font-weight:800}
  .pc .stp span{font-weight:800;font-size:14px}
  .pc .vchips{display:flex;gap:5px;flex-wrap:wrap;margin:1px 0 3px}
  .pc .vchip{border:1.4px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
  .pc .vchip.on{border-color:var(--green);background:#EAF7EE;color:var(--green)}
  .pc .unit{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:-2px}
  .pc .packlbl{font-size:10.5px;color:#0B3D22;font-weight:700;background:#eef5ef;border-radius:6px;padding:1px 7px;display:inline-block;margin:2px 0 1px}
  .pc .moqlbl{font-size:10px;color:#a8632a;font-weight:700;margin-top:1px}
  .ci.cifall{background:radial-gradient(120% 95% at 100% 0,#fff,var(--tile));position:relative;overflow:hidden}
  .ci.cifall .mono{position:absolute;right:6px;bottom:-10px;font-size:58px;font-weight:800;line-height:1;color:var(--green);opacity:.16}
  .pc .chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:5px}
  .pc .chip{font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:800;color:var(--green);background:var(--tile);border-radius:5px;padding:2px 6px}
  .pc .opts{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:999px;font-size:9.5px;font-weight:800;color:#7A1F1F;padding:2px 7px;z-index:2}
  .pc.pcoos{opacity:.72}
  .pc .img.oos img{filter:grayscale(.7);opacity:.55}
  .oosbadge{position:absolute;top:6px;left:6px;background:#B4232A;color:#fff;border-radius:999px;font-size:9.5px;font-weight:800;padding:2px 8px;z-index:2}
  .pc .add[disabled]{border-color:var(--line);color:var(--muted);background:#fff;cursor:not-allowed;opacity:1}
  .vrowoos{opacity:.6}
  .voos{flex:none;color:#B4232A;font-weight:800;font-size:13px;white-space:nowrap}
.pc .vsize{font-size:11px;color:var(--muted);font-weight:700;margin-top:-1px}
.pc .add.opt{display:flex;flex-direction:column;align-items:center;line-height:1.05;gap:1px;padding:6px}
.pc .add.opt span{font-size:9.5px;font-weight:800;color:var(--green);opacity:.85}
.vlist{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
.vrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.vth{width:54px;height:54px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.vth img{width:100%;height:100%;object-fit:contain;padding:4px}
.vth .cicon,.vth .ph,.vth span{font-size:22px;color:#B9CDBE}
.vmeta{flex:1}
.vsz{font-weight:700;font-size:14px}
.vpr{font-weight:800;font-size:14px;margin-top:1px}
.vunit{font-weight:600;font-size:11px;color:var(--muted)}
.add.sm{border:1.4px solid var(--green);background:#fff;color:var(--green);border-radius:9px;padding:7px 18px;font-size:13px;font-weight:800;flex:none}
.stp.sm{display:flex;align-items:center;border:1.4px solid var(--green);border-radius:9px;overflow:hidden;flex:none}
.stp.sm button{border:0;background:var(--green);color:#fff;width:30px;height:30px;font-size:16px;font-weight:800}
.stp.sm span{font-weight:800;font-size:13px;min-width:28px;text-align:center}
  .empty{padding:42px 16px;text-align:center;color:var(--muted)}
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--green);color:#fff;display:none;align-items:center;justify-content:space-between;padding:13px 16px;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .cartbar.show{display:flex}
  .cartbar .l{font-size:13px;opacity:.9}.cartbar .n{font-size:16px;font-weight:800}
  .cartbar button{border:0;background:#fff;color:var(--green-d);font-weight:800;border-radius:10px;padding:10px 18px;font-size:14px}
  .sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none}.sheet.show{display:block}
  .sheetcard{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
  .sheethd{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}
  .sheethd b{font-size:16px}.sheethd .x{border:0;background:#F2F6F2;width:32px;height:32px;border-radius:50%;font-size:18px}
  .sheetbody{overflow-y:auto;padding:8px 16px;flex:1}
  .ci2{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #EEF2EE}
  .ci2 .nm{flex:1;font-size:13.5px;font-weight:600}.ci2 .pr{font-size:12px;color:var(--muted)}
  .ci2 .stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ci2 .stp button{border:0;background:#F2F6F2;width:30px;height:30px;font-size:16px;font-weight:800}
  .ci2 .stp span{width:30px;text-align:center;font-weight:700}
  .field{margin:9px 0}.field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;background:#fff;color:var(--ink);outline:none}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--green)}
  .note{font-size:12px;color:var(--muted);background:#F4F7F4;border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:8px 0}
  .totrow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .totrow.g{font-weight:800;font-size:17px;border-top:2px solid var(--ink);margin-top:6px;padding-top:9px}
  .place{width:100%;border:0;background:var(--green);color:#fff;font-weight:800;border-radius:12px;padding:15px;font-size:16px;margin:12px 0 6px}
  .place:disabled{opacity:.6}
  .ok{padding:46px 22px;text-align:center}.ok .big{font-size:46px}.ok h2{margin:12px 0 4px;color:var(--green-d)}.ok p{color:var(--muted);font-size:14px}
  .ok .ono{display:inline-block;margin-top:10px;background:#EAF3EC;color:var(--green-d);font-weight:800;border-radius:10px;padding:9px 16px;font-size:18px}
  #footer{text-align:center;padding:26px 16px 12px;color:var(--muted);font-size:12px;line-height:1.7}
  .faq{display:grid;gap:9px;text-align:left}
  .faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:2px 15px}
  .faq summary{font-weight:700;font-size:14px;padding:13px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:'+';font-size:19px;color:var(--green);font-weight:700;flex:none}
  .faq details[open] summary::after{content:'\2212'}
  .faq .a{padding:0 0 14px;color:#444;font-size:13.5px;line-height:1.55}
  #footer a{color:var(--muted);text-decoration:underline}
  .cicon{display:block}
  .pc .img{position:relative}
  .pc .img img{position:absolute;inset:0}
  .pc .img .cicon{width:52px;height:52px}
  .cat .ci{position:relative}
  .cat .ci .cicon{width:58%;height:58%}
  .mgrp{margin:4px 0 14px}.mgh{font-size:13px;font-weight:800;margin:10px 0 6px}.mgh .req{font-size:11px;color:#C0392B;font-weight:700;margin-left:6px}
  .mopt{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;margin:7px 0;font-size:14px;cursor:pointer}
  .mopt.on{border-color:var(--green);background:#EAF6EF;font-weight:700}

/* product detail overlay */
.detail{position:fixed;inset:0;background:#fff;z-index:60;overflow-y:auto;display:none}
.detail.show{display:block}
.dwrap{max-width:1000px;margin:0 auto;padding:14px 16px 90px}
.dback{border:0;background:none;font-size:16px;font-weight:600;color:var(--ink,#1b211d);padding:8px 0;cursor:pointer}
.uacct{border:1px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;flex:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.uacct:active{background:#f0f2f5}
.uacct svg{width:20px;height:20px}
.dhdr{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.dhdr .dback{border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:24px;font-weight:700;padding:0 0 3px;display:grid;place-items:center;flex:none;color:var(--ink)}
.dhdr .dback:active{background:#f0f2f5}
.dsearch{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:15px;background:#F4F4F6;color:var(--ink);outline:none}
.dhdr .uacct{width:38px;height:38px}
.dload{padding:60px 0;text-align:center;color:var(--muted,#777)}

.dth img{width:100%;height:100%;object-fit:contain}
.dinfo{flex:1 1 300px}

/* ==================================================================================
   STOREFRONT V2 — Premium foundation (Increment 1)
   Additive only: design tokens, skeleton loaders, persistent bottom navigation,
   fly-to-cart + badge motion, reduced-motion + larger touch targets.
   No existing rule is removed; these layer on top.
   ================================================================================== */
:root{
  --radius:12px; --radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 6px 20px rgba(16,24,40,.12);
  --nav-h:60px; --safe-b:env(safe-area-inset-bottom,0px);
}
/* Room for the persistent bottom nav (replaces the old 88px cart-bar allowance). */
body{padding-bottom:calc(var(--nav-h) + 14px + var(--safe-b))}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ---- Skeleton loaders: content-shaped placeholders in <100ms (perceived speed) ---- */
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
@media(min-width:560px){.skgrid{grid-template-columns:1fr 1fr 1fr}}
.sk{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.sk .a{aspect-ratio:1/1;background:#eef0f2}
.sk .b{height:12px;margin:10px 10px 0;border-radius:6px;background:#eef0f2}
.sk .b.w70{width:70%} .sk .b.w45{width:45%} .sk .b.last{margin-bottom:12px}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:sk-sh 1.25s infinite}
@keyframes sk-sh{100%{transform:translateX(100%)}}

/* ---- Persistent bottom navigation (the thumb-zone spine) ---- */
.btmnav{position:fixed;left:0;right:0;bottom:0;z-index:45;height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 12px rgba(16,24,40,.06)}
.btmnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;min-height:44px;position:relative;padding:0}
.btmnav button.on{color:var(--green-d)}
.btmnav button:active{background:#f6f7f9}
.btmnav svg{width:22px;height:22px;stroke-width:2}
.btmnav .nbadge{position:absolute;top:6px;left:calc(50% + 5px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center;display:none}
.btmnav .nbadge.show{display:block}
.btmnav button.bump svg{animation:cart-bump .35s ease}
@keyframes cart-bump{0%,100%{transform:scale(1)}40%{transform:scale(1.3)}}

/* ---- Floating cart CTA now sits ABOVE the nav (grocery-app pattern) ---- */
.cartbar{left:10px;right:10px;bottom:calc(var(--nav-h) + 10px + var(--safe-b));width:auto;border-radius:14px;box-shadow:var(--shadow-md)}

/* ---- Fly-to-cart dot (the dopamine hit; skipped under reduced-motion) ---- */
.flydot{position:fixed;z-index:60;width:16px;height:16px;border-radius:50%;background:var(--green);pointer-events:none;
  box-shadow:var(--shadow-md);transition:transform .55s cubic-bezier(.5,-.35,.35,1.25),opacity .55s ease;will-change:transform,opacity}

/* ---- Accessibility: guarantee thumb-friendly targets + visible focus ---- */
.pc .add,.stp button,.btmnav button,.uacct,.hback{min-height:44px}
.stp button{min-width:36px}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---- V2 product card (Increment 2): price hero · smart badges · wishlist · compare ---- */
.pc .img{position:relative}
.cardbadges{position:absolute;top:6px;left:6px;display:flex;flex-direction:column;gap:4px;z-index:2}
.cbadge{font-size:9.5px;font-weight:800;letter-spacing:.02em;padding:3px 6px;border-radius:6px;color:#fff;line-height:1;text-transform:uppercase}
.cbadge.disc{background:var(--red)} .cbadge.hot{background:var(--green)} .cbadge.new{background:#2563EB}
.cardbtns{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px;z-index:2}
.cardbtns button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;color:#8a8f98;box-shadow:var(--shadow-sm);padding:0}
.cardbtns button svg{width:16px;height:16px}
.cardbtns .wish.on{color:var(--red);border-color:var(--red)} .cardbtns .wish.on svg{fill:var(--red)}
.cardbtns .cmp.on{color:var(--green-d);border-color:var(--green)}
.pc .prrow{display:flex;align-items:baseline;gap:6px;margin-top:3px}
.pc .prrow .pr{font-size:16px;font-weight:800;color:var(--ink)}
.pc .was{font-size:12px;color:var(--muted);text-decoration:line-through}
.pc .lowstk{font-size:11px;font-weight:700;color:var(--amber);margin-top:3px}
.cmpbar{position:fixed;left:10px;right:10px;bottom:calc(var(--nav-h) + 10px + var(--safe-b));z-index:46;background:#111;color:#fff;border-radius:14px;padding:11px 14px;display:none;align-items:center;gap:10px;box-shadow:var(--shadow-md)}
.cmpbar span{flex:1;font-weight:700;font-size:14px}
.cmpbar button{border:0;background:#fff;color:#111;font-weight:800;border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
.cmpbar button.x{background:transparent;color:#fff;padding:8px 6px}
.cmpcols{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.cmpcol{flex:0 0 46%;max-width:46%;border:1px solid var(--line);border-radius:12px;padding:10px}
.cmpcol .cn{font-weight:700;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.cmpcol .cp{font-size:15px;font-weight:800;margin:6px 0}
.cmprow{font-size:12px;color:var(--muted);margin-top:3px}

/* ---- V2 premium search (Increment 3): trigger bar + full-screen overlay ---- */
.searchbar{display:flex;align-items:center;gap:8px;background:#F4F4F6;border:1px solid var(--line);border-radius:12px;padding:0 10px;height:46px;cursor:text}
.searchbar .sicon{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{flex:1;border:0;background:none;font-size:15px;color:var(--ink);outline:none;height:100%;cursor:text}
.searchbar .sqbtn{border:0;background:none;font-size:17px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.soverlay{position:fixed;inset:0;z-index:55;background:#fff;display:none;flex-direction:column}
.soverlay.show{display:flex}
.shdr{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.shdr .sback{border:0;background:none;font-size:26px;line-height:1;color:var(--ink);width:36px;height:44px;cursor:pointer;padding:0}
.shdr .sinput{flex:1;display:flex;align-items:center;gap:8px;background:#F4F4F6;border-radius:12px;padding:0 12px;height:44px}
.shdr .sinput svg{width:18px;height:18px;color:var(--muted);flex:none}
.shdr .sinput input{flex:1;border:0;background:none;font-size:15px;outline:none;color:var(--ink)}
.shdr .sic{border:1px solid var(--line);background:#fff;border-radius:10px;height:44px;min-width:42px;display:grid;place-items:center;color:var(--green-d);cursor:pointer;font-size:17px;flex:none}
.sbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 0 24px}
.sgroup{padding:14px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.srow{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer}
.srow:active{background:#f6f7f9}
.srow .sthumb{width:40px;height:40px;border-radius:8px;background:var(--tile);display:grid;place-items:center;flex:none;overflow:hidden;font-size:19px}
.srow .sthumb img{width:100%;height:100%;object-fit:cover}
.srow .sthumb svg{width:22px;height:22px}
.srow .smeta{flex:1;min-width:0}
.srow .st{font-size:14px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .ss{font-size:12px;color:var(--muted)}
.srow .sadd{border:1px solid var(--green);color:var(--green);background:#fff;border-radius:9px;padding:8px 15px;font-weight:800;font-size:13px;flex:none;min-height:40px}
.schips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 14px}
.schip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.szero{text-align:center;padding:34px 22px;color:var(--muted);font-size:14px;line-height:1.5}
.szero .wa{display:inline-block;margin-top:14px;background:var(--green);color:#fff;border-radius:10px;padding:12px 18px;font-weight:800;text-decoration:none}

/* ---- V2 toast (success/info feedback; also fixes previously-undefined toast() calls) ---- */
.cbtoast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px + var(--safe-b));transform:translateX(-50%) translateY(10px);
  background:#111;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:70;opacity:0;
  pointer-events:none;transition:opacity .25s,transform .25s;max-width:88%;text-align:center;box-shadow:var(--shadow-md)}
.cbtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- V2 category filters & sort (Increment 4) ---- */
.filterbar{position:sticky;top:120px;z-index:22;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:9px 12px;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.filterbar::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;min-height:38px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.fchip.on{border-color:var(--green);background:#f1f9f4;color:var(--green-d)}
.fcount{background:var(--green);color:#fff;border-radius:999px;min-width:18px;height:18px;font-size:11px;display:inline-grid;place-items:center;padding:0 4px;font-weight:800}
.brandstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 8px;-webkit-overflow-scrolling:touch}
.brandstrip::-webkit-scrollbar{display:none}
.brandchip{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.brandchip.on{border-color:var(--green);background:#f1f9f4;color:var(--green-d)}
.fsec{border-bottom:1px solid var(--line);padding:12px 0}
.fsh{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:8px}
.frow{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:14.5px;cursor:pointer}
.frow input{width:20px;height:20px}

/* ---- V2 cart drawer (Increment 5) ---- */
.cartlines{padding:2px 0}
.cline{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.cline .cthumb{width:46px;height:46px;border-radius:10px;background:var(--tile);display:grid;place-items:center;flex:none;overflow:hidden;font-size:20px}
.cline .cthumb img{width:100%;height:100%;object-fit:cover}
.cline .cthumb svg{width:24px;height:24px}
.cline .cmeta{flex:1;min-width:0}
.cline .cnm{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cline .cpr{font-size:12px;color:var(--muted);margin-top:2px}
.cline .cright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.cline .clsub{font-size:14px;font-weight:800}
.freebar{background:#F1F8F3;border:1px solid #DDEEE1;border-radius:12px;padding:10px 12px;margin:12px 0}
.freebar.done{color:var(--green-d);font-weight:700;text-align:center}
.freebar .ft{font-size:13px;font-weight:600;margin-bottom:7px}
.freebar .fprog{height:7px;border-radius:99px;background:#e5efe8;overflow:hidden}
.freebar .fprog>div{height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.xsell{margin:14px 0 6px}
.xsh{font-size:13px;font-weight:800;margin-bottom:8px}
.xrow{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.xrow::-webkit-scrollbar{display:none}
.xcard{flex:0 0 120px;max-width:120px;border:1px solid var(--line);border-radius:12px;padding:8px}
.xcard .xthumb{aspect-ratio:1/1;border-radius:8px;background:var(--tile);display:grid;place-items:center;overflow:hidden;font-size:24px;cursor:pointer}
.xcard .xthumb img{width:100%;height:100%;object-fit:cover}
.xcard .xnm{font-size:12px;font-weight:600;line-height:1.25;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.xcard .xpr{font-size:13px;font-weight:800;margin:3px 0 6px}
.xcard .xadd{width:100%;border:1px solid var(--green);color:var(--green);background:#fff;border-radius:8px;padding:8px;font-weight:800;font-size:12px;cursor:pointer;min-height:38px}
.billbox{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.billrow{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:5px 0;color:var(--ink)}
.billrow .mut{color:var(--muted);font-weight:600;font-size:13px;max-width:60%;text-align:right}
.billrow.save{color:var(--green-d);font-weight:700}
.billrow.tot{font-size:16px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.billrow.tot .plusdel{font-size:12px;font-weight:600;color:var(--muted)}
.trustrow{font-size:12px;color:var(--muted);text-align:center;padding:12px 4px 8px;line-height:1.7}
.cartfoot{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;border-top:1px solid var(--line)}
.cartfoot .place{width:100%}

/* ---- V2 checkout (Increment 6) ---- */
.cosec{padding:6px 0 12px;border-bottom:1px solid var(--line)}
.cosh{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 0 9px}
.cosum{background:#F6F7F9;border-radius:12px;padding:13px;position:relative}
.cosum-t{font-weight:700;font-size:14px;padding-right:52px}
.cosum-s{font-size:13px;color:var(--muted);margin-top:3px;padding-right:52px}
.cosum-e{position:absolute;top:11px;right:11px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--green-d);cursor:pointer}
.paytiles{display:flex;flex-direction:column;gap:8px}
.paytile{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;min-height:48px}
.paytile.on{border-color:var(--green);background:#f1f9f4;color:var(--green-d)}
.colink{border:0;background:none;color:var(--green-d);font-weight:700;font-size:13.5px;cursor:pointer;padding:9px 2px;display:block}
/* success */
.ok2{text-align:center;padding:22px 12px 8px}
.ok2 .okcheck{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;font-size:40px;display:grid;place-items:center;margin:6px auto 14px;animation:okpop .45s cubic-bezier(.2,.8,.3,1.4)}
@keyframes okpop{0%{transform:scale(0)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.ok2 h2{margin:0;font-size:20px}
.ok2 .okno{font-weight:800;font-size:15px;color:var(--green-d);margin-top:6px;letter-spacing:.02em}
.ok2 .okmsg{color:var(--muted);font-size:13.5px;line-height:1.55;margin:10px 16px 0}

/* ---- V2 motion & polish (Increment 7) — all gated on no-reduced-motion ---- */
@media (prefers-reduced-motion: no-preference){
  .sheet.show .sheetcard{animation:sheetUp .28s cubic-bezier(.2,.8,.2,1)}
  .soverlay.show{animation:ovfade .2s ease}
  #detail.show{animation:ovfade .22s ease}
  .pc .img img{animation:imgin .4s ease}
}
@keyframes sheetUp{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes ovfade{from{opacity:0}to{opacity:1}}
@keyframes imgin{from{opacity:.25}to{opacity:1}}
.cbtoast.err{background:#B4232A}
.cbtoast.ok{background:var(--green)}

/* ==================================================================================
   STOREFRONT V3 — Premium polish layer (last in the cascade; refines every component)
   Depth · typography · spacing · elevation · tactile feedback · signature touches.
   Pure presentation. No structural or logic change.
   ================================================================================== */
:root{ --bg:#F4F5F7; --card:#FFFFFF; --line:#EAECEF; --ink:#16181D; --muted:#6B7280;
  --shadow-card:0 1px 2px rgba(16,24,40,.05); --shadow-lift:0 8px 24px rgba(16,24,40,.10); }
html{ -webkit-text-size-adjust:100% }
body{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; letter-spacing:-.005em }
/* surfaces that must stay white on the new gray app background */
.top,.btmnav,.sheetcard,.soverlay,.searchbar{ background:#fff }

/* ---- Header ---- */
.top{ padding:12px 14px; border-bottom:0; box-shadow:0 1px 0 rgba(16,24,40,.05) }
.top .lg{ border-radius:11px; box-shadow:0 2px 6px rgba(12,131,31,.25) }
.top b{ letter-spacing:-.01em }

/* ---- Search bar ---- */
.searchbar{ height:48px; border-color:#E3E6EA; box-shadow:0 1px 2px rgba(16,24,40,.03) }
.searchbar input::placeholder{ color:#9AA1AB }

/* ---- Section titles ---- */
.section-title{ font-size:16px; font-weight:800; letter-spacing:-.02em; padding:16px 14px 9px }
.sgroup{ letter-spacing:.06em }

/* ---- Category tiles ---- */
.cat .ci{ border-radius:18px; box-shadow:var(--shadow-card) }
.cat .nm{ font-size:12px; font-weight:600; color:#374151 }

/* ---- Product cards ---- */
.pc{ border:1px solid #EEF0F3; border-radius:16px; box-shadow:var(--shadow-card); transition:box-shadow .2s ease }
.pc .img{ background:linear-gradient(180deg,#FBFCFD,#F2F4F7); border-bottom:0; transition:transform .12s ease }
.pc .img:active{ transform:scale(.98) }
.pc .bd{ padding:9px 10px 11px; gap:5px }
.pc .nm{ font-size:12.5px; font-weight:600; color:#1F2937; letter-spacing:-.005em }
.pc .prrow .pr,.pc .pr{ font-size:17px; font-weight:800; letter-spacing:-.02em }
.pc .add{ margin-top:auto; border:1.5px solid var(--green); background:#fff; color:var(--green-d);
  text-transform:uppercase; letter-spacing:.04em; font-size:12.5px; font-weight:800; border-radius:11px;
  padding:9px; transition:transform .1s ease, background .15s ease }
.pc .add:active{ transform:scale(.95); background:#EAF7EE }
.pc .stp{ border:1.5px solid var(--green); border-radius:11px }
.pc .stp button{ width:36px; height:36px; transition:background .12s ease }
.pc .stp button:active{ background:var(--green-d) }
@media(hover:hover){ .pc:hover{ box-shadow:var(--shadow-lift) } .pc:hover .img{ transform:scale(1.02) } }

/* ---- Home rail cards keep the same premium card ---- */
.xcard,.cmpcol{ box-shadow:var(--shadow-card); border-color:#EEF0F3 }

/* ---- Buttons ---- */
.place{ border-radius:13px; font-size:15px; letter-spacing:.01em; box-shadow:0 3px 10px rgba(12,131,31,.22);
  transition:transform .1s ease, box-shadow .2s ease; min-height:50px }
.place:active{ transform:scale(.985) }
button{ -webkit-tap-highlight-color:transparent }

/* ---- Bottom navigation: active indicator + weight ---- */
.btmnav{ box-shadow:0 -1px 0 rgba(16,24,40,.05) }
.btmnav button{ transition:color .15s ease }
.btmnav button.on{ font-weight:800 }
.btmnav button.on::before{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:26px; height:3px; border-radius:0 0 4px 4px; background:var(--green) }
.btmnav button svg{ transition:transform .12s ease }
.btmnav button:active svg{ transform:scale(.88) }

/* ---- Bottom sheet: grabber handle + softer backdrop ---- */
.sheet{ background:rgba(16,24,40,.48) }
@supports (backdrop-filter:blur(2px)){ .sheet{ backdrop-filter:blur(3px) } }
.sheetcard{ border-radius:22px 22px 0 0; box-shadow:0 -8px 30px rgba(16,24,40,.16) }
.sheethd{ position:relative; padding-top:19px }
.sheethd::before{ content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:38px; height:4px; border-radius:99px; background:#DCE0E6 }
.sheethd b{ font-size:17px; letter-spacing:-.01em }
.sheethd .x{ width:34px; height:34px; border-radius:50%; background:#F2F4F7; border:0; font-size:20px; color:#4B5563 }

/* ---- Floating cart CTA: premium lift ---- */
.cartbar{ box-shadow:0 8px 24px rgba(12,131,31,.30); border-radius:16px }

/* ---- Chips / filters: crisper ---- */
.fchip,.schip,.brandchip,.subchip{ box-shadow:0 1px 1px rgba(16,24,40,.03) }
.paytile{ box-shadow:var(--shadow-card) }

/* ---- Skeleton: softer, calmer ---- */
.sk{ border-color:#EEF0F3 } .sk .a,.sk .b{ background:#EEF1F4 }

/* ---- Delivery bar ---- */
.delv{ background:#F0F7F2; border-bottom:0; box-shadow:0 1px 0 rgba(16,24,40,.04); font-weight:600 }

/* ---- Empty states ---- */
.empty{ color:#8A909A; font-size:14px }

/* ==================================================================================
   STOREFRONT V3 — Product detail + variant picker + modifiers, brought to the system
   ================================================================================== */
/* Detail header (its own sticky search) */
.dhdr{ border-bottom:0; box-shadow:0 1px 0 rgba(16,24,40,.05); padding:9px 0 11px }
.dhdr .dback{ border-color:var(--line); border-radius:11px; width:40px; height:44px }
.dhdr .dsearch{ height:44px; background:#F4F5F7; border:1px solid #E3E6EA; border-radius:12px; padding:0 14px; font-size:15px }
/* Gallery */
.dgal>img,.dnoimg{ background:linear-gradient(180deg,#FBFCFD,#F2F4F7); border:1px solid #EEF0F3; border-radius:18px }
.dth{ border-color:#E5E8EC; border-radius:11px; background:linear-gradient(180deg,#FBFCFD,#F2F4F7) }
.dth.on{ border-color:var(--green); border-width:2px }
/* Info */
.dcat{ color:var(--muted); letter-spacing:.06em; font-weight:700; font-size:11.5px }
.dname{ font-size:21px; font-weight:800; letter-spacing:-.02em; margin:6px 0 8px }
.dprice{ font-size:26px; font-weight:800; letter-spacing:-.02em }
.doff{ background:#EAF7EE; color:var(--green-d); font-weight:800 }
/* Buy controls (also used in the sticky bar) */
.dstepwrap{ margin:0 }
.dadd{ background:var(--green); border-radius:13px; font-weight:800; box-shadow:0 3px 10px rgba(12,131,31,.24); transition:transform .1s ease }
.dadd:active{ transform:scale(.97) }
.dstp{ border:1.5px solid var(--green); border-radius:13px }
.dstp button{ transition:background .12s ease } .dstp button:active{ background:var(--green-d) }
/* Sticky bottom buy bar (premium PDP pattern) */
.dbuybar{ position:fixed; left:0; right:0; bottom:0; z-index:6; background:#fff; border-top:1px solid var(--line);
  box-shadow:0 -6px 22px rgba(16,24,40,.10); display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)) }
.dbuybar .dbp{ font-size:21px; font-weight:800; letter-spacing:-.02em } .dbuybar .dbsub{ font-size:12px; color:var(--muted) }
.dbuybar #dstepwrap{ flex:none }
/* Sections + reco rails */
.dsec{ border-top-color:var(--line); margin-top:24px } .dsech{ font-size:16px; font-weight:800; letter-spacing:-.01em }
.dtext{ color:#4B5563 }
.dwrow{ border-top-color:#F1F3F5 } .dwico{ background:#EAF7EE; color:var(--green-d) }
.drailh{ font-size:16px; font-weight:800; letter-spacing:-.01em }
.rcard{ border:1px solid #EEF0F3; border-radius:14px; box-shadow:var(--shadow-card); transition:box-shadow .2s,transform .12s }
.rcard:active{ transform:scale(.98) } @media(hover:hover){ .rcard:hover{ box-shadow:var(--shadow-lift) } }

/* Variant picker sheet */
.vlist{ gap:10px } .vrow{ border:1px solid #EEF0F3; border-radius:14px; box-shadow:var(--shadow-card); padding:10px 12px }
.vth{ background:linear-gradient(180deg,#FBFCFD,#F2F4F7); border-color:#EEF0F3; border-radius:12px }
.vsz{ font-weight:700 } .vpr{ font-weight:800; letter-spacing:-.01em }
.stp.sm{ border-width:1.5px; border-radius:11px } .stp.sm button{ width:34px; height:34px; transition:background .12s } .stp.sm button:active{ background:var(--green-d) }
.add.sm{ border:1.5px solid var(--green); background:#fff; color:var(--green-d); text-transform:uppercase; letter-spacing:.03em; font-weight:800; border-radius:10px; padding:8px 14px; min-height:38px }

/* Modifier (customize) sheet */
.mgrp{ margin-bottom:14px } .mgh{ font-size:14px; font-weight:800; letter-spacing:-.01em; margin-bottom:8px }
.mgh .req{ font-size:11px; font-weight:700; color:#B4232A; background:#FDECEC; border-radius:6px; padding:2px 7px; text-transform:uppercase; letter-spacing:.03em }
.mopt{ display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; font-size:14.5px; cursor:pointer; box-shadow:var(--shadow-card) }
.mopt.on{ border-color:var(--green); background:#F1F9F4; color:var(--green-d) }

<script>
/* ====================== CONFIG (injected per shop by the server) ====================== */
window.SHOP = __SHOP_CONFIG__;
var SHOP = window.SHOP || {};
/* Vertical-driven storefront mode. 'snacks' = advance-booking pickup (no delivery). */
var VERTICAL  = SHOP.vertical || 'grocery';
var IS_PICKUP = (VERTICAL === 'snacks');
function applyVertical(){
  if(!IS_PICKUP) return;                       // grocery/restaurant: unchanged
  var bar=document.getElementById('delvBar'); if(bar) bar.style.display='none';
  var sub=document.getElementById('hdrSub');   if(sub) sub.textContent='Order ahead \u00B7 collect on WhatsApp';
}
applyVertical();
/* ---- per-tenant theme: accent colour, copy, eyebrow, trust strip (all optional) ---- */
var THEME = SHOP.theme || {};
function applyTheme(){
  var root=document.documentElement.style;
  if(THEME.accent)     root.setProperty('--green', THEME.accent);
  if(THEME.accentDark) root.setProperty('--green-d', THEME.accentDark);
  var q=document.getElementById('q');           if(q && THEME.searchHint) q.placeholder=THEME.searchHint;
  var sub=document.getElementById('hdrSub');     if(sub && THEME.tagline) sub.textContent=THEME.tagline;
  var eb=document.getElementById('hdrEyebrow');  if(eb && THEME.eyebrow){eb.textContent=THEME.eyebrow;eb.style.display='block';}
  var ts=document.getElementById('trustStrip');
  if(ts && THEME.trustLine){
    ts.innerHTML=String(THEME.trustLine).split('·').map(function(s){return '<span>'+esc(s.trim())+'</span>';}).join('');
    ts.style.display='flex';
  }
}
applyTheme();
var CUR  = SHOP.currency || 'UGX';
var CATALOGUE_URL = SHOP.catalogueUrl || (location.pathname.replace(/\/+$/,'') + '/catalogue');
var SUBMIT_URL    = SHOP.orderUrl     || (location.pathname.replace(/\/+$/,'') + '/order');
var EVENT_URL     = (SUBMIT_URL||'').replace(/\/order$/,'/event');
var ADMIN_URL     = SHOP.panelUrl     || '/panel';
/* Fire-and-forget storefront analytics → product_events (powers the Trending rail + BI). */
var VIEWED_SESS={}, TRENDING=[];
function track(ev,id){ try{
  var body; if(Array.isArray(id)){ if(!id.length)return; body={event:ev,product_ids:id}; } else { if(id==null)return; id=Number(id); if(!id)return; body={event:ev,product_id:id}; }
  fetch(EVENT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).catch(function(){});
}catch(e){} }
function trackView(id){ id=Number(id); if(!id||VIEWED_SESS[id])return; VIEWED_SESS[id]=1; track('view',id); }
var WA_NUMBER     = String(SHOP.waNumber || '').replace(/[^0-9]/g,''); // shop's public WhatsApp (digits only)
/* ---- delivery time bands (overridden by the feed's settings when provided) ---- */
var DELIVERY = Object.assign({
  near_km:4,  near:'Delivery in ~30 min',
  mid_km:10,  mid:'Delivery in ~1–2 hrs',
  max_km:25,  far:'Same-day delivery',
  out:'Message us to check delivery to your area'
}, SHOP.delivery || {});
var BRANCHES = (SHOP.branches && SHOP.branches.length)
  ? SHOP.branches.map(function(b){return {name:String(b.name||'Store'),lat:Number(b.lat),lng:Number(b.lng)};}).filter(function(b){return isFinite(b.lat)&&isFinite(b.lng);})
  : [{name:(SHOP.city||'Our store'), lat:0.3476, lng:32.5825}];
var DELV = null;                               // current detected delivery state
var GEO  = null;                               // captured delivery GPS pin {lat,lng}
/* ===================================================================================== */

var $=function(id){return document.getElementById(id);};
var PRODUCTS=[], CATS=[], CART={}, CAT='all', Q='', CAT_IMG={}, THALI=null, VSEL={}, GROUPS={}, CATGROUPS={}, MENUTAB='';
var TINTS=['#EEF2FB','#FDEEF3','#EAF6EF','#FFF4E6','#F1EEFB','#E9F5F9','#FCEEEA','#EEF7F0'];
var STORE_KEY='cb_cart_'+(SHOP.slug||'shop'), DELV_KEY='cb_delv_'+(SHOP.slug||'shop');
var CUST_KEY='cb_cust_'+(SHOP.slug||'shop'), LAST_KEY='cb_last_'+(SHOP.slug||'shop');
var CUST=null, LASTORDER=null;
var AUTH_KEY='cb_tok_'+(SHOP.slug||'shop'), AUTHTOK=null, MYORDERS=null, MYSTMT=null;
function loadCust(){loadWMode();loadRecent();try{CUST=JSON.parse(localStorage.getItem(CUST_KEY)||'null');}catch(e){CUST=null;} try{LASTORDER=JSON.parse(localStorage.getItem(LAST_KEY)||'null');}catch(e){LASTORDER=null;} try{AUTHTOK=localStorage.getItem(AUTH_KEY)||null;}catch(e){AUTHTOK=null;} if(AUTHTOK)loadMyOrders();}
function saveCust(c){CUST=c;try{localStorage.setItem(CUST_KEY,JSON.stringify(c));}catch(e){}}
function saveLast(items){LASTORDER={items:items,at:Date.now()};try{localStorage.setItem(LAST_KEY,JSON.stringify(LASTORDER));}catch(e){}}
function forgetCust(){CUST=null;try{localStorage.removeItem(CUST_KEY);}catch(e){} render();}
/* --- Segment-aware storefront (Phase 1): buyer mode + wholesale/carton face + credit ------- */
var BUYER={mode:'retail',segment:null,credit:null};
var WMODE_KEY='cb_wmode_'+(SHOP.slug||'shop'), WMODE=false, WMODE_SET=false;
function loadWMode(){try{var v=localStorage.getItem(WMODE_KEY);if(v==='1'){WMODE=true;WMODE_SET=true;}else if(v==='0'){WMODE=false;WMODE_SET=true;}}catch(e){} if(!WMODE_SET&&/(^|[?&])mode=wholesale/.test(location.search)){WMODE=true;}}
function isWholesaleBuyer(){return BUYER.mode==='wholesale'||BUYER.mode==='institutional';}
function applyBuyer(b){ if(!b||typeof b!=='object')return; BUYER={mode:b.mode||'retail',segment:b.segment||null,credit:b.credit||null}; if(!WMODE_SET&&isWholesaleBuyer())WMODE=true; }
function setWMode(on){WMODE=!!on;WMODE_SET=true;try{localStorage.setItem(WMODE_KEY,WMODE?'1':'0');}catch(e){}render();try{bar();}catch(e){}}
function wsBar(){
  if(!(isWholesaleBuyer()||WMODE))return '';
  var cr=BUYER.credit,credit='';
  if(cr&&cr.limit){credit=' &middot; Credit '+esc(cr.currency||'')+' '+(Number(cr.available||0)).toLocaleString('en-US')+'/'+(Number(cr.limit||0)).toLocaleString('en-US')+(cr.canSell===false?' <b style="color:#ffd2cc">(over limit)</b>':'');}
  return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:'+(WMODE?'#0C2C6B':'#eef2fb')+';color:'+(WMODE?'#fff':'#103A8C')+';border-radius:12px;padding:9px 12px;margin:4px 0 10px;font-size:13px">'+
    '<div><b>'+(WMODE?'Wholesale / carton pricing':'Retail pricing')+'</b>'+(BUYER.segment?(' &middot; '+esc(BUYER.segment)):'')+credit+'</div>'+
    '<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600"><input type="checkbox"'+(WMODE?' checked':'')+' onchange="setWMode(this.checked)" style="width:16px;height:16px"> Wholesale</label>'+
    '</div>';
}
function creditOptionHtml(){ return (isWholesaleBuyer()&&BUYER.credit&&BUYER.credit.limit)?'<option>Credit (account)</option>':''; }
/* --- Self-updating home rails: Buy Again · Recently Viewed · Popular · New Arrivals --------- */
var BUYAGAIN=[];
var RECENT_KEY='cb_recent_'+(SHOP.slug||'shop'), RECENT=[];
function loadRecent(){try{RECENT=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]')||[];}catch(e){RECENT=[];}}
function pushRecent(id){ if(id==null)return; id=Number(id); if(!id)return; RECENT=RECENT.filter(function(x){return x!==id;}); RECENT.unshift(id); RECENT=RECENT.slice(0,20); try{localStorage.setItem(RECENT_KEY,JSON.stringify(RECENT));}catch(e){} }
function sellableRail(p){ return p && !p.poa && !oosOf(p); }
/* One horizontal, swipeable strip of product cards under a section title. Empty items → nothing. */
function railHtml(title,items){
  if(!items||!items.length) return '';
  items=items.slice(0,12);
  var cards=items.map(function(p){return '<div style="flex:0 0 152px;max-width:152px">'+prodCard(p)+'</div>';}).join('');
  return '<div class="section-title">'+esc(title)+'</div>'+
    '<div style="display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 12px;margin-bottom:4px">'+cards+'</div>';
}
function buyAgainRail(){
  if(!AUTHTOK || !BUYAGAIN || !BUYAGAIN.length || !PRODUCTS.length) return '';
  var seen={}, items=[];
  BUYAGAIN.forEach(function(b){
    var p=null;
    if(b.id!=null) p=PRODUCTS.find(function(x){return x.id===b.id;});
    if(!p && b.name) p=prod(b.name);
    if(p && !seen[p.name]){ seen[p.name]=1; items.push(p); }
  });
  return railHtml('Buy again', items);
}
function recentlyViewedRail(){
  if(!PRODUCTS.length || !RECENT.length) return '';
  var items=[]; RECENT.forEach(function(id){ var p=PRODUCTS.find(function(x){return x.id===id;}); if(sellableRail(p)) items.push(p); });
  return items.length>=3 ? railHtml('Recently viewed', items) : '';
}
function popularRail(){
  if(!PRODUCTS.length) return '';
  var pool=PRODUCTS.filter(sellableRail).filter(function(p){return (p.popularity||0)>0;});
  if(pool.length<4) return '';
  pool=pool.slice().sort(function(a,b){return (b.popularity||0)-(a.popularity||0);});
  return railHtml('Popular right now', pool);
}
function newArrivalsRail(){
  if(!PRODUCTS.length) return '';
  var pool=PRODUCTS.filter(sellableRail).slice().sort(function(a,b){return (b.createdAt||b.id||0)-(a.createdAt||a.id||0);});
  return pool.length>=4 ? railHtml('New arrivals', pool) : '';
}
function trendingRail(){
  if(!PRODUCTS.length || !TRENDING.length) return '';
  var items=[]; TRENDING.forEach(function(id){ var p=PRODUCTS.find(function(x){return x.id===id;}); if(sellableRail(p)) items.push(p); });
  return items.length>=3 ? railHtml('Trending today', items) : '';
}
function homeRails(){ return buyAgainRail()+recentlyViewedRail()+trendingRail()+popularRail()+newArrivalsRail(); }
/* Currency-aware price format. Zero-decimal currencies (UGX/SSP/…) stay whole; USD/EUR keep 2
   and use the $ symbol. Output is byte-identical to before for a UGX shop; correct for others. */
function ugx(n){ n=Number(n)||0; var cur=String(CUR||'UGX').toUpperCase();
  var zero=['UGX','KES','TZS','RWF','BIF','SSP','JPY','KRW','VND','XAF','XOF','GNF','MGA','CLP','PYG','ISK','KMF','XPF'];
  var d=zero.indexOf(cur)>=0?0:2;
  var s=n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  return cur==='USD' ? ('$'+s) : (CUR+' '+s); }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jk(s){return JSON.stringify(String(s)).replace(/"/g,'&quot;');}
function num(v){return Number(String(v==null?'':v).replace(/[^0-9.]/g,''))||0;}
function qp(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}

function mapProduct(row){
  var pn=String(row['Product Name']||''), v=String(row.Variant||'').trim();
  return {id:(row._row!=null?row._row:(row.id!=null?row.id:null)), name:v?pn+' '+v:pn, brand:String(row.Brand||''), category:String(row.Category||'Other'),
    desc:String(row.Description||'').trim(),
    keywords:String(row.Keywords||''), price:num(row.Price_UGX), poa:!(num(row.Price_UGX)>0),
    stock:(row.Stock===null||row.Stock===undefined||row.Stock==='')?null:num(row.Stock),
    modifiers:Array.isArray(row.Modifiers)?row.Modifiers:[],
    moq:(row.MOQ===null||row.MOQ===undefined||row.MOQ==='')?1:Math.max(1,parseInt(row.MOQ,10)||1),
    packSize:(row.PackSize===null||row.PackSize===undefined||row.PackSize==='')?0:(parseInt(row.PackSize,10)||0),
    unit:String(row.Unit||'').trim(),
    popularity:num(row.Popularity), createdAt:Number(row.Created)||0,
    image:String(row.Image||row.Photo||row.Image_URL||row['Image URL']||'')};
}

async function load(){
  try{
    var r=await fetch(CATALOGUE_URL,{cache:'no-store'});
    var d=await r.json();
    PRODUCTS=(Array.isArray(d.products)?d.products:[]).map(mapProduct).filter(function(p){return p.name && (p.price>0 || p.poa);});
    _popThresh=null;   // recompute bestseller threshold for the fresh catalogue
    if(d.settings){var ph=String(d.settings.waNumber||d.settings.storePhone||'').replace(/[^0-9]/g,'');if(ph)WA_NUMBER=ph;
      if(d.settings.currency)CUR=String(d.settings.currency);
      if(d.settings.category_images)CAT_IMG=d.settings.category_images||{}; if(d.settings.thali)THALI=d.settings.thali;
      if(d.settings.category_groups)CATGROUPS=d.settings.category_groups||{};
      if(d.settings.trending)TRENDING=(d.settings.trending||[]).map(Number);
      var faqCustom=(Array.isArray(d.settings.faq)&&d.settings.faq.length);
      if(faqCustom)FAQ_DATA=d.settings.faq;
      if(d.settings.vertical){VERTICAL=String(d.settings.vertical);IS_PICKUP=(VERTICAL==='snacks');applyVertical();}
      if(!faqCustom&&VERTICAL==='restaurant')FAQ_DATA=FAQ_RESTAURANT;}
    if(Array.isArray(d.branches)&&d.branches.length){
      var bs=d.branches.map(function(b){return {name:String(b.name||b.title||'Branch'),lat:Number(b.lat),lng:Number(b.lng)};}).filter(function(b){return isFinite(b.lat)&&isFinite(b.lng);});
      if(bs.length)BRANCHES=bs;
    }
    if(d.settings&&d.settings.delivery){var dl=d.settings.delivery;
      ['near_km','mid_km','max_km'].forEach(function(k){if(dl[k]!=null&&isFinite(Number(dl[k])))DELIVERY[k]=Number(dl[k]);});
      ['near','mid','far','out'].forEach(function(k){if(dl[k]!=null)DELIVERY[k]=String(dl[k]);});
    }
    var map={};
    PRODUCTS.forEach(function(p){ var c=p.category||'Other'; if(!map[c])map[c]={name:c,img:'',count:0}; map[c].count++; if(!map[c].img&&p.image)map[c].img=p.image; });
    CATS=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.count-a.count;});
    render();
    applyQuickOrder();
    handleHash();
  }catch(e){
    $('content').innerHTML='<div class="empty">Couldn’t load the catalogue.<br>Please try again shortly.</div>';
  }
}

function setCat(c){CAT=c;Q='';if($('q'))$('q').value='';_catShown=24;render();window.scrollTo(0,0);}
/* Deep-link from the brand site: ?add=<product> drops it in the cart (MOQ-aware) & opens checkout;
   ?cat=<category> jumps straight to that aisle. URL is cleaned so a refresh won't re-add. */
function applyQuickOrder(){
  try{
    var sp=new URLSearchParams(location.search||'');
    var add=sp.get('add'), cat=sp.get('cat');
    if(add){
      var p=prod(add)||PRODUCTS.filter(function(x){return x.name.toLowerCase()===add.toLowerCase();})[0];
      if(p){inc(p.name);openCart();}
    }else if(cat){
      var m=CATS.filter(function(c){return c.name.toLowerCase()===String(cat).toLowerCase();})[0];
      setCat(m?m.name:cat);
    }
    if((add||cat)&&window.history&&history.replaceState)history.replaceState(null,'',location.pathname);
  }catch(e){}
}

function _srow(p){ var add=oosOf(p)?'':('<button class="sadd" onclick="event.stopPropagation();cartAdd('+jk(p.name)+')">Add</button>');

function searchRender(q){
  q=(q||'').trim(); var b=$('sqBody'); if(!b)return;
  if(q.length<1){ b.innerHTML=searchDefault(); return; }
  var ql=q.toLowerCase(), seenB={}, brands=[], seenC={}, cats=[];
  PRODUCTS.forEach(function(p){
    var br=p.brand||''; if(br && br.toLowerCase().indexOf(ql)>=0 && !seenB[br.toLowerCase()]){ seenB[br.toLowerCase()]=1; brands.push(br); }
    var c=p.category||''; if(c && c.toLowerCase().indexOf(ql)>=0 && !seenC[c.toLowerCase()]){ seenC[c.toLowerCase()]=1; cats.push(c); }
  });
  var prods=PRODUCTS.filter(function(p){ return !p.poa && (p.name+' '+p.brand+' '+p.keywords).toLowerCase().indexOf(ql)>=0; });
  var html='';
  if(brands.length){ html+='<div class="sgroup">Brands</div>'+brands.slice(0,4).map(function(br){return '<div class="srow" onclick="searchSubmit('+jk(br)+')"><div class="sthumb">🏷️</div><div class="smeta"><div class="st">'+esc(br)+'</div><div class="ss">Brand</div></div></div>';}).join(''); }
  if(cats.length){ html+='<div class="sgroup">Categories</div>'+cats.slice(0,4).map(function(c){return '<div class="srow" onclick="searchPickCat('+jk(c)+')"><div class="sthumb">'+catIcon(c)+'</div><div class="smeta"><div class="st">'+esc(c)+'</div><div class="ss">Category</div></div></div>';}).join(''); }
  if(prods.length){ html+='<div class="sgroup">Products</div>'+prods.slice(0,6).map(_srow).join('')
    +'<div class="srow" onclick="searchSubmit('+jk(q)+')" style="color:var(--green-d);font-weight:700"><div class="sthumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><div class="smeta"><div class="st">See all results for “'+esc(q)+'”</div></div></div>'; }
  b.innerHTML = html || searchZero(q);
}
function searchDefault(){
  var html='';
  if(RSEARCH.length){ html+='<div class="sgroup">Recent</div><div class="schips">'+RSEARCH.map(function(v){return '<button class="schip" onclick="searchSubmit('+jk(v)+')">'+esc(v)+'</button>';}).join('')+'</div>'; }
  var cats=(CATS||[]).slice(0,10).map(function(c){return '<button class="schip" onclick="searchPickCat('+jk(c.name)+')">'+esc(c.name)+'</button>';}).join('');
  if(cats) html+='<div class="sgroup">Popular categories</div><div class="schips">'+cats+'</div>';
  var best=PRODUCTS.filter(function(p){return !p.poa && !oosOf(p);}).slice().sort(function(a,b){return (b.popularity||0)-(a.popularity||0);}).slice(0,6);
  if(best.length){ html+='<div class="sgroup">Trending</div>'+best.map(_srow).join(''); }
  return html || '<div class="szero">Start typing to find products.</div>';
}

function skeletonGrid(n){ n=n||8; var s=''; for(var i=0;i<n;i++){ s+='<div class="sk shimmer"><div class="a"></div><div class="b w70"></div><div class="b w45 last"></div></div>'; } return '<div class="skgrid">'+s+'</div>'; }

/* Fly-to-cart: a dot launches from the last-tapped control to the cart nav icon, badge bumps,
   light haptic. Skipped under reduced-motion. Purely visual — never touches cart/checkout logic. */
var _lastTap={x:window.innerWidth/2,y:window.innerHeight/2};
document.addEventListener('pointerdown',function(e){ _lastTap={x:e.clientX,y:e.clientY}; },{passive:true});
function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function flyToCart(){
  var cart=$('navCart');
  if(cart){ cart.classList.remove('bump'); void cart.offsetWidth; cart.classList.add('bump'); }
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  if(reducedMotion()||!cart) return;
  var r=cart.getBoundingClientRect(), tx=r.left+r.width/2, ty=r.top+r.height/2;
  var dot=document.createElement('div'); dot.className='flydot';
  dot.style.left=(_lastTap.x-8)+'px'; dot.style.top=(_lastTap.y-8)+'px';
  document.body.appendChild(dot);
  requestAnimationFrame(function(){ dot.style.transform='translate('+(tx-_lastTap.x)+'px,'+(ty-_lastTap.y)+'px) scale(.3)'; dot.style.opacity='0.2'; });
  setTimeout(function(){ if(dot.parentNode) dot.parentNode.removeChild(dot); }, 600);
}

/* ---------------- delivery location ---------------- */
function haversineKm(la1,lo1,la2,lo2){var R=6371,t=Math.PI/180,dLa=(la2-la1)*t,dLo=(lo2-lo1)*t;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
function nearestBranch(lat,lng){var best=null;BRANCHES.forEach(function(b){var km=haversineKm(lat,lng,Number(b.lat),Number(b.lng));if(best===null||km<best.km)best={branch:b,km:km};});return best;}
function etaLabel(km){if(km<=DELIVERY.near_km)return DELIVERY.near;if(km<=DELIVERY.mid_km)return DELIVERY.mid;if(km<=DELIVERY.max_km)return DELIVERY.far;return null;}
function setDelv(html,out){var el=$('delvBar');if(!el)return;el.className='delv'+(out?' out':'');el.innerHTML=html;}
function saveDelv(){try{localStorage.setItem(DELV_KEY,JSON.stringify(DELV));}catch(e){}}
function showDelv(){
  if(!DELV){setDelv('<span class="ico">📍</span><span class="txt">Set your location for delivery time</span><span class="chg">›</span>');return;}
  if(DELV.mode==='out'){setDelv('<span class="ico">⚠️</span><span class="txt">'+esc(DELIVERY.out)+'</span><span class="chg">Change</span>',true);return;}
  if(DELV.mode==='city'){setDelv('<span class="ico">🛵</span><span class="txt">Delivering to '+esc(DELV.branch.name)+'</span><span class="chg">Change</span>');return;}
  setDelv('<span class="ico">🛵</span><span class="txt">'+esc(DELV.label)+'</span><span class="chg">Change</span>');
}
function applyCoords(lat,lng){
  GEO={lat:+(+lat).toFixed(6),lng:+(+lng).toFixed(6)};
  var n=nearestBranch(lat,lng);
  if(!n){DELV={mode:'city',branch:BRANCHES[0]||{name:'your area'}};}
  else{var lab=etaLabel(n.km);
    if(lab===null)DELV={mode:'out',branch:n.branch,km:n.km};
    else DELV={mode:'eta',branch:n.branch,km:n.km,label:lab+' · '+n.branch.name};}
  saveDelv();showDelv();
}
function renderManual(){
  setDelv('<span class="ico">📍</span><span class="txt">Choose your area:</span><span class="pick">'+
    BRANCHES.map(function(b){return '<button onclick="event.stopPropagation();pickCity('+jk(b.name)+')">'+esc(b.name)+'</button>';}).join('')+'</span>');
}
function pickCity(name){var b=null;BRANCHES.forEach(function(x){if(x.name===name)b=x;});DELV={mode:'city',branch:b||{name:name}};saveDelv();showDelv();}
function askLocation(){
  if(!navigator.geolocation){renderManual();return;}
  setDelv('<span class="ico">📍</span><span class="txt">Detecting your location…</span>');
  navigator.geolocation.getCurrentPosition(
    function(p){applyCoords(p.coords.latitude,p.coords.longitude);},
    function(){renderManual();},
    {enableHighAccuracy:false,timeout:8000,maximumAge:600000}
  );
}
function restoreDelv(){try{var s=localStorage.getItem(DELV_KEY);if(s)DELV=JSON.parse(s);}catch(e){DELV=null;}showDelv();}

function toGrams(n,u){n=parseFloat(n);u=String(u).toLowerCase();if(u==='kg')return n*1000;if(u==='gm'||u==='g')return n;if(u==='l'||u==='ltr')return n*1000;if(u==='ml')return n;return 0;}
function parseSize(name){

  var ps=PRODUCTS.map(function(p){return p.popularity||0;}).filter(function(x){return x>0;}).sort(function(a,b){return b-a;});
  _popThresh = ps.length>=6 ? ps[Math.floor(ps.length*0.15)] : Infinity; return _popThresh; }
function isBestseller(p){ var t=bestThresh(); return t!==Infinity && (p.popularity||0)>0 && (p.popularity||0)>=t; }

  else if(isBestseller(p)) b='<span class="cbadge hot">Bestseller</span>';

/* derive up to 3 spec chips from the product name + keywords (paper/tissue vernacular) */
function specChipsFor(p){
  var s=((p.name||'')+' '+(p.keywords||'')).toLowerCase(),out=[];
  var ply=s.match(/(\d)\s*-?\s*ply/);                  if(ply)out.push(ply[1]+'-Ply');
  if(/\ba4\b/.test(s))out.push('A4');
  var sh=s.match(/(\d{2,4})\s*sheets?/);               if(sh)out.push(sh[1]+' Sheets');
  var gsm=s.match(/(\d{2,3})\s*gsm/);                   if(gsm)out.push(gsm[1]+' GSM');
  if(/virgin/.test(s))out.push('100% Virgin');
  if(/thermal/.test(s))out.push('Thermal');
  var sz=s.match(/(\d{2,3})\s*[x×]\s*(\d{2,3})\s*mm/);  if(sz)out.push(sz[1]+'×'+sz[2]+'mm');
  var seen={},res=[];out.forEach(function(c){if(!seen[c]&&res.length<3){seen[c]=1;res.push(c);}});
  return res;
}

/* ---- Department layer (grocery only). Groups EXISTING product categories into
        departments from the per-tenant `category_groups` config. Pure presentation:
        products keep their category, no schema change. Stays inactive (flat layout)
        unless a grocery tenant has real department groups configured — so restaurants,
        snacks, and unconfigured grocery-vertical shops (electronics, pharmacy, hardware,
        fashion) render exactly as before. ---- */
function catIndex(name){for(var i=0;i<CATS.length;i++)if(CATS[i].name===name)return i;return -1;}
function catExists(name){return catIndex(name)>=0;}
function deptModel(){
  var keys=Object.keys(CATGROUPS||{}); if(!keys.length)return [];
  var used={},depts=[];
  keys.forEach(function(dn){
    var subs=(CATGROUPS[dn]||[]).filter(catExists);   // only sub-categories that actually have products
    subs.forEach(function(s){used[s]=1;});
    if(subs.length)depts.push({name:dn,subs:subs});
  });
  var more=CATS.filter(function(c){return !used[c.name];}).map(function(c){return c.name;}); // never drop a category
  if(more.length)depts.push({name:'More',subs:more});
  return depts;
}
function useDepartments(){ if(VERTICAL!=='grocery')return false; return deptModel().some(function(d){return d.name!=='More';}); }
function deptOf(cat){var m=deptModel();for(var i=0;i<m.length;i++)if(m[i].subs.indexOf(cat)>=0)return m[i];return null;}
function catProductImg(name){for(var k=0;k<CATS.length;k++){if(CATS[k].name===name)return CATS[k].img||'';}return '';}
function catTile(name,i){
  var ci=CAT_IMG[name]||catProductImg(name);
  var inner;
  if(ci){inner='<div class="ci" style="background:#fff"><img alt="" src="'+esc(ci)+'" onerror="this.style.display=\'none\'"></div>';}
  else if(THEME.premiumTiles){inner='<div class="ci cifall"><span class="mono">'+esc(String(name||'?').trim().charAt(0).toUpperCase())+'</span></div>';}
  else{inner='<div class="ci" style="background:'+TINTS[(i<0?0:i)%TINTS.length]+'">'+catIcon(name)+'</div>';}
  return '<button class="cat" onclick="setCat('+jk(name)+')">'+inner+'<div class="nm">'+esc(name)+'</div></button>';
}

}

/* ================= Storefront V2 — filter & sort engine (Increment 4) ================= */
var FSORT='pop', FINSTOCK=false, FBULK=false, FBRANDS={}, FPMAX=0, _catShown=24;
function activeFilterCount(){ var n=0; if(FINSTOCK)n++; if(FBULK)n++; n+=Object.keys(FBRANDS).length; if(FPMAX>0)n++; return n; }
function resetFilters(){ FSORT='pop'; FINSTOCK=false; FBULK=false; FBRANDS={}; FPMAX=0; }
function applyFilters(list){
  var out=list.filter(function(p){
    if(FINSTOCK && oosOf(p)) return false;
    if(FBULK && !(p.packSize && p.packSize>=2)) return false;
    if(FPMAX>0 && p.price>FPMAX) return false;
    if(Object.keys(FBRANDS).length && !FBRANDS[(p.brand||'').toLowerCase()]) return false;
    return true;
  });
  out.sort(function(a,b){
    if(FSORT==='plow') return a.price-b.price;
    if(FSORT==='phigh') return b.price-a.price;
    if(FSORT==='new') return (b.createdAt||b.id||0)-(a.createdAt||a.id||0);
    return (b.popularity||0)-(a.popularity||0);
  });
  return out;
}
function sortLabel(){ return ({pop:'Popular',plow:'Price ↑',phigh:'Price ↓',new:'Newest'})[FSORT]||'Popular'; }
function filterBar(){
  var sorts=[['pop','Popular'],['plow','Price ↑'],['phigh','Price ↓'],['new','New']];
  var chips=sorts.map(function(s){return '<button class="fchip'+(FSORT===s[0]?' on':'')+'" onclick="setSort('+jk(s[0])+')">'+s[1]+'</button>';}).join('');
  var fc=activeFilterCount();
  return '<div class="filterbar"><button class="fchip" onclick="openFilters()">⚙ Filters'+(fc?(' <span class="fcount">'+fc+'</span>'):'')+'</button>'
    +'<button class="fchip'+(FINSTOCK?' on':'')+'" onclick="toggleInstock()">In stock</button>'+chips+'</div>';
}
function setSort(s){ FSORT=s; render(); }
function toggleInstock(){ FINSTOCK=!FINSTOCK; _catShown=24; render(); }
function curCatList(){ return PRODUCTS.filter(function(p){return p.category===CAT;}); }
function currentList(){ var ql=Q.trim().toLowerCase();
  if(ql) return PRODUCTS.filter(function(p){return (p.name+' '+p.brand+' '+p.category+' '+p.keywords).toLowerCase().indexOf(ql)>=0;});
  if(CAT!=='all') return curCatList(); return []; }
function catBrands(list){ var seen={},b=[]; list.forEach(function(p){var br=p.brand||'';if(br&&!seen[br.toLowerCase()]){seen[br.toLowerCase()]=1;b.push(br);}}); return b; }
function featuredBrands(list){ var b=catBrands(list); if(b.length<2)return '';
  return '<div class="sgroup" style="padding-left:14px">Featured brands</div><div class="brandstrip">'+b.slice(0,12).map(function(br){return '<button class="brandchip'+(FBRANDS[br.toLowerCase()]?' on':'')+'" onclick="toggleBrand('+jk(br)+')">'+esc(br)+'</button>';}).join('')+'</div>'; }
function toggleBrand(br){ br=br.toLowerCase(); if(FBRANDS[br])delete FBRANDS[br]; else FBRANDS[br]=1; _catShown=24; render(); }
function filterBrandChk(b,on){ if(on)FBRANDS[b]=1; else delete FBRANDS[b]; }
function openFilters(){
  var list=currentList(), brands=catBrands(list);
  var prices=list.map(function(p){return p.price;}).filter(function(x){return x>0;});
  var pmax=prices.length?Math.max.apply(null,prices):0, buckets=[];
  if(pmax>0){ [0.25,0.5,0.75].forEach(function(f){ var v=Math.ceil(pmax*f/500)*500; if(v>0 && buckets.indexOf(v)<0)buckets.push(v); }); }
  var html='<div style="padding:2px 0">';
  html+='<div class="fsec"><div class="fsh">Availability</div>'
    +'<label class="frow"><span>In stock only</span><input type="checkbox" '+(FINSTOCK?'checked':'')+' onchange="FINSTOCK=this.checked"></label>'
    +'<label class="frow"><span>Bulk / carton</span><input type="checkbox" '+(FBULK?'checked':'')+' onchange="FBULK=this.checked"></label></div>';
  if(brands.length){ html+='<div class="fsec"><div class="fsh">Brand</div>'+brands.slice(0,20).map(function(br){var b=br.toLowerCase();return '<label class="frow"><span>'+esc(br)+'</span><input type="checkbox" '+(FBRANDS[b]?'checked':'')+' onchange="filterBrandChk('+jk(b)+',this.checked)"></label>';}).join('')+'</div>'; }
  if(buckets.length){ html+='<div class="fsec"><div class="fsh">Max price</div><div class="schips" style="padding:0 0 2px">'+buckets.map(function(v){return '<button class="schip'+(FPMAX===v?' on':'')+'" onclick="FPMAX='+v+';openFilters()">Under '+ugx(v)+'</button>';}).join('')+(FPMAX?'<button class="schip" onclick="FPMAX=0;openFilters()">Any price</button>':'')+'</div></div>'; }
  html+='</div>';
  $('sheetTitle').textContent='Filters';
  $('sheetBody').innerHTML=html+'<div style="display:flex;gap:10px;margin-top:10px"><button class="place" style="flex:1;background:#fff;color:var(--green-d);border:1px solid var(--line)" onclick="resetFilters();closeSheet();render()">Clear all</button><button class="place" style="flex:2" onclick="_catShown=24;closeSheet();render()">Show results</button></div>';
  $('sheet').classList.add('show');
}
function growGrid(){ var wrap=$('catgridwrap'); if(!wrap)return; var full=applyFilters(currentList()); if(_catShown>=full.length){var lm=$('loadmore');if(lm)lm.remove();return;} _catShown+=24; wrap.innerHTML=gridG(full.slice(0,_catShown)); if(_catShown<full.length){ if(!$('loadmore')){var d=document.createElement('div');d.id='loadmore';d.style.height='1px';wrap.parentNode.insertBefore(d,wrap.nextSibling);} } else { var l=$('loadmore'); if(l)l.remove(); } }

function render(){
  var c=$('content');
  var hb=$('hback');if(hb)hb.style.display=(CAT!=='all'||Q)?'grid':'none';
  if(!PRODUCTS.length){c.innerHTML=skeletonGrid(8);return;}

  var pays=[['Cash on '+(IS_PICKUP?'pickup':'delivery')],['Mobile money']]; if(credit)pays.push(['Credit (account)']);
  var paytiles='<div class="cosec"><div class="cosh">Payment</div><div class="paytiles">'
    +pays.map(function(p,i){return '<button type="button" class="paytile'+(i===0?' on':'')+'" onclick="pickPay(this,'+jk(p[0])+')">'+esc(p[0])+'</button>';}).join('')
    +'</div><input type="hidden" id="coPay" value="'+esc(pays[0][0])+'">'
    +(credit?('<div class="note">Credit available: '+esc(BUYER.credit.currency||'')+' '+(Number(BUYER.credit.available||0)).toLocaleString('en-US')+(BUYER.credit.canSell===false?' (over limit, credit paused)':'')+'</div>'):'')
    +'</div>';
  var extras='<div class="cosec"><button class="colink" onclick="toggleEl(\'coNoteWrap\')">+ Add a note</button>'
    +'<div id="coNoteWrap" style="display:none"><textarea id="coNote" rows="2" placeholder="e.g. leave at gate, call on arrival"></textarea></div>'
    +'<button class="colink" onclick="toggleEl(\'coWhenWrap\')">+ Schedule for later</button>'
    +'<div id="coWhenWrap" style="display:none"><input id="coWhen" type="datetime-local"></div></div>';
  var bill='<div class="billbox"><div class="billrow"><span>Items ('+cartCount()+')</span><span>'+ugx(sub)+'</span></div>'
    +'<div class="billrow"><span>Delivery</span><span class="mut">'+(de?esc(de):'set your location')+'</span></div>'
    +'<div class="billrow tot"><span>To pay</span><span>'+ugx(sub)+'<span class="plusdel"> + delivery</span></span></div></div>';
  $('sheetBody').innerHTML=details+paytiles+extras+bill
    +'<div class="trustrow">You only pay when you receive · we message you on WhatsApp at every step</div>'
    +'<div class="cartfoot"><button class="place" id="placeBtn" onclick="placeOrder()">Place order · '+ugx(sub)+'</button>'
    +'<button class="colink" style="text-align:center;width:100%;margin-top:6px" onclick="openCart()">Back to cart</button></div>';
  $('sheet').classList.add('show');
  renderLocMsg();
}
function mapsUrl(g){return 'https://maps.google.com/?q='+g.lat+','+g.lng;}
function renderLocMsg(){
  var m=$('locMsg'),b=$('locBtn');if(!m)return;
  if(GEO){m.innerHTML='✓ Location captured — <a href="'+mapsUrl(GEO)+'" target="_blank" rel="noopener">view pin</a>';m.className='locmsg ok';if(b)b.textContent='📍 Update my location';}
  else{m.textContent='Optional — sends an exact map pin so the rider finds you fast.';m.className='locmsg';if(b)b.textContent='📍 Share my current location';}
}
function captureLoc(){
  if(!navigator.geolocation){toast('Location isn’t available — please type your address.','err');return;}
  var b=$('locBtn');if(b){b.disabled=true;b.textContent='Detecting…';}
  navigator.geolocation.getCurrentPosition(
    function(p){GEO={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)};if(b)b.disabled=false;renderLocMsg();},
    function(){if(b)b.disabled=false;renderLocMsg();toast('Couldn’t get your location — type your address instead.','err');},
    {enableHighAccuracy:true,timeout:10000,maximumAge:60000}
  );
}
async function placeOrder(){
  var name=($('coName').value||'').trim(), phone=($('coPhone').value||'').replace(/[^0-9]/g,''), addr=($('coAddr').value||'').trim(), pay=$('coPay').value, note=(($('coNote')||{}).value||'').trim(), when=(($('coWhen')||{}).value||'').trim();
  if(!name){toast('Please enter your name','err');return;}
  if(phone.length<7){toast('Please enter your WhatsApp number','err');return;}
  if(!IS_PICKUP && !addr && !GEO){toast('Add your delivery address or share your location','err');return;}
  var onCredit=/credit/i.test(pay);
  var payload={name:name,phone:phone,location:addr,payment:pay,note:note,when:when,on_credit:onCredit?1:0,items:cartItems().map(function(i){return {name:i.name,price:i.price,qty:i.qty,modifiers:i.modifiers||[]};}),total:cartTotal(),channel:'web'};
  if(GEO){payload.geo=GEO.lat+','+GEO.lng;payload.maps_url=mapsUrl(GEO);}
  var btn=$('placeBtn');btn.disabled=true;btn.textContent='Placing…';
  try{
    var r=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
    var d=await r.json();
    if(d&&d.ok){track('checkout',payload.items.map(function(i){var p=prod(i.name);return p?p.id:null;}).filter(Boolean));saveCust({name:name,phone:phone,addr:addr});saveLast(payload.items);CART={};saveCart();bar();render();$('sheetTitle').textContent='Order placed';
      var shopName=SHOP.name||'us';
      var eta=deliveryEstimateText();
      try{ toast('Order placed'); if(navigator.vibrate)navigator.vibrate([10,30,10]); }catch(e){}
      $('sheetBody').innerHTML='<div class="ok2"><div class="okcheck">✓</div><h2>Order placed!</h2>'+
        (d.order_no?'<div class="okno">'+esc(d.order_no)+'</div>':'')+
        '<p class="okmsg">'+(eta?('We’ll deliver '+esc(eta)+'. '):'')+'We’ll message you on WhatsApp at every step.</p>'+
        '<div style="margin-top:18px">'+
        (d.track_url?'<a class="place" style="display:block;text-decoration:none;text-align:center" href="'+esc(d.track_url)+'">Track my order</a>':'')+
        (WA_NUMBER?'<a class="place" style="display:block;text-decoration:none;text-align:center;background:#fff;color:var(--green-d);border:1px solid var(--line);margin-top:8px" href="https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent('Hi '+shopName+', about my order '+(d.order_no||''))+'">Message us on WhatsApp</a>':'')+
        '<button class="place" style="background:#fff;color:var(--ink);border:1px solid var(--line);margin-top:8px" onclick="goHome();closeSheet()">Continue shopping</button></div></div>';
    }else{toast((d&&d.message)?d.message:((d&&d.error)?d.error:'Could not place order. Please try again.'),'err');btn.disabled=false;btn.textContent='Place order';}
  }catch(e){toast('Network error — please try again.','err');btn.disabled=false;btn.textContent='Place order';}
}

/* ---- brand the shell from the injected config ---- */
(function brand(){
  document.title=(SHOP.name||'Shop')+' — Shop';
  var hb=document.querySelector('.top b'); if(hb)hb.textContent=SHOP.name||'Shop';
  var lg=document.querySelector('.top .lg'); if(lg){ if(SHOP.logo){lg.innerHTML='<img alt="" src="'+esc(SHOP.logo)+'" style="width:100%;height:100%;object-fit:cover">';lg.style.background='#fff';} else {lg.textContent=SHOP.initials||'SH';} }
  var fn=$('footName'); if(fn)fn.textContent=(SHOP.name||'Shop')+(SHOP.city?(' · '+SHOP.city):'');
  var sl=$('staffLink'); if(sl)sl.href=ADMIN_URL;
})();

/* V2 search overlay wiring (the main #q is now a trigger; typing happens in #sq). */
if($('sq')){
  $('sq').addEventListener('input',function(){ searchRender(this.value); });
  $('sq').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); searchSubmit(this.value); } });
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var o=$('searchOverlay'); if(o&&o.classList.contains('show')){ searchClose(); return; } var sh=$('sheet'); if(sh&&sh.classList.contains('show')) closeSheet(); } });
/* Infinite scroll: grow the category/search grid as the sentinel nears the viewport. */
window.addEventListener('scroll',function(){ var lm=$('loadmore'); if(!lm)return; if(lm.getBoundingClientRect().top < window.innerHeight+320){ growGrid(); } },{passive:true});
/* A11y: when the bottom sheet opens, move focus into the dialog (screen readers announce it,
   keyboard stays trapped-ish); restore focus to the trigger on close. Centralised via observer. */
(function(){ var sh=$('sheet'); if(!sh||!window.MutationObserver)return; var last=null;
  new MutationObserver(function(){ if(sh.classList.contains('show')){ last=document.activeElement; var x=sh.querySelector('.sheethd .x'); if(x){ try{ x.focus(); }catch(e){} } }
    else if(last){ try{ last.focus(); }catch(e){} last=null; } }).observe(sh,{attributes:true,attributeFilter:['class']});
})();
loadCart(); loadCust(); loadWish(); loadRSearch(); bar(); restoreDelv(); if($('content'))$('content').innerHTML=skeletonGrid(8); load();
</script>
