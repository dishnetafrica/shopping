<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b7a3b">
<title>Transport Register</title>
<style>
  :root{
    --green:#0b7a3b; --green-d:#0a5c2e; --green-l:#e7f5ec;
    --red:#d92d20; --red-l:#fdeceb;
    --amber:#e08b00; --amber-l:#fdf3e3;
    --blue:#1d6fd6; --blue-l:#e8f1fd;
    --purple:#7a3ec9; --purple-l:#f0e9fb;
    --ink:#172029; --muted:#66727e; --line:#e8ecf0; --bg:#f4f6f8; --card:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:16px}
  .top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top))}
  .top .bk{width:34px;height:34px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;font-size:20px;display:none;place-items:center;cursor:pointer;flex:none}
  .top.sub .bk{display:grid}
  .top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em;flex:1;line-height:1.15}
  .top .sub2{font-size:11px;opacity:.85;font-weight:500;display:block}
  .top .act{width:34px;height:34px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;font-size:16px;display:grid;place-items:center;cursor:pointer;flex:none}
  .hero{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;border-radius:18px;padding:18px;margin:14px;box-shadow:0 8px 20px rgba(11,122,59,.22)}
  .hero .lbl{font-size:12px;opacity:.85;font-weight:600;letter-spacing:.02em}
  .hero .big{font-size:44px;font-weight:900;line-height:1;margin:6px 0 2px}
  .hero .big small{font-size:16px;font-weight:700;opacity:.85}
  .hero .split{display:flex;gap:8px;margin-top:14px}
  .hero .sp{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 9px}
  .hero .sp .k{font-size:10.5px;opacity:.85;font-weight:600}
  .hero .sp .v{font-size:18px;font-weight:800;margin-top:2px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
  .bigcard{border:0;border-radius:18px;padding:16px;text-align:left;cursor:pointer;color:#fff;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 12px rgba(16,24,40,.08)}
  .bigcard .ic{font-size:24px}
  .bigcard .t{font-size:18px;font-weight:800;margin-top:6px}
  .bigcard .d{font-size:12px;opacity:.9;font-weight:500;margin-top:2px}
  .bigcard .badge{font-size:30px;font-weight:900;line-height:1}
  .bigcard.in{background:linear-gradient(135deg,#12a150,#0b7a3b)}
  .bigcard.wait{background:linear-gradient(135deg,#f0a500,#d98200)}
  .bigcard.transit{background:linear-gradient(135deg,#2b7fe0,#1a5bb8)}
  .bigcard.dash{background:linear-gradient(135deg,#3b3f52,#22252f)}
  .sec{padding:16px 14px 4px;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;justify-content:space-between}
  .sec .mini{font-size:11px;font-weight:700;text-transform:none;letter-spacing:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 14px 12px;overflow:hidden}
  .field{padding:12px 14px;border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:0}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:0;font-size:17px;font-weight:600;color:var(--ink);background:none;outline:none;font-family:inherit}
  .field input::placeholder,.field textarea::placeholder{color:#b3bcc6;font-weight:500}
  .field textarea{resize:none;min-height:40px}
  .req::after{content:" *";color:var(--red)}
  .pick{flex:1;text-align:left;border:1px dashed var(--line);background:#fafbfc;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600;color:#b3bcc6;cursor:pointer;font-family:inherit}
  .pick.has{color:var(--ink);border-style:solid;background:#fff}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:24px;font-weight:800;color:var(--green-d);cursor:pointer;line-height:1;flex:none}
  .stepper input{flex:1;text-align:center;font-size:28px;font-weight:900;border:0;outline:none;width:50px;-moz-appearance:textfield}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--green-l);border-color:#bfe6cd;color:var(--green-d)}
  .save{position:sticky;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,246,248,0),var(--bg) 34%)}
  .btn{width:100%;border:0;border-radius:15px;padding:16px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(11,122,59,.24)}
  .btn.green{background:var(--green)} .btn.red{background:var(--red);box-shadow:0 6px 16px rgba(217,45,32,.24)}
  .btn.blue{background:var(--blue);box-shadow:0 6px 16px rgba(29,111,214,.24)}
  .btn.ghost{background:#fff;color:var(--green-d);border:1px solid var(--line);box-shadow:none}
  .btn:disabled{opacity:.5}
  .row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row:active{background:#fafbfc}
  .row .dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none;font-weight:800}
  .dot.in{background:var(--green-l);color:var(--green-d)} .dot.out{background:var(--blue-l);color:var(--blue)}
  .dot.g{background:#eef1f4;color:#5b6b7b}
  .row .m{flex:1;min-width:0}
  .row .m .l1{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .m .l2{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .r{text-align:right;flex:none}
  .row .r .q{font-size:16px;font-weight:900}
  .row .r .bal{font-size:11px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.01em}
  .st-kampala{background:#eef1f4;color:#5b6b7b}
  .st-park{background:var(--amber-l);color:var(--amber)}
  .st-transit{background:var(--blue-l);color:var(--blue)}
  .st-arrived{background:#eef3ff;color:#3652c9}
  .st-received{background:var(--green-l);color:var(--green-d)}
  .st-lost{background:var(--red-l);color:var(--red)}
  .holder{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--purple);background:var(--purple-l);padding:3px 9px;border-radius:999px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .tile .k{font-size:12px;font-weight:700;color:var(--muted);line-height:1.25}
  .tile .v{font-size:28px;font-weight:900;margin-top:4px;line-height:1}
  .tile .u{font-size:11px;color:var(--muted);font-weight:600}
  .tile.hot .v{color:var(--amber)} .tile.bad .v{color:var(--red)} .tile.good .v{color:var(--green-d)} .tile.info .v{color:var(--blue)}
  .prod{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .prod:last-child{border-bottom:0}
  .prod .pn{flex:1;font-weight:700;font-size:15px}
  .prod .pb{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
  .prod .send{width:120px;flex:none}
  .searchbar{margin:14px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .searchbar input{flex:1;border:0;outline:none;font-size:16px;font-weight:600;font-family:inherit}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty .em{font-size:40px;display:block;margin-bottom:8px}
  .timeitem{display:flex;gap:12px;padding:0 14px}
  .timeitem .tl{display:flex;flex-direction:column;align-items:center;flex:none}
  .timeitem .tl .d2{width:12px;height:12px;border-radius:50%;background:var(--green);margin-top:16px}
  .timeitem .tl .ln{flex:1;width:2px;background:var(--line)}
  .timeitem .tc{flex:1;padding:12px 0 4px;border-bottom:1px solid var(--line)}
  .timeitem:last-child .tc{border-bottom:0}
  .timeitem .tc .tt{font-weight:700;font-size:14px}
  .timeitem .tc .ts{font-size:12px;color:var(--muted);margin-top:2px}
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.42);display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .card2{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));animation:up .22s ease;max-height:86vh;overflow:auto}
  @keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .grab{width:38px;height:4px;background:#d7dde3;border-radius:99px;margin:8px auto 6px}
  .sheet .sh{font-size:16px;font-weight:800;padding:6px 18px 12px}
  .sheet .opt{display:flex;align-items:center;gap:12px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer;border-top:1px solid var(--line)}
  .sheet .opt .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#172029;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mut{color:var(--muted)}
  .foot{text-align:center;color:#9aa5b1;font-size:11px;padding:20px 20px 8px}
  /* barcode scanner */
  .scanov{position:fixed;inset:0;z-index:1200;background:#0b0f14;display:none;flex-direction:column}
  .scanov.show{display:flex}
  .scanov .scanhd{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;color:#fff;font-weight:800;font-size:16px}
  .scanov .scanx{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
  .scanov .scanstage{position:relative;flex:1;overflow:hidden;display:grid;place-items:center;background:#000}
  .scanov video{width:100%;height:100%;object-fit:cover}
  .scanov .scanbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72%;max-width:340px;aspect-ratio:1.6/1;border:2px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);overflow:hidden}
  .scanov .scanline{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#22c55e,transparent);animation:scanln 1.8s ease-in-out infinite}
  @keyframes scanln{0%{top:6%}50%{top:94%}100%{top:6%}}
  .scanov .scanhint{color:#dbe4ee;text-align:center;font-size:13.5px;padding:16px 20px calc(20px + env(safe-area-inset-bottom))}
  @media(prefers-reduced-motion:reduce){.scanov .scanline{animation:none;top:50%}}
</style>
</head>
<body>
<div class="top" id="top">
  <button class="bk" onclick="back()" aria-label="Back">‹</button>
  <h1 id="title">Transport Register<span class="sub2">Kampala → Juba</span></h1>
  <button class="act" id="syncBtn" onclick="syncNow()" aria-label="Sync now" style="display:none;font-size:18px">↻</button>
  <button class="act" onclick="openMenu()" aria-label="Menu">⋯</button>
</div>
<div id="app"></div>
<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="card2"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div class="scanov" id="scanOv"><div class="scanhd"><button class="scanx" onclick="stopTrScan()" aria-label="Close scanner">‹</button><span>Scan a box</span></div><div class="scanstage"><video id="scanVid" playsinline muted autoplay></video><div class="scanbox"><span class="scanline"></span></div></div><div class="scanhint" id="scanHint">Point the camera at the barcode</div></div>
<div class="toast" id="toast"></div>

<script>/* Sync config + product catalogue: injected by the v3 server page (or a test) BEFORE this runs. */
window.TR_CONFIG = window.TR_CONFIG || null;
window.TR_PRODUCTS = window.TR_PRODUCTS || [];</script>
<script>
/* ============================================================================
   TRANSPORT REGISTER — shipment-centric (Kampala → Juba). Offline prototype.
   Model:
     shipment = an intake batch (TRN-YYYYMMDD-NNN) received at Kampala warehouse,
                holding products with carton totals.
     load     = a bus manifest (LD-YYYYMMDD-NNN): partial product quantities put on
                ONE bus, moving through the lifecycle with a current HOLDER.
   Every carton is always in exactly one place:
     waiting at Kampala  →  at bus park  →  in transit  →  arrived Juba  →  Juba warehouse
   (or flagged lost/disputed). Product-level sent/pending falls out of this.
   ============================================================================ */
var KEY='transport_register_v2';
var REG={shipments:[],loads:[],seq:{},companies:[],tombstones:{}};
/* Sync config is injected by the v3 server page (window.TR_CONFIG); when absent the
   register runs purely on-device (offline prototype). */
var TRc=(typeof window!=='undefined' && window.TR_CONFIG && typeof window.TR_CONFIG==='object')?window.TR_CONFIG:null;
var TRP=(typeof window!=='undefined' && Array.isArray(window.TR_PRODUCTS))?window.TR_PRODUCTS:[];   // catalogue: [{name,cat,unit}]
function load(){ try{var s=localStorage.getItem(KEY); if(s)REG=JSON.parse(s);}catch(e){} REG.shipments=REG.shipments||[]; REG.loads=REG.loads||[]; REG.seq=REG.seq||{}; REG.companies=REG.companies||[]; REG.tombstones=REG.tombstones||{}; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(REG));}catch(e){} }
function markDirty(){ save(); scheduleSync(); }

/* ---- SYNC (offline-first, last-write-wins per entity by updatedAt) ---- */
var SYNC={state:TRc?'idle':'local',timer:null,pull:null};
function stamp(e){ e.uid=e.uid||uid(); e.updatedAt=Date.now(); return e; }
function tombstone(uidv){ REG.tombstones[uidv]=Date.now(); }
function scheduleSync(){ if(!TRc)return; if(SYNC.timer)clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncNow,700); }
function setSync(s){ SYNC.state=s; var el=document.getElementById('syncBtn'); if(el){ var m={idle:['↻','#fff'],syncing:['⟳','#ffe9a8'],synced:['✓','#c7f0d5'],offline:['⚠','#ffd0cc'],error:['⚠','#ffd0cc']}; var v=m[s]||m.idle; el.textContent=v[0]; el.style.color=v[1]; } }
function mergeList(t,remoteList){
  var by={}; (REG[t]||[]).forEach(function(e){by[e.uid]=e;});
  (remoteList||[]).forEach(function(r){ if(!r||!r.uid)return; var l=by[r.uid]; if(!l||(r.updatedAt||0)>(l.updatedAt||0))by[r.uid]=r; });
  REG[t]=Object.keys(by).map(function(k){return by[k];});
}
function mergeReg(remote){
  mergeList('shipments',remote.shipments); mergeList('loads',remote.loads);
  var tomb=remote.tombstones||{}; for(var k in tomb){ if(!REG.tombstones[k]||tomb[k]>REG.tombstones[k])REG.tombstones[k]=tomb[k]; }
  // apply tombstones: drop any entity a delete supersedes
  ['shipments','loads'].forEach(function(t){ REG[t]=REG[t].filter(function(e){ var td=REG.tombstones[e.uid]; return !(td && td>=(e.updatedAt||0)); }); });
  (remote.companies||[]).forEach(function(c){ if(REG.companies.indexOf(c)<0)REG.companies.push(c); });
}
function syncNow(){
  if(!TRc)return;
  if(typeof navigator!=='undefined' && navigator.onLine===false){ setSync('offline'); return; }
  setSync('syncing');
  fetch(TRc.syncUrl,{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-TOKEN':TRc.csrf||''},credentials:'include',
    body:JSON.stringify({shipments:REG.shipments,loads:REG.loads,tombstones:REG.tombstones,companies:REG.companies})})
   .then(function(r){ if(!r.ok)throw 0; return r.json(); })
   .then(function(d){ if(d&&d.ok){ mergeReg(d); save(); setSync('synced'); render(); } else setSync('error'); })
   .catch(function(){ setSync('offline'); });
}
function startSync(){ if(!TRc)return; syncNow(); if(SYNC.pull)clearInterval(SYNC.pull); SYNC.pull=setInterval(function(){ if(document.visibilityState!=='hidden')syncNow(); },20000);
  try{ window.addEventListener('online',syncNow); window.addEventListener('focus',syncNow); }catch(e){} }
function uid(){ return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jq(s){return JSON.stringify(String(s==null?'':s)).replace(/"/g,'&quot;');}
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso){ if(!iso)return ''; var p=String(iso).split('-'); if(p.length<3)return iso; var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return Number(p[2])+' '+m[Number(p[1])-1]+' '+p[0]; }
function fmtTime(ts){ try{return new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }
function ago(ts){ var h=(Date.now()-ts)/3600000; if(h<1)return Math.max(1,Math.round(h*60))+' min'; if(h<24)return Math.round(h)+'h'; return Math.round(h/24)+'d'; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2400); }
function haptic(){ try{ if(navigator.vibrate)navigator.vibrate(12);}catch(e){} }
function seqId(pfx,dateISO){ var ymd=String(dateISO).replace(/-/g,''); var k=pfx+ymd; REG.seq[k]=(REG.seq[k]||0)+1; return pfx+'-'+ymd+'-'+String(REG.seq[k]).padStart(3,'0'); }

/* ---- lifecycle ---- */
var STATUS={
  park:{l:'At bus park',c:'st-park',ic:'🅿️',holder:'Bus park'},
  transit:{l:'In transit',c:'st-transit',ic:'🚌',holder:null},          /* holder = bus company */
  arrived:{l:'Arrived Juba',c:'st-arrived',ic:'📍',holder:'Juba staff'},
  received:{l:'Juba warehouse',c:'st-received',ic:'🏬',holder:'Juba warehouse'},
  lost:{l:'Lost / disputed',c:'st-lost',ic:'⚠️',holder:'Disputed'}
};
var FLOW=['park','transit','arrived','received'];
function statusPill(st){ var s=STATUS[st]||STATUS.park; return '<span class="pill '+s.c+'">'+s.ic+' '+s.l+'</span>'; }
function holderOf(ld){ var s=STATUS[ld.status]||STATUS.park; return (ld.status==='transit')?(ld.company||'Bus company'):s.holder; }
function nextStatus(st){ var i=FLOW.indexOf(st); return (i>=0&&i<FLOW.length-1)?FLOW[i+1]:null; }

/* ---- computations ---- */
/* ---- big-bag (sack) helpers: a bag = fixed contents [{name,qty}] × count identical sacks ---- */
function bagUnit(bag){ return (bag.contents||[]).reduce(function(s,c){return s+(Number(c.qty)||0);},0); }   // items noted inside one sack (informational only)
function bagCartons(bag){ return Number(bag.count)||0; }        // a big bag counts as ONE unit to dispatch (20 boxes + 2 bags = 22)
function baglineCartons(bl){ return Number(bl.count)||0; }
function loadTotal(ld){ return (ld.lines||[]).reduce(function(s,l){return s+(Number(l.cartons)||0);},0)
  + (ld.baglines||[]).reduce(function(s,b){return s+baglineCartons(b);},0); }
function shipTotal(sh){ return (sh.products||[]).reduce(function(s,p){return s+(Number(p.cartons)||0);},0)
  + (sh.bags||[]).reduce(function(s,b){return s+bagCartons(b);},0); }
/* bag dispatch tracking (whole sacks): how many sacks of each bag are already on buses */
function dispatchedBagMap(){ var m={}; REG.loads.forEach(function(ld){ (ld.baglines||[]).forEach(function(bl){ m[bl.bagUid]=(m[bl.bagUid]||0)+(Number(bl.count)||0); }); }); return m; }
function shipBagPending(bag,dbm){ dbm=dbm||dispatchedBagMap(); return (Number(bag.count)||0)-(dbm[bag.uid]||0); }
function waitingBags(){ var dbm=dispatchedBagMap(), out=[]; REG.shipments.forEach(function(sh){ (sh.bags||[]).forEach(function(bag){ var pend=(Number(bag.count)||0)-(dbm[bag.uid]||0); if(pend>0) out.push({shipmentId:sh.id, bag:bag, pending:pend}); }); }); return out; }
function bagLabel(bag){ if(bag.label)return bag.label; var c=(bag.contents||[]); return c.length?('Bag · '+c.slice(0,2).map(function(x){return x.name;}).join(', ')+(c.length>2?'…':'')):'Bag'; }

/* ---- allocation (FIFO across shipments) ---- */
function allocate(name,qty,dm){ var lines=[],need=qty; REG.shipments.slice().sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(sh){ if(need<=0)return; var pend=(function(){var t=0;(sh.products||[]).forEach(function(p){if(p.name===name)t+=Number(p.cartons)||0;});return t-(dm[sh.id+'|'+name]||0);})(); if(pend>0){ var take=Math.min(pend,need); lines.push({shipmentId:sh.id,name:name,cartons:take}); need-=take; dm[sh.id+'|'+name]=(dm[sh.id+'|'+name]||0)+take; } }); return lines; }

   .catch(function(e){ var nm=e&&e.name; setHint(nm==='NotAllowedError'?'Camera blocked — allow camera access':'Couldn’t start the camera'); setTimeout(stopTrScan,1700); }); }

function dpRow(p,i){ return '<div class="prod"><div style="flex:1"><div class="pn">'+esc(p.name)+'</div><div class="pb">'+p.pending+' waiting</div></div><div class="send">'+stepper('dp_'+i,p.pending,p.pending)+'</div></div>'; }
function dpBagRow(w,i){ return '<div class="prod"><div style="flex:1"><div class="pn">'+esc(bagLabel(w.bag))+'</div><div class="pb">'+w.pending+' bag'+(w.pending===1?'':'s')+' waiting · '+bagSummary(w.bag)+'</div></div><div class="send">'+stepper('dpbag_'+i,w.pending,w.pending)+'</div></div>'; }
function dpStatusChips(){ return [['park','🅿️ At bus park'],['transit','🚌 Left / in transit']].map(function(s){return '<button class="chip'+(DP_STATUS===s[0]?' on':'')+'" onclick="DP_STATUS=\''+s[0]+'\';document.getElementById(\'dpStatus\').innerHTML=dpStatusChips()">'+s[1]+'</button>';}).join(''); }
function doDispatch(){
  var co=val('dpCo'), bus=val('dpBus'), phone=val('dpPhone'), eta=val('dpEta');
  if(!co){ toast('Which bus company?'); return; }
  if(!bus){ toast('Enter the bus number'); return; }
  var wp=waitingProducts(), dm=dispatchedMap(), lines=[];
  wp.forEach(function(p,i){ var q=Math.min(p.pending, Number(val('dp_'+i))||0); if(q>0){ lines=lines.concat(allocate(p.name,q,dm)); } });
  var wb=waitingBags(), baglines=[];
  wb.forEach(function(w,i){ var q=Math.min(w.pending, Number(val('dpbag_'+i))||0); if(q>0){ baglines.push({shipmentId:w.shipmentId,bagUid:w.bag.uid,label:bagLabel(w.bag),count:q,contents:w.bag.contents}); } });
  if(!lines.length && !baglines.length){ toast('Set how many boxes or bags to load'); return; }

  var date=todayISO(), id=seqId('LD',date), now=Date.now();
  var ld=stamp({id:id,date:date,ts:now,company:co,bus:bus,phone:phone,eta:eta,status:DP_STATUS,lines:lines,baglines:baglines,

  REG.loads.push(ld);
  markDirty(); haptic(); toast('Dispatched '+loadTotal(ld)+' boxes · '+id);
  reset('home'); go('load',id);
}

/* ---- BUSES / active loads ---- */
function viewBuses(){

  var done=loads.filter(function(l){return l.status==='received'||l.status==='lost';});
  var shipCards='';

  if(withPending.length){ shipCards='<div class="sec">Shipments with boxes still at Kampala</div><div class="card">'+withPending.map(shipRow).join('')+'</div>'; }

function manifestText(ld){ var lines=['*Bus manifest — '+ld.company+' '+ld.bus+'*','('+ld.id+' · '+fmtDate(ld.date)+')','','Status: '+((STATUS[ld.status]||{}).l||ld.status),ld.eta?('ETA: '+ld.eta):'', '']; (ld.lines||[]).forEach(function(l){ lines.push('• '+l.name+' — '+l.cartons); }); (ld.baglines||[]).forEach(function(bl){ lines.push('🛍️ '+(bl.label||'Bag')+' × '+bl.count+' ('+(bl.contents||[]).map(function(c){return c.name+' '+c.qty;}).join(', ')+')'); }); lines.push(''); lines.push('*Total: '+loadTotal(ld)+' boxes*'); return lines.join('\n'); }
function shareManifest(id){ var ld=loadById(id); if(!ld)return; shareText(manifestText(ld)); }
function dashText(){ var l=['*Transport status — '+fmtDate(todayISO())+'*','','📥 Received (Kampala): '+totalIntake(),'📦 Waiting to dispatch: '+waitingTotal(),'🅿️ At bus park: '+cartonsByStatus('park'),'🚌 In transit: '+cartonsByStatus('transit'),'📍 Arrived Juba: '+cartonsByStatus('arrived'),'🏬 In Juba warehouse: '+cartonsByStatus('received')]; var lost=cartonsByStatus('lost'); if(lost)l.push('⚠️ Lost/disputed: '+lost); var d=delayedLoads(24).length; if(d)l.push('⏱ Delayed >24h: '+d+' shipments'); return l.join('\n'); }
function shareDash(){ shareText(dashText()); }
function shareText(txt){ if(navigator.share){ navigator.share({text:txt}).catch(function(){}); return; } try{ window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'); }catch(e){ try{navigator.clipboard.writeText(txt);toast('Copied');}catch(e2){toast('Share not available');} } }

/* ---- menu / backup ---- */
function openMenu(){ var b=document.getElementById('sheetBody'); b.innerHTML='<div class="sh">Transport Register</div>'
  +opt('📊','Manager dashboard','','closeSheet();go(\'dash\')')
  +opt('📤','Share status on WhatsApp','','closeSheet();shareDash()')
  +opt('⬇️','Export backup (JSON)','','closeSheet();exportData()')
  +opt('⬆️','Import backup','','closeSheet();importData()')
  +opt('🧹','Clear all data','','closeSheet();clearAll()');
  document.getElementById('sheet').classList.add('show'); }
function opt(ic,l,note,onclick){ return '<div class="opt" onclick="'+onclick+'"><div class="ic" style="background:#eef1f4">'+ic+'</div><div style="flex:1">'+esc(l)+'</div>'+(note?'<span class="mut" style="font-size:12px;font-weight:700">'+esc(note)+'</span>':'')+'</div>'; }
function closeSheet(){ document.getElementById('sheet').classList.remove('show'); }
function exportData(){ var blob=new Blob([JSON.stringify(REG,null,2)],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='transport-register-'+todayISO()+'.json'; a.click(); toast('Backup downloaded'); }
function importData(){ var f=document.createElement('input'); f.type='file'; f.accept='application/json'; f.onchange=function(){ var file=f.files[0]; if(!file)return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(d&&(d.shipments||d.loads)){ REG=d; load(); save(); reset('home'); toast('Backup restored'); } else toast('Not a valid backup'); }catch(e){ toast('Could not read file'); } }; r.readAsText(file); }; f.click(); }
function clearAll(){ if(!confirm('Delete ALL transport records on this phone?'))return; REG={shipments:[],loads:[],seq:{},companies:[]}; save(); reset('home'); toast('All data cleared'); }

/* ---- boot ---- */
load();
/* Demo data only in the standalone offline prototype (no server). A real deployment
   starts empty and shares data through the sync endpoints. */
if(!TRc && !REG.shipments.length && !localStorage.getItem(KEY+'_seen')){
  var t=todayISO(), now=Date.now();
  var s1=seqId('TRN',t);
  REG.shipments.push(stamp({id:s1,date:t,ts:now-9000000,source:'Kampala Warehouse',dest:'Juba Warehouse',ref:'GRN-1042',products:[{name:'Toilet Paper',cartons:40},{name:'Brown Chana',cartons:25},{name:'Disposable Glasses',cartons:55}]}));
  var dm={};
  var L1=seqId('LD',t); REG.loads.push(stamp({id:L1,date:t,ts:now-6000000,company:'Gateway Bus',bus:'UBK 456Y',eta:'Tomorrow AM',status:'transit',lines:allocate('Toilet Paper',40,dm).concat(allocate('Brown Chana',10,dm)).concat(allocate('Disposable Glasses',55,dm)),events:[{status:'park',ts:now-6300000,note:'Loaded on Gateway Bus'},{status:'transit',ts:now-6000000,note:'Bus left Kampala'}]}));
  REG.companies=['Gateway Bus','Nile Coach'];
  localStorage.setItem(KEY+'_seen','1'); save();
}
if(TRc){ var sb=document.getElementById('syncBtn'); if(sb)sb.style.display='grid'; }
render();
if(TRc) startSync();
</script>
