<style>
:root{--accent:#C8102E;--accent-d:#9B0C23;--ink:#0C1220;--ink2:#141B2D;--muted:#5A6472;--line:#E6EAF0;--soft:#F3F5F8;--ok:#128A4B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#F5F7FA;line-height:1.55}
a{text-decoration:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;font-weight:700;cursor:pointer;padding:11px 18px;font-size:14px;font-family:inherit}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-d)}
.btn-o{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-o:hover{background:var(--soft)}
.btn-w{background:#25D366;color:#fff}.btn-sm{padding:8px 14px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.chip.g{color:var(--ok);background:#E4F4EC}.chip.b{color:#C77700;background:#FDF3E2}
.stock{font-size:12px;font-weight:700}.stock.y{color:var(--ok)}.stock.n{color:#C62828}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff}
.nav .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.emb{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.brand b{font-size:15px;letter-spacing:.4px}.brand i{display:block;font-style:normal;font-size:8px;letter-spacing:2px;color:#aeb8cc}
.nav .lnk{color:#cdd6e6;font-weight:600;font-size:13.5px;margin-left:16px;cursor:pointer}.nav .lnk:hover{color:#fff}
.nav .sp{flex:1}
.nav .cart{position:relative;color:#fff;background:#1b2436;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px}
/* hero */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero .g{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:46px 20px 52px}
.hero h1{font-size:40px;font-weight:800;line-height:1.06;letter-spacing:-.02em}
.hero p{color:#aeb8cc;font-size:17px;margin:14px 0 22px;max-width:44ch}
.hsearch{display:flex;gap:8px;background:#fff;border-radius:12px;padding:7px 7px 7px 15px;max-width:520px;align-items:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hsearch input{flex:1;border:0;outline:0;font-size:15px;font-family:inherit;color:var(--ink)}
.pop{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:#aeb8cc;align-items:center}
.pop a{background:#1b2436;border:1px solid #29344a;color:#dfe5f0;border-radius:99px;padding:5px 11px;font-weight:600;cursor:pointer}
.hero img.hph{width:100%;max-width:560px;border-radius:18px;box-shadow:0 26px 50px rgba(0,0,0,.5);object-fit:cover;aspect-ratio:16/11}
/* trust */
.trust{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 12px rgba(12,18,32,.06);padding:16px 20px;margin-top:-26px;position:relative;z-index:3}
.trust div{display:flex;align-items:center;gap:9px}.trust .d{width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.trust b{display:block;font-size:12.5px}.trust span{font-size:11px;color:var(--muted)}
/* blocks */
.blk{padding:40px 0 4px}.blk .hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
.blk h2{font-size:24px;font-weight:800;letter-spacing:-.01em}.blk .sub{color:var(--muted);font-size:14px;margin-top:4px}
.link{color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 1px 3px rgba(12,18,32,.06);transition:transform .16s,box-shadow .16s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(12,18,32,.12)}
.mc .im{aspect-ratio:4/3;background:var(--soft);overflow:hidden}.mc .im img{width:100%;height:100%;object-fit:cover}
.mc .bd{padding:13px 15px}.mc .bd b{font-size:15px}.mc .bd p{color:var(--muted);font-size:12.5px;margin:2px 0 8px}.mc .go{color:var(--accent);font-weight:700;font-size:12.5px}
.sc{position:relative;height:120px;border-radius:12px;overflow:hidden;background:var(--ink);cursor:pointer}
.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,18,32,.15),rgba(12,18,32,.85))}
.sc .m{position:absolute;left:14px;bottom:12px;z-index:2;color:#fff}.sc .m b{font-size:15px}.sc .m span{display:block;font-size:11px;color:#dfe5f0}
.sc .ph{position:absolute;inset:0;display:grid;place-items:center;color:#3a465c;font-weight:800}
/* product card */
.pc .im{aspect-ratio:1;background:var(--soft);display:grid;place-items:center;overflow:hidden}.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:11px 13px}.pc .bd .cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pc .bd h4{font-size:13.5px;font-weight:700;line-height:1.3;margin:3px 0;min-height:2.5em}
.pc .ft{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.pc .ft b{font-size:15px}
.pc .add{width:100%;justify-content:center}
/* generic page */
.page{padding:24px 0 40px}.crumb{font-size:13px;color:var(--muted);padding:16px 0 0}.crumb a{color:var(--accent);cursor:pointer}
.keyspecs{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0}.keyspecs .k b{font-size:16px}.keyspecs .k span{display:block;font-size:11px;color:var(--muted)}
.spec{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.spec .r{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}.spec .r:first-child{border-top:0}.spec .r span{color:var(--muted)}.spec .r b{font-weight:600}
/* part detail */
.pd{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.pd .big{background:#fff;border:1px solid var(--line);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}.pd .big img{width:100%;height:100%;object-fit:contain}
.pd h1{font-size:26px;font-weight:800}.pd .price{font-size:30px;font-weight:800;color:var(--accent);margin:12px 0 4px}
.fitwrap{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.fitwrap h4{font-size:14px;margin-bottom:10px}
.fit{display:flex;flex-wrap:wrap;gap:8px}.fit span{display:inline-flex;align-items:center;gap:5px;background:#E4F4EC;color:var(--ok);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px}
.qty{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.qty button{width:38px;height:44px;border:0;background:#fff;font-size:18px;cursor:pointer}.qty input{width:44px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);font-family:inherit;font-weight:700}
/* ai */
.ai{max-width:840px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}
.ai .hdr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.ai .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.msg{font-size:14px;padding:11px 13px;border-radius:13px;margin-bottom:9px;max-width:92%}.msg.b{background:var(--soft)}.msg.u{background:var(--accent);color:#fff;margin-left:auto}
.dxchip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;margin:3px}
.dxcard{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0}
.dxcard .bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:5px 0}.dxcard .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#F5B301)}
/* model overview */
.ovhero{background:linear-gradient(180deg,#eef2f8,#e3ebf4)}
.ovh-g{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;align-items:center;padding:26px 20px 30px}
.ovh-info h1{letter-spacing:-.02em}
.ovks{display:flex;gap:20px;flex-wrap:wrap;margin:16px 0}
.ks1 b{font-size:16px;display:block}.ks1 span{font-size:11px;color:var(--muted)}
.ovh-media{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:start}
.ovh-main{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 14px 30px rgba(12,18,32,.12);aspect-ratio:16/11}
.ovh-main img{width:100%;height:100%;object-fit:cover}
.ovh-thumbs{display:flex;flex-direction:column;gap:9px}
.ovthumb{border:2px solid transparent;border-radius:9px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:#fff}
.ovthumb img{width:100%;height:100%;object-fit:cover}.ovthumb.on{border-color:var(--accent)}
.ovthumb.more{display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:14px;line-height:1;text-align:center}
.ovthumb.more span{display:block;font-size:9px;font-weight:600;margin-top:2px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:18px;overflow:auto}
.tab{padding:13px 2px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab.on{color:var(--accent);border-color:var(--accent)}.tab:hover{color:var(--ink)}
.ov-body{display:grid;grid-template-columns:250px 1fr 240px;gap:22px;align-items:start;padding-top:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.intel .ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.io{display:flex;flex-direction:column;margin-top:10px}.io span{font-size:11px;color:var(--muted)}.io b{font-size:16px}
.pbar{height:6px;background:var(--soft);border-radius:99px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent)}
.ct{font-size:11px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.cmg{display:flex;gap:8px}.cmp{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.cmp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft);margin-bottom:3px}
.ov-left,.ov-right{position:sticky;top:74px;display:flex;flex-direction:column;gap:14px}
.sysg .sc{height:130px}
.qa{display:flex;align-items:center;gap:10px;padding:9px 4px;cursor:pointer;border-top:1px solid var(--line);margin-top:4px}
.qa:first-of-type{border-top:0;margin-top:8px}.qa span{font-size:18px}.qa b{font-size:13px;display:block}.qa i{font-style:normal;font-size:11px;color:var(--muted)}
.need{background:#EAF1FF;border-color:#d5e2fb}.need p{font-size:12.5px;color:var(--muted);margin:6px 0 10px}.need .btn{width:100%;justify-content:center}
@media(max-width:1080px){.ov-body{grid-template-columns:1fr}.ov-left,.ov-right{position:static}.ovh-g{grid-template-columns:1fr}}
/* exploded diagram */
.diag{display:grid;grid-template-columns:190px 1fr 1.15fr;gap:18px;align-items:start}
.dnav{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;max-height:640px;overflow:auto;position:sticky;top:74px}
.dnav-sys{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 3px;font-weight:700}
.dnav-item{font-size:13px;padding:7px 9px;border-radius:7px;cursor:pointer}.dnav-item:hover{background:var(--soft)}
.dnav-item.on{background:#FDECEC;color:var(--accent);font-weight:700}
.dframe{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;padding:12px;min-height:380px}
.dframe img{max-width:100%;height:auto;mix-blend-mode:multiply}
.dbadge{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.dlist .dtitle{margin-bottom:12px}.dlist .dtitle b{font-size:16px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:26px 48px 1fr auto auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;transition:box-shadow .14s,border-color .14s}
.prow[role=button]{cursor:pointer}.prow[role=button]:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(12,18,32,.08)}
.prn{color:var(--muted);font-weight:700;font-size:12px;text-align:center}
.pthumb{width:48px;height:48px;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover}.pno-b{font-weight:800;color:#c4ccd8}
.pinfo{min-width:0}.pnm{display:block;font-size:13.5px;font-weight:600;line-height:1.25}.pinfo .mono{font-size:11px}
.pprice{text-align:right;white-space:nowrap}.pprice b{font-size:14px}.pprice .stock{display:block;font-size:10.5px;font-weight:700}.pprice .tbd{color:var(--muted);font-size:12px}
.miniadd{display:inline-block;background:#FDECEC;color:var(--accent);font-weight:700;font-size:12px;padding:7px 12px;border-radius:8px;white-space:nowrap}
.miniadd:hover{background:var(--accent);color:#fff}
@media(max-width:560px){.prow{grid-template-columns:40px 1fr auto;grid-template-areas:'t i p' 't i a'}.prn{display:none}.pthumb{grid-area:t}.pinfo{grid-area:i}.pprice{grid-area:p}.pact{grid-area:a}}
@media(max-width:980px){.diag{grid-template-columns:1fr}.dframe{order:1}.dlist{order:2}.dnav{order:3;position:static;max-height:none}.dnav-item{display:inline-block;margin:2px}.dnav-sys{display:block}}
/* misc */
.notice{background:#FDF3E2;color:#8a5a00;border:1px solid #f3d9a6;border-radius:10px;padding:10px 14px;font-size:13px;margin:12px 0}
.empty{text-align:center;color:var(--muted);padding:50px}
.foot{background:var(--ink);color:#aeb8cc;margin-top:44px;padding:30px 0}.foot .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.foot b{color:#fff}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:60px auto}@keyframes s{to{transform:rotate(360deg)}}
.wa{position:fixed;right:16px;bottom:16px;z-index:60}
@media(max-width:980px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.trust{grid-template-columns:repeat(2,1fr)}.hero .g,.pd{grid-template-columns:1fr}.hero img.hph{display:none}.hero h1{font-size:32px}.nav .lnk{display:none}}
@media(max-width:560px){.g4,.g5,.trust{grid-template-columns:1fr}}
</style>

var STATE = { products:[], byCat:{}, byPn:{}, pnPlate:{}, loaded:false, error:false };
function normPn(s){return String(s||'').replace(/\s+/g,'').toUpperCase();}
var $ = function(s,r){return (r||document).querySelector(s);};
function money(n){var c=(CFG.currency&&CFG.currency.symbol)||CFG.currency||'UGX';return c+' '+Number(n||0).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function partNo(kw){var m=String(kw||'').match(/\b[A-Z0-9]{2}\s?[A-Z0-9]{2,4}\s?[A-Z0-9]{2}\b/);return m?m[0]:'';}
function shopAdd(id){return (CFG.shopUrl||'#')+'?add='+encodeURIComponent(id);}
function shopCat(c){return (CFG.shopUrl||'#')+'?cat='+encodeURIComponent(c);}

/* ---------- data ---------- */
function normalize(json){
  var arr = Array.isArray(json)?json:(json.rows||json.products||json.items||json.data||[]);
  if(!Array.isArray(arr)){ for(var k in json){ if(Array.isArray(json[k])){arr=json[k];break;} } }
  return (arr||[]).map(function(p,i){
    return {
      id: p._row||p.id||p.ID||i,
      name: p['Product Name']||p.name||p.Name||'',
      cat: p.Category||p.category||'Other',
      price: p.Price_UGX!=null?p.Price_UGX:(p.price!=null?p.price:0),
      stock: (p.Stock!=null?p.Stock:(p.stock!=null?p.stock:null)),
      img: p.Image||p.image||p.image_url||'',
      kw: p.Keywords||p.keywords||'',
      desc: p.Description||p.description||''
    };
  }).filter(function(p){return p.name;});
}
function loadCatalogue(){
  if(!CFG.catalogueUrl){ STATE.error=true; render(); return; }
  fetch(CFG.catalogueUrl,{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(j){
    STATE.products = normalize(j); STATE.byCat={}; STATE.byPn={};
    STATE.products.forEach(function(p){ (STATE.byCat[p.cat]=STATE.byCat[p.cat]||[]).push(p); var pn=normPn(partNo(p.kw)); if(pn)STATE.byPn[pn]=p; });
    (DIAG&&DIAG.plates||[]).forEach(function(pl){ (pl.parts||[]).forEach(function(x){ STATE.pnPlate[normPn(x.pn)]=pl.plate; }); });
    STATE.loaded=true; render();
  }).catch(function(){ STATE.error=true; STATE.loaded=true; render(); });
}
function systemsWithCounts(){
  return (CFG.systems||[]).map(function(s){
    var list=STATE.byCat[s.name]||STATE.byCat[s.id]||[];
    return {id:s.id,name:s.name,count:list.length,cover:(list[0]&&list[0].img)||''};
  });
}

/* ---------- shell ---------- */
function nav(){
  return '<header class="nav"><div class="wrap">'
   +'<div class="brand" onclick="go(\'\')"><span class="emb">'+esc(CFG.initials||'EA')+'</span><span><b>'+esc(CFG.name||'Auto Part')+'</b><i>'+esc((CFG.eyebrow||'GENUINE SPARES').toUpperCase())+'</i></span></div>'
   +'<span class="sp"></span>'
   +'<span class="lnk" onclick="go(\'\')">Home</span>'
   +'<span class="lnk" onclick="go(\'parts\')">Parts</span>'
   +'<span class="lnk" onclick="go(\'ai\')">AI Assistant</span>'
   +'<a class="cart" href="'+esc(CFG.shopUrl||'#')+'">Cart</a>'
   +'</div></header>';
}
function foot(){
  var cc=[];if(CFG.phone)cc.push(esc(CFG.phone));if(CFG.email)cc.push(esc(CFG.email));if(CFG.website)cc.push(esc(CFG.website));
  return '<footer class="foot"><div class="wrap"><div><b>'+esc(CFG.name||'')+'</b> · '+esc(CFG.eyebrow||'')+'<div style="font-size:12px;margin-top:4px">'+cc.join(' · ')+'</div></div><div style="font-size:12px">Genuine parts guarantee · 1 Year Warranty</div></div></footer>';
}
function trust(){
  var items=(CFG.trustLine||'100% Genuine Parts · Interactive Diagrams · Fast Delivery · Expert Support').split('·');
  return '<div class="wrap"><div class="trust">'+items.map(function(t){t=t.trim();return t?'<div><span class="d">✓</span><div><b>'+esc(t)+'</b></div></div>':'';}).join('')+'</div></div>';
}

/* ---------- views ---------- */
function vHome(){
  var models=(MODELS||[]).slice(0,5).map(function(m){
    return '<div class="card mc" onclick="go(\'model/'+m.id+'\')"><div class="im"><img src="'+(IMG[m.id]||'')+'" alt=""></div><div class="bd"><b>'+esc(m.name)+'</b><p>'+esc(m.tagline)+'</p><span class="go">Explore parts ›</span></div></div>';
  }).join('');
  var sys=systemsWithCounts().map(function(s){
    var bg=s.cover?'<img src="'+esc(s.img||s.cover)+'" alt="">':'<div class="ph">'+esc(s.name)+'</div>';
    return '<div class="sc" onclick="go(\'system/'+encodeURIComponent(s.name)+'\')">'+ (s.cover?'<img src="'+esc(s.cover)+'">':'')+'<div class="ph" style="'+(s.cover?'display:none':'')+'"></div><div class="m"><b>'+esc(s.name)+'</b><span>'+s.count+' parts</span></div></div>';
  }).join('');
  var pop=STATE.products.slice().sort(function(a,b){return (b.price)-(a.price);}).slice(0,5).map(prodCard).join('')

     +'<div class="pop"><span>Popular:</span><a onclick="qsearch(\'Clutch\')">Clutch Plate</a><a onclick="qsearch(\'Filter\')">Air Filter</a><a onclick="qsearch(\'Spark\')">Spark Plug</a><a onclick="qsearch(\'Brake\')">Brake Shoe</a></div>'
   +'</div><div style="text-align:center"><img class="hph" src="'+(IMG.hero||'')+'" alt=""></div></div></section>'

   +'<section class="blk wrap"><div class="hd"><div><h2>Browse by system</h2><div class="sub">Jump straight to the parts for each system.</div></div><span class="link" onclick="go(\'parts\')">View all parts ›</span></div><div class="g5">'+sys+'</div></section>'
   + (STATE.products.length? '<section class="blk wrap"><div class="hd"><div><h2>Popular parts</h2></div></div><div class="g5">'+pop+'</div></section>':'')
   + (STATE.error?'<div class="wrap"><div class="notice">Live catalogue is loading or unavailable right now — parts appear once the shop feed responds.</div></div>':'')
   +foot();
}
function prodCard(p){

    +'<div class="bd"><div class="cat">'+esc(p.cat)+'</div><h4>'+esc(p.name)+'</h4>'+(pn?'<div class="mono">'+esc(pn)+'</div>':'')
    +'<div class="ft"><b>'+money(p.price)+'</b><span class="stock '+(inS?'y':'n')+'">'+(inS?'In Stock':'Order')+'</span></div>'
    +'<a class="btn btn-p btn-sm add" href="'+esc(shopAdd(p.id))+'" onclick="event.stopPropagation()">Add to Cart</a></div></div>';
}
function vParts(){

    +'<section class="blk wrap"><div class="hd"><div><h2>Parts — browse by category</h2><div class="sub">'+STATE.products.length+' genuine parts across '+sys.length+' systems.</div></div><span class="link" onclick="go(\'diagrams\')">View exploded diagrams ›</span></div><div class="g4">'+cards+'</div></section>'+foot();

function vSystem(cat){
  var list=(STATE.byCat[cat]||[]);

function vPart(id){

  var also=(STATE.byCat[p.cat]||[]).filter(function(x){return x.id!==p.id;}).slice(0,4).map(prodCard).join('');
  var pl=STATE.pnPlate[normPn(pn)];

   +'<section class="page wrap"><div class="pd"><div class="big">'+(p.img?'<img src="'+esc(p.img)+'">':'<div style="color:#c4ccd8;font-weight:800">'+esc(p.cat)+'</div>')+'</div>'
   +'<div><span class="chip g">✓ Genuine Part</span> <h1 style="margin-top:8px">'+esc(p.name)+'</h1>'+(pn?'<div class="mono" style="margin-top:4px">Part No: '+esc(pn)+'</div>':'')
   +'<div class="price">'+money(p.price)+'</div><div class="stock '+(inS?'y':'n')+'" style="margin-bottom:12px">'+(inS?('✓ In Stock'+(p.stock!=null?(' ('+p.stock+')'):'')):'Available on order')+'</div>'
   +(p.desc?'<p style="color:var(--muted);margin-bottom:16px">'+esc(p.desc)+'</p>':'')
   +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><div class="qty"><button onclick="qd(-1)">−</button><input id="qn" value="1" readonly><button onclick="qd(1)">+</button></div>'
   +'<a class="btn btn-p" href="'+esc(shopAdd(p.id))+'">🛒 Add to Cart</a>'+diagBtn+'<a class="btn btn-o" href="'+esc(waLink())+'" target="_blank">Ask on WhatsApp</a></div>'
   +'<div class="fitwrap"><h4>Compatible with</h4><div class="fit">'+fits+'</div></div>'
   +'<div class="fitwrap"><h4>Category</h4><div class="mono" style="font-size:13px">'+esc(p.cat)+'</div></div>'

   +(also?'<div class="blk"><div class="hd"><div><h2>Customers also bought</h2></div></div><div class="g4">'+also+'</div></div>':'')
   +'</section>'+foot();

function galleryFor(id){ var g=(GAL&&GAL[id])||[]; if(!g.length&&IMG[id])g=[IMG[id]]; return g; }
function findParts(words,n){
  var out=[],seen={};
  words.forEach(function(w){ w=w.toLowerCase();
    STATE.products.forEach(function(p){ if(out.length<n&&!seen[p.id]&&(p.name+' '+p.kw).toLowerCase().indexOf(w)>=0){seen[p.id]=1;out.push(p);} });
  });
  return out;
}
function ovMain(el){ var m=document.getElementById('ovMain'); if(m&&el.dataset.src)m.src=el.dataset.src; document.querySelectorAll('.ovthumb').forEach(function(t){t.classList.remove('on');}); el.classList.add('on'); }
function vModel(id){
  var m=(MODELS||[]).filter(function(x){return x.id===id;})[0]; if(!m) return go('');
  var g=galleryFor(id);
  var thumbs=g.slice(0,4).map(function(src,i){return '<div class="ovthumb'+(i===0?' on':'')+'" data-src="'+src+'" onclick="ovMain(this)"><img src="'+src+'"></div>';}).join('')
    + (g.length>4?'<div class="ovthumb more">+'+(g.length-4)+'<span>View more</span></div>':'');
  var ks=(m.keySpecs||[]).slice(0,4).map(function(k){return '<div class="ks1"><b>'+esc(k.v)+'</b><span>'+esc(k.l)+'</span></div>';}).join('');
  var tabs=['Overview','360° Explorer','Systems & Parts','Diagrams','Specifications','Reviews (256)','Manuals'];
  var tabH=tabs.map(function(t,i){
    var act=i===0?' on':'';
    var oc = t==='Diagrams'?'go(\'diagrams\')' : t==='Systems & Parts'?'scrollTo2(\'ov-sys\')' : t.indexOf('Specifications')>=0?'scrollTo2(\'ov-spec\')' : t.indexOf('Reviews')>=0?'scrollTo2(\'ov-rev\')' : t==='Manuals'?'scrollTo2(\'ov-man\')' : t.indexOf('360')>=0?'scrollTo2(\'ov-top\')' : 'scrollTo2(\'ov-top\')';
    return '<span class="tab'+act+'" onclick="'+oc+'">'+esc(t)+'</span>';
  }).join('');
  var sys=systemsWithCounts().map(function(s){return '<div class="sc" onclick="go(\'system/'+encodeURIComponent(s.name)+'\')">'+(s.cover?'<img src="'+esc(s.cover)+'">':'')+'<div class="m"><b>'+esc(s.name)+'</b></div></div>';}).join('');
  var common=findParts(['clutch','chain','brake shoe'],3).map(function(p){return '<a class="cmp" onclick="go(\'part/'+p.id+'\')">'+(p.img?'<img src="'+esc(p.img)+'">':'')+'<span>'+esc(p.name)+'</span></a>';}).join('');
  var pop=STATE.products.slice().sort(function(a,b){return b.price-a.price;}).slice(0,6).map(prodCard).join('');
  var specRows=Object.keys(m.specs||{}).map(function(k){return '<div class="r"><span>'+esc(k)+'</span><b>'+esc(m.specs[k])+'</b></div>';}).join('');
  var main=g[0]||'';
  return nav()
   +'<span id="ov-top"></span><section class="ovhero"><div class="wrap ovh-g">'
     +'<div class="ovh-info"><div class="crumb" style="padding:0 0 10px"><a onclick="go(\'\')">‹ Back to all motorcycles</a></div>'
       +'<h1 style="font-size:36px">'+esc(m.name)+' <span class="chip" style="background:#E8F0FF;color:#0E3A94;vertical-align:middle">Popular</span></h1>'
       +'<p style="color:var(--muted);font-size:17px;margin-top:4px">'+esc(m.tagline)+'</p>'
       +'<div class="ovks">'+ks+'</div>'
       +'<p style="color:var(--muted);margin:6px 0 18px;max-width:52ch">'+esc(m.summary||'')+'</p>'
       +'<a class="btn btn-p" onclick="go(\'parts\')">Explore Parts & Diagrams ›</a> <a class="btn btn-o" onclick="scrollTo2(\'ov-intel\')">📈 Vehicle Intelligence</a>'
     +'</div>'
     +'<div class="ovh-media"><div class="ovh-main">'+(main?'<img id="ovMain" src="'+main+'">':'')+'</div><div class="ovh-thumbs">'+thumbs+'</div></div>'
   +'</div></section>'
   +'<div class="wrap"><nav class="tabs">'+tabH+'</nav></div>'
   +'<section class="page wrap ov-body">'
     +'<aside class="ov-left" id="ov-intel"><div class="card intel"><div class="ih"><b>Vehicle Intelligence</b><span class="chip g">Active</span></div>'
       +'<div class="io"><span>Odometer</span><b>18,450 km</b></div><div class="io"><span>Next Service</span><b>1,550 km / 45 days</b><div class="pbar"><i style="width:72%"></i></div></div>'
       +'<div class="ct">Common at this mileage</div><div class="cmg">'+common+'</div>'
       +'<a class="link" onclick="go(\'parts\')">See all recommendations ›</a></div></aside>'
     +'<div class="ov-mid"><div class="hd"><div><h2 id="ov-sys">Browse by system</h2><div class="sub">Select a system to view parts, diagrams and components.</div></div><span class="link" onclick="go(\'parts\')">View all systems ›</span></div>'
       +'<div class="g4 sysg">'+sys+'</div>'
       +'<div class="hd" style="margin-top:30px"><div><h2 id="ov-spec">Specifications</h2></div></div><div class="spec">'+specRows+'</div>'
       +'<div class="hd" style="margin-top:30px"><div><h2 id="ov-rev">Reviews</h2><div class="sub">⭐ 4.6 · 256 reviews</div></div></div>'
       +'<div class="hd" style="margin-top:30px"><div><h2 id="ov-man">Manuals & Downloads</h2><div class="sub">Owner manual and service guides — available on request via WhatsApp.</div></div></div>'
     +'</div>'
     +'<aside class="ov-right"><div class="card"><b>Quick Actions</b>'
       +'<a class="qa" onclick="go(\'parts\')"><span>🔍</span><div><b>Search Parts</b><i>Find parts by number</i></div></a>'
       +'<a class="qa" onclick="go(\'ai\')"><span>🤖</span><div><b>Ask AI Assistant</b><i>Get help for your bike</i></div></a>'
       +'<a class="qa" href="'+esc(waLink())+'" target="_blank"><span>📷</span><div><b>Upload Photo</b><i>Identify parts</i></div></a>'
       +'<a class="qa" onclick="go(\'diagrams\')"><span>🧩</span><div><b>Part Compatibility</b><i>Check fitment</i></div></a>'
       +'<a class="qa" onclick="go(\'ai\')"><span>🗓️</span><div><b>Service Schedule</b><i>View maintenance plan</i></div></a></div>'
       +'<div class="card need"><b>Need help?</b><p>Our experts are ready to help you find the right part.</p><a class="btn btn-w" href="'+esc(waLink())+'" target="_blank">Chat on WhatsApp</a></div></aside>'
   +'</section>'
   +'<section class="blk wrap"><div class="hd"><div><h2>Popular parts for '+esc(m.name)+'</h2></div><span class="link" onclick="go(\'parts\')">View all parts ›</span></div><div class="g5">'+pop+'</div></section>'
   +foot();
}
function scrollTo2(id){var e=document.getElementById(id); if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}
function vSearch(q){
  q=decodeURIComponent(q||'').toLowerCase();
  var res=STATE.products.filter(function(p){return (p.name+' '+p.kw+' '+p.cat).toLowerCase().indexOf(q)>=0;});
  return nav()+'<div class="wrap crumb"><a onclick="go(\'\')">Home</a> › Search</div>'
   +'<section class="blk wrap"><div class="hd"><div><h2>Results for "'+esc(q)+'"</h2><div class="sub">'+res.length+' parts found</div></div></div>'
   +(res.length?'<div class="g5">'+res.slice(0,60).map(prodCard).join('')+'</div>':'<div class="empty">No parts matched. Try a part number or a keyword like "clutch" or "brake".</div>')+'</section>'+foot();
}
function plateImg(pl){ for(var i=0;i<(pl.parts||[]).length;i++){var pr=STATE.byPn[normPn(pl.parts[i].pn)]; if(pr&&pr.img)return pr.img;} return ''; }
function vDiagram(plateNo){
  var plates=(DIAG&&DIAG.plates)||[]; if(!plates.length) return nav()+'<div class="empty">Diagrams unavailable.</div>'+foot();
  plateNo=parseInt(plateNo)||plates[0].plate;
  var cur=plates.filter(function(p){return p.plate==plateNo;})[0]||plates[0];
  var groups={}; plates.forEach(function(p){(groups[p.system]=groups[p.system]||[]).push(p);});
  var navHtml=Object.keys(groups).map(function(sys){
    return '<div class="dnav-sys">'+esc(sys)+'</div>'+groups[sys].map(function(p){
      return '<div class="dnav-item'+(p.plate==cur.plate?' on':'')+'" onclick="go(\'plate/'+p.plate+'\')">'+esc(p.name)+'</div>';
    }).join('');
  }).join('');
  var rows=(cur.parts||[]).map(function(x){
    var pr=STATE.byPn[normPn(x.pn)];
    var nm=esc(x.d||(pr&&pr.name)||'Part');
    var img=pr&&pr.img;
    var inS=pr?(pr.stock===null||pr.stock>0):null;
    var open=pr?('onclick="go(\'part/'+pr.id+'\')"'):'';
    var thumb=img?'<img src="'+esc(img)+'">':'<span class="pno-b">'+esc(x.no)+'</span>';
    var priceHtml=pr?('<b>'+money(pr.price)+'</b>'+(inS!=null?'<span class="stock '+(inS?'y':'n')+'">'+(inS?'In stock':'On order')+'</span>':'')):'<span class="tbd">Ask us</span>';
    var add=pr?('<a class="miniadd" href="'+esc(shopAdd(pr.id))+'" onclick="event.stopPropagation()" title="Add to cart">+ Add</a>'):'';
    return '<div class="prow" '+open+(pr?' role="button"':'')+'>'
      +'<span class="prn">'+esc(x.no)+'</span>'
      +'<span class="pthumb">'+thumb+'</span>'
      +'<span class="pinfo"><span class="pnm">'+nm+'</span><span class="mono">'+esc(x.pn)+'</span></span>'
      +'<span class="pprice">'+priceHtml+'</span>'
      +'<span class="pact">'+add+'</span></div>';
  }).join('');
  var img=plateImg(cur);
  return nav()+'<div class="wrap crumb"><a onclick="go(\'\')">Home</a> › <a onclick="go(\'parts\')">Parts</a> › Diagrams › '+esc(cur.system)+'</div>'
   +'<section class="page wrap"><div class="diag">'
   +'<aside class="dnav">'+navHtml+'</aside>'
   +'<div class="dframe">'+(img?'<img src="'+esc(img)+'">':'<div class="empty">Diagram appears once parts are imported.</div>')+'<span class="dbadge">Plate '+cur.plate+'</span></div>'
   +'<div class="dlist"><div class="dtitle"><b>'+esc(cur.system)+' › '+esc(cur.name)+'</b><div class="mono">Plate '+cur.plate+' · '+(cur.parts||[]).length+' parts · tap any part to view or add it</div></div>'
   +'<div class="plist">'+rows+'</div></div>'
   +'</div></section>'+foot();
}
function vAI(){
  var chips=(TB.problems||[]).map(function(p){return '<span class="dxchip" onclick="dx(\''+p.id+'\')">'+esc(p.label)+'</span>';}).join('');
  return nav()+'<section class="page wrap"><div class="ai"><div class="hdr"><span class="av">AI</span><div><b>'+esc(CFG.name||'')+' Assistant</b><div style="font-size:12px;color:var(--ok)">● Online</div></div></div>'
   +'<div class="msg b">'+esc(TB.greeting||'Describe the symptom and I\'ll point you to the likely cause and the genuine part.')+'</div>'
   +'<div style="margin:8px 0"><span style="font-size:12px;color:var(--muted)">Common issues:</span> '+chips+'</div>'
   +'<div id="dxout"></div></div></section>'+foot();
}
function dx(id){
  var p=(TB.problems||[]).filter(function(x){return x.id===id;})[0]; if(!p)return;
  var cards=(p.causes||[]).map(function(c){
    return '<div class="dxcard"><div style="flex:1"><div style="display:flex;justify-content:space-between"><b>'+esc(c.name)+'</b><b style="color:var(--accent)">'+c.probability+'%</b></div><div class="bar"><i style="width:'+c.probability+'%"></i></div><div style="font-size:12px;color:var(--muted)">'+esc(c.partName||'')+'</div><div style="margin-top:6px"><a class="btn btn-p btn-sm" onclick="qsearch(\''+esc((c.partName||c.name).split(" ")[0])+'\')">View parts</a></div></div></div>';
  }).join('');
  var steps=(p.steps||[]).map(function(s){return '<li>'+esc(s)+'</li>';}).join('');
  $('#dxout').innerHTML='<div class="msg u">'+esc(p.query)+'</div><div class="msg b"><p>'+esc(p.intro)+'</p>'+cards+(steps?'<div style="border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin-top:6px"><b style="font-size:13px">Suggested next steps</b><ol style="margin:6px 0 0 18px;font-size:13px;color:var(--muted)">'+steps+'</ol></div>':'')+'</div>';
  $('#dxout').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- router ---------- */
function waLink(){return CFG.waNumber?('https://wa.me/'+CFG.waNumber):'#';}
function go(path){location.hash='#/'+path;}
function qsearch(q){go('search/'+encodeURIComponent(q));}
function doSearch(e){e.preventDefault();var v=$('#q').value.trim();if(v)qsearch(v);return false;}
function qd(d){var n=$('#qn');n.value=Math.max(1,(parseInt(n.value)||1)+d);}
function render(){
  var h=(location.hash||'').replace(/^#\//,''); var parts=h.split('/');
  var v;
  if(!STATE.loaded && !STATE.error){ v=nav()+'<div class="spin"></div>'; document.getElementById('app').innerHTML=v; return; }
  if(parts[0]==='part') v=vPart(parts[1]);
  else if(parts[0]==='system') v=vSystem(decodeURIComponent(parts.slice(1).join('/')));
  else if(parts[0]==='model') v=vModel(parts[1]);
  else if(parts[0]==='parts') v=vParts();
  else if(parts[0]==='plate'||parts[0]==='diagram'||parts[0]==='diagrams') v=vDiagram(parts[1]);
  else if(parts[0]==='search') v=vSearch(parts.slice(1).join('/'));
  else if(parts[0]==='ai') v=vAI();
  else v=vHome();
  document.getElementById('app').innerHTML=v;
  window.scrollTo(0,0);
  var r=document.documentElement.style; if(CFG.accent)r.setProperty('--accent',CFG.accent); if(CFG.accentDark)r.setProperty('--accent-d',CFG.accentDark);
  var wf=document.getElementById('waFloat'); if(wf)wf.href=waLink();
}
window.addEventListener('hashchange',render);
(function(){var r=document.documentElement.style;if(CFG.accent)r.setProperty('--accent',CFG.accent);if(CFG.accentDark)r.setProperty('--accent-d',CFG.accentDark);
 document.getElementById('waFloat').href=waLink(); render(); loadCatalogue();})();
</script>
