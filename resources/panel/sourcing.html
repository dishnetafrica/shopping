<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sourcing Requests</title>
<style>
  :root{--gd:#0B3D22;--g:#15803D;--amber:#92400e;--mute:#94a3b8;--bg:#f5f5f2;--border:#e8e8e3;--font:'Inter',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:var(--font);color:#0f0f0f;}
  .wrap{max-width:640px;margin:0 auto;padding:14px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .top h1{font-size:20px;margin:0;font-weight:900;}.top a{color:var(--g);text-decoration:none;font-weight:700;font-size:13px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .cards>div{border-radius:14px;padding:13px;color:#fff;}
  .cnew{background:linear-gradient(135deg,#d97706,#92400e);}.cprc{background:linear-gradient(135deg,#15803D,#0B3D22);}
  .cards .t{font-size:10.5px;opacity:.85;font-weight:700;text-transform:uppercase;}.cards .n{font-size:22px;font-weight:900;margin-top:2px;}
  .addp{width:100%;background:#0B3D22;color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:14px;}
  .sub{font-size:12px;color:var(--mute);font-weight:600;margin-bottom:8px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;}
  .card.done{opacity:.6;}
  .ph{flex:0 0 auto;width:60px;height:60px;border-radius:11px;overflow:hidden;background:#f1f5f9;display:grid;place-items:center;color:#94a3b8;font-size:22px;}
  .ph img{width:100%;height:100%;object-fit:cover;}
  .mid{flex:1;min-width:0;}
  .nm{font-size:15px;font-weight:800;line-height:1.2;}
  .meta{font-size:11.5px;color:#64748b;margin-top:3px;font-weight:600;}
  .badges{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;}
  .d-low{background:#eef2f7;color:#475569;}.d-medium{background:#E6F1FB;color:#185FA5;}.d-high{background:#FCEBEB;color:#B4232A;}
  .s-new{background:#FFF7E6;color:#92400e;}.s-priced{background:#E6F4EA;color:#0B3D22;}.s-closed{background:#eef2f7;color:#64748b;}
  .price{margin-top:8px;background:#E6F4EA;border:1px solid #BFE3CB;border-radius:10px;padding:8px 10px;font-size:12.5px;color:#0B3D22;font-weight:700;}
  .price small{color:#3f6f52;font-weight:600;}
  .acts{margin-top:10px;display:flex;gap:7px;}
  .acts button{border:none;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800;cursor:pointer;}
  .b-price{background:#0B3D22;color:#fff;}.b-done{background:#eef2f7;color:#475569;}.b-wa{background:#25D366;color:#fff;}
  .empty{text-align:center;color:var(--mute);padding:36px 20px;font-size:14px;font-weight:600;}
  .loading{text-align:center;color:var(--mute);padding:24px;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid var(--border);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -8px 30px -10px rgba(0,0,0,.25);transform:translateY(110%);transition:.22s;max-height:88vh;overflow:auto;}
  .sheet.on{transform:translateY(0);}
  .sheet h3{margin:0 0 4px;font-size:16px;font-weight:800;}.sheet .who{font-size:12px;color:#64748b;font-weight:700;margin-bottom:6px;}
  .sheet label{display:block;font-size:12px;font-weight:700;color:#374151;margin:10px 0 5px;}
  .sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:11px;font-size:16px;font-family:inherit;}
  .sheet .g2{display:flex;gap:10px;}.sheet .g2>*{flex:1;}
  .chips{display:flex;gap:6px;}.chip{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-size:12.5px;font-weight:800;color:#374151;text-align:center;cursor:pointer;}
  .chip.on{border-color:#15803D;background:#E6F4EA;color:#0B3D22;}
  .save{width:100%;margin-top:14px;background:#0B3D22;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;}
  .cancel{position:absolute;right:14px;top:14px;background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:79;display:none;}.backdrop.on{display:block;}
</style><!-- ===== DishNet mobile app shell (injected v2) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dn-shell">
  :root{--dn-g:#15803D;--dn-gd:#0B3D22;--dn-gl:#E6F4EA;--dn-line:#E2E8E2;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px)!important;}
  .top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
       justify-content:flex-start;margin:-14px -14px 14px -14px!important;
       padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px!important;
       background:var(--dn-gd);box-shadow:0 2px 10px -4px rgba(11,61,34,.5);}
  .top h1{color:#fff!important;font-size:17px!important;font-weight:800!important;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top a{order:-1;flex-shrink:0;width:34px;height:34px;border-radius:50%;
         background:rgba(255,255,255,.16)!important;color:#fff!important;
         display:grid;place-items:center;font-size:0!important;text-decoration:none;}
  .top a::before{content:"\2039";font-size:24px;font-weight:700;line-height:1;margin-top:-2px;}
  .dn-appbtn{margin-left:auto;flex-shrink:0;height:34px;padding:0 13px;border-radius:99px;
             background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:700;
             display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .dn-appbtn:active{background:rgba(255,255,255,.28);}
  .btn{background:var(--dn-gd)!important;border-radius:12px!important;padding:14px!important;font-weight:800!important;}
  .btn:active{background:#082a18!important;}
  input,select,textarea{font-size:16px!important;border-radius:11px!important;}
  input:focus,select:focus,textarea:focus{border-color:var(--dn-g)!important;}
  .card,.oitem,.item,.balcard,.hero{box-shadow:0 1px 2px rgba(16,35,28,.05),0 3px 12px -4px rgba(16,35,28,.06);}
  .dn-amt-echo{display:none;margin:9px 0 2px;padding:8px 12px;border-radius:10px;
               background:var(--dn-gl);border:1px solid #BFE3CB;color:var(--dn-gd);
               font-size:16px;font-weight:800;letter-spacing:.2px;}
  .dn-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;min-height:58px;
             background:#fff;border-top:1px solid var(--dn-line);
             padding-bottom:env(safe-area-inset-bottom,0px);
             box-shadow:0 -2px 14px -6px rgba(16,35,28,.18);}
  .dn-tabbar a{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;
               gap:3px;padding:9px 2px 8px;text-decoration:none;color:#7C8A80;font-size:10.5px;font-weight:700;}
  .dn-tabbar a .di{font-size:20px;line-height:1;filter:grayscale(35%);opacity:.85;}
  .dn-tabbar a .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .dn-tabbar a.on{color:var(--dn-gd);}
  .dn-tabbar a.on .di{filter:none;opacity:1;transform:translateY(-1px);}
  .dn-tabbar a.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--dn-g);}
  @media(min-width:721px){.dn-tabbar{max-width:720px;margin:0 auto;border-left:1px solid var(--dn-line);border-right:1px solid var(--dn-line);}}
</style>
</head>
<body><div class="wrap">
  <div class="top"><h1>🔎 Sourcing Requests</h1><a href="/panel">← Panel</a></div>
  <div class="cards">
    <div class="cnew"><div class="t">Needs price</div><div class="n" id="cNew">0</div></div>
    <div class="cprc"><div class="t">Priced</div><div class="n" id="cPrc">0</div></div>
  </div>
  <button class="addp" onclick="openNew()">＋ New request (get me a price)</button>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="sub" id="sub" style="margin:0">Requests</div><button onclick="setPurchaser()" style="background:#eef2f7;border:none;border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#475569;cursor:pointer" id="jbtn">⚙ Jayesh’s WhatsApp</button></div>
  <div id="list"><div class="loading">Loading…</div></div>
</div>

<div class="backdrop" id="backdrop" onclick="closeAll()"></div>

<!-- new request (Asish) -->
<div class="sheet" id="newForm">
  <button class="cancel" onclick="closeAll()">✕</button>
  <h3>New sourcing request</h3><div class="who">Ask Jayesh to find a price</div>
  <label>Item customers want</label><input id="nItem" placeholder="e.g. Sunlight bar soap 250g">
  <label>Note (optional)</label><textarea id="nNote" rows="2" placeholder="e.g. 3 customers asked; want a carton price"></textarea>
  <label>Demand</label>
  <div class="chips" id="nDemand"><div class="chip" data-d="low">Low</div><div class="chip on" data-d="medium">Medium</div><div class="chip" data-d="high">High</div></div>
  <label>Photo (optional)</label><input id="nPhoto" type="file" accept="image/*" capture="environment">
  <button class="save" id="nSave" onclick="saveNew()">Send request</button>
</div>

<!-- price (Jayesh) -->
<div class="sheet" id="priceForm">
  <button class="cancel" onclick="closeAll()">✕</button>
  <h3>Add price found</h3><div class="who" id="pWho"></div>
  <div class="g2"><div style="max-width:120px"><label>Currency</label><select id="pCur"><option>UGX</option><option>USD</option><option>SSP</option></select></div>
  <div><label>Price found</label><input id="pPrice" inputmode="decimal" placeholder="0"></div></div>
  <label>Supplier (optional)</label><input id="pSupplier" placeholder="e.g. Kikuubo shop">
  <label>Availability (optional)</label><input id="pAvail" placeholder="e.g. in stock / 3 days">
  <label>Note (optional)</label><textarea id="pNote" rows="2" placeholder="pack size, min order, etc."></textarea>
  <button class="save" id="pSave" onclick="savePrice()">Save price</button>
</div>

<!-- convert to catalogue product -->
<div class="sheet" id="convForm">
  <button class="cancel" onclick="closeAll()">✕</button>
  <h3>Add to catalogue</h3><div class="who" id="cWho"></div>
  <label>Product name</label><input id="cName" placeholder="Name shown to customers">
  <div class="g2">
    <div><label>Cost (Jayesh’s price)</label><input id="cCost" inputmode="decimal" readonly style="background:#f3f5f7"></div>
    <div><label>Selling price (Juba)</label><input id="cPrice" inputmode="decimal" placeholder="0" oninput="cMargin()"></div>
  </div>
  <div class="who" id="cMarginMsg" style="margin:-4px 0 6px"></div>
  <label>Category</label><input id="cCat" list="catDL" placeholder="e.g. Foil & Cling"><datalist id="catDL"></datalist>
  <div class="g2">
    <div><label>MOQ (optional)</label><input id="cMoq" inputmode="numeric" placeholder="e.g. 10"></div>
    <div><label>Unit (optional)</label><input id="cUnit" placeholder="e.g. cartons"></div>
  </div>
  <button class="save" id="cSave" onclick="saveConvert()">➕ Create product</button>
</div>

<script>
const $=s=>document.getElementById(s);
function nf(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var NDEMAND='medium', PID=null, REQS=[], BUYER={phone:'',name:'',auto:false};
function purchaserNo(){ return (BUYER&&BUYER.phone)||''; }
function setPurchaser(){
  var name=prompt('Buyer\u2019s name (who prices \u2014 e.g. Jayesh Bhai):', BUYER.name||'Jayesh Bhai'); if(name===null)return;
  var v=prompt('Buyer\u2019s WhatsApp number (with country code, e.g. 2567XXXXXXXX):', BUYER.phone||'');
  if(v===null) return; v=(v||'').replace(/[^0-9]/g,'');
  fetch('/papi/sourcing/buyer',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:new URLSearchParams({phone:v,name:name.trim()})})
    .then(r=>r.json()).then(function(r){ if(r&&r.ok){BUYER.phone=r.phone;BUYER.name=name.trim();refreshJbtn();} else alert('Could not save'); });
}
function refreshJbtn(){ var n=BUYER.phone; var b=document.getElementById('jbtn'); if(b) b.textContent = n ? ('\u2699 '+(BUYER.name||'Buyer')+': '+n) : '\u2699 Set buyer\u2019s WhatsApp'; }
function notifyJayesh(item,note,demand){
  var n=BUYER.phone; if(!n) return false;
  var txt='*New sourcing request*\nItem: '+item+'\nDemand: '+demand+(note?('\nNote: '+note):'')+'\n\nPlease find a price.';
  location.href='https://wa.me/'+n+'?text='+encodeURIComponent(txt); return true;
}
// One-time migration: if an old device had the number in localStorage but the server has none, save it up.
function migrateBuyer(){ try{ var old=localStorage.getItem('src_purchaser_wa')||''; if(old && !BUYER.phone){ fetch('/papi/sourcing/buyer',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:new URLSearchParams({phone:old.replace(/[^0-9]/g,''),name:BUYER.name||'Jayesh Bhai'})}).then(r=>r.json()).then(function(r){ if(r&&r.ok){BUYER.phone=r.phone;refreshJbtn();} }); } }catch(e){} }

function load(){
  fetch('/papi/sourcing',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(r=>r.json()).then(function(d){
      if(!d.ok){ $('list').innerHTML='<div class="empty">Not available.</div>'; return; }
      REQS=d.requests||[];
      if(d.buyer){ BUYER.phone=d.buyer.phone||''; BUYER.name=d.buyer.name||''; BUYER.auto=!!d.buyer.auto; refreshJbtn(); migrateBuyer(); }
      $('cNew').textContent=d.counts.new; $('cPrc').textContent=d.counts.priced;
      var L=$('list');
      if(!REQS.length){ $('sub').textContent='Requests'; L.innerHTML='<div class="empty">No requests yet. Tap “New request”.</div>'; return; }
      $('sub').textContent=REQS.length+' request'+(REQS.length>1?'s':'');
      L.innerHTML=REQS.map(function(r){
        var ph=r.photo?'<img src="'+esc(r.photo)+'" onerror="this.style.display=\'none\'">':'📦';
        var dbadge='<span class="badge d-'+r.demand+'">'+r.demand.toUpperCase()+' DEMAND</span>';
        var slabel=(r.status==='new'?'NEEDS PRICE':(r.status==='priced'?'PRICED':(r.status==='rejected'?'NOT STOCKED':'DONE')));
        var sbadge='<span class="badge s-'+r.status+'"'+(r.status==='rejected'?' style="background:#fdecea;color:#C0392B"':'')+'>'+slabel+'</span>';
        var price='';
        if(r.status!=='new' && r.quoted_price!=null){
          price='<div class="price">'+esc(r.currency||'')+' '+nf(r.quoted_price)+
            (r.supplier?(' <small>· '+esc(r.supplier)+'</small>'):'')+
            (r.availability?(' <small>· '+esc(r.availability)+'</small>'):'')+
            (r.price_note?('<br><small>'+esc(r.price_note)+'</small>'):'')+
            (r.priced_by?('<br><small>by '+esc(r.priced_by)+'</small>'):'')+'</div>';
        }
        var chase='';
        if(r.status==='new'){
          if(r.reminders>0) chase='<span class="badge" style="background:#fff3e0;color:#b45309">asked '+(r.reminders+1)+'×</span>';
          else if(r.notified) chase='<span class="badge" style="background:#e8f0fe;color:#1877F2">asked</span>';
        }
        if(r.product_id) chase='<span class="badge" style="background:#eaf6ee;color:#15803D">✓ IN CATALOGUE</span>';
        var acts='<div class="acts">';
        if(r.status==='new') acts+='<button class="b-price" onclick="openPrice('+r.id+')">Add price</button>';
        if(r.status==='new' && BUYER.auto && BUYER.phone) acts+='<button class="b-wa" onclick="remindNow('+r.id+')">Remind now</button>';
        if(r.status==='priced'){
          acts+='<button class="b-price" onclick="openConvert('+r.id+')">➕ Add to catalogue</button>';
          acts+='<button class="b-wa" style="background:#C2700A" onclick="renegotiate('+r.id+')">Ask better price</button>';
          acts+='<button class="b-done" style="background:#C0392B" onclick="reject('+r.id+')">Too high · won’t stock</button>';
        }
        if(r.status==='rejected') acts+='<button class="b-wa" style="background:#C2700A" onclick="renegotiate('+r.id+')">Ask better price</button>';
        acts+='<button class="b-wa" onclick="waReq('+r.id+')">WhatsApp</button></div>';
        var decision=r.decision_note?('<div class="price" style="background:#fdecea;color:#C0392B"><small>🚫 '+esc(r.decision_note)+'</small></div>'):'';
        return '<div class="card'+((r.status==='closed'||r.status==='rejected')?' done':'')+'"><div class="ph">'+ph+'</div>'+
          '<div class="mid"><div class="nm">'+esc(r.item)+'</div>'+
          '<div class="meta">'+(r.requested_by?('by '+esc(r.requested_by)+' · '):'')+esc(r.date||'')+(r.note?('<br>'+esc(r.note)):'')+'</div>'+
          '<div class="badges">'+dbadge+sbadge+chase+'</div>'+price+decision+acts+'</div></div>';
      }).join('');
    }).catch(function(){ $('list').innerHTML='<div class="empty">Could not load.</div>'; });
}

document.addEventListener('click',function(e){
  var d=e.target.closest('#nDemand .chip'); if(d){ NDEMAND=d.getAttribute('data-d'); d.parentNode.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');}); d.classList.add('on'); }
});
function openNew(){ $('nItem').value='';$('nNote').value='';$('nPhoto').value=''; NDEMAND='medium';
  $('nDemand').querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-d')==='medium');});
  $('backdrop').classList.add('on'); $('newForm').classList.add('on'); setTimeout(function(){$('nItem').focus();},250); }
function closeAll(){ $('backdrop').classList.remove('on'); $('newForm').classList.remove('on'); $('priceForm').classList.remove('on'); var cf=$('convForm'); if(cf)cf.classList.remove('on'); }

function saveNew(){
  var item=$('nItem').value.trim(); if(!item){ alert('What item?'); return; }
  var noteVal=$('nNote').value.trim(); var demandVal=NDEMAND;
  var b=$('nSave'); b.disabled=true; b.textContent='Sending…';
  var fd=new FormData(); fd.append('item_name',item); fd.append('note',noteVal); fd.append('demand',demandVal);
  if($('nPhoto').files[0]) fd.append('photo',$('nPhoto').files[0]);
  fetch('/papi/sourcing',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin',body:fd})
    .then(r=>r.json()).then(function(r){ b.disabled=false; b.textContent='Send request';
      if(r&&r.ok){ closeAll(); load();
        // Server auto-sends to the buyer when configured. If it couldn't (no number / WhatsApp
        // not connected), fall back to opening WhatsApp so nothing is missed.
        if(r.sent){ if(typeof toast==='function') toast('✓ Sent to '+(BUYER.name||'the buyer')+' on WhatsApp'); }
        else { notifyJayesh(item, noteVal, demandVal); }
      } else alert('Could not send'); })
    .catch(function(){ b.disabled=false; b.textContent='Send request'; alert('Failed'); });
}

function openPrice(id){ PID=id; var r=REQS.filter(function(x){return x.id===id;})[0];
  $('pWho').textContent=r?('For: '+r.item):''; $('pPrice').value='';$('pSupplier').value='';$('pAvail').value='';$('pNote').value='';
  $('backdrop').classList.add('on'); $('priceForm').classList.add('on'); setTimeout(function(){$('pPrice').focus();},250); }
function savePrice(){
  var price=parseFloat(($('pPrice').value||'').replace(/,/g,''))||0; if(price<=0){ alert('Price?'); return; }
  var b=$('pSave'); b.disabled=true; b.textContent='Saving…';
  var body=new URLSearchParams({quoted_price:price, currency:$('pCur').value, supplier_name:$('pSupplier').value.trim(), availability:$('pAvail').value.trim(), price_note:$('pNote').value.trim()});
  fetch('/papi/sourcing/'+PID+'/price',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:body})
    .then(r=>r.json()).then(function(r){ b.disabled=false; b.textContent='Save price';
      if(r&&r.ok){ closeAll(); load(); } else alert('Could not save'); })
    .catch(function(){ b.disabled=false; b.textContent='Save price'; alert('Failed'); });
}
function setStatus(id,s){
  fetch('/papi/sourcing/'+id+'/status',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:new URLSearchParams({status:s})})
    .then(r=>r.json()).then(function(){ load(); });
}
// ---- finalise a priced request into a catalogue product ----
var CID_C=null, CATS=[];
function loadCats(){
  fetch('/papi/products',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'}).then(r=>r.json()).then(function(d){
    var seen={}; CATS=[]; ((d&&d.products)||[]).forEach(function(p){ var c=((p['Category']||'')+'').trim(); if(c&&!seen[c]){seen[c]=1;CATS.push(c);} });
    var dl=$('catDL'); if(dl)dl.innerHTML=CATS.map(function(c){return '<option value="'+esc(c)+'">';}).join('');
  }).catch(function(){});
}
function cMargin(){
  var cost=parseFloat(($('cCost').value||'').replace(/,/g,''))||0, sell=parseFloat(($('cPrice').value||'').replace(/,/g,''))||0, m=$('cMarginMsg'); if(!m)return;
  if(cost>0&&sell>0){ var mg=sell-cost, pct=Math.round((mg/cost)*100); m.textContent='Margin: '+nf(mg)+' ('+pct+'%)'; m.style.color=mg>=0?'#15803D':'#C0392B'; } else m.textContent='';
}
function openConvert(id){
  CID_C=id; var r=REQS.filter(function(x){return x.id===id;})[0]; if(!r)return;
  $('cWho').textContent='From: '+r.item+(r.priced_by?(' · priced by '+r.priced_by):'');
  $('cName').value=r.item||''; $('cCost').value=(r.quoted_price!=null?r.quoted_price:'');
  $('cPrice').value=(r.quoted_price!=null?Math.round(r.quoted_price*1.3):''); // suggest cost +30%
  $('cCat').value=''; $('cMoq').value=''; $('cUnit').value=''; cMargin();
  $('backdrop').classList.add('on'); $('convForm').classList.add('on'); setTimeout(function(){$('cPrice').focus();},250);
}
function reject(id){
  var why=prompt('Why won’t we stock this? (e.g. Kampala price too high, no margin)','Price too high from Kampala — no margin to sell');
  if(why===null)return;
  fetch('/papi/sourcing/'+id+'/reject',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:new URLSearchParams({reason:why.trim()})})
    .then(r=>r.json()).then(function(r){ if(r&&r.ok){ load(); } else alert('Could not update'); });
}
function renegotiate(id){
  if(!confirm('Ask '+(BUYER.name||'the buyer')+' for a better price? This re-opens the request and starts nudging again.'))return;
  var target=prompt('Target price to suggest (optional, e.g. UGX 40000):','')||'';
  fetch('/papi/sourcing/'+id+'/renegotiate',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:new URLSearchParams({target:target.trim()})})
    .then(r=>r.json()).then(function(r){ if(r&&r.ok){ if(typeof toast==='function')toast(r.sent?'Asked for a better price':'Re-opened (set buyer’s WhatsApp to auto-send)'); load(); } else alert('Could not send'); });
}
function saveConvert(){
  if(!CID_C)return; var name=$('cName').value.trim(); if(!name){alert('Product name?');return;}
  var cost=parseFloat(($('cCost').value||'').replace(/,/g,''))||0, sell=parseFloat(($('cPrice').value||'').replace(/,/g,''))||0;
  if(sell>0 && cost>0 && sell<=cost){ if(!confirm('⚠️ Selling price ('+nf(sell)+') is at or below cost ('+nf(cost)+') — this product would sell at a loss. Add it anyway?'))return; }
  var b=$('cSave'); b.disabled=true; b.textContent='Creating…';
  var body=new URLSearchParams({name:name, price:($('cPrice').value||'').replace(/,/g,''), category:$('cCat').value.trim(), moq:$('cMoq').value.trim(), unit_label:$('cUnit').value.trim()});
  fetch('/papi/sourcing/'+CID_C+'/convert',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest','Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:body})
    .then(r=>r.json()).then(function(r){ b.disabled=false; b.textContent='➕ Create product';
      if(r&&r.ok){ closeAll(); load(); if(typeof toast==='function')toast('✓ Added to catalogue'); }
      else alert(r&&r.error==='forbidden'?'You don’t have product access':(r&&r.error==='not_priced'?'Add a price first':'Could not create')); })
    .catch(function(){ b.disabled=false; b.textContent='➕ Create product'; alert('Failed'); });
}
function remindNow(id){
  fetch('/papi/sourcing/'+id+'/remind',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(r=>r.json()).then(function(r){ if(r&&r.ok){ if(typeof toast==='function')toast('Reminder sent'); load(); } else alert(r&&r.error==='no_whatsapp'?'WhatsApp not connected / no buyer number':'Could not send'); });
}
function waReq(id){
  var r=REQS.filter(function(x){return x.id===id;})[0]; if(!r) return;
  var txt='*Sourcing request*\nItem: '+r.item+'\nDemand: '+r.demand+(r.note?('\nNote: '+r.note):'');
  if(r.status!=='new' && r.quoted_price!=null) txt+='\nPrice found: '+(r.currency||'')+' '+nf(r.quoted_price)+(r.supplier?(' ('+r.supplier+')'):'');
  var n=purchaserNo(); location.href='https://wa.me/'+(n||'')+'?text='+encodeURIComponent(txt);
}
refreshJbtn();
load();
loadCats();
</script><!-- ===== DishNet role-aware tab bar + amount format (injected v2) ===== -->
<nav class="dn-tabbar" id="dnTabbar"></nav>
<script>
(function(){
  var here=location.pathname.replace(/\/+$/,'')||'/panel';
  var TABS=[
    {t:'Orders',i:'\uD83D\uDED2',u:'/panel/orders-costs', need:'menu:ordercosts'},
    {t:'Buy',   i:'\uD83D\uDECD\uFE0F',u:'/panel/book-cost',    need:'menu:purchases'},
    {t:'List',  i:'\uD83D\uDCCB',u:'/panel/buy-list',     need:'buylist'},
    {t:'Cash',  i:'\uD83D\uDCB0',u:'/panel/cash-position', need:'menu:cash'},
    {t:'Book',  i:'\uD83D\uDCD2',u:'/panel/trade-cashbook',need:'owner'},
    {t:'Spend', i:'\uD83D\uDCB8',u:'/panel/expenses',      need:'owner'},
    {t:'P&L',   i:'\uD83D\uDCC8',u:'/panel/pnl',           need:'owner'}
  ];
  function allowed(rule, nav){
    if(rule==='owner') return !!nav.is_owner;
    if(rule==='buylist') return (nav.menus||[]).indexOf('purchases')>=0 && !nav.is_owner;
    if(rule.indexOf('menu:')===0){ var k=rule.slice(5); return (nav.menus||[]).indexOf(k)>=0; }
    return false;
  }
  function render(nav){
    var bar=document.getElementById('dnTabbar'); if(!bar) return;
    var vis=TABS.filter(function(x){ return allowed(x.need,nav); });
    bar.innerHTML=vis.map(function(x){
      var on=(here===x.u)?'on':'';
      return '<a class="'+on+'" href="'+x.u+'"><span class="di">'+x.i+'</span><span class="dl">'+x.t+'</span></a>';
    }).join('');
    var top=document.querySelector('.top');
    if(top && here!=='/panel/approvals' && (nav.menus||[]).indexOf('approvals')>=0){
      var a=document.createElement('a'); a.className='dn-appbtn'; a.href='/panel/approvals';
      a.innerHTML='\u2713 Approvals'; top.appendChild(a);
    }
  }
  var FALLBACK={is_owner:false, menus:['ordercosts','purchases','cash']};
  fetch('/papi/me/nav',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(function(d){ render(d && d.ok ? d : FALLBACK); })
    .catch(function(){ render(FALLBACK); });

  function group(v){
    v=(v==null?'':String(v)).replace(/[^\d.]/g,'');
    var p=v.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return p.length>1 ? p[0]+'.'+p.slice(1).join('') : p[0];
  }
  function wire(id, curId){
    var el=document.getElementById(id); if(!el) return;
    var cur=curId?document.getElementById(curId):null;
    var echo=document.createElement('div'); echo.className='dn-amt-echo';
    var anchor=(el.closest && el.closest('.row'))||el;
    if(anchor.parentNode) anchor.parentNode.insertBefore(echo, anchor.nextSibling);
    function upd(){
      var g=group(el.value); if(el.value!==g) el.value=g;
      var n=parseFloat(g.replace(/,/g,''))||0;
      if(n>0){ echo.textContent=(cur&&cur.value?cur.value+' ':'')+group(String(n)); echo.style.display='block'; }
      else { echo.textContent=''; echo.style.display='none'; }
    }
    el.addEventListener('input',upd);
    if(cur) cur.addEventListener('change',upd);
    document.querySelectorAll('.btn,button').forEach(function(b){ b.addEventListener('click',function(){ setTimeout(upd,1500); }); });
    upd();
  }
  wire('amt','cur');
  wire('total','sellcur');
})();
</script>
