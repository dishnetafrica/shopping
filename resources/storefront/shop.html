function bizProducts(biz){ return PRODUCTS.filter(function(p){return bizMatch(p,biz);}); }
/* Robust sub-collection matcher — works even when the collection's configured category name
   doesn't exactly equal the live catalogue's category (matches loose category + keyword tokens
   derived from the label / category words), so counts & clicks are meaningful. */
var COLL_STOP={and:1,the:1,ready:1,mixes:1,mix:1,store:1,'with':1,pack:1,packs:1,essentials:1,products:1,supplies:1,items:1,'for':1,amp:1,all:1};
function collTokens(c){ var raw=(String(c.keywords||'')+' '+String(c.label||'')+' '+String(c.cat||'')).toLowerCase();
  var toks=raw.split(/[^a-z0-9]+/).filter(function(w){return w.length>=3 && !COLL_STOP[w];});
  var seen={},out=[]; toks.forEach(function(t){if(!seen[t]){seen[t]=1;out.push(t);}}); return out; }
function collMatch(p,c){ if(!sellableRail(p))return false;
  var pcat=String(p.category||'').toLowerCase(), cat=String(c.cat||'').toLowerCase();
  if(cat){ if(pcat===cat)return true; if(pcat.length>=3 && cat.indexOf(pcat)>=0)return true; if(cat.length>=3 && pcat.indexOf(cat)>=0)return true; }
  var toks=collTokens(c); if(!toks.length)return false;
  var hay=(p.name+' '+p.keywords+' '+p.category+' '+p.brand).toLowerCase();
  for(var i=0;i<toks.length;i++){ var t=toks[i];
    if(hay.indexOf(t)>=0)return true;
    // Plural/singular tolerance: token "masalas" should match category "masala"; "wraps"→"wrap".
    if(t.length>=4){ var s=t.replace(/s$/,''); if(s!==t && hay.indexOf(s)>=0)return true; }
  }
  return false; }
function collProducts(c){ return PRODUCTS.filter(function(p){return collMatch(p,c);}); }
function bizTitle(t){ return esc(String(t||'')).replace(/\*(.+?)\*/g,'<b>$1</b>'); }

function businessBanners(){
  var list=activeBiz(); if(!list.length) return '';   // config order…
  // …but the "Default for new visitors" collection always leads the row (it's the main). Stable —
  // the default is a fixed setting, so the selector doesn't reshuffle as visitors click around.
  var def=(BANNERS&&BANNERS['default'])||'';
  if(def){ var di=-1; for(var _i=0;_i<list.length;_i++){ if(list[_i].id===def){di=_i;break;} }
    if(di>0){ list=[list[di]].concat(list.slice(0,di)).concat(list.slice(di+1)); } }
  var biz=currentBiz(); if(!biz) return '';
  var slides=(biz.slides&&biz.slides.length)?biz.slides:[{title:biz.label,cta_label:'Shop '+biz.label}];
  if(_bizSlide>=slides.length||_bizSlide<0)_bizSlide=0;
  var title=(BANNERS&&BANNERS.title)||'Shop for Every Need';
  // Clean navigation card: large icon + title + one subtitle. Nothing else.
  var sel=list.map(function(b){
    return '<div class="needcard'+(b.id===biz.id?' on':'')+'" onclick="pickBiz('+jk(b.id)+')">'
      +'<span class="nic">'+bizIcon(b.icon||b.id)+'</span>'
      +'<div class="ntx"><b>'+esc(b.label)+'</b>'+(b.sub?'<small>'+esc(b.sub)+'</small>':'')+'</div></div>';
  }).join('');
  var selBlock='<div class="section-title">'+esc(title)+'</div><div class="needrow">'+sel+'</div>';
  var track=slides.map(function(s){
    var bg=s.image_url?('background-image:url("'+encodeURI(s.image_url)+'")'):(s.theme?('background:'+s.theme):'background:linear-gradient(135deg,#123a2a,#0b5c46)');
    var pts=(s.points||[]).map(function(p){return '<li>'+esc(p)+'</li>';}).join('');
    return '<div class="bizslide" style="'+bg+'"><div class="bztxt">'
      +(s.kick?'<span class="kick">'+esc(s.kick)+'</span>':'')
      +'<h2>'+bizTitle(s.title||biz.label)+'</h2>'+(pts?'<ul>'+pts+'</ul>':'')
      +'<button class="cta'+(s.gold?' gold':'')+'" onclick="bizCta('+jk(biz.id)+','+jk(s.cta||'')+')">'+esc(s.cta_label||('Shop '+biz.label))+' →</button>'
      +'</div></div>';
  }).join('');
  var multi=slides.length>1;
  var dots=multi?('<div class="bizdots" id="bizDots">'+slides.map(function(_,i){return '<i class="'+(i===_bizSlide?'on':'')+'" onclick="bizGo('+i+')"></i>';}).join('')+'</div>'):'';
  var arrows=multi?'<button class="bizarw l" onclick="bizPrev()" aria-label="Previous">‹</button><button class="bizarw r" onclick="bizNext()" aria-label="Next">›</button>':'';
  // Clean banner: message + CTA only. No product cards inside the banner (the real products live in
  // the "Best sellers" row right below it).
  var hero='<div class="bizhero" id="bizHero"><div class="biztrack" id="bizTrack" style="transform:translateX(-'+(_bizSlide*100)+'%)">'+track+'</div>'+arrows+'</div>'+dots;
  var coll='';
  if(biz.collections&&biz.collections.length){
    // Count with the robust matcher (collMatch) so tiles show real numbers even when the
    // collection's cat/keywords use the recategorised taxonomy and the live catalogue still
    // carries the old category names. Empty collections are dropped rather than shown as "0".
    var cc=biz.collections.map(function(c){
      var im=c.image_url?('<div class="im" style="background-image:url(\''+encodeURI(c.image_url)+'\')"></div>'):('<div class="im">'+bizIcon(c.icon||'shop')+'</div>');
      var n=collProducts(c).length;
      if(!n)return '';
      return '<div class="bizcoll" onclick="bizColl('+jk(biz.id)+','+jk(c.cat||'')+','+jk(c.keywords||'')+','+jk(c.label||'')+')">'+im+'<div class="ct"><b>'+esc(c.label)+'</b><span>'+n+' product'+(n===1?'':'s')+'</span></div></div>';
    }).filter(Boolean).join('');
    if(cc) coll='<div class="section-title">Popular collections for '+esc(biz.label)+'</div><div class="bizcollrow">'+cc+'</div>';
  }
  var items=[], bs=biz.bestsellers;
  if(Array.isArray(bs)&&bs.length){ bs.forEach(function(nm){var p=prod(nm)||PRODUCTS.filter(function(x){return x.name.toLowerCase()===String(nm).toLowerCase();})[0]; if(sellableRail(p))items.push(p);}); }
  if(!items.length){ items=bizProducts(biz).filter(sellableRail).slice().sort(function(a,b){return (b.popularity||0)-(a.popularity||0);}); }
  var best=items.length>=3?railHtml('Best sellers for '+biz.label, items):'';
  var kitsHtml=kitsFor(biz.id).map(kitCard).filter(Boolean).join('');
  var kitsBlock=kitsHtml?('<div class="section-title">Ready-made kits — add to your quote in one tap</div><div class="kitrow">'+kitsHtml+'</div>'):'';
  // Product-first: best-sellers (real products) sit directly under the banner, before collections.
  return '<div class="bizwrap">'+selBlock+hero+best+coll+kitsBlock+'</div>';
}
function pickBiz(id){ BIZSEL=id; rememberBiz(id); bumpBizFreq(id); _bizSlide=0; render(); }
/* Ready-made Kits: a curated bundle a customer drops into a quotation in one tap. Products are
   matched from the catalogue by name; each line honours the product's MOQ. */
function kitsFor(bizId){ return (KITS||[]).filter(function(k){return k && k.active!==false && (!k.collection || k.collection===bizId);}); }
function kitResolve(kit){ var out=[],miss=0; (kit.lines||[]).forEach(function(l){
  var p=prod(l.name)||PRODUCTS.filter(function(x){return x.name.toLowerCase()===String(l.name||'').toLowerCase();})[0];
  if(p&&!oosOf(p)){ out.push({p:p,qty:Math.max(Number(l.qty)||1, minq(p))}); } else miss++; });
  return {lines:out,miss:miss}; }
function kitTotal(r){ return r.lines.reduce(function(s,x){return s+x.p.price*x.qty;},0); }
function kitCard(k){ var r=kitResolve(k); if(r.lines.length<2) return '';   // a "kit" needs ≥2 available items
  var bg=k.image_url?('background-image:url("'+encodeURI(k.image_url)+'")'):'background:linear-gradient(135deg,#123a2a,#0b7a3b)';
  return '<div class="kitcard" style="'+bg+'"><span class="ov"></span><div class="kbd">'
    +'<b>'+esc(k.label||'Kit')+'</b>'+(k.desc?'<small>'+esc(k.desc)+'</small>':'')
    +'<div class="kmeta">'+r.lines.length+' items · '+ugx(kitTotal(r))+'</div>'

    +'</div></div>'; }
function addKit(id){ var k=(KITS||[]).filter(function(x){return x.id===id;})[0]; if(!k)return;
  var r=kitResolve(k); if(!r.lines.length)return;
  r.lines.forEach(function(x){ if(!CART[x.p.name])CART[x.p.name]={name:x.p.name,price:x.p.price,qty:0}; CART[x.p.name].qty+=x.qty; try{track('add',x.p.id);}catch(e){} });
  saveCart(); flyToCart(); render(); bar(); openCheckout(); }
function bizCta(id,cta){ cta=String(cta||'');

function bizColl(id,cat,kw,label){ COLLVIEW={id:id||'',cat:cat||'',keywords:kw||'',label:label||''}; BIZVIEW=''; CATLIST=false; Q=''; if($('q'))$('q').value=''; CAT='all'; _catShown=24; render(); window.scrollTo(0,0); }
function collClose(){ COLLVIEW=null; render(); window.scrollTo(0,0); }
function bizShop(id){ BIZVIEW=id; COLLVIEW=null; CATLIST=false; Q=''; if($('q'))$('q').value=''; CAT='all'; _catShown=24; render(); window.scrollTo(0,0); }
function bizClose(){ BIZVIEW=''; render(); window.scrollTo(0,0); }
function updateBizSlide(){ var t=$('bizTrack'); if(t)t.style.transform='translateX(-'+(_bizSlide*100)+'%)'; var d=$('bizDots'); if(d){var ch=d.children; for(var i=0;i<ch.length;i++)ch[i].className=(i===_bizSlide?'on':'');} }
function bizN(){ var b=currentBiz(); return b&&b.slides?b.slides.length:1; }
function bizNext(){ var n=bizN()||1; _bizSlide=(_bizSlide+1)%n; updateBizSlide(); }
function bizPrev(){ var n=bizN()||1; _bizSlide=(_bizSlide-1+n)%n; updateBizSlide(); }
function bizGo(i){ _bizSlide=i; updateBizSlide(); bizRestart(); }
function bizStop(){ if(_bizTimer){clearInterval(_bizTimer);_bizTimer=null;} }
function bizStart(){ bizStop(); if(bizReduce())return; if(bizN()<2)return; var sec=(BANNERS&&BANNERS.autoscroll!=null)?Number(BANNERS.autoscroll):5; if(!(sec>0))return; _bizTimer=setInterval(bizNext,sec*1000); }

function bizInit(){ bizStop(); var hero=$('bizHero'); if(!hero)return;
  var x0=null;
  hero.addEventListener('pointerdown',function(e){bizStop();x0=e.clientX;});
  hero.addEventListener('pointerup',function(e){ if(x0!=null){var dx=e.clientX-x0; if(dx<-40)bizNext(); else if(dx>40)bizPrev();} x0=null; bizStart(); });
  hero.addEventListener('mouseenter',bizStop);
  hero.addEventListener('mouseleave',bizStart);

/* Currency-aware price format. Zero-decimal currencies (UGX/SSP/…) stay whole; USD/EUR keep 2
   and use the $ symbol. Output is byte-identical to before for a UGX shop; correct for others. */
function ugx(n){ n=Number(n)||0; var cur=String(CUR||'UGX').toUpperCase();
  var zero=['UGX','KES','TZS','RWF','BIF','SSP','JPY','KRW','VND','XAF','XOF','GNF','MGA','CLP','PYG','ISK','KMF','XPF'];
  var d=zero.indexOf(cur)>=0?0:2;
  var s=n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
  return cur==='USD' ? ('$'+s) : (CUR+' '+s); }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jk(s){return JSON.stringify(String(s)).replace(/"/g,'&quot;');}
function num(v){return Number(String(v==null?'':v).replace(/[^0-9.]/g,''))||0;}
function qp(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]*)'));return m?decodeURIComponent(m[1]):'';}

function mapProduct(row){
  var pn=String(row['Product Name']||''), v=String(row.Variant||'').trim();
  return {id:(row._row!=null?row._row:(row.id!=null?row.id:null)), name:v?pn+' '+v:pn, brand:String(row.Brand||''), category:String(row.Category||'Other'),
    desc:String(row.Description||'').trim(),
    keywords:String(row.Keywords||''), price:num(row.Price_UGX), poa:!(num(row.Price_UGX)>0),
    stock:(row.Stock===null||row.Stock===undefined||row.Stock==='')?null:num(row.Stock),
    modifiers:Array.isArray(row.Modifiers)?row.Modifiers:[],
    moq:(row.MOQ===null||row.MOQ===undefined||row.MOQ==='')?1:Math.max(1,parseInt(row.MOQ,10)||1),
    packSize:(row.PackSize===null||row.PackSize===undefined||row.PackSize==='')?0:(parseInt(row.PackSize,10)||0),
    unit:String(row.Unit||'').trim(),
    popularity:num(row.Popularity), createdAt:Number(row.Created)||0,
    image:String(row.Image||row.Photo||row.Image_URL||row['Image URL']||'')};
}

async function load(){
  try{
    var r=await fetch(CATALOGUE_URL,{cache:'no-store'});
    var d=await r.json();
    PRODUCTS=(Array.isArray(d.products)?d.products:[]).map(mapProduct).filter(function(p){return p.name && (p.price>0 || p.poa);});
    _popThresh=null;   // recompute bestseller threshold for the fresh catalogue
    if(d.settings){var ph=String(d.settings.waNumber||d.settings.storePhone||'').replace(/[^0-9]/g,'');if(ph)WA_NUMBER=ph;
      if(d.settings.currency)CUR=String(d.settings.currency);
      if(d.settings.category_images)CAT_IMG=d.settings.category_images||{}; if(d.settings.thali)THALI=d.settings.thali;
      if(d.settings.category_groups)CATGROUPS=d.settings.category_groups||{};
      if(d.settings.category_order)CATORDER=(d.settings.category_order||[]).map(String);
      if(d.settings.business_banners)BANNERS=d.settings.business_banners||null;
      if(d.settings.kits)KITS=Array.isArray(d.settings.kits)?d.settings.kits:[];
      if(d.settings.trending)TRENDING=(d.settings.trending||[]).map(Number);
      var faqCustom=(Array.isArray(d.settings.faq)&&d.settings.faq.length);
      if(faqCustom)FAQ_DATA=d.settings.faq;
      if(d.settings.vertical){VERTICAL=String(d.settings.vertical);IS_PICKUP=(VERTICAL==='snacks');applyVertical();}
      if(!faqCustom&&VERTICAL==='restaurant')FAQ_DATA=FAQ_RESTAURANT;}
    if(Array.isArray(d.branches)&&d.branches.length){
      var bs=d.branches.map(function(b){return {name:String(b.name||b.title||'Branch'),lat:Number(b.lat),lng:Number(b.lng)};}).filter(function(b){return isFinite(b.lat)&&isFinite(b.lng);});
      if(bs.length)BRANCHES=bs;
    }
    if(d.settings&&d.settings.delivery){var dl=d.settings.delivery;
      ['near_km','mid_km','max_km'].forEach(function(k){if(dl[k]!=null&&isFinite(Number(dl[k])))DELIVERY[k]=Number(dl[k]);});
      ['near','mid','far','out'].forEach(function(k){if(dl[k]!=null)DELIVERY[k]=String(dl[k]);});
      DELV_CFG=Object.assign({}, DELV_CFG, dl);   // keep full delivery config (incl. free_rules) for free-delivery logic
    }
    var map={};
    PRODUCTS.forEach(function(p){ var c=p.category||'Other'; if(!map[c])map[c]={name:c,img:'',count:0}; map[c].count++; if(!map[c].img&&p.image)map[c].img=p.image; });
    var _ordIx=function(n){var i=CATORDER.indexOf(n);return i<0?9999:i;};
    CATS=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){
      var ia=_ordIx(a.name), ib=_ordIx(b.name);
      if(ia!==ib)return ia-ib;          // department order from the catalogue (food-first) when configured
      return b.count-a.count;           // otherwise fall back to product count (original behaviour)
    });
    buildSearchIndex();   // pre-warm the smart-search inverted index for instant queries at scale
    render();
    applyQuickOrder();
    /* v4.27 — the server already knows which product this URL is for (it rendered the
       page's title/OG/JSON-LD for it), so open that first; else migrate a legacy #p link;
       else read the path. */
    var boot=Number(window.__OPEN_PRODUCT_ID__||0);
    if(boot>0) openDetail(boot);
    else if(!hashMigrate()) handleRoute();
  }catch(e){
    $('content').innerHTML='<div class="empty">Couldn’t load the catalogue.<br>Please try again shortly.</div>';
  }
}

function voiceSearch(){
  if(_recActive){ stopVoice(); return; }
  var SR=_SR();
  if(!SR){ searchOpen(); toast('Voice isn’t supported on this browser — please type'); sTrack('voice_unsupported',{}); return; }
  searchOpen();
  try{ _rec=new SR(); }catch(e){ toast('Voice unavailable'); return; }
  _rec.lang=(navigator.language||'en-US'); _rec.interimResults=true; _rec.maxAlternatives=1; _rec.continuous=false;
  _voiceFinal='';
  _rec.onstart=function(){ _recActive=true; setMicState(true); showListening(''); };
  _rec.onresult=function(ev){ var interim='',fin='';
    for(var i=ev.resultIndex;i<ev.results.length;i++){ var res=ev.results[i]; if(res.isFinal) fin+=res[0].transcript; else interim+=res[0].transcript; }
    if(fin)_voiceFinal+=fin; var shown=(_voiceFinal+' '+interim).replace(/\s+/g,' ').trim();
    var sq=$('sq'); if(sq)sq.value=shown; showListening(shown); if(shown)searchRender(shown); };
  _rec.onerror=function(ev){ setMicState(false); _recActive=false; hideListening();
    var e=ev&&ev.error;
    if(e==='not-allowed'||e==='service-not-allowed') toast('Microphone blocked — allow mic access in your browser');
    else if(e==='no-speech') toast('Didn’t catch that — tap 🎤 and try again');
    else if(e==='audio-capture') toast('No microphone found');

  _rec.onend=function(){ setMicState(false); _recActive=false; hideListening();
    var q=(_voiceFinal||($('sq')&&$('sq').value)||'').replace(/\s+/g,' ').trim();

/* ============================================================================
   BARCODE / QR SCAN  (client-side, native BarcodeDetector — no backend)
   Tap 📷 → camera opens → detect a barcode/QR → resolve to a product (barcode /
   sku / keywords / name) → open it. Graceful fallback (manual entry) where the
   BarcodeDetector API is unavailable (e.g. Safari/Firefox). Full "find similar
   products from a photo" needs a vision model and would sit behind SemanticProvider.
   ============================================================================ */
var _scanStream=null, _scanRAF=null, _scanDet=null, _scanActive=false;
function barcodeSupported(){ return (typeof window.BarcodeDetector!=='undefined'); }
function barcodeSearch(){
  if(_scanActive){ stopScan(); return; }
  if(!barcodeSupported()){
    var code=null; try{ code=window.prompt('Scan isn’t supported on this browser.\nEnter the product barcode / code:'); }catch(e){}
    if(code){ resolveBarcode(String(code).trim()); } else { toast('Barcode scan needs Chrome/Android; you can type the code'); }
    sTrack('scan_unsupported',{}); return;
  }
  openScanUI();
}
function openScanUI(){
  var ov=$('scanOverlay');
  if(!ov){ ov=document.createElement('div'); ov.id='scanOverlay'; ov.className='scanov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Scan a barcode');
    ov.innerHTML='<div class="scanhd"><button class="scanx" onclick="stopScan()" aria-label="Close scanner">‹</button><span>Scan barcode</span></div>'
      +'<div class="scanstage"><video id="scanVid" playsinline muted autoplay></video><div class="scanbox"><span class="scanline"></span></div></div>'
      +'<div class="scanhint" id="scanHint" role="status" aria-live="polite">Point your camera at a product barcode</div>';
    document.body.appendChild(ov);
  }
  ov.classList.add('show'); document.body.style.overflow='hidden';
  startScan();
}
async function startScan(){
  var vid=$('scanVid'); if(!vid)return;
  try{ _scanDet=new window.BarcodeDetector(); }catch(e){ try{ _scanDet=new window.BarcodeDetector({formats:['ean_13','ean_8','code_128','upc_a','upc_e','qr_code']}); }catch(e2){ _scanDet=null; } }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ if($('scanHint'))$('scanHint').textContent='Camera not available on this device'; setTimeout(stopScan,1500); return; }
  try{
    _scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    vid.srcObject=_scanStream; try{ await vid.play(); }catch(e){} _scanActive=true; sTrack('scan_open',{});
    _scanTick();
  }catch(e){
    var nm=e&&e.name, msg=(nm==='NotAllowedError'||nm==='SecurityError')?'Camera blocked — allow camera access to scan':(nm==='NotFoundError'?'No camera found':'Couldn’t start the camera');
    if($('scanHint'))$('scanHint').textContent=msg; toast(msg); sTrack('scan_error',{err:String(nm||'')});
    setTimeout(stopScan,1700);
  }
}
function _scanTick(){
  if(!_scanActive)return; var vid=$('scanVid');
  if(vid && vid.readyState>=2 && _scanDet){
    _scanDet.detect(vid).then(function(codes){
      if(codes&&codes.length){ var v=codes[0].rawValue||''; if(v){ onScanned(String(v).trim()); return; } }
      _scanRAF=requestAnimationFrame(_scanTick);
    }).catch(function(){ _scanRAF=requestAnimationFrame(_scanTick); });
  } else { _scanRAF=requestAnimationFrame(_scanTick); }
}
function onScanned(code){ try{ if(navigator.vibrate)navigator.vibrate(30); }catch(e){} sTrack('scan_result',{code:code}); stopScan(); resolveBarcode(code); }
function stopScan(){
  _scanActive=false; if(_scanRAF){cancelAnimationFrame(_scanRAF);_scanRAF=null;}
  if(_scanStream){ try{ _scanStream.getTracks().forEach(function(t){t.stop();}); }catch(e){} _scanStream=null; }
  var ov=$('scanOverlay'); if(ov)ov.classList.remove('show'); if(!($('searchOverlay')&&$('searchOverlay').classList.contains('show'))) document.body.style.overflow='';
}
// Resolve a scanned code to a product: exact barcode/sku first, then keyword/name contains.
function resolveBarcode(code){
  if(!code)return; var lc=code.toLowerCase(), hit=null;
  for(var i=0;i<PRODUCTS.length;i++){ var p=PRODUCTS[i];
    if(String(p.barcode||'')===code || String(p.sku||'')===code){ hit=p; break; }
    if(!hit){ var hay=((p.keywords||'')+' '+(p.name||'')).toLowerCase(); if(hay.indexOf(lc)>=0) hit=p; }
  }
  if(hit){ toast('Found: '+hit.name,'ok'); sTrack('scan_match',{code:code,id:hit.id||0}); if(hit.id){ goDetail(hit.id); } else { searchSubmit(hit.name); } }
  else { sTrack('scan_nomatch',{code:code}); searchOpen(); if($('sq'))$('sq').value=code; searchRender(code); toast('Scanned '+code+' — no exact match'); }
}
function topBrands(n){ var cnt={},order=[];
  PRODUCTS.forEach(function(p){ var br=(p.brand||'').trim(); if(!br)return; var k=br.toLowerCase(); if(!cnt[k]){cnt[k]={name:br,c:0};order.push(k);} cnt[k].c++; });
  return order.map(function(k){return cnt[k];}).sort(function(a,b){return b.c-a.c;}).slice(0,n||10).map(function(x){return x.name;}); }
function searchDefault(){
  var html='';

  var brs=topBrands(10);

  return html || '<div class="szero">Start typing to find products.</div>';

/* Skeleton grid — content-shaped placeholders so the screen looks populated in <100ms. */
function skeletonGrid(n){ n=n||8; var s=''; for(var i=0;i<n;i++){ s+='<div class="sk shimmer"><div class="a"></div><div class="b w70"></div><div class="b w45 last"></div></div>'; } return '<div class="skgrid">'+s+'</div>'; }
/* v4.83 — the wholesale home needs a wholesale-SHAPED skeleton: an 8-card grid placeholder is
   the wrong silhouette for hero + rails, so the catalogue swap moved every pixel below it
   (Lighthouse: the single biggest layout shift on the desktop home, CLS 0.89). A hero-shaped
   block followed by a card row swaps into roughly its own footprint instead. Gated: classic
   shops keep their grid skeleton byte-for-byte. */
function whSkeleton(){
  return '<div class="skwh"><div class="sk shimmer skhero"></div>'+skeletonGrid(4)+'</div>';
}

/* Fly-to-cart: a dot launches from the last-tapped control to the cart nav icon, badge bumps,
   light haptic. Skipped under reduced-motion. Purely visual — never touches cart/checkout logic. */
var _lastTap={x:window.innerWidth/2,y:window.innerHeight/2};
document.addEventListener('pointerdown',function(e){ _lastTap={x:e.clientX,y:e.clientY}; },{passive:true});
function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
function flyToCart(){
  var cart=$('dCartPill'); if(!cart||!cart.offsetParent) cart=$('navCart');
  if(cart){ cart.classList.remove('bump'); void cart.offsetWidth; cart.classList.add('bump'); }
  try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){}
  if(reducedMotion()||!cart) return;
  var r=cart.getBoundingClientRect(), tx=r.left+r.width/2, ty=r.top+r.height/2;
  var dot=document.createElement('div'); dot.className='flydot';
  dot.style.left=(_lastTap.x-8)+'px'; dot.style.top=(_lastTap.y-8)+'px';
  document.body.appendChild(dot);
  requestAnimationFrame(function(){ dot.style.transform='translate('+(tx-_lastTap.x)+'px,'+(ty-_lastTap.y)+'px) scale(.3)'; dot.style.opacity='0.2'; });
  setTimeout(function(){ if(dot.parentNode) dot.parentNode.removeChild(dot); }, 600);
}

/* ---------------- delivery location ---------------- */
function haversineKm(la1,lo1,la2,lo2){var R=6371,t=Math.PI/180,dLa=(la2-la1)*t,dLo=(lo2-lo1)*t;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));}
function nearestBranch(lat,lng){var best=null;BRANCHES.forEach(function(b){var km=haversineKm(lat,lng,Number(b.lat),Number(b.lng));if(best===null||km<best.km)best={branch:b,km:km};});return best;}
function etaLabel(km){if(km<=DELIVERY.near_km)return DELIVERY.near;if(km<=DELIVERY.mid_km)return DELIVERY.mid;if(km<=DELIVERY.max_km)return DELIVERY.far;return null;}
function setDelv(html,out){var el=$('delvBar');if(!el)return;el.className='delv'+(out?' out':'');el.innerHTML=html;}
function saveDelv(){try{localStorage.setItem(DELV_KEY,JSON.stringify(DELV));}catch(e){}}
function showDelv(){
  if(!DELV){setDelv('<span class="ico">📍</span><span class="txt">Set your location for delivery time</span><span class="chg">›</span>');return;}
  if(DELV.mode==='out'){setDelv('<span class="ico">⚠️</span><span class="txt">'+esc(DELIVERY.out)+'</span><span class="chg">Change</span>',true);return;}
  if(DELV.mode==='city'){setDelv('<span class="ico">🛵</span><span class="txt">Delivering to '+esc(DELV.branch.name)+'</span><span class="chg">Change</span>');return;}
  var wl=whDelvLabel();                        // v4.73 — wholesale homes: no invented minutes
  if(wl){setDelv('<span class="ico">🚚</span><span class="txt">'+esc(wl)+' · '+esc((DELV.branch&&DELV.branch.name)||'')+'</span><span class="chg">Change</span>');return;}
  setDelv('<span class="ico">🛵</span><span class="txt">'+esc(DELV.label)+'</span><span class="chg">Change</span>');
}
function applyCoords(lat,lng){
  GEO={lat:+(+lat).toFixed(6),lng:+(+lng).toFixed(6)};
  var n=nearestBranch(lat,lng);
  if(!n){DELV={mode:'city',branch:BRANCHES[0]||{name:'your area'}};}
  else{var lab=etaLabel(n.km);
    if(lab===null)DELV={mode:'out',branch:n.branch,km:n.km};
    else DELV={mode:'eta',branch:n.branch,km:n.km,label:lab+' · '+n.branch.name};}
  saveDelv();showDelv();
}
function renderManual(){
  setDelv('<span class="ico">📍</span><span class="txt">Choose your area:</span><span class="pick">'+
    BRANCHES.map(function(b){return '<button onclick="event.stopPropagation();pickCity('+jk(b.name)+')">'+esc(b.name)+'</button>';}).join('')+'</span>');
}
function pickCity(name){var b=null;BRANCHES.forEach(function(x){if(x.name===name)b=x;});DELV={mode:'city',branch:b||{name:name}};saveDelv();showDelv();}
function askLocation(){
  if(!navigator.geolocation){renderManual();return;}
  setDelv('<span class="ico">📍</span><span class="txt">Detecting your location…</span>');
  navigator.geolocation.getCurrentPosition(
    function(p){applyCoords(p.coords.latitude,p.coords.longitude);},
    function(){renderManual();},
    {enableHighAccuracy:false,timeout:8000,maximumAge:600000}
  );
}

function toGrams(n,u){n=parseFloat(n);u=String(u).toLowerCase();if(u==='kg')return n*1000;if(u==='gm'||u==='g')return n;if(u==='l'||u==='ltr')return n*1000;if(u==='ml')return n;return 0;}
function parseSize(name){
  var m=String(name).match(/^(.*?)[\s,]*\b(\d+(?:\.\d+)?)\s?(kg|gm|g|ml|l|ltr|pcs|pc)\b\s*$/i);
  if(m&&m[1].trim())return {base:m[1].trim(),size:(m[2]+' '+m[3]).replace(/\bg\b/,'gm'),grams:toGrams(m[2],m[3])};
  return {base:String(name).trim(),size:'',grams:0};
}
function groupProducts(list){
  var g={},order=[];
  list.forEach(function(p){var pv=parseSize(p.name);var key=(p.category||'')+'|'+pv.base.toLowerCase();
    if(!g[key]){g[key]={base:pv.base,category:p.category,variants:[],image:''};order.push(key);}
    g[key].variants.push({size:pv.size,grams:pv.grams,product:p});
    if(!g[key].image&&p.image)g[key].image=p.image;});
  return order.map(function(k){var grp=g[k];grp.variants.sort(function(a,b){return (a.grams||1e12)-(b.grams||1e12);});return grp;});
}
function poaCard(name,category,image,packHtml){

  var wa=(SHOP.waNumber?('https://wa.me/'+SHOP.waNumber+'?text='+msg):'#');
  var ic=catIcon(category);
  var img='<div class="img">'+ic+(image?'<img alt="" src="'+esc(image)+'" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">':'')+'</div>';
  return '<div class="pc">'+img+'<div class="bd"><div class="nm">'+esc(name)+'</div>'+(packHtml||'')
    +'<div class="pr" style="color:var(--green);font-size:14px">Price on request</div>'
    +'<a class="add" href="'+wa+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Request a quote</a>'
    +'</div></div>';
}
function variantCard(grp){
  if(grp.variants.length===1)return prodCard(grp.variants[0].product);
  if(grp.variants[0].product.poa)return poaCard(grp.base,grp.category,grp.image,'');
  var key=grp.category+'|'+grp.base.toLowerCase();
  var inv=grp.variants.filter(function(v){return !oosOf(v.product);});
  var allOos=inv.length===0;
  var def=(inv[0]||grp.variants[0]),p=def.product;
  var ic=catIcon(grp.category);
  var badge=allOos?'<span class="oosbadge">Out of stock</span>':'<span class="opts">'+grp.variants.length+' sizes</span>';
  var img='<div class="img'+(allOos?' oos':'')+'" onclick="openVariantPicker('+jk(key)+')">'+ic+(grp.image?'<img alt="" src="'+esc(grp.image)+'" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">':'')+badge+'</div>';
  var unit=def.grams?('<div class="unit">'+ugx(Math.round(p.price/def.grams*1000))+' / kg</div>'):'';
  var totalInCart=grp.variants.reduce(function(s,v){return s+((CART[v.product.name]||{}).qty||0);},0);
  var ctrl=allOos
    ?'<button class="add" disabled>Out of stock</button>'
    :(totalInCart
      ?'<button class="add" onclick="openVariantPicker('+jk(key)+')">'+totalInCart+' in cart \u00b7 Edit</button>'
      :'<button class="add opt" onclick="openVariantPicker('+jk(key)+')">Add<span>'+inv.length+' option'+(inv.length>1?'s':'')+'</span></button>');
  return '<div class="pc'+(allOos?' pcoos':'')+'">'+img+'<div class="bd"><div class="nm">'+esc(grp.base)+'</div>'+(p.desc?'<div class="dsc">'+esc(p.desc)+'</div>':'')+'<div class="vsize">'+esc(def.size)+'</div><div class="pr">'+ugx(p.price)+'</div>'+unit+ctrl+'</div></div>';
}
function openVariantPicker(key){

      :('<button class="add sm" onclick="vpStep('+jk(p.name)+','+jk(key)+',1)">Add</button>'));

function cartAdd(name){var p=prod(name);if(!p||oosOf(p))return;flyToCart();if(!CART[name]){CART[name]={name:p.name,price:p.price,qty:0};track('add',p.id);}CART[name].qty++;saveCart();render();bar();}

var DVIEW='grid';

    var qtyctl = oos ? '<span class="opoosn">—</span>' :
      '<div class="opq-wrap"><button class="opb" tabindex="-1" onclick="opadStep('+jk(p.name)+',-1)">−</button>'
      +'<input class="opq" type="number" inputmode="numeric" min="0" value="'+(q||'')+'" placeholder="0" data-key="'+esc(p.name)+'" onchange="opadSetQty('+jk(p.name)+',this.value)" onkeydown="opadKey(event,this)" aria-label="Quantity for '+esc(p.name)+'">'
      +'<button class="opb" tabindex="-1" onclick="opadStep('+jk(p.name)+',1)">+</button></div>';
    return '<div class="oprow'+(q>0?' inpad':'')+'" data-key="'+esc(p.name)+'">'
      +'<div class="opth">'+thumb+'</div>'
      +'<div class="opnm"><div class="opn">'+esc(p.name)+'</div><div class="opmeta">'+meta.join(' · ')+'</div></div>'
      +'<div class="opup">'+ugx(p.price)+'<span class="opu">/'+esc(p.unit||'unit')+'</span></div>'
      +'<div class="opqty">'+qtyctl+'</div>'

      +'</div>';
  }).join('');
  return '<div class="opad"><div class="opadhd"><div></div><div>Product</div><div class="opup">Unit price</div><div class="opqty">Qty</div><div class="oplt">Line total</div></div>'+rows+'</div>';

function opadSetQty(key,val){
  var p=prod(key); if(!p)return;
  val=parseInt(val,10); if(isNaN(val)||val<0)val=0;
  if(val>0 && oosOf(p)){ toast(p.name+' is out of stock','err'); val=0; }
  var mq=minq(p);
  if(val>0 && val<mq){ val=mq; toast('Minimum order for '+p.name+' is '+mq,'err'); }
  if(val<=0){ delete CART[key]; } else { if(!CART[key])CART[key]={name:p.name,price:p.price,qty:0}; CART[key].qty=val; }
  saveCart(); bar(); opadRefreshRow(key);
}
function opadStep(key,dir){
  var p=prod(key); if(!p)return; var cur=(CART[key]?CART[key].qty:0), mq=minq(p);
  var nv=cur + dir*((cur===0&&dir>0)?mq:1); if(nv<0)nv=0; if(nv>0&&nv<mq)nv=(dir<0?0:mq);
  opadSetQty(key,nv);
}
function opadRefreshRow(key){
  var rows=document.querySelectorAll('#content .oprow'); var p=prod(key), q=(CART[key]?CART[key].qty:0);
  for(var i=0;i<rows.length;i++){ if(rows[i].getAttribute('data-key')===key){
    var inp=rows[i].querySelector('.opq'); if(inp && document.activeElement!==inp) inp.value=(q||'');
    var lt=rows[i].querySelector('.oplt'); if(lt) lt.textContent = q?ugx((p?p.price:0)*q):'—';
    rows[i].classList.toggle('inpad', q>0); break; } }
}
function _opadFocus(inp,dir){
  var all=Array.prototype.slice.call(document.querySelectorAll('#content .opq'));
  var i=all.indexOf(inp); if(i<0)return; var n=all[i+dir]; if(n){ n.focus(); if(n.select)try{n.select();}catch(e){} }
}
function opadKey(e,inp){
  if(e.key==='Enter'){ e.preventDefault(); opadSetQty(inp.getAttribute('data-key'),inp.value); _opadFocus(inp,1); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); _opadFocus(inp,1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _opadFocus(inp,-1); }
}

/* ================= Phase 7 (P2) — power-buyer tools, desktop only =================
   Quick Order (paste from Excel / SKU list), saved order templates (localStorage),
   compact density, keyboard shortcuts. All additive; matching is client-side against
   the already-loaded PRODUCTS; no backend calls, no new APIs. */

/* Parse pasted lines: "name, qty" | "name<TAB>qty" (Excel) | "name x5" | "name 5" | "5 x name". */
function parseOrderLines(text){
  return String(text||'').split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean).map(function(line){
    var name=line, qty=null, m;
    var parts=line.split(/\s*[,\t]\s*/);
    if(parts.length>=2 && /^\d+$/.test(parts[parts.length-1])){ qty=parseInt(parts.pop(),10); name=parts.join(', '); }
    else if((m=line.match(/^(\d+)\s*[x×]\s*(.+)$/i))){ qty=parseInt(m[1],10); name=m[2].trim(); }
    else if((m=line.match(/^(.*?)\s*[x×]\s*(\d+)$/i))){ name=m[1].trim(); qty=parseInt(m[2],10); }
    else if((m=line.match(/^(.*?)\s+(\d{1,5})$/))){ name=m[1].trim(); qty=parseInt(m[2],10); }
    return {raw:line, name:name, qty:qty};
  });
}
/* Match a typed name to a product: exact → unique prefix → unique contains → ambiguous. */
function matchProduct(name){
  var q=String(name||'').toLowerCase().trim(); if(!q)return null;
  var ex=PRODUCTS.filter(function(p){return p.name.toLowerCase()===q;}); if(ex.length)return {p:ex[0]};
  var pre=PRODUCTS.filter(function(p){return p.name.toLowerCase().indexOf(q)===0;}); if(pre.length===1)return {p:pre[0]};
  var ct=PRODUCTS.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0;});
  if(ct.length===1)return {p:ct[0]}; if(ct.length>1)return {ambiguous:ct};
  return null;
}
var _QOR=[];
var TPL_KEY='cb_tpl_'+(SHOP.slug||SHOP.shopName||'shop');
function loadTemplates(){ try{ return JSON.parse(localStorage.getItem(TPL_KEY)||'[]')||[]; }catch(e){ return []; } }
function saveTemplates(a){ try{ localStorage.setItem(TPL_KEY,JSON.stringify(a)); }catch(e){} }
function saveCurrentAsTemplate(name){
  var items=cartItems().map(function(i){return {name:i.name,qty:i.qty};});
  if(!items.length){ toast('Your order is empty — add items first','err'); return; }
  name=String(name||'').trim()||('Template '+(loadTemplates().length+1));
  var a=loadTemplates(); a.unshift({name:name,items:items}); saveTemplates(a);
  toast('Saved “'+name+'”','ok'); openQuickOrder();
}
function loadTemplate(i){ var a=loadTemplates(),t=a[i]; if(!t)return; closeSheet(); reorderItems(t.items); }
function deleteTemplate(i){ var a=loadTemplates(); a.splice(i,1); saveTemplates(a); openQuickOrder(); }

    +'<div id="qoPrev"></div></div>'

    +'<div class="qorow"><input id="qoTplName" class="qoinput" placeholder="e.g. Weekly kitchen order"><button class="qobtn2" onclick="saveCurrentAsTemplate(($(\'qoTplName\')||{}).value)">Save</button></div></div>'
    +'<div class="qosec"><div class="qoh">Your templates</div>'+tplHtml+'</div></div>';

function quickOrderPreview(){
  var lines=parseOrderLines(($('qoText')||{}).value||'');
  _QOR=lines.map(function(l){ return {raw:l.raw, name:l.name, qty:l.qty, match:(l.name?matchProduct(l.name):null)}; });
  var matched=0, rows=_QOR.map(function(r){
    if(r.match&&r.match.p){ matched++; var p=r.match.p, mq=minq(p), q=r.qty||mq; if(q<mq)q=mq;
      return '<div class="qpr ok"><span class="qpi">'+esc(p.name)+(oosOf(p)?' <span class="qpx">(out of stock)</span>':'')+'</span><span class="qpq">×'+q+'</span><span class="qps">'+ugx(p.price*q)+'</span></div>'; }
    if(r.match&&r.match.ambiguous){ return '<div class="qpr amb"><span class="qpi">'+esc(r.name)+'</span><span class="qps">'+r.match.ambiguous.length+' matches — be more specific</span></div>'; }
    return '<div class="qpr no"><span class="qpi">'+esc(r.raw)+'</span><span class="qps">no match</span></div>';
  }).join('');
  $('qoPrev').innerHTML='<div class="qprhd">'+matched+' of '+_QOR.length+' line'+(_QOR.length===1?'':'s')+' matched</div>'+rows
    +(matched?'<button class="qobtn" onclick="quickOrderApply()">Add '+matched+' item'+(matched===1?'':'s')+' to order</button>':'');

/* ---- Department layer (grocery only). Groups EXISTING product categories into
        departments from the per-tenant `category_groups` config. Pure presentation:
        products keep their category, no schema change. Stays inactive (flat layout)
        unless a grocery tenant has real department groups configured — so restaurants,
        snacks, and unconfigured grocery-vertical shops (electronics, pharmacy, hardware,
        fashion) render exactly as before. ---- */
function catIndex(name){for(var i=0;i<CATS.length;i++)if(CATS[i].name===name)return i;return -1;}
function catExists(name){return catIndex(name)>=0;}
function deptModel(){
  var keys=Object.keys(CATGROUPS||{}); if(!keys.length)return [];
  var used={},depts=[];
  keys.forEach(function(dn){
    var subs=(CATGROUPS[dn]||[]).filter(catExists);   // only sub-categories that actually have products
    subs.forEach(function(s){used[s]=1;});
    if(subs.length)depts.push({name:dn,subs:subs});
  });
  var more=CATS.filter(function(c){return !used[c.name];}).map(function(c){return c.name;}); // never drop a category
  if(more.length)depts.push({name:'More',subs:more});
  return depts;
}
function useDepartments(){ if(VERTICAL!=='grocery')return false; return deptModel().some(function(d){return d.name!=='More';}); }
function deptOf(cat){var m=deptModel();for(var i=0;i<m.length;i++)if(m[i].subs.indexOf(cat)>=0)return m[i];return null;}
function catProductImg(name){for(var k=0;k<CATS.length;k++){if(CATS[k].name===name)return CATS[k].img||'';}return '';}
function catTileInner(name,i){
  var ci=CAT_IMG[name]||catProductImg(name);
  if(ci){return '<div class="ci" style="background:#fff"><img alt="" src="'+esc(ci)+'" onerror="this.style.display=\'none\'"></div>';}
  if(THEME.premiumTiles){return '<div class="ci cifall"><span class="mono">'+esc(String(name||'?').trim().charAt(0).toUpperCase())+'</span></div>';}
  return '<div class="ci" style="background:'+TINTS[(i<0?0:i)%TINTS.length]+'">'+catIcon(name)+'</div>';
}
function catTile(name,i){
  return '<button class="cat" onclick="setCat('+jk(name)+')">'+catTileInner(name,i)+'<div class="nm">'+esc(name)+'</div></button>';
}

/* ================= Storefront V2 — filter & sort engine (Increment 4) ================= */
var FSORT='pop', FINSTOCK=false, FBULK=false, FBRANDS={}, FPMAX=0, _catShown=24;
function activeFilterCount(){ var n=0; if(FINSTOCK)n++; if(FBULK)n++; n+=Object.keys(FBRANDS).length; if(FPMAX>0)n++; return n; }
function resetFilters(){ FSORT='pop'; FINSTOCK=false; FBULK=false; FBRANDS={}; FPMAX=0; }
function applyFilters(list, keepOrder){
  var out=list.filter(function(p){
    if(FINSTOCK && oosOf(p)) return false;
    if(FBULK && !(p.packSize && p.packSize>=2)) return false;
    if(FPMAX>0 && p.price>FPMAX) return false;
    if(Object.keys(FBRANDS).length && !FBRANDS[(p.brand||'').toLowerCase()]) return false;
    return true;
  });
  // keepOrder: preserve the caller's ordering (used for relevance-ranked search results) unless
  // the shopper explicitly picked a sort other than the default 'pop'.
  if(keepOrder && FSORT==='pop') return out;
  out.sort(function(a,b){
    if(FSORT==='plow') return a.price-b.price;
    if(FSORT==='phigh') return b.price-a.price;
    if(FSORT==='new') return (b.createdAt||b.id||0)-(a.createdAt||a.id||0);
    return (b.popularity||0)-(a.popularity||0);
  });
  return out;
}
function sortLabel(){ return ({pop:'Popular',plow:'Price ↑',phigh:'Price ↓',new:'Newest'})[FSORT]||'Popular'; }
function filterBar(){
  var sorts=[['pop','Popular'],['plow','Price ↑'],['phigh','Price ↓'],['new','New']];
  var chips=sorts.map(function(s){return '<button class="fchip'+(FSORT===s[0]?' on':'')+'" onclick="setSort('+jk(s[0])+')">'+s[1]+'</button>';}).join('');
  var fc=activeFilterCount();
  return '<div class="filterbar"><button class="fchip" onclick="openFilters()">⚙ Filters'+(fc?(' <span class="fcount">'+fc+'</span>'):'')+'</button>'
    +'<button class="fchip'+(FINSTOCK?' on':'')+'" onclick="toggleInstock()">In stock</button>'+chips+'</div>';
}
function setSort(s){ FSORT=s; render(); }
function toggleInstock(){ FINSTOCK=!FINSTOCK; _catShown=24; render(); }
function curCatList(){ return PRODUCTS.filter(function(p){return p.category===CAT;}); }
function currentList(){ var ql=Q.trim().toLowerCase();
  if(ql) return smartSearch(Q,0).map(function(r){return r.p;});
  if(COLLVIEW) return collProducts(COLLVIEW);
  if(BIZVIEW){ var vb=activeBiz().filter(function(x){return x.id===BIZVIEW;})[0]; if(vb) return bizProducts(vb); }
  if(CAT!=='all') return curCatList(); return []; }
function catBrands(list){ var seen={},b=[]; list.forEach(function(p){var br=p.brand||'';if(br&&!seen[br.toLowerCase()]){seen[br.toLowerCase()]=1;b.push(br);}}); return b; }
function featuredBrands(list){ var b=catBrands(list); if(b.length<2)return '';
  return '<div class="sgroup" style="padding-left:14px">Featured brands</div><div class="brandstrip">'+b.slice(0,12).map(function(br){return '<button class="brandchip'+(FBRANDS[br.toLowerCase()]?' on':'')+'" onclick="toggleBrand('+jk(br)+')">'+esc(br)+'</button>';}).join('')+'</div>'; }
function toggleBrand(br){ br=br.toLowerCase(); if(FBRANDS[br])delete FBRANDS[br]; else FBRANDS[br]=1; _catShown=24; render(); }
function filterBrandChk(b,on){ if(on)FBRANDS[b]=1; else delete FBRANDS[b]; }

/* ---- Desktop rails (Phase 3): drive the SAME filter/cart state, no logic dup ----
   Instant-apply togglers (mobile filter sheet applies on "Show results"; the
   desktop sidebar applies immediately — that's the whole point). All gated to
   >=1024px so mobile never runs them. */
function _desktop(){ return !!(window.matchMedia && window.matchMedia('(min-width:1024px)').matches); }
function toggleBulk(){ FBULK=!FBULK; _catShown=24; render(); }
function setPmax(v){ FPMAX=(FPMAX===v?0:v); _catShown=24; render(); }
/* ---- Free-delivery rules (config-driven, per-city) ----
   Rules live in settings.delivery.free_rules = [{city, free_over}] (editable in v3).
   Falls back to a global delivery.free_over applied to every city, then to a seeded
   Juba / $50 default so the offer works before it's configured. currency = store currency. */
function freeRules(){
  var d=DELV_CFG||{}, rs=(d.free_rules&&d.free_rules.length)?d.free_rules:null;
  if(!rs){ var g=Number(d.free_over||d.freeOver||0)||0;
    if(g>0){ rs=(BRANCHES||[]).map(function(b){return {city:b.name,free_over:g};}); }
    else { rs=[{city:'Juba',free_over:50},{city:'Kampala',free_over:20}]; }   // seeded default until configured
  }
  return rs.map(function(r){return {city:String(r.city||'').trim(),free_over:Number(r.free_over)||0};})
           .filter(function(r){return r.city && r.free_over>0;});
}
function currentCity(){ return (DELV&&DELV.branch&&DELV.branch.name)?String(DELV.branch.name):''; }
function freeRuleForCity(city){ if(!city)return null; var lc=city.toLowerCase(), rs=freeRules();
  for(var i=0;i<rs.length;i++){ if(rs[i].city.toLowerCase()===lc) return rs[i]; } return null; }
function activeFreeRule(){ return freeRuleForCity(currentCity()); }
function freeQualified(sub){ var r=activeFreeRule(); return !!(r && sub>=r.free_over); }
// One-line delivery arrangement for the order / quotation note (reaches WhatsApp & the merchant).
function deliveryNote(){ var city=currentCity(), sub=cartTotal(), r=activeFreeRule();
  if(city && r && sub>=r.free_over) return 'Delivery: FREE (order over '+ugx(r.free_over)+' to '+city+')';
  if(city && r) return 'Delivery to '+city+': charged (FREE over '+ugx(r.free_over)+'); confirmed on WhatsApp';
  if(city) return 'Delivery to '+city+': confirmed on WhatsApp';
  return 'Delivery: confirmed on WhatsApp'; }
function _freeOver(){ var r=activeFreeRule(); return r?r.free_over:0; }

/* WH-AC v4.83 — M4: typo-tolerant search autocomplete ──────────────────────────────────────────
   The ENGINE has forgiven typos since the smart-search build (_fuzzyHit / _candidates): a
   misspelled word still finds products. What was missing is the SURFACE — the overlay never
   completed a half-typed word, never said "Did you mean…?", and a dead query fell straight to
   the WhatsApp fallback without offering the near-miss. These suggestions are honest by
   construction:
     · candidates come ONLY from the catalogue's own token vocabulary (SITOKENS) — never invented;
     · every suggestion is VERIFIED against the live engine before display — a query we offer is
       a query that returns at least one product. This is also what keeps words that exist only
       on hidden/POA products out of the suggestion list: they are in the index, but they verify
       to zero results, so they are never shown;
     · typo rescue never floods: at most the two closest candidates (edit distance first, then
       how common the word is), and only when nothing completes by prefix;
     · only the word being typed (the tail) is completed/rescued — earlier words are the buyer's
       own and the engine's fuzzy matching already handles typos there.
   Gated: whAcRows() returns '' unless whOn(), so classic shops render byte-identically. */
function whAcVerify(q){ try{ return smartSearch(q,1).length>0; }catch(e){ return false; } }
function whAcSuggest(q,max){
  max=max||4;
  if(!SIDX||!SITOKENS) return [];
  var n=_normStr(q); if(!n) return [];
  var words=n.split(/[^a-z0-9]+/).filter(Boolean); if(!words.length) return [];
  var tail=words[words.length-1], head=words.slice(0,-1).join(' '); head=head?head+' ':'';
  if(tail.length<2) return [];
  var cand=[], k, st;
  for(k=0;k<SITOKENS.length;k++){ st=SITOKENS[k];
    if(st!==tail && st.indexOf(tail)===0) cand.push({t:st,d:0,f:SIDX[st].length,dym:false}); }
  cand.sort(function(a,b){ return b.f-a.f; });
  if(!cand.length && tail.length>=4){
    var thr=tail.length>=7?2:1;
    for(k=0;k<SITOKENS.length;k++){ st=SITOKENS[k];
      if(st===tail||Math.abs(st.length-tail.length)>thr) continue;
      var d=_lev(st,tail); if(d<=thr) cand.push({t:st,d:d,f:SIDX[st].length,dym:true});
    }
    cand.sort(function(a,b){ if(a.d!==b.d)return a.d-b.d; return b.f-a.f; });
    cand=cand.slice(0,2);   // ambiguity never floods: two best guesses, ranked, or nothing
  }
  /* SITOKENS keys are unique and completions/rescue are mutually exclusive, so every candidate
     yields a distinct full query — no dedupe needed. tried<8 is the cost fence: at most eight
     verification searches per keystroke, no matter how big the vocabulary. */
  var out=[], tried=0;
  for(k=0;k<cand.length && out.length<max && tried<8;k++){
    tried++;
    var full=(head+cand[k].t).replace(/\s+/g,' ').trim();
    if(whAcVerify(full)) out.push({q:full,dym:cand[k].dym});
  }
  return out;
}
function whAcRows(q,max){

/* v4.82 — the model's *stars* (and any stray markdown **stars**) render as bold, never as raw
   asterisks. Escaping happens FIRST; only <b> is introduced after, so nothing else can inject. */

    .replace(/\*\*([^*<]{1,80}?)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*<]{1,80}?)\*/g,'<b>$1</b>');

function whChatSend(text,action){
  if(WHCHAT.busy) return;
  if(text==='__human__'){ text='I would like to talk to a person.'; action='human'; }
  var sg=document.querySelector('#whChatBd .sugg'); if(sg) sg.remove();   /* v4.84 — the greeting bubble stays in the thread; only the chips clear */
  whChatPaint({role:'me',text:text}); whChatScroll();
  WHCHAT.busy=true; WHCHAT.last=text;
  var bd=document.getElementById('whChatBd');
  bd.insertAdjacentHTML('beforeend','<div class="row bot" id="whChatTyp">'+whChatAva()+'<div class="bub typ"><span></span><span></span><span></span></div></div>'); whChatScroll();
  var body={message:text,session_id:whChatSid()};
  try{ var dl=(typeof DELV!=='undefined'&&DELV&&DELV.branch&&DELV.branch.name)?String(DELV.branch.name):''; if(dl) body.location=dl.slice(0,40); }catch(e){}
  if(action) body.action=action;
  try{ if(typeof AUTHTOK!=='undefined'&&AUTHTOK) body.auth=AUTHTOK; }catch(e){}   // v4.81 — server validates; never trusted client-side
  var ctc=whChatContact(); if(ctc){ body.contact_name=ctc.name; body.contact_phone=ctc.phone; }   // v4.85 — rides every message; server stores once
  /* v4.93 — campaign attribution rides along; the server stores it once per session and ignores it
     after that, exactly like the contact fields above. Both values were sanitised server-side before
     they reached this page, so nothing here can smuggle a query string into the log. */
  try{ var cx=SHOP.chatCtx||{}; if(cx.source) body.source=cx.source; if(cx.campaign) body.campaign=cx.campaign; }catch(e){}
  fetch((SHOP.base||'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){ return r.json().then(function(j){ return {st:r.status,j:j}; }).catch(function(){ return {st:r.status,j:null}; }); })
  .then(function(x){
    whChatDone();
    if(x.st===429){ whChatErr('One moment — still finishing your last message.',true); return; }
    if(x.j && x.j.error==='need_contact'){   // v4.85 — the server is the law; the form reappears
      whChatErr('Please share your name and WhatsApp number first.',false);
      try{ localStorage.removeItem('cb_chat_ctc_'+(SHOP.slug||'shop')); }catch(e){}
      whChatCtcSync();
      return;
    }
    /* v4.84 — ✓✓ means DELIVERED to our server and answered: it upgrades only on paths where a
       real reply (or the honest chat-off notice) came back — never on errors, never before. */
    if(x.j && (x.j.ok!==false || x.j.error==='chat_off')) whChatTick();
    if(x.j && x.j.error==='chat_off'){
      whChatErr('Chat isn\'t switched on right now.',false);
      if(SHOP.waNumber){ bd.insertAdjacentHTML('beforeend','<div class="row bot"><a class="bub doc" target="_blank" rel="noopener" href="'+whChatWaHref()+'">'+WH_IC.wa+' Message us on WhatsApp</a></div>'); whChatScroll(); }
      return;
    }
    if(!x.j || x.j.ok===false){ whChatErr('Something went wrong.',true); return; }
    (x.j.messages||[]).forEach(function(m){ whChatPaint(m); });
    (x.j.products||[]).forEach(function(p){ whChatPaint({type:'card',p:p}); });
    if((x.j.products||[]).length){ sTrack('chat_reco',{n:x.j.products.length}); }
    if(x.j.wa && SHOP.waNumber){
      bd.insertAdjacentHTML('beforeend','<div class="row bot"><a class="bub doc" target="_blank" rel="noopener" href="'+whChatWaHref()+'">'+WH_IC.wa+' Continue on WhatsApp</a></div>');
    }
    whChatScroll(); sTrack('chat_msg',{});
  })
  .catch(function(){ whChatDone(); whChatErr('No connection.',true); });
}

/* v4.84 — dictate into the chat input (same Web Speech API the search mic uses; progressive
   enhancement — the button only renders when the browser supports it). The buyer still presses
   send: on an order channel, autosubmitting a misheard sentence is worse than one extra tap. */
var _cRec=null;
function whChatVoice(btn){
  var SR=_SR(); if(!SR) return;
  if(_cRec){ try{_cRec.stop();}catch(e){} return; }
  try{ _cRec=new SR(); }catch(e){ _cRec=null; return; }
  _cRec.lang=(navigator.language||'en-US'); _cRec.interimResults=true; _cRec.maxAlternatives=1; _cRec.continuous=false;
  var i=document.getElementById('whChatIn');
  _cRec.onresult=function(ev){ var s=''; for(var k=ev.resultIndex;k<ev.results.length;k++){ s+=ev.results[k][0].transcript; } if(i&&s) i.value=s.replace(/\s+/g,' ').trim(); };
  _cRec.onerror=function(ev){ var e=ev&&ev.error; if(e==='not-allowed'||e==='service-not-allowed'){ try{toast('Microphone blocked — allow mic access in your browser');}catch(x){} } };
  _cRec.onend=function(){ _cRec=null; if(btn) btn.classList.remove('rec'); if(i){ try{ i.focus(); }catch(e){} } };
  if(btn) btn.classList.add('rec');
  try{ _cRec.start(); }catch(e){ _cRec=null; if(btn) btn.classList.remove('rec'); }
}

/* v4.76.1 — owner's repro: Browse Categories → "Shop by Business" did nothing. The old guard
   only left CATEGORY/SEARCH state (CAT/Q); the category BROWSER (CATLIST), business drill-ins
   and the detail page all kept their view, so the target section never existed to scroll to.
   Now the DOM decides: section missing → we are not on home → goHome() (which resets every
   view flag), then keep seeking until the section renders. Slow phones get 12 tries, not 1. */
function whGo(id){
  WHPAGE='';
  if(!$(id)){ goHome(); }
  var tries=0;(function seek(){ var el=$(id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); }
    else if(++tries<12){ setTimeout(seek,70); }

/* ============================================================================
   ProductPriceService — SINGLE SOURCE OF TRUTH FOR PRICE
   ----------------------------------------------------------------------------
   The catalogue feed (PRODUCTS) is authoritative: it is what the listing,
   search, collections, cart, checkout and WhatsApp summary all read, and it
   carries the true price (derived from the cents field). The product-detail
   endpoint (/product/:id) is a SEPARATE data source and has been observed to
   return a different value for the same product (e.g. a rounded/base price like
   $2.00 where the catalogue says $2.74). That divergence is the pricing bug.

   Rule: NO screen reads a price from the detail endpoint (or any per-page copy)
   for display or for adding to the cart. Every surface resolves price through
   priceOf(); detail/related-product objects are reconciled to the catalogue
   BEFORE they are shown or added. Same product => same price everywhere.
   ============================================================================ */
function _prodById(id){ if(id==null||id==='')return null; id=String(id); for(var i=0;i<PRODUCTS.length;i++){ if(String(PRODUCTS[i].id)===id) return PRODUCTS[i]; } return null; }
function _prodByName(name){ if(!name)return null; var n=String(name).toLowerCase(); for(var i=0;i<PRODUCTS.length;i++){ if(String(PRODUCTS[i].name).toLowerCase()===n) return PRODUCTS[i]; } return null; }
function catalogueProduct(ref){ if(ref&&typeof ref==='object') return _prodById(ref.id)||_prodByName(ref.name); return _prodById(ref)||_prodByName(ref); }
// Authoritative price for a product ref (id | name | object). Falls back to the
// object's own price ONLY when the item isn't in the catalogue at all.
function priceOf(ref){ var c=catalogueProduct(ref); if(c && c.price>0) return c.price; if(ref&&typeof ref==='object' && ref.price>0) return ref.price; return 0; }
function oldPriceOf(ref){ var c=catalogueProduct(ref); if(c) return c.oldPrice||0; if(ref&&typeof ref==='object') return ref.oldPrice||0; return 0; }
// Align a detail/related-product object's price fields to the catalogue in place,
// so anything built from it (display, stepper, add-to-cart) is guaranteed correct.
function reconcilePrice(obj){ if(!obj)return obj; var c=catalogueProduct(obj); if(c && c.price>0){ obj.price=c.price; obj.oldPrice=c.oldPrice||0; obj.mrp=c.oldPrice||0; } return obj; }

  }catch(e){toast('Network error — please try again.','err');if(btn){btn.disabled=false;btn.textContent='Request Quotation';}}
}

/* ---- brand the shell from the injected config ---- */
(function brand(){
  document.title=(SHOP.name||'Shop')+' — Shop';
  var hb=document.querySelector('.top b'); if(hb)hb.textContent=SHOP.name||'Shop';
  var lg=document.querySelector('.top .lg'); if(lg){ if(SHOP.logo){lg.innerHTML='<img alt="" src="'+esc(SHOP.logo)+'" style="width:100%;height:100%;object-fit:cover">';lg.style.background='#fff';} else {lg.textContent=SHOP.initials||'SH';} }
  var fn=$('footName'); if(fn)fn.textContent=(SHOP.name||'Shop')+(SHOP.city?(' · '+SHOP.city):'');
  var sl=$('staffLink'); if(sl)sl.href=ADMIN_URL;
})();

/* V2 search overlay wiring (the main #q is now a trigger; typing happens in #sq). */
/* Phase 4: keyboard-first search. A highlight walks the result rows; Enter
   quick-adds the highlighted product (keeping the palette open so the buyer
   keeps typing the next item) or triggers a brand/category/"see-all" row.
   On mobile no arrows are pressed, so _skb stays -1 and Enter → searchSubmit,
   exactly as before — mobile behaviour is preserved. */
var _skb=-1;
function _srows(){ var b=$('sqBody'); return b?Array.prototype.slice.call(b.querySelectorAll('.srow')):[]; }
function _skbSet(i){ var rows=_srows(); if(!rows.length){ _skb=-1; return; }
  rows.forEach(function(r){ r.classList.remove('kbhl'); });
  if(i<0)i=rows.length-1; if(i>=rows.length)i=0; _skb=i;
  rows[i].classList.add('kbhl'); try{ rows[i].scrollIntoView({block:'nearest'}); }catch(e){} }
if($('sq')){
  $('sq').addEventListener('input',function(){ cancelAutorun(); _skb=-1; var v=this.value;
    // Debounced render keeps typing smooth on large catalogues; empty query renders immediately.
    if(_sqDeb)clearTimeout(_sqDeb); if(!v){ searchRender(''); return; } _sqDeb=setTimeout(function(){ searchRender(v); }, 80); });
  $('sq').addEventListener('keydown',function(e){
    var rows=_srows();
    if(e.key==='ArrowDown'){ e.preventDefault(); if(rows.length)_skbSet(_skb+1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); if(rows.length)_skbSet(_skb-1); }
    else if(e.key==='Enter'){ e.preventDefault();
      if(_skb>=0 && rows[_skb]){ var row=rows[_skb], add=row.querySelector('.sadd');
        if(add){ add.click(); toast('Added to your order','ok'); }   /* quick add, palette stays open */
        else { row.click(); } }
      else { searchSubmit(this.value); } }
    else if(e.key==='Escape'){ e.preventDefault(); searchClose(); }
  });
}
/* Desktop: click the dimmed page (scrim) to dismiss the search palette. Mobile
   overlay is full-bleed with no scrim, so this is gated to desktop and is a no-op there. */
if($('searchOverlay')){
  $('searchOverlay').addEventListener('click',function(e){ if(e.target===this && _desktop()) searchClose(); });
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ var sc=$('scanOverlay'); if(sc&&sc.classList.contains('show')){ stopScan(); return; } var o=$('searchOverlay'); if(o&&o.classList.contains('show')){ searchClose(); return; } var sh=$('sheet'); if(sh&&sh.classList.contains('show')) closeSheet(); } });
/* Infinite scroll: grow the category/search grid as the sentinel nears the viewport. */
window.addEventListener('scroll',function(){ var lm=$('loadmore'); if(!lm)return; if(lm.getBoundingClientRect().top < window.innerHeight+320){ growGrid(); } },{passive:true});
/* A11y: when the bottom sheet opens, move focus into the dialog (screen readers announce it,
   keyboard stays trapped-ish); restore focus to the trigger on close. Centralised via observer. */
(function(){ var sh=$('sheet'); if(!sh||!window.MutationObserver)return; var last=null;
  new MutationObserver(function(){ if(sh.classList.contains('show')){ last=document.activeElement; var x=sh.querySelector('.sheethd .x'); if(x){ try{ x.focus(); }catch(e){} } }
    else if(last){ try{ last.focus(); }catch(e){} last=null; } }).observe(sh,{attributes:true,attributeFilter:['class']});
})();

/* Desktop breadcrumbs (Phase 2): the existing .backbar (parent ‹ current) is
   upgraded in place to a "Home / parent / current" trail. Desktop-only via
   matchMedia; idempotent via data-crumb; preserves the parent link's action.
   No-op on mobile, so the phone backbar is unchanged. */
(function(){
  var content=$('content'); if(!content||!window.MutationObserver||!window.matchMedia)return;
  var mq=window.matchMedia('(min-width:1024px)');
  function enhance(){
    if(!mq.matches)return;
    var bars=content.querySelectorAll('.backbar:not([data-crumb])');
    for(var i=0;i<bars.length;i++){
      var b=bars[i]; b.setAttribute('data-crumb','1');
      var back=b.querySelector('button'), cur=b.querySelector('b');
      var act=back?(back.getAttribute('onclick')||''):'';
      var pl=back?back.textContent.replace(/^[‹<\s]+/,'').trim():'';
      var cl=cur?cur.textContent:'';
      var html='<button class="crumb" onclick="goHome()">Home</button>';
      /* v4.76.1 — when the parent IS home ("‹ Home"), a second Home crumb duplicated the first
         ("Home / Home / All categories"). All-shop fix: the parent crumb renders only when it
         leads somewhere other than home. */
      if(pl && act.indexOf('goHome()')===-1) html+='<span class="crumbsep">/</span><button class="crumb" onclick="'+act+'">'+esc(pl)+'</button>';
      html+='<span class="crumbsep">/</span><b>'+esc(cl)+'</b>';
      b.innerHTML=html;
    }
    if(typeof syncDesktopSide==='function') syncDesktopSide();
  }
  new MutationObserver(enhance).observe(content,{childList:true,subtree:true});
  enhance();
})();

loadCart(); loadCust(); loadWish(); loadRSearch(); try{whChrome();whNav();whPopChips();whSearchIcons();}catch(e){} bar(); restoreDelv(); if($('content'))$('content').innerHTML=(whOn()?whSkeleton():skeletonGrid(8)); load();   /* v4.83 — wholesale chrome + a wholesale-shaped skeleton BEFORE first paint (the desktop CLS fix). Gated: classic shops boot exactly as before. */

/* v4.93 — /chat: open the conversation instead of the shop. The page is identical; only the chrome
   is hidden (chatOnlyCss) and the panel is opened on load rather than on a launcher tap. Campaign
   context arrives from the server already sanitised and is handed to the chat as its opening intent,
   so attribution is decided server-side and never guessed here. */
(function(){
  if(!SHOP || !SHOP.chatOnly) return;
  document.body.classList.add('chat-only');
  var ctx = SHOP.chatCtx || {};
  function openIt(){
    try{ whChatShow(); }catch(e){ return; }
    try{
      var seed = '';
      if(ctx.product)  seed = 'I am looking for product ' + ctx.product;
      else if(ctx.category) seed = 'Show me ' + ctx.category.replace(/-/g,' ');
      else if(ctx.campaign) seed = 'I saw your ' + ctx.campaign.replace(/-/g,' ') + ' offer';
      // whChatSend() is the SAME path the launcher chips and the composer use — the campaign seed
      // is an ordinary customer message, so the AI, the caps, the contact gate and the logging all
      // treat it exactly like one. Nothing about campaigns is special-cased downstream.
      if(seed && typeof whChatSend === 'function') whChatSend(seed);
    }catch(e){}
  }
  if(document.readyState === 'complete') setTimeout(openIt, 60);
  else window.addEventListener('load', function(){ setTimeout(openIt, 60); });
})();

</script>
