/* __VENDORED_FONTS_END__ */
:root{--accent:#C8102E;--accent-d:#9B0C23;--ink:#0C1220;--ink2:#141B2D;--muted:#5A6472;--line:#E6EAF0;--soft:#F3F5F8;--ok:#0C6E3A}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#F5F7FA;line-height:1.55}
a{text-decoration:none;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;font-weight:700;cursor:pointer;padding:11px 18px;font-size:14px;font-family:inherit}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-d)}
.btn-o{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-o:hover{background:var(--soft)}
.btn-w{background:#0B7A3D;color:#fff}.btn-sm{padding:8px 14px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.chip.g{color:var(--ok);background:#E4F4EC}.chip.b{color:#C77700;background:#FDF3E2}
.stock{font-size:12px;font-weight:700}.stock.y{color:var(--ok)}.stock.n{color:#C62828}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff}
.nav .wrap{display:flex;align-items:center;gap:16px;height:62px}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer}
.emb{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px}
.brand b{font-size:15px;letter-spacing:.4px}.brand i{display:block;font-style:normal;font-size:8px;letter-spacing:2px;color:#aeb8cc}
.nav .lnk{color:#cdd6e6;font-weight:600;font-size:13.5px;margin-left:16px;cursor:pointer}.nav .lnk:hover{color:#fff}
.nav .sp{flex:1}
.nav .cart{position:relative;color:#fff;background:#1b2436;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px}
/* hero */
.hero{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.hero .g{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;padding:46px 20px 52px}
.hero h1{font-size:40px;font-weight:800;line-height:1.06;letter-spacing:-.02em}
.hero p{color:#aeb8cc;font-size:17px;margin:14px 0 22px;max-width:44ch}
.hsearch{display:flex;gap:8px;background:#fff;border-radius:12px;padding:7px 7px 7px 15px;max-width:520px;align-items:center;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hsearch input{flex:1;border:0;outline:0;font-size:15px;font-family:inherit;color:var(--ink)}
.pop{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:#aeb8cc;align-items:center}
.pop a{background:#1b2436;border:1px solid #29344a;color:#dfe5f0;border-radius:99px;padding:5px 11px;font-weight:600;cursor:pointer}
.hero img.hph{width:100%;max-width:560px;border-radius:18px;box-shadow:0 26px 50px rgba(0,0,0,.5);object-fit:cover;aspect-ratio:16/11}
/* trust */
.trust{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 12px rgba(12,18,32,.06);padding:16px 20px;margin-top:-26px;position:relative;z-index:3}
.trust div{display:flex;align-items:center;gap:9px}.trust .d{width:34px;height:34px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.trust b{display:block;font-size:12.5px}.trust span{font-size:11px;color:var(--muted)}
/* blocks */
.blk{padding:40px 0 4px}.blk .hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
.blk h2{font-size:24px;font-weight:800;letter-spacing:-.01em}.blk .sub{color:var(--muted);font-size:14px;margin-top:4px}
.link{color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.allbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#fff;border:1.5px solid var(--line,#e2e8f0);border-radius:14px;padding:16px 20px;margin:0 0 18px;cursor:pointer;transition:.15s}.allbar:hover{border-color:var(--brand,#16a34a);box-shadow:0 2px 10px rgba(0,0,0,.06)}.allbar b{display:block;font-size:16px}.allbar span{color:#64748b;font-size:13.5px}.allbar .go{color:var(--brand,#16a34a);font-weight:700;white-space:nowrap;font-size:14px}@media(max-width:640px){.allbar{padding:14px 16px}.allbar .go{font-size:13px}}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.listlayout{display:flex;gap:22px;align-items:flex-start}
.listmain{flex:1;min-width:0}
.side{flex:0 0 224px;position:sticky;top:74px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14px}
.side .sblock{margin-bottom:16px}.side .sblock:last-child{margin-bottom:0}
.side .slabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:800}
.side .srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink);font-weight:600;margin-bottom:2px}
.side .srow span{color:var(--muted);font-size:12px;font-weight:600}
.side .srow.on{background:var(--accent);color:#fff}.side .srow.on span{color:rgba(255,255,255,.85)}
.side .srow:hover:not(.on){background:#f2f5f8}
.side .fchk{display:flex;align-items:center;gap:9px;padding:7px 4px;cursor:pointer;font-weight:600}
.side .fchk input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
.side .fhint{font-size:12px;color:var(--muted);padding:4px 2px}
@media(max-width:820px){
  .listlayout{flex-direction:column}
  .side{position:static;flex:none;width:100%;order:-1;padding:12px}
  .side .sblock{margin-bottom:12px}
  .side .sblock:first-child{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .side .sblock:first-child .slabel{width:100%}
  .side .sblock:first-child .srow{display:inline-flex;margin:0;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#f7f9fb}
  .side .sblock:first-child .srow.on{background:var(--accent);border-color:var(--accent)}
  .side .sblock:last-child{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .side .sblock:last-child .slabel{width:100%}
}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 1px 3px rgba(12,18,32,.06);transition:transform .16s,box-shadow .16s;cursor:pointer}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(12,18,32,.12)}
.mc .im{aspect-ratio:4/3;background:var(--soft);overflow:hidden}.mc .im img{width:100%;height:100%;object-fit:cover}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  if(!wants.length) return [];

  wants.forEach(function(w){ STATE.products.forEach(function(x){
    if(out.length>=n||seen[x.id]||x.id===p.id) return;

    if(String(x.name).toLowerCase().indexOf(w)<0) return;
    if(p.brand&&x.brand&&p.brand!==x.brand) return;      /* stay in the same brand family */
    seen[x.id]=1; out.push(x);
  }); });
  return out;
}

   name/keyword tokens; per-word correction with edit-distance <=1 (short) / <=2 (longer). */
var _VOC=null;
function vocab(){
  if(_VOC) return _VOC;
  var set={};
  STATE.products.forEach(function(p){
    String(p.name+' '+(p.kw||'')).toLowerCase().split(/[^a-z]+/).forEach(function(t){ if(t.length>=3&&t.length<=18) set[t]=1; });
  });
  _VOC=Object.keys(set); return _VOC;
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  var m=a.length,n=b.length,prev=[],cur=[];
  for(var j=0;j<=n;j++)prev[j]=j;
  for(var i=1;i<=m;i++){ cur=[i];
    for(var k=1;k<=n;k++){ cur[k]=Math.min(prev[k]+1,cur[k-1]+1,prev[k-1]+(a[i-1]===b[k-1]?0:1)); }
    prev=cur; }
  return prev[n];
}
function didYouMean(q){
  var words=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length||words.length>5) return null;
  var changed=false;
  var out=words.map(function(w){
    if(w.length<3||/[0-9]/.test(w)) return w;
    if(searchSets(w).all.length) return w;                 /* word already finds parts — keep it */
    var best=null,bd=9,lim=w.length<=4?1:2;
    var V=vocab();
    for(var i=0;i<V.length;i++){ var d=lev(w,V[i]); if(d<=lim&&d<bd){ bd=d; best=V[i]; if(d===1&&w.length>5)break; } }
    if(best){ changed=true; return best; }
    return w;
  }).join(' ');
  if(!changed||out===q) return null;
  var s=searchSets(out);
  return (s.all.length||s.plates.length)?out:null;
}

// NOTE: these src/ files share one runtime scope; build_storefront.py concatenates them

/* ---------- data ---------- */
function normalize(json){
  var arr = Array.isArray(json)?json:(json.rows||json.products||json.items||json.data||[]);
  if(!Array.isArray(arr)){ for(var k in json){ if(Array.isArray(json[k])){arr=json[k];break;} } }
  return (arr||[]).map(function(p,i){
    return {
      id: p._row||p.id||p.ID||i,
      name: p['Product Name']||p.name||p.Name||'',
      cat: p.Category||p.category||'Other',
      price: p.Price_UGX!=null?p.Price_UGX:(p.price!=null?p.price:0),
      stock: (p.Stock!=null?p.Stock:(p.stock!=null?p.stock:null)),
      img: p.Image||p.image||p.image_url||'',
      kw: p.Keywords||p.keywords||'',
      pn: (p.OEM||p.oem||'').toString().trim(),
      sku: (p.SKU||p.Item_Code||'').toString().trim(),
      gal: p.Gallery||[],
      specs: p.Specs||{},
      brand: p.Brand||p.brand||'',
      created: p.Created||0,
      popularity: p.Popularity||0,
      desc: p.Description||p.description||'',
      pack: (p.PackSize!=null?p.PackSize:(p.pack_size!=null?p.pack_size:(p.pack!=null?p.pack:null))),
      piece: (p.PiecePrice!=null?p.PiecePrice:(p.piece_price!=null?p.piece_price:null)),
      unit: (p.Unit||p.unit||p.unit_label||'')
    };
  }).filter(function(p){return p.name;});
}
/* Infer a system (Engine, Brakes, …) for a part from its name/keywords. Needed when a catalogue's
   Category is model-based ("Bike Spare Parts - Boxer") instead of system-based, so "browse by system"
   would otherwise show 0 in every system. Returns a name from CFG.systems, or '' if none apply. */
function sysGuess(p, sysNames){
  var h=(String(p.name||'')+' '+String(p.kw||'')).toLowerCase();
  var R=[
    ['Brakes',         /brake|caliper|master cylinder/],
    ['Suspension',     /shock|suspension|\bfork\b|damper|swing ?arm/],
    ['Fuel System',    /carburet|\bcarb\b|fuel|choke|throttle|petcock|tank cap|air filter/],
    ['Electrical',     /\bcdi\b|stator|regulator|rectifi|flasher|ignition|\bcoil\b|head ?light|tail ?light|turn signal|indicator|speedo|\bhorn\b|wir(e|ing)|battery|starter motor|magneto|spark plug|\bbulb\b|relay|\bswitch\b/],
    ['Transmission',   /clutch|\bgear|drive chain|sprocket|kick ?start|transmission|counter ?shaft/],
    ['Engine',         /piston|camshaft|cam chain|crank|connecting rod|conrod|cylinder|\bvalve\b|rocker|gasket|oil seal|oil pump|\bengine\b|timing|bearing/],
    ['Wheels & Tyres', /wheel|\btyre|\btire|\brim\b|\btube\b|spoke|\baxle\b|\bhub\b/],
    ['Controls',       /handle|\bgrip\b|lever|mirror|foot ?rest|foot ?peg|cable|control/],
    ['Frame & Body',   /frame|fender|mud ?guard|\bguard\b|\bseat\b|tank|panel|cover|\bbody\b|\bstand\b|number plate/],
  ];
  for(var i=0;i<R.length;i++){ if(R[i][1].test(h) && sysNames.indexOf(R[i][0])>=0) return R[i][0]; }
  return (sysNames.indexOf('Accessories')>=0)?'Accessories':'';
}
function loadCatalogue(){
  if(!CFG.catalogueUrl){ STATE.error=true; render(); return; }
  fetch(CFG.catalogueUrl,{headers:{'Accept':'application/json'}}).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); }).then(function(j){
    var all=normalize(j); STATE.allProducts=all; STATE.byCat={}; STATE.byPn={}; STATE.bySys={};
    // "Sell only what we have": hide parts with an explicit 0 stock (untracked/null still shows).
    STATE.products = CFG.hideOOS ? all.filter(function(p){ return !(p.stock!=null && p.stock<=0); }) : all;
    // byPn from ALL parts so exploded diagrams still resolve every callout
    all.forEach(function(p){ var pn=normPn(pnOf(p)); if(pn && !STATE.byPn[pn])STATE.byPn[pn]=p; });
    var sysNames=(CFG.systems||[]).map(function(s){return s.name;});
    STATE.products.forEach(function(p){
      (STATE.byCat[p.cat]=STATE.byCat[p.cat]||[]).push(p);
      var segs=String(p.cat||'').split('>').concat(String(p.kw||'').split('|')).map(nk);
      var hit=false;
      sysNames.forEach(function(sn){ var k=nk(sn); if(segs.indexOf(k)>=0){ (STATE.bySys[k]=STATE.bySys[k]||[]).push(p); hit=true; } });
      // Category didn't name a system (e.g. a model-based catalogue) — infer one from the part name so
      // "browse by system" isn't empty. Each part lands in exactly one system.
      if(!hit){ var g=sysGuess(p, sysNames); if(g){ (STATE.bySys[nk(g)]=STATE.bySys[nk(g)]||[]).push(p); } }
    });
    (DIAG&&DIAG.plates||[]).forEach(function(pl){ (pl.parts||[]).forEach(function(x){ STATE.pnPlate[normPn(x.pn)]=pl.plate; }); });
    STATE.loaded=true; render(); try{ dlrLoad(); }catch(e){}
  }).catch(function(){ STATE.error=true; STATE.loaded=true; render(); try{ dlrLoad(); }catch(e){} });
}
function systemsWithCounts(){
  return (CFG.systems||[]).map(function(s){
    var list=(STATE.bySys&&STATE.bySys[nk(s.name)])||STATE.byCat[s.name]||[];
    var cov=(SYSCOVER&&(SYSCOVER[s.id]||SYSCOVER[s.name]))||'';
    return {id:s.id,name:s.name,count:list.length,cover:cov};
  });
}

// EA Auto Part storefront — module: 03-garage.js
// saved bike (My Garage) + fitment
// NOTE: these src/ files share one runtime scope; build_storefront.py concatenates them
// in filename order into a single inline bundle. Keep 12-a11y-boot.js last (it boots the app).
/* ---------- My Garage (saved bike) + fitment ---------- */
function getBike(){ try{ var id=localStorage.getItem('ea_bike'); return (MODELS||[]).filter(function(m){return m.id===id;})[0]||null; }catch(e){ return null; } }
function setBike(id){ try{ localStorage.setItem('ea_bike',id); }catch(e){} }
function clearBike(){ try{ localStorage.removeItem('ea_bike'); }catch(e){} render(); }
// Family/series of a model name: the leading word(s) before the numbers.
// "Boxer 100 KS" -> "boxer" ; "CT 125 HD" -> "ct" ; "Pulsar 150" -> "pulsar".
function bikeSeries(b){ var m=String((b&&(b.catName||b.name))||'').toLowerCase().match(/^[a-z]+/); return m?m[0]:''; }
/*
 * Smart, three-state fitment (never scares the customer with a false "not for"):
 *   true  -> confidently fits: the model or its family is named in the part, OR it's a
 *            universal / generic component (bearing, bolt, seal, cable…) that fits broadly.
 *   false -> confidently does NOT fit: the part names a DIFFERENT specific model and nothing
 *            ties it to this bike.
 *   null  -> unknown: don't hide it, don't badge it negatively.
 * This copes with real supplier data where stock is tagged by series ("BOXER") or left generic.
 */
// Compatible model ids for a part, from the official catalogue cross-reference (or null if the
// part number isn't in it). This is authoritative multi-model fitment.
function compatIds(p){ var pn=normPn(pnOf(p)); return (pn && PNFITS && PNFITS[pn])||null; }
var _pnfitsModels=null;
function pnfitsCovers(id){ if(!_pnfitsModels){ _pnfitsModels={}; for(var k in (PNFITS||{})){ (PNFITS[k]||[]).forEach(function(m){_pnfitsModels[m]=1;}); } } return !!_pnfitsModels[id]; }
function compatibleModels(p){ var ids=compatIds(p); if(!ids) return []; return (MODELS||[]).filter(function(m){return ids.indexOf(m.id)>=0;}); }
function fitsBike(p){
  var b=getBike(); if(!b) return null;
  // Authoritative: if the part is in the catalogue cross-reference AND this model has a catalogue,
  // trust the cross-reference exactly (fits iff the model is listed).
  var ids=compatIds(p);
  if(ids && pnfitsCovers(b.id)) return ids.indexOf(b.id)>=0;
  var hay=nk(String(p.kw||'')+' '+String(p.cat||''));
  var model=nk(b.catName||b.name);
  if(model && hay.indexOf(model)>=0) return true;      // explicit model match anywhere
  var series=bikeSeries(b);
  if(series && series.length>=2 && hay.indexOf(series)>=0) return true;  // same family (e.g. BOXER)
  /* v4.7.5: brand-family guard — supplier catalogues tag parts per brand (bajaj/boxer vs tvs/hlx).
     A part tagged ONLY for the other brand is confidently not for this bike, even if it is a
     generic wear item (a TVS clutch cable does not fit a Boxer). Token-exact, so 'rectifier'
     can never read as 'ct'. Untagged parts fall through to the generic rules unchanged. */
  var _pt=String((p.kw||'')+','+(p.cat||'')).toLowerCase().split(/[^a-z0-9]+/);
  var _bt=String((b.catName||b.name)||'').toLowerCase().split(/[^a-z0-9]+/);
  var _FB={bajaj:['bajaj','boxer','ct'],tvs:['tvs','hlx']}, _FP={bajaj:['bajaj','boxer'],tvs:['tvs','hlx']};
  var _fam=''; for(var _f in _FB){ if(_FB[_f].some(function(t){return _bt.indexOf(t)>=0;})){ _fam=_f; break; } }
  if(_fam){ var _own=_FP[_fam].some(function(t){return _pt.indexOf(t)>=0;});
            var _oth=false; for(var _g in _FP){ if(_g!==_fam&&_FP[_g].some(function(t){return _pt.indexOf(t)>=0;})){ _oth=true; break; } }
            if(_oth&&!_own) return false; }
  if(isUniversal(p)||isGenericPart(p)) return true;    // generic hardware fits across models
  // Only say "no" when the part clearly names another specific model we know about.
  var namesOther=(MODELS||[]).some(function(m){ if(!m||m.id===b.id) return false; var mn=nk(m.catName||m.name); return mn && mn.length>=4 && hay.indexOf(mn)>=0; });
  return namesOther ? false : null;
}

// EA Auto Part storefront — module: 04-vehicle.js
// vehicle taxonomy (scales to cars)
// NOTE: these src/ files share one runtime scope; build_storefront.py concatenates them
// in filename order into a single inline bundle. Keep 12-a11y-boot.js last (it boots the app).
/* ---------- vehicle taxonomy (scales to cars) ---------- */
function vehTypes(){ var t={}; (MODELS||[]).forEach(function(m){ if(m.type)t[m.type]=1; }); return Object.keys(t); }
function vehWord(){ return vehTypes().length>1 ? 'vehicle' : 'motorcycle'; }
function isUniversal(p){ var h=(String(p.cat||'')+' '+String(p.kw||'')).toLowerCase(); return h.indexOf('universal')>=0||h.indexOf('fits all')>=0||h.indexOf('all models')>=0; }
/* Generic components that fit broadly across models (standard hardware / wear items). */
function isGenericPart(p){ return /\b(bearing|ball bearing|bolt|nut|washer|screw|circlip|c-clip|o-?ring|oil seal|seal|gasket|cable|bulb|spring|clip|clamp|stud|pin|spacer|bush|grommet|valve|filter|spark plug|chain|sprocket)\b/i.test(String(p.name||'')+' '+String(p.kw||'')); }
/* When a vehicle is chosen, lists hide only parts that CONFIDENTLY don't fit (fitsBike===false);
   fitting and unknown parts stay. "Show all parts" clears the bike. */
function vehFilter(arr){ var b=getBike(); if(!b) return arr; var out=arr.filter(function(p){ return fitsBike(p)!==false; }); return out.length?out:arr; }
/* v4.7.5: once the catalogue is loaded, show only systems that actually have parts. */
function systemsLive(){ var s=systemsWithCounts(); var l=s.filter(function(x){return x.count>0;}); return (STATE.loaded&&l.length)?l:s; }
/* v4.50 — not every shopper thinks in categories. A customer who knows the part they want, or who
   is just browsing, had to guess which of nine systems it lived under before seeing a single
   product. ALL_PARTS is a sentinel category meaning "everything", so the existing system view —
   grid, filters, vehicle filter, dealer pricing — serves the full list with no second screen to
   build and nothing to keep in step. */
var ALL_PARTS='*';
function partsInSystem(name){ if(name===ALL_PARTS) return vehFilter(STATE.products); return vehFilter((STATE.bySys&&STATE.bySys[nk(name)])||STATE.byCat[name]||[]); }
/* Sidebar filters: "in stock only" and "fits my bike only" (only confident fits). */
function applyListFilters(arr){
  var f=STATE.filters||{}; var out=arr;
  if(f.stock) out=out.filter(function(p){ return p.stock>0; });
  if(f.fit && getBike()) out=out.filter(function(p){ return fitsBike(p)===true; });
  return out;
}
function toggleFilter(k){ STATE.filters[k]=!STATE.filters[k]; render(); }
function clearListFilters(){ STATE.filters={stock:false, fit:false}; render(); }
/* fitting guide — difficulty + tools inferred from the part's system (a guide, not a rule) */
function fitGuide(p){
  var sys=nk(String(p.kw||'').split('|')[1]||'')||nk(String(p.cat||'').split('>').slice(-2)[0]||'');
  var map={brakes:['Easy','Spanner set, pliers'],electrical:['Easy','Screwdriver, spanner'],controls:['Easy','Spanner, pliers'],
    fuelsystem:['Easy','Screwdriver, spanner'],accessories:['Easy','Basic hand tools'],frameandbody:['Medium','Spanner set, screwdriver'],
    wheels:['Medium','Spanner, tyre levers, stand'],wheelsandtyres:['Medium','Spanner, tyre levers, stand'],suspension:['Medium','Spanner set, stand'],
    transmission:['Advanced','Clutch/chain tools — mechanic advised'],engine:['Advanced','Workshop — mechanic recommended']};
  var m=map[sys]||['Medium','Basic hand tools']; return {level:m[0],tools:m[1]};
}

/* ---------- customer-built quotation ----------

   and types local digits; ccCompose builds the full international number, and already-international
   input (a +/00 prefix, or a long 3-digit corridor code) is left as typed — never double-prefixed. */
var WH_CC=[
 ['SS','🇸🇸','211','South Sudan'],['UG','🇺🇬','256','Uganda'],['KE','🇰🇪','254','Kenya'],
 ['TZ','🇹🇿','255','Tanzania'],['RW','🇷🇼','250','Rwanda'],['CD','🇨🇩','243','DR Congo'],
 ['SD','🇸🇩','249','Sudan'],['ET','🇪🇹','251','Ethiopia'],['ER','🇪🇷','291','Eritrea'],
 ['BI','🇧🇮','257','Burundi'],['SO','🇸🇴','252','Somalia'],['DJ','🇩🇯','253','Djibouti'],
 ['EG','🇪🇬','20','Egypt'],['AE','🇦🇪','971','UAE'],['SA','🇸🇦','966','Saudi Arabia'],
 ['IN','🇮🇳','91','India'],['PK','🇵🇰','92','Pakistan'],['CN','🇨🇳','86','China'],
 ['GB','🇬🇧','44','UK'],['US','🇺🇸','1','USA']
];
function ccDefault(){
  try{ var s=localStorage.getItem('ea_cc'); if(s){ for(var i=0;i<WH_CC.length;i++){ if(WH_CC[i][2]===s) return s; } } }catch(e){}
  var wa=String((CFG&&CFG.waNumber)||''), best='';
  for(var j=0;j<WH_CC.length;j++){ var c=WH_CC[j][2]; if(wa.indexOf(c)===0 && c.length>best.length) best=c; }

function ccCompose(cc,raw){
  var s=String(raw||''); var intl=/^\s*(\+|00)/.test(s); var d=s.replace(/\D+/g,'');

  d=d.replace(/^0+/,''); if(!d) return '';

  var lines=c.map(function(i){return '• '+i.qty+'x '+i.name+(i.pn?(' ('+i.pn+')'):'')+(i.price>0?(' — '+money(i.price*i.qty)):'');}).join('%0a');
  var t='Hello '+(CFG.name||'')+', I want to order these genuine parts:'+(STATE.dealer?' (DEALER ORDER — my trade prices below)':'')+'%0a'+lines+'%0a%0aTotal: '+money(cartTotal())+(b?('%0aMy motorcycle: '+b.name):'')+'%0a%0aPlease confirm stock, delivery time and payment.';
  return CFG.waNumber?('https://wa.me/'+CFG.waNumber+'?text='+t):'#'; }
/* ---------- which bike models to show ----------
   1) If the shop set an explicit list (Settings -> Storefront), show exactly those, in order.
   2) Otherwise show every model that has parts loaded in the catalogue (auto).
   3) If neither yields anything yet (e.g. catalogue still loading), fall back to all. */
function nk(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function modelHasParts(m){
  var key=nk(m.catName||m.name);
  if(!key) return false;
  for(var i=0;i<STATE.products.length;i++){
    var seg=String(STATE.products[i].kw||'').split('|')[0];
    if(nk(seg)===key) return true;
  }
  return false;
}
function activeModels(){
  var all=(MODELS||[]);
  var want=(CFG.enabledModels||[]);
  if(want.length){
    var out=[];
    want.forEach(function(tok){
      var t=nk(tok);
      var m=all.filter(function(x){return nk(x.id)===t||nk(x.name)===t||nk(x.catName)===t;})[0]
          || all.filter(function(x){return nk(x.name).indexOf(t)===0||nk(x.catName).indexOf(t)===0;})[0];
      if(m&&out.indexOf(m)<0) out.push(m);
    });
    if(out.length) return out;
  }
  if(STATE.loaded && STATE.products.length){
    var withParts=all.filter(modelHasParts);
    if(withParts.length) return withParts;
  }
  return all.slice(0,5);
}

function searchSets(q){
  var qn=normQ(q);
  var text=applyListFilters(vehFilter(STATE.products).filter(function(p){return (p.name+' '+p.kw+' '+p.cat).toLowerCase().indexOf(q)>=0;}));
  var oem=(qn&&qn.length>=3)?applyListFilters(vehFilter(STATE.products).filter(function(p){var pn=normQ(pnOf(p)||''),sk=normQ(String(p.sku||''));return (pn&&pn.indexOf(qn)>=0)||(sk&&sk.indexOf(qn)>=0);})):[];
  var seen={},all=[];
  text.concat(oem).forEach(function(p){ if(!seen[p.id]){seen[p.id]=1;all.push(p);} });
  /* v4.10.2 — rank by relevance, never catalogue order: exact OEM/SKU > prefix > name > keywords, fitting bikes first */
  var _sc={}; all.forEach(function(p){ _sc[p.id]=suggScore(p,q,qn)+(fitsBike(p)===true?5:0); });
  var byScore=function(a,b){ return (_sc[b.id]||0)-(_sc[a.id]||0); };
  all.sort(byScore); text.sort(byScore); oem.sort(byScore);
  var plates=(q&&showDiag())?(((typeof DIAG!=='undefined'&&DIAG&&DIAG.plates)||[]).filter(function(pl){
    if((String(pl.system||'')+' '+String(pl.name||'')).toLowerCase().indexOf(q)>=0) return true;
    return (pl.parts||[]).some(function(x){return String(x.pn||'').toLowerCase().indexOf(q)>=0||String(x.d||'').toLowerCase().indexOf(q)>=0;});
  })):[];
  return {text:text,oem:oem,all:all,plates:plates};
}

function render(){
  var h=curRoute(); var parts=h.split('/');
  var v;
  if(!STATE.loaded && !STATE.error){ v=nav()+'<div class="spin"></div>'; document.getElementById('app').innerHTML=v; return; }
  // Catalogue failed to load — show a retry on ANY view, not just the homepage, so a deep link
  // to /parts or a search doesn't sit on a bare "0 parts".
  if(STATE.error && (!STATE.products || !STATE.products.length)){
    document.getElementById('app').innerHTML=nav()+errBanner()+foot(); window.scrollTo(0,0); try{updBotbar('');}catch(e){} return;
  }
  if(parts[0]==='part') v=vPart(parts[1]);
  else if(parts[0]==='system') v=vSystem(decodeURIComponent(parts.slice(1).join('/')));
  else if(parts[0]==='model') v=vModel(parts[1]);
  else if(parts[0]==='parts') v=vParts();
  else if(parts[0]==='plate'||parts[0]==='diagram'||parts[0]==='diagrams') v=showDiag()?vDiagram(parts[1]):vParts();
  else if(parts[0]==='search'){ var _sq=parts.slice(1).join('/'); v=_sq?vSearch(_sq):vSearchHub(); }
  else if(parts[0]==='ai') v=vAI();
  else if(parts[0]==='cart') v=vCart();
  else v=vHome();
  document.getElementById('app').innerHTML=v;
  window.scrollTo(0,0);
  updateCartBadge();
  updBotbar(parts[0]);
  var r=document.documentElement.style; if(CFG.accent)r.setProperty('--accent',CFG.accent); if(CFG.accentDark)r.setProperty('--accent-d',CFG.accentDark);

  var bc=document.getElementById('botCart'); if(bc)bc.href=CFG.shopUrl||'#';
  enhanceA11y();
}

// EA Auto Part storefront — module: 12-a11y-boot.js
// accessibility enhancement + boot
// NOTE: these src/ files share one runtime scope; build_storefront.py concatenates them
// in filename order into a single inline bundle. Keep 12-a11y-boot.js last (it boots the app).
/* ---------- accessibility: make onclick elements keyboard-operable + labelled ---------- */
function enhanceA11y(){
  try{
    var els=document.querySelectorAll('[onclick]');
    Array.prototype.forEach.call(els,function(el){
      var tag=el.tagName.toLowerCase();
      var native=(tag==='button')||(tag==='a'&&el.hasAttribute('href'))||tag==='input'||tag==='select'||tag==='textarea';
      // Don't advertise a container as a button if it wraps its own interactive controls
      // (that would be a "nested interactive" a11y violation) — its inner controls stay focusable.
      var wrapsInteractive=!!el.querySelector('button,a[href],input,select,textarea,[role="button"],[tabindex],[onclick]');
      if(!native && !wrapsInteractive){
        if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
        if(!el.hasAttribute('role')) el.setAttribute('role','button');
      }
      // icon-only control with no visible text → label it from its title/aria for screen readers.
      if(!el.getAttribute('aria-label') && !(el.textContent||'').trim()){
        var t=el.getAttribute('title'); if(t) el.setAttribute('aria-label',t);
      }
    });
  }catch(e){}
}
// One delegated key handler: Enter / Space activates any role=button-ish onclick element.
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar') return;
  var el=e.target;
  if(!el||!el.getAttribute) return;
  var tag=el.tagName.toLowerCase();
  var native=(tag==='button')||(tag==='a'&&el.hasAttribute('href'))||tag==='input'||tag==='select'||tag==='textarea';
  if(native) return;
  if(el.hasAttribute('onclick')||el.getAttribute('role')==='button'){ e.preventDefault(); el.click(); }
});
/* v4.10 — sticky search: once the hero search scrolls away on the homepage, the nav grows
   a pinned search bar so a mechanic can fire the next search without scrolling back up. */

  var h=document.getElementById('topnav'); if(!h||!h.classList.contains('homehero')) return;
  h.classList.toggle('srch',(window.scrollY||document.documentElement.scrollTop||0)>330);

function hashMigrate(){
  var m=(location.hash||'').match(/^#\/(.*)$/);
  if(m){ try{ history.replaceState({},'',urlFor(m[1])); }catch(e){} }
}
try{ history.scrollRestoration='manual'; }catch(e){}
