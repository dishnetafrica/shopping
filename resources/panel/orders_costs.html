<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Shopper">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>Orders &amp; Margin</title>
<style>
  :root{--red:#D41C1C;--green:#059669;--amber:#d97706;--blue:#1e40af;--dark:#0f0f0f;
        --mute:#94a3b8;--bg:#f5f5f2;--border:#e8e8e3;--font:'Inter',-apple-system,'Segoe UI',sans-serif;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:var(--font);color:#0f0f0f;}
  .wrap{max-width:640px;margin:0 auto;padding:14px;}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .top h1{font-size:20px;margin:0;font-weight:900;} .top a{color:var(--green);text-decoration:none;font-weight:700;font-size:13px;}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
  label{font-size:12px;font-weight:700;color:#374151;display:block;margin:10px 0 5px;}
  input,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:var(--font);background:#fff;outline:none;}
  input:focus,select:focus{border-color:var(--green);}
  .row{display:flex;gap:10px;}.row>div{flex:1;}
  .btn{width:100%;margin-top:14px;background:var(--dark);color:#fff;border:none;border-radius:11px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;}
  .oitem{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
  .oitem:active{background:#fafaf8;}
  .oitem-top{display:flex;justify-content:space-between;align-items:center;}
  .oitem-no{font-weight:800;font-size:14px;} .oitem-cust{font-size:12px;color:#64748b;margin-top:2px;}
  .margin{font-size:18px;font-weight:900;} .margin.pos{color:#15803d;} .margin.neg{color:#dc2626;}
  .marginlbl{font-size:10px;color:var(--mute);text-align:right;font-weight:700;text-transform:uppercase;}
  .breakdown{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:none;}
  .breakdown.on{display:block;}
  .costrow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f1f1ee;}
  .costrow .l{color:#374151;} .costrow .r{font-weight:700;}
  .stagetag{font-size:9px;background:#f1f5f9;color:#475569;padding:1px 6px;border-radius:8px;font-weight:800;margin-right:6px;}
  .totrow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;font-weight:800;}
  .sub{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.5px;margin:6px 0 8px;}
  .loading{text-align:center;color:var(--mute);padding:20px;}
</style>
<!-- ===== DishNet mobile app shell (injected v2) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="dn-shell">
  :root{--dn-g:#15803D;--dn-gd:#0B3D22;--dn-gl:#E6F4EA;--dn-line:#E2E8E2;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}
  .wrap{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px)!important;}

  /* sticky app bar (reuse existing .top) */
  .top{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
       justify-content:flex-start;margin:-14px -14px 14px -14px!important;
       padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px!important;
       background:var(--dn-gd);box-shadow:0 2px 10px -4px rgba(11,61,34,.5);}
  .top h1{color:#fff!important;font-size:17px!important;font-weight:800!important;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top a{order:-1;flex-shrink:0;width:34px;height:34px;border-radius:50%;
         background:rgba(255,255,255,.16)!important;color:#fff!important;
         display:grid;place-items:center;font-size:0!important;text-decoration:none;}
  .top a::before{content:"\2039";font-size:24px;font-weight:700;line-height:1;margin-top:-2px;}
  .dn-appbtn{margin-left:auto;flex-shrink:0;height:34px;padding:0 13px;border-radius:99px;
             background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:700;
             display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .dn-appbtn:active{background:rgba(255,255,255,.28);}

  /* theme accents */
  .btn{background:var(--dn-gd)!important;border-radius:12px!important;padding:14px!important;font-weight:800!important;}
  .btn:active{background:#082a18!important;}
  input,select,textarea{font-size:16px!important;border-radius:11px!important;}
  input:focus,select:focus,textarea:focus{border-color:var(--dn-g)!important;}
  .card,.oitem,.item,.balcard,.hero{box-shadow:0 1px 2px rgba(16,35,28,.05),0 3px 12px -4px rgba(16,35,28,.06);}

  /* #2 amount echo (anti-typo) */
  .dn-amt-echo{display:none;margin:9px 0 2px;padding:8px 12px;border-radius:10px;
               background:var(--dn-gl);border:1px solid #BFE3CB;color:var(--dn-gd);
               font-size:16px;font-weight:800;letter-spacing:.2px;}

  /* fixed bottom tab bar */
  .dn-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;min-height:58px;
             background:#fff;border-top:1px solid var(--dn-line);
             padding-bottom:env(safe-area-inset-bottom,0px);
             box-shadow:0 -2px 14px -6px rgba(16,35,28,.18);}
  .dn-tabbar a{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;
               gap:3px;padding:9px 2px 8px;text-decoration:none;color:#7C8A80;font-size:10.5px;font-weight:700;}
  .dn-tabbar a .di{font-size:20px;line-height:1;filter:grayscale(35%);opacity:.85;}
  .dn-tabbar a .dl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .dn-tabbar a.on{color:var(--dn-gd);}
  .dn-tabbar a.on .di{filter:none;opacity:1;transform:translateY(-1px);}
  .dn-tabbar a.on::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--dn-g);}
  @media(min-width:721px){.dn-tabbar{max-width:720px;margin:0 auto;border-left:1px solid var(--dn-line);border-right:1px solid var(--dn-line);}}
</style>
</head>
<body><div class="wrap">
  <div class="top"><h1>🧾 Orders &amp; Margin</h1><a href="/panel">← Panel</a></div>
  <a href="/panel/buy-list" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px">🧺 Today's buy list</a>

  <div class="card">
    <div class="sub">➕ RECORD A JUBA ORDER</div>
    <div class="row">
      <div style="flex:2"><label>Customer</label><input id="cust" placeholder="Embassy of Nordhavn"></div>
      <div><label>Location</label><input id="loc" value="Juba"></div>
    </div>
    <label>What did they order (each item = a line)</label>
    <div id="itemRows"></div>
    <button type="button" onclick="addItemRow()" style="width:100%;background:#E6F4EA;color:#0B3D22;border:1px solid #BFE3CB;border-radius:10px;padding:10px;font-size:13px;font-weight:800;cursor:pointer;margin-top:2px">+ add item</button>
    <div class="row">
      <div><label>Sell currency</label><select id="sellcur"><option>USD</option><option>SSP</option><option>UGX</option></select></div>
      <div style="flex:2"><label>Price (they pay)</label><input id="total" inputmode="decimal" placeholder="200"></div>
    </div>
    <button class="btn" onclick="createOrder()">Create order</button>
  </div>

  <div class="sub">📋 ORDERS</div>
  <div id="list"><div class="loading">Loading…</div></div>
</div>
<script>
const $=s=>document.getElementById(s);
function fmt(n){return Number(n).toLocaleString(undefined,{maximumFractionDigits:2});}
function addItemRow(name,qty,unit){
  var wrap=$('itemRows'); var row=document.createElement('div');
  row.className='irow'; row.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:center';
  row.innerHTML='<input class="iname" placeholder="Item e.g. Router" style="flex:2">'+
    '<input class="iqty" inputmode="decimal" placeholder="Qty" style="flex:0 0 62px;text-align:center">'+
    '<input class="iunit" placeholder="unit" style="flex:0 0 66px">'+
    '<button type="button" style="flex:0 0 auto;background:#FCE9E9;color:#D41C1C;border:none;border-radius:9px;width:36px;height:42px;font-weight:800;font-size:18px">×</button>';
  row.querySelector('.iname').value=name||''; row.querySelector('.iqty').value=(qty!=null?qty:1); row.querySelector('.iunit').value=unit||'';
  row.querySelector('button').onclick=function(){ row.remove(); if(!$('itemRows').children.length) addItemRow(); };
  wrap.appendChild(row);
}
function collectItems(){
  return Array.prototype.map.call(document.querySelectorAll('#itemRows .irow'),function(r){
    var nm=(r.querySelector('.iname').value||'').trim();
    var qy=parseFloat((r.querySelector('.iqty').value||'').replace(/,/g,''))||0;
    var un=(r.querySelector('.iunit').value||'').trim();
    return nm ? {name:nm, qty:(qy>0?qy:1), unit:un} : null;
  }).filter(Boolean);
}
function createOrder(){
  const b=event.target; b.disabled=true; b.textContent='Saving…';
  const fd=new FormData();
  fd.append('customer',$('cust').value); fd.append('location',$('loc').value);
  fd.append('sell_currency',$('sellcur').value);
  fd.append('total',($('total').value||'').replace(/,/g,''));
  fd.append('items', JSON.stringify(collectItems()));
  fetch('/papi/orders/quick',{method:'POST',headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin',body:fd})
    .then(r=>r.json()).then(r=>{ b.disabled=false; b.textContent='Create order';
      if(r.ok){ $('cust').value='';$('total').value=''; $('itemRows').innerHTML=''; addItemRow();
        alert('Order '+r.order_no+' created ✅'); load(); } else alert('Failed'); });
}
addItemRow();
function toggle(id){
  const el=$('bd-'+id); if(el.classList.contains('on')){el.classList.remove('on');return;}
  el.classList.add('on'); el.innerHTML='<div class="loading">…</div>';
  fetch('/papi/orders/'+id+'/costs',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{
    if(!d.ok){el.innerHTML='<div class="loading">no data</div>';return;}
    let rows=d.costs.map(c=>`<div class="costrow"><span class="l"><span class="stagetag">${c.stage.replace('_',' ')}</span>${c.currency} ${fmt(c.native)} @${fmt(c.rate)}${c.holder?' · '+c.holder:''}</span><span class="r">$${fmt(c.usd)}</span></div>`).join('')||'<div class="costrow"><span class="l">No costs booked yet</span><span class="r">$0</span></div>';
    el.innerHTML=rows+
      `<div class="totrow"><span>Revenue (${d.order.sell_currency} ${fmt(d.order.total)})</span><span>$${fmt(d.order.revenue_usd)}</span></div>`+
      `<div class="totrow"><span>Landed cost</span><span>-$${fmt(d.landed_usd)}</span></div>`+
      `<div class="totrow" style="color:${d.margin_usd>=0?'#15803d':'#dc2626'}"><span>Margin (${d.margin_pct}%)</span><span>$${fmt(d.margin_usd)}</span></div>`;
  });
}
function load(){
  fetch('/papi/order-costs/orders',{headers:{'X-Requested-With':'XMLHttpRequest'}}).then(r=>r.json()).then(d=>{
    const L=$('list');
    if(!d.orders||!d.orders.length){L.innerHTML='<div class="loading">No orders yet — create one above.</div>';return;}
    L.innerHTML=d.orders.map(o=>`
      <div class="oitem" onclick="toggle(${o.id})">
        <div class="oitem-top">
          <div><div class="oitem-no">${o.order_no}</div><div class="oitem-cust">${o.customer_name||'—'} · ${o.location||''}</div></div>
          <div><div class="marginlbl">tap for margin</div></div>
        </div>
        <div class="breakdown" id="bd-${o.id}"></div>
      </div>`).join('');
  });
}
load();
</script>
<!-- ===== DishNet role-aware tab bar + amount format (injected v2) ===== -->
<nav class="dn-tabbar" id="dnTabbar"></nav>
<script>
(function(){
  var here=location.pathname.replace(/\/+$/,'')||'/panel';
  // tab -> access rule. menu:X requires effectiveMenus contains X; owner requires is_owner.
  var TABS=[
    {t:'Orders',i:'\uD83D\uDED2',u:'/panel/orders-costs', need:'menu:ordercosts'},
    {t:'Buy',   i:'\uD83D\uDECD\uFE0F',u:'/panel/book-cost',    need:'menu:purchases'},
    {t:'List',  i:'\uD83D\uDCCB',u:'/panel/buy-list',     need:'buylist'},
    {t:'Cash',  i:'\uD83D\uDCB0',u:'/panel/cash-position', need:'menu:cash'},
    {t:'Book',  i:'\uD83D\uDCD2',u:'/panel/trade-cashbook',need:'owner'},
    {t:'Spend', i:'\uD83D\uDCB8',u:'/panel/expenses',      need:'owner'},
    {t:'P&L',   i:'\uD83D\uDCC8',u:'/panel/pnl',           need:'owner'}
  ];
  function allowed(rule, nav){
    if(rule==='owner') return !!nav.is_owner;
    if(rule==='buylist') return (nav.menus||[]).indexOf('purchases')>=0 && !nav.is_owner;
    if(rule.indexOf('menu:')===0){ var k=rule.slice(5); return (nav.menus||[]).indexOf(k)>=0; }
    return false;
  }
  function render(nav){
    var bar=document.getElementById('dnTabbar'); if(!bar) return;
    var vis=TABS.filter(function(x){ return allowed(x.need,nav); });
    bar.innerHTML=vis.map(function(x){
      var on=(here===x.u)?'on':'';
      return '<a class="'+on+'" href="'+x.u+'"><span class="di">'+x.i+'</span><span class="dl">'+x.t+'</span></a>';
    }).join('');
    // Approvals pill: only if user actually has the approvals menu, and not already on it
    var top=document.querySelector('.top');
    if(top && here!=='/panel/approvals' && (nav.menus||[]).indexOf('approvals')>=0){
      var a=document.createElement('a'); a.className='dn-appbtn'; a.href='/panel/approvals';
      a.innerHTML='\u2713 Approvals'; top.appendChild(a);
    }
  }
  // Safe fallback if the nav call fails: core three only, no owner tabs, no approvals.
  var FALLBACK={is_owner:false, menus:['ordercosts','purchases','cash']};
  fetch('/papi/me/nav',{headers:{'X-Requested-With':'XMLHttpRequest'},credentials:'same-origin'})
    .then(function(r){return r.json();})
    .then(function(d){ render(d && d.ok ? d : FALLBACK); })
    .catch(function(){ render(FALLBACK); });

  // ---- #2 live thousands-grouping + currency echo (anti big-number typo) ----
  function group(v){
    v=(v==null?'':String(v)).replace(/[^\d.]/g,'');
    var p=v.split('.'); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
    return p.length>1 ? p[0]+'.'+p.slice(1).join('') : p[0];
  }
  function wire(id, curId){
    var el=document.getElementById(id); if(!el) return;
    var cur=curId?document.getElementById(curId):null;
    var echo=document.createElement('div'); echo.className='dn-amt-echo';
    var anchor=(el.closest && el.closest('.row'))||el;
    if(anchor.parentNode) anchor.parentNode.insertBefore(echo, anchor.nextSibling);
    function upd(){
      var g=group(el.value); if(el.value!==g) el.value=g;
      var n=parseFloat(g.replace(/,/g,''))||0;
      if(n>0){ echo.textContent=(cur&&cur.value?cur.value+' ':'')+group(String(n)); echo.style.display='block'; }
      else { echo.textContent=''; echo.style.display='none'; }
    }
    el.addEventListener('input',upd);
    if(cur) cur.addEventListener('change',upd);
    // pages clear the field on successful save (value set directly) -> re-sync after any button tap
    document.querySelectorAll('.btn,button').forEach(function(b){ b.addEventListener('click',function(){ setTimeout(upd,1500); }); });
    upd();
  }
  wire('amt','cur');       // book_cost, expenses, trade_cashbook
  wire('total','sellcur'); // orders_costs
})();
</script>
</body></html>
